name: FLIXO Historical Action Error Index — Chair Proposal Only

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC ISO start of the historical slice'
        required: false
        default: '2026-08-10T00:00:00Z'
        type: string
      end:
        description: 'UTC ISO end of the historical slice'
        required: false
        default: ''
        type: string
      batch_days:
        description: 'Days per scan window'
        required: false
        default: '7'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-historical-index-proposal
  cancel-in-progress: true
  queue: max

jobs:
  index:
    name: Backfill and index real GitHub Action failures
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout execution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1

      - name: Resolve historical window
        id: window
        shell: bash
        env:
          FLIXO_INPUT_START: ${{ inputs.start || '' }}
          FLIXO_INPUT_END: ${{ inputs.end || '' }}
          FLIXO_INPUT_BATCH_DAYS: ${{ inputs.batch_days || '7' }}
        run: |
          set -euo pipefail
          START="$FLIXO_INPUT_START"
          END="$FLIXO_INPUT_END"
          if [ -z "$START" ]; then
            START="$(node --input-type=module -e "import fs from 'node:fs'; const p='docs/agents/historical-action-errors/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(m.nextCursor || m.repositoryCreatedAt || '2026-08-10T00:00:00Z')")"
          fi
          BATCH_DAYS="$FLIXO_INPUT_BATCH_DAYS"
          if [ -z "$END" ]; then
            END="$(START="$START" BATCH_DAYS="$BATCH_DAYS" node --input-type=module -e "const s=new Date(process.env.START); const n=new Date(); const days=Math.max(1,Math.min(31,Number(process.env.BATCH_DAYS||7))); const e=new Date(Math.min(s.getTime()+days*86400000,n.getTime())); process.stdout.write(e.toISOString())")"
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Backfill real Action error lines
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FLIXO_HISTORY_START: ${{ steps.window.outputs.start }}
          FLIXO_HISTORY_END: ${{ steps.window.outputs.end }}
          FLIXO_HISTORY_BATCH_DAYS: ${{ inputs.batch_days || '7' }}
          FLIXO_HISTORY_OUT: /tmp/flixo-historical-errors
        run: node scripts/ci/backfill-historical-action-errors.mjs

      - name: Merge occurrences into instant index
        run: |
          set -euo pipefail
          mkdir -p docs/agents/historical-action-errors/records
          for file in /tmp/flixo-historical-errors/*.json; do
            [ -f "$file" ] || continue
            node scripts/ci/historical-action-error-index.mjs add "$file"
          done
          test -s docs/agents/historical-action-errors/index.json
          test -s docs/agents/historical-action-errors/manifest.json

      - name: Synchronize permanent ACTION-INDEX copy of historical Action index
        run: |
          set -euo pipefail
          node scripts/ci/action-learning-master.mjs --op=sync-index
          test -s diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
          node scripts/ci/test-action-repair-memory.mjs

      - name: Validate historical index
        run: node scripts/ci/test-historical-action-error-index.mjs

      - name: Publish historical corpus as proposal evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-historical-action-index-proposal-${{ github.run_id }}
          path: |
            docs/agents/historical-action-errors
            diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
            /tmp/flixo-historical-errors
          if-no-files-found: warn
          retention-days: 14
