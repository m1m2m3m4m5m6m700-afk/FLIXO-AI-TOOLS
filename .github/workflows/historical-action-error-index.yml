name: FLIXO Historical Action Error Index

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC ISO start of the historical slice'
        required: false
        default: '2026-08-10T00:00:00Z'
        type: string
      end:
        description: 'UTC ISO end of the historical slice'
        required: false
        default: ''
        type: string
      batch_days:
        description: 'Days per scan window'
        required: false
        default: '7'
        type: string
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: flixo-execution-mutation-lane
  cancel-in-progress: false
  queue: max

jobs:
  index:
    name: Backfill and index real GitHub Action failures
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout execution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1

      - name: Resolve historical window
        id: window
        shell: bash
        env:
          FLIXO_INPUT_START: ${{ inputs.start || '' }}
          FLIXO_INPUT_END: ${{ inputs.end || '' }}
          FLIXO_INPUT_BATCH_DAYS: ${{ inputs.batch_days || '7' }}
        run: |
          set -euo pipefail
          START="$FLIXO_INPUT_START"
          END="$FLIXO_INPUT_END"
          if [ -z "$START" ]; then
            START="$(node --input-type=module -e "import fs from 'node:fs'; const p='docs/agents/historical-action-errors/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(m.nextCursor || m.repositoryCreatedAt || '2026-08-10T00:00:00Z')")"
          fi
          BATCH_DAYS="$FLIXO_INPUT_BATCH_DAYS"
          if [ -z "$END" ]; then
            END="$(START="$START" BATCH_DAYS="$BATCH_DAYS" node --input-type=module -e "const s=new Date(process.env.START); const n=new Date(); const days=Math.max(1,Math.min(31,Number(process.env.BATCH_DAYS||7))); const e=new Date(Math.min(s.getTime()+days*86400000,n.getTime())); process.stdout.write(e.toISOString())")"
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Backfill real Action error lines
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FLIXO_REQUIRE_FENCED_CHAIR: 'true'
          FLIXO_CHAIR_SIGNING_KEY: ${{ github.token }}
          FLIXO_MUTATION_ADMISSION: /tmp/flixo-mutation-admission.json
          FLIXO_HEAD_AUTHORITY_PROOF: /tmp/flixo-head-authority.json
          FLIXO_HISTORY_START: ${{ steps.window.outputs.start }}
          FLIXO_HISTORY_END: ${{ steps.window.outputs.end }}
          FLIXO_HISTORY_BATCH_DAYS: ${{ inputs.batch_days || '7' }}
          FLIXO_HISTORY_OUT: /tmp/flixo-historical-errors
        run: node scripts/ci/backfill-historical-action-errors.mjs

      - name: Merge occurrences into instant index
        run: |
          set -euo pipefail
          mkdir -p docs/agents/historical-action-errors/records
          for file in /tmp/flixo-historical-errors/*.json; do
            [ -f "$file" ] || continue
            node scripts/ci/historical-action-error-index.mjs add "$file"
          done
          test -s docs/agents/historical-action-errors/index.json
          test -s docs/agents/historical-action-errors/manifest.json

      - name: Synchronize permanent ACTION-INDEX copy of historical Action index
        run: |
          set -euo pipefail
          node scripts/ci/action-learning-master.mjs --op=sync-index
          test -s diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
          node scripts/ci/test-action-repair-memory.mjs

      - name: Validate historical index
        run: node scripts/ci/test-historical-action-error-index.mjs

      - name: Persist historical corpus and ACTION-INDEX memory on execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin execution
          test "$(git rev-parse origin/execution)" = "$BASE_SHA" || { echo 'FAIL CLOSED: execution advanced before historical mutation.'; exit 1; }
          git add docs/agents/historical-action-errors diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
          git diff --cached --quiet && exit 0
          MUTATION_PATHS="$(git diff --cached --name-only | paste -sd, -)"
          WORK_PACKAGE_ID="HISTORICAL-ACTION-INDEX:$GITHUB_RUN_ID"
          TASK_ID="HISTORICAL-ACTION-INDEX:$GITHUB_RUN_ID"
          node scripts/ci/execution-mutation-gate.mjs admit --owner=HISTORICAL_ACTION_INDEX --sha="$BASE_SHA" --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --paths="$MUTATION_PATHS" --output="$FLIXO_MUTATION_ADMISSION"
          FENCING_TOKEN="$(jq -r '.fencingToken' "$FLIXO_MUTATION_ADMISSION")"
          node scripts/ci/chair-bound-execution.mjs init --sha="$BASE_SHA"
          node scripts/ci/chair-bound-execution.mjs acquire --chair=chair_1 --agent=HISTORICAL_ACTION_INDEX --sha="$BASE_SHA" --repository-state=IDLE --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --fencing-token="$FENCING_TOKEN" --scope="$MUTATION_PATHS" >/tmp/flixo-chair-acquire.json
          node scripts/ci/chair-bound-execution.mjs authorize-write --chair=chair_1 --agent=HISTORICAL_ACTION_INDEX --sha="$BASE_SHA" --permission=SOURCE_MUTATION --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --fencing-token="$FENCING_TOKEN" --paths="$MUTATION_PATHS" >/tmp/flixo-chair-authorize.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(memory): index historical GitHub Action errors [skip ci]"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          node scripts/ci/execution-mutation-gate.mjs verify --phase=pre-push --admission="$FLIXO_MUTATION_ADMISSION" --candidate="$CANDIDATE_SHA" --parent="$BASE_SHA"
          node scripts/ci/chair-bound-execution.mjs authorize-publication --chair=chair_1 --agent=HISTORICAL_ACTION_INDEX --sha="$BASE_SHA" --permission=SOURCE_MUTATION --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --fencing-token="$FENCING_TOKEN" --paths="$MUTATION_PATHS" >/tmp/flixo-chair-publication.json
          node scripts/ci/execution-head-authority.mjs authorize --agent=HISTORICAL_ACTION_INDEX --target-sha="$BASE_SHA" --parent-sha="$BASE_SHA" --candidate-sha="$CANDIDATE_SHA" --task-id="$TASK_ID" --work-package="$WORK_PACKAGE_ID" --output="$FLIXO_HEAD_AUTHORITY_PROOF" >/tmp/flixo-head-authority-log.json
          git push origin execution
          node scripts/ci/execution-mutation-gate.mjs verify --phase=post-push --admission="$FLIXO_MUTATION_ADMISSION" --candidate="$CANDIDATE_SHA"
          node scripts/ci/chair-bound-execution.mjs release --chair=chair_1 --agent=HISTORICAL_ACTION_INDEX --sha="$BASE_SHA" --successful=true >/tmp/flixo-chair-release.json
