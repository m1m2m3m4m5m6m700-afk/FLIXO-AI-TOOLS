name: FLIXO Repair Lease — 100 Worker Atomic Race (Read-Only Provider)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-repair-lease-live-race
  cancel-in-progress: false

jobs:
  live-race:
    name: Local atomic lease race (100 workers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted lease controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run 100-way atomic lease race without GitHub write permission
        run: node scripts/ci/test-repair-lease-live-race.mjs
