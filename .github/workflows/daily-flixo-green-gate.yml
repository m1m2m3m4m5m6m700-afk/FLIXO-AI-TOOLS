name: Daily·FLIXO Green Gate
# SUPREME AUTOMATION RESIDENCY: unresolved work must always re-enter recovery/dispatch.
run-name: Daily·FLIXO Green Gate ${{ github.run_id }}

on:
  push:
    branches: [execution]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      # Canonical triggers: every required verification/security completion wakes the watcher.
      # The watcher still inspects every required workflow/check on the exact SHA.
      - FLIXO Test System
      - FLIXO Auto Repair Bot
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - Repository Security Baseline
      - Claude Security Review
    types: [completed]
    branches: [execution, main]

permissions:
  actions: write
  contents: write
  checks: read
  pull-requests: read

# Every observation is evidence-bearing and must complete; duplicate wake suppression is handled by the watchdog.
# The watcher itself never cancels an evidence-bearing observation.
concurrency:
  group: flixo-continuous-error-watch-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  watch:
    name: Observe, classify, repair-or-block, prove, continue
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'execution' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Self-test canonical repair control plane
        run: |
          set -euo pipefail
          node scripts/ci/test-repair-control-plane.mjs
          node scripts/ci/test-repair-lease.mjs

      - name: Self-test continuous watcher
        run: node scripts/ci/test-continuous-error-watch.mjs

      - name: Capture exact repository state
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-watch/logs
          WATCH_BRANCH="execution"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            WATCH_BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$WATCH_BRANCH" in
            execution|main) ;;
            *) echo "Unsupported observer branch: $WATCH_BRANCH"; exit 1 ;;
          esac
          EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$WATCH_BRANCH" --jq '.sha')"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 5 \
            --json number,headRefOid,baseRefOid,url,mergedAt,mergeCommit,isDraft > /tmp/flixo-watch/open-prs.json
          gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state all --limit 10 \
            --json number,state,headRefOid,baseRefOid,url,mergedAt,mergeCommit,isDraft > /tmp/flixo-watch/all-prs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100" > /tmp/flixo-watch/workflow-runs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$EXECUTION_SHA/check-runs?per_page=100" > /tmp/flixo-watch/check-runs.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXECUTION_SHA/status" > /tmp/flixo-watch/statuses.json
          if [ "$WATCH_BRANCH" = "execution" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/main...execution" > /tmp/flixo-watch/compare.json
          else
            gh api "repos/$GITHUB_REPOSITORY/compare/main...main" > /tmp/flixo-watch/compare.json
          fi
          printf '%s\n' "$EXECUTION_SHA" > /tmp/flixo-watch/execution-sha
          printf '%s\n' "$MAIN_SHA" > /tmp/flixo-watch/main-sha
          printf '%s\n' "$WATCH_BRANCH" > /tmp/flixo-watch/observed-branch
          printf 'branch=%s\n' "$WATCH_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Ensure exact-SHA required CI is resident
        if: >-
          steps.capture.outputs.branch == 'execution' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(cat /tmp/flixo-watch/execution-sha)"
          declare -A REQUIRED_FILES=(
            ["FLIXO Test System"]="ci.yml"
            ["FLIXO WP0 Trust Baseline"]="wp0-trust-baseline.yml"
            ["FLIXO Test Impact"]="test-impact.yml"
            ["FLIXO Test Impact Execution"]="test-impact-execution.yml"
            ["Repository Security Baseline"]="repository-security-baseline.yml"
            ["Claude Security Review"]="claude-security-review.yml"
          )
          MAX_RESIDENCY_POLLS=1
          RESIDENCY_POLL_SECONDS=5
          declare -A RESIDENT_DISPATCHED=()
          for ((poll=1; poll<=MAX_RESIDENCY_POLLS; poll++)); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100" > /tmp/flixo-watch/workflow-runs.json
            MISSING=0
            for WORKFLOW in "FLIXO Test System" "FLIXO WP0 Trust Baseline" "FLIXO Test Impact" "FLIXO Test Impact Execution" "Repository Security Baseline" "Claude Security Review"; do
              FILE="${REQUIRED_FILES[$WORKFLOW]}"
              RUN_COUNT="$(jq --arg name "$WORKFLOW" --arg sha "$EXECUTION_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and (.status == "queued" or .status == "in_progress" or .conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required"))] | length' /tmp/flixo-watch/workflow-runs.json)"
              if [ "$RUN_COUNT" -eq 0 ]; then
                echo "REQUIRED_CI_MISSING workflow=$WORKFLOW file=$FILE sha=$EXECUTION_SHA poll=$poll"
                MISSING=1
              else
                echo "REQUIRED_CI_ALREADY_RESIDENT poll=$poll workflow=$WORKFLOW count=$RUN_COUNT sha=$EXECUTION_SHA"
              fi
            done
            if [ "$MISSING" -eq 0 ]; then
              echo "REQUIRED_CI_RESIDENCY=PASS sha=$EXECUTION_SHA"
              exit 0
            fi
            if [ "$poll" -lt "$MAX_RESIDENCY_POLLS" ]; then
              sleep "$RESIDENCY_POLL_SECONDS"
            fi
          done
          echo "FAIL_CLOSED: required CI residency is incomplete for exact SHA $EXECUTION_SHA after $MAX_RESIDENCY_POLLS polls; another control-plane owner did not establish residency."
          exit 1


      - name: Await required internal CI settlement on exact SHA
        id: settle_required_ci
        if: steps.capture.outcome == 'success' && steps.capture.outputs.branch == 'execution'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(cat /tmp/flixo-watch/execution-sha)"
          REQUIRED_WORKFLOWS=(
            "FLIXO Test System"
            "FLIXO WP0 Trust Baseline"
            "FLIXO Test Impact"
            "FLIXO Test Impact Execution"
            "Repository Security Baseline"
            "Claude Security Review"
          )
          MAX_POLLS=24
          POLL_SECONDS=15
          declare -A REQUIRED_FILES=(
            ["FLIXO Test System"]="ci.yml"
            ["FLIXO WP0 Trust Baseline"]="wp0-trust-baseline.yml"
            ["FLIXO Test Impact"]="test-impact.yml"
            ["FLIXO Test Impact Execution"]="test-impact-execution.yml"
            ["Repository Security Baseline"]="repository-security-baseline.yml"
            ["Claude Security Review"]="claude-security-review.yml"
          )
          for ((poll=1; poll<=MAX_POLLS; poll++)); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100" > /tmp/flixo-watch/workflow-runs.json
            WAITING=false
            FAILED=false
            for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
              RUN_JSON="$(jq -c --arg name "$workflow" --arg sha "$EXECUTION_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .conclusion != "cancelled")] | sort_by(.updated_at) | last // empty' /tmp/flixo-watch/workflow-runs.json)"
              if [ -z "$RUN_JSON" ]; then
                echo "SETTLEMENT_WAITING poll=$poll workflow=$workflow state=MISSING"
                WAITING=true
                continue
              fi
              RUN_STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
              RUN_CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // ""')"
              if [ "$RUN_STATUS" = "completed" ]; then
                if [ "$RUN_CONCLUSION" != "success" ]; then
                  echo "SETTLEMENT_FOUND_RED poll=$poll workflow=$workflow conclusion=$RUN_CONCLUSION"
                  FAILED=true
                fi
              else
                echo "SETTLEMENT_WAITING poll=$poll workflow=$workflow status=$RUN_STATUS"
                WAITING=true
              fi
            done
            if [ "$FAILED" = true ] || [ "$WAITING" = false ]; then
              break
            fi
            if [ "$poll" -lt "$MAX_POLLS" ]; then
              sleep "$POLL_SECONDS"
            fi
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$EXECUTION_SHA/check-runs?per_page=100" > /tmp/flixo-watch/check-runs.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXECUTION_SHA/status" > /tmp/flixo-watch/statuses.json
          echo "REQUIRED_CI_SETTLEMENT_COMPLETE=true"

      - name: Normalize settled workflow-run evidence shape
        if: steps.capture.outputs.branch == 'execution' && steps.settle_required_ci.outcome == 'success'
        run: |
          set -euo pipefail
          jq -c '
            def normalize_run:
              {
                databaseId: (.databaseId // .id // null),
                workflowName: (.workflowName // .name // .display_title // ""),
                headSha: (.headSha // .head_sha // ""),
                headBranch: (.headBranch // .head_branch // ""),
                status: (.status // ""),
                conclusion: (.conclusion // null),
                updatedAt: (.updatedAt // .updated_at // .completed_at // .started_at // "")
              };
            (if type == "array" then . elif (.workflow_runs | type) == "array" then .workflow_runs else [] end)
            | map(normalize_run)
          ' /tmp/flixo-watch/workflow-runs.json > /tmp/flixo-watch/workflow-runs.normalized.json
          mv /tmp/flixo-watch/workflow-runs.normalized.json /tmp/flixo-watch/workflow-runs.json
          jq -e 'type == "array" and all(.[]; (.databaseId != null and .workflowName != "" and (.headSha | test("^[0-9a-f]{40}$")) and .headBranch != "" and .status != "" and (.updatedAt != "")))' /tmp/flixo-watch/workflow-runs.json >/dev/null

      - name: Capture failed CI evidence for classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required") | .databaseId' /tmp/flixo-watch/workflow-runs.json > /tmp/flixo-watch/failed-run-ids
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "/tmp/flixo-watch/logs/run-$run_id.log" 2>&1; then
              printf '\nEVIDENCE_CAPTURE=AVAILABLE\n' >> "/tmp/flixo-watch/logs/run-$run_id.log"
            else
              printf 'EVIDENCE_CAPTURE=FAILED\nRUN_ID=%s\n' "$run_id" > "/tmp/flixo-watch/logs/run-$run_id.log"
            fi
          done < /tmp/flixo-watch/failed-run-ids

          jq -r '[.[].check_runs[]
            | select(.status == "completed")
            | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")
            | select(.details_url != null and (.details_url | test("/actions/runs/[0-9]+")))
            | .details_url
            | capture("/actions/runs/(?<id>[0-9]+)").id
          ] | .[]' /tmp/flixo-watch/check-runs.json | sort -u > /tmp/flixo-watch/failed-check-run-ids
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "/tmp/flixo-watch/logs/run-$run_id.log" 2>&1; then
              printf '\nEVIDENCE_CAPTURE=AVAILABLE\n' >> "/tmp/flixo-watch/logs/run-$run_id.log"
            else
              printf 'EVIDENCE_CAPTURE=FAILED\nRUN_ID=%s\n' "$run_id" > "/tmp/flixo-watch/logs/run-$run_id.log"
            fi
          done < /tmp/flixo-watch/failed-check-run-ids

      - name: Build watcher input
        id: build_input
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => fs.readFileSync(p, 'utf8');
          const parse = (p) => JSON.parse(read(p));
          const executionSha = read('/tmp/flixo-watch/execution-sha').trim();
          const mainSha = read('/tmp/flixo-watch/main-sha').trim();
          const openPrs = parse('/tmp/flixo-watch/open-prs.json');
          const allPrs = parse('/tmp/flixo-watch/all-prs.json');
          const workflowRuns = parse('/tmp/flixo-watch/workflow-runs.json');
          const checkPages = parse('/tmp/flixo-watch/check-runs.json');
          const checkRuns = checkPages.flatMap((page) => page.check_runs ?? []);
          const statuses = parse('/tmp/flixo-watch/statuses.json').statuses ?? [];
          const compare = parse('/tmp/flixo-watch/compare.json');
          const logs = {};
          for (const name of fs.readdirSync('/tmp/flixo-watch/logs')) {
            const match = name.match(/^run-(\d+)\.log$/);
            if (match) logs[match[1]] = read('/tmp/flixo-watch/logs/' + name);
          }
          const observedBranch = read('/tmp/flixo-watch/observed-branch').trim();
          const input = {
            executionSha,
            mainSha,
            observedBranch,
            openPr: openPrs[0] ?? null,
            latestMergedPr: allPrs.find((item) => item.mergedAt && item.mergeCommit) ?? null,
            workflowRuns,
            checkRuns,
            statuses,
            logs,
            compare,
          };
          fs.writeFileSync('/tmp/flixo-watch/input.json', JSON.stringify(input, null, 2) + '\n');
          NODE

      - name: Evaluate Daily FLIXO Green Gate
        id: evaluate
        run: |
          set +e
          node scripts/ci/continuous-error-watch.mjs /tmp/flixo-watch/input.json /tmp/flixo-watch/report.json
          rc=$?
          STATUS="$(jq -r '.status' /tmp/flixo-watch/report.json)"
          REPAIR_REQUIRED="$(jq -r '.repair.required // false' /tmp/flixo-watch/report.json)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "repair_required=$REPAIR_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate comprehensive execution prompts from this visit
        id: generate_prompts
        if: steps.build_input.outcome == 'success'
        env:
          FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/ci/generate-repair-execution-prompts.mjs             /tmp/flixo-watch/input.json             /tmp/flixo-watch/report.json             /tmp/flixo-watch/execution-prompts.json             /tmp/flixo-watch/execution-prompts.md
          test -s /tmp/flixo-watch/execution-prompts.json
          test -s /tmp/flixo-watch/execution-prompts.md
          PROMPT_META="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bundle = JSON.parse(fs.readFileSync('/tmp/flixo-watch/execution-prompts.json', 'utf8'));
          if (!Number.isInteger(bundle.promptCount) || bundle.promptCount < 0) throw new Error('PROMPT_BUNDLE_PROMPT_COUNT_INVALID');
          if (!/^[a-f0-9]{64}$/u.test(String(bundle.digest ?? ''))) throw new Error('PROMPT_BUNDLE_DIGEST_INVALID');
          process.stdout.write(JSON.stringify({ promptCount: bundle.promptCount, digest: bundle.digest }));
          NODE
          )"
          PROMPT_COUNT="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/flixo-watch/execution-prompts.json','utf8')); process.stdout.write(String(x.promptCount))" )"
          PROMPT_DIGEST="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/flixo-watch/execution-prompts.json','utf8')); process.stdout.write(String(x.digest))" )"
          echo "REPAIR_PROMPT_COUNT=$PROMPT_COUNT"
          echo "REPAIR_PROMPT_DIGEST=$PROMPT_DIGEST"
          echo "REPAIR_PROMPT_SOURCE_RUN_ID=$GITHUB_RUN_ID"

      - name: Publish execution prompt bundle
        if: steps.generate_prompts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-execution-prompts-${{ github.run_id }}
          path: |
            /tmp/flixo-watch/execution-prompts.json
            /tmp/flixo-watch/execution-prompts.md
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch internal repair target under Task Agent authority
        if: steps.evaluate.outputs.status == 'RED_INTERNAL' && steps.evaluate.outputs.repair_required == 'true' && steps.capture.outputs.branch == 'execution'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_RUN_ID="$(jq -r '.repair.targetRunId // empty' /tmp/flixo-watch/report.json)"
          FAILURE_FINGERPRINT="$(jq -r '.repair.failureFingerprint // empty' /tmp/flixo-watch/report.json)"
          FAILED_SHA="$(jq -r '.repair.failedSha // empty' /tmp/flixo-watch/report.json)"
          REPAIR_KEY="$(jq -r '.repair.repairKey // empty' /tmp/flixo-watch/report.json)"
          REPAIR_CHAIN_ID="$(jq -r '.repair.repairChainId // empty' /tmp/flixo-watch/report.json)"
          LEASE_REF="$(jq -r '.repair.leaseRef // empty' /tmp/flixo-watch/report.json)"
          for value in TARGET_RUN_ID FAILURE_FINGERPRINT FAILED_SHA REPAIR_KEY REPAIR_CHAIN_ID LEASE_REF; do
            test -n "${!value}" || { echo "FAIL CLOSED: watcher repair identity field $value is missing."; exit 1; }
          done
          EXPECTED_CLAIM_KEY="$(node scripts/ci/repair-control-plane.mjs identity \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" | jq -r '.claimKey')"
          test "$REPAIR_KEY" = "$EXPECTED_CLAIM_KEY" || {
            echo 'FAIL CLOSED: watcher repairKey is not derived from the canonical Control Plane identity.'
            exit 1
          }

          OBSERVED_EXECUTION_SHA="$(cat /tmp/flixo-watch/execution-sha)"
          CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$FAILED_SHA" = "$OBSERVED_EXECUTION_SHA" || {
            echo "FAIL CLOSED: watcher failed SHA $FAILED_SHA does not match the exact observed execution SHA $OBSERVED_EXECUTION_SHA."
            exit 1
          }
          test "$CURRENT_EXECUTION_SHA" = "$OBSERVED_EXECUTION_SHA" || {
            echo "FAIL CLOSED: execution advanced between observation and lease claim: observed=$OBSERVED_EXECUTION_SHA current=$CURRENT_EXECUTION_SHA."
            exit 1
          }
          echo "EXACT_SHA_DISPATCH_GUARD=PASS"

          CLAIM_FILE="/tmp/flixo-watch/lease-claim.json"
          node scripts/ci/repair-lease.mjs claim \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" \
            --leaseOwner="DAILY_FLIXO_GREEN_GATE" \
            --repairRunId="$GITHUB_RUN_ID" > "$CLAIM_FILE"
          CLAIM_STATUS="$(jq -r '.status' "$CLAIM_FILE")"
          echo "REPAIR_LEASE_INITIAL_STATUS=$CLAIM_STATUS"

          ATTEMPT=1
          DISPATCH=false

          case "$CLAIM_STATUS" in
            ACQUIRED)
              DISPATCH=true
              ;;
            ALREADY_CLAIMED)
              RECOVERY_FILE="/tmp/flixo-watch/lease-recovery.json"
              node scripts/ci/repair-lease.mjs recover \
                --fingerprint="$FAILURE_FINGERPRINT" \
                --failedSha="$FAILED_SHA" \
                --targetRunId="$TARGET_RUN_ID" \
                --branch="execution" \
                --leaseOwner="DAILY_FLIXO_GREEN_GATE" \
                > "$RECOVERY_FILE"
              RECOVERY_STATUS="$(jq -r '.status' "$RECOVERY_FILE")"
              echo "REPAIR_LEASE_RECOVERY_STATUS=$RECOVERY_STATUS"
              case "$RECOVERY_STATUS" in
                RECOVERY_ACQUIRED)
                  ATTEMPT="$(jq -r '.attempt' "$RECOVERY_FILE")"
                  DISPATCH=true
                  ;;
                RECOVERY_ALREADY_CLAIMED)
                  echo 'Another watcher already acquired the stale recovery lease; no duplicate dispatch.'
                  ;;
                ACTIVE|NOT_STALE|MUTATION_OR_NEW_SHA|VERIFIED|CIRCUIT_OPEN|SUCCESS_WITHOUT_ATTESTATION)
                  echo "NO_DISPATCH_REASON=$RECOVERY_STATUS"
                  ;;
                AUTH_FAILURE|PROVIDER_FAILURE|FAIL_CLOSED)
                  echo 'FAIL CLOSED: stale recovery could not be evaluated safely.'
                  exit 1
                  ;;
                *)
                  echo "FAIL CLOSED: unexpected stale recovery status=$RECOVERY_STATUS"
                  exit 1
                  ;;
              esac
              ;;
            AUTH_FAILURE|PROVIDER_FAILURE|FAIL_CLOSED)
              echo "FAIL CLOSED: atomic lease claim status=$CLAIM_STATUS"
              exit 1
              ;;
            *)
              echo "FAIL CLOSED: unexpected lease claim status=$CLAIM_STATUS"
              exit 1
              ;;
          esac

          if [ "$DISPATCH" = true ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/auto-repair.yml/dispatches" \
              -f ref=execution \
              -f "inputs[target_run_id]=$TARGET_RUN_ID" \
              -f "inputs[chain_id]=$REPAIR_CHAIN_ID" \
              -f "inputs[failure_fingerprint]=$FAILURE_FINGERPRINT" \
              -f "inputs[repair_lease_ref]=$LEASE_REF" \
              -f "inputs[repair_lease_attempt]=$ATTEMPT" \
              -f "inputs[prompt_source_run_id]=$GITHUB_RUN_ID"
            echo "REPAIR_LEASE_DISPATCHED=true"
            echo "REPAIR_DISPATCH_TARGET=$TARGET_RUN_ID"
            echo "REPAIR_CHAIN_ID=$REPAIR_CHAIN_ID"
            echo "REPAIR_LEASE_ATTEMPT=$ATTEMPT"
          else
            echo 'REPAIR_LEASE_DISPATCHED=false'
            echo "REPAIR_ALREADY_CLAIMED=$REPAIR_KEY"
          fi

      - name: Promote Action Vault learning only after Canonical GREEN
        id: learning_promotion
        if: steps.evaluate.outputs.status == 'GREEN' && steps.capture.outputs.branch == 'execution'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(cat /tmp/flixo-watch/execution-sha)"
          ARTIFACT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("flixo-action-vault-provisional-learning-"))) | [.id,.created_at,.name] | @tsv' | sort -k2,2r | head -n 1 | cut -f1)"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "provisional_found=false" >> "$GITHUB_OUTPUT"
            echo "ACTION_VAULT_LEARNING_PROMOTION=SKIPPED_NO_PROVISIONAL"
            exit 0
          fi
          echo "provisional_found=true" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/action-vault-provisional-learning.zip
          mkdir -p /tmp/action-vault-learning
          unzip -o /tmp/action-vault-provisional-learning.zip -d /tmp/action-vault-learning >/dev/null
          PROVISIONAL="$(find /tmp/action-vault-learning -name provisional-learning.json -print -quit)"
          test -s "$PROVISIONAL"
          TARGET_SHA="$(jq -r '.targetSha' "$PROVISIONAL")"
          LEARNING_EXECUTION_SHA="$(jq -r '.executionSha // empty' "$PROVISIONAL")"
          LEARNING_RUN_ID="$(jq -r '.runId // empty' "$PROVISIONAL")"
          FINGERPRINT="$(jq -r '.fingerprint' "$PROVISIONAL")"
          TASK_ID="$(jq -r '.taskId' "$PROVISIONAL")"
          test "$(jq -r '.status' "$PROVISIONAL")" = 'PROVISIONAL'
          test "$LEARNING_EXECUTION_SHA" = "$CURRENT_SHA" || {
            echo "FAIL CLOSED: provisional learning executionSha=$LEARNING_EXECUTION_SHA does not match current green SHA=$CURRENT_SHA."
            exit 1
          }
          test -n "$LEARNING_RUN_ID" || {
            echo "FAIL CLOSED: provisional learning runId is missing."
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_SHA"
          jq -n --arg recordId "DAILY_FLIXO_GREEN_GATE:$CURRENT_SHA:$GITHUB_RUN_ID" --arg source 'DAILY_FLIXO_GREEN_GATE' --arg conclusion 'success' --arg targetSha "$CURRENT_SHA" --arg taskId "$TASK_ID" --arg fingerprint "$FINGERPRINT" '{recordId:$recordId,source:$source,conclusion:$conclusion,zeroRed:true,exactShaVerified:true,targetSha:$targetSha,taskId:$taskId,fingerprint:$fingerprint}' > /tmp/action-vault-green-record.json
          node scripts/ci/action-vault-learning-promotion.mjs "$PROVISIONAL" /tmp/action-vault-green-record.json "$(jq -r '.proofIds | join(",")' "$PROVISIONAL")" /tmp/verified-learning.json
          jq -e --arg sha "$CURRENT_SHA" '.status=="VERIFIED" and .executionSha==$sha and .greenRecordId != ""' /tmp/verified-learning.json >/dev/null

      - name: Certify Action Vault from exact-SHA Green evidence
        id: action_vault_certification
        if: steps.learning_promotion.outcome == 'success' && steps.learning_promotion.outputs.provisional_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s /tmp/verified-learning.json
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          node scripts/ci/action-vault-certification-collector.mjs /tmp/flixo-watch/report.json /tmp/ACTION-VAULT-100-CERTIFICATION.json
          jq -e '.certificationStatus=="100/100 VERIFIED" and .score==100 and .exactSha==.executionSha and .canonicalGreenRecord.conclusion=="success"' /tmp/ACTION-VAULT-100-CERTIFICATION.json >/dev/null

      - name: Publish Action Vault 100/100 certification evidence
        if: always() && steps.action_vault_certification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ACTION-VAULT-100-CERTIFICATION-${{ github.run_id }}
          path: |
            /tmp/ACTION-VAULT-100-CERTIFICATION.json
            /tmp/verified-learning.json
            /tmp/action-vault-green-record.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish cycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-continuous-error-watch-${{ github.run_id }}
          path: |
            /tmp/flixo-watch/report.json
            /tmp/flixo-watch/execution-sha
            /tmp/flixo-watch/main-sha
            /tmp/flixo-watch/observed-branch
            /tmp/flixo-watch/open-prs.json
            /tmp/flixo-watch/all-prs.json
            /tmp/flixo-watch/workflow-runs.json
            /tmp/flixo-watch/check-runs.json
            /tmp/flixo-watch/statuses.json
            /tmp/flixo-watch/compare.json
            /tmp/flixo-watch/logs/
            /tmp/flixo-watch/repair-control-plane.json
            /tmp/flixo-watch/lease-claim.json
            /tmp/flixo-watch/lease-recovery.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed unless the monitored state is fully GREEN
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test -s /tmp/flixo-watch/report.json
          STATUS="$(jq -r '.status' /tmp/flixo-watch/report.json)"
          echo "FLIXO CONTINUOUS ERROR WATCH STATUS=$STATUS"
          case "$STATUS" in
            GREEN) exit 0 ;;
            *) exit 1 ;;
          esac