name: Matrix First Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  PLAYWRIGHT_SERVER: preview
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  matrix:
    name: Matrix First — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: matrix-first-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          executable="$(node - <<'NODE'
          const p = require('playwright');
          const b = p[process.env.BROWSER];
          process.stdout.write(b.executablePath());
          NODE
          )"
          if [[ -x "$executable" ]]; then
            echo "Browser cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install '${{ matrix.browser }}'
      - name: Build preview
        run: npm run build
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/matrix-first-server.log 2>&1 &
          echo $! >/tmp/matrix-first-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/matrix-first-server.log || true
          exit 1
      - name: Capture bootstrap diagnostics
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3000/ar/ai-image-generator > /tmp/matrix-first-html.html
          echo '--- SERVED HTML HEAD ---'
          head -c 5000 /tmp/matrix-first-html.html
          echo
          echo '--- BROWSER BOOT DIAGNOSTICS ---'
          timeout --preserve-status 45s node - <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const browserType = { chromium, firefox, webkit }[process.env.BROWSER];
          if (!browserType) throw new Error(`Unsupported browser: ${process.env.BROWSER}`);
          (async () => {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage();
            const events = [];
            await page.addInitScript(() => {
              const traces = [];
              const htmlElement = document.documentElement;
              const record = (kind, name, value) => {
                traces.push({ kind, name, value: String(value), stack: new Error().stack });
              };
              const langProto = Object.getPrototypeOf(htmlElement);
              const protos = [langProto, HTMLElement.prototype, Element.prototype].filter(Boolean);
              for (const prop of ['lang', 'dir']) {
                for (const proto of protos) {
                  const descriptor = Object.getOwnPropertyDescriptor(proto, prop);
                  if (!descriptor?.configurable || (!descriptor.get && !descriptor.set)) continue;
                  Object.defineProperty(proto, prop, {
                    configurable: true,
                    enumerable: descriptor.enumerable ?? false,
                    get: descriptor.get ? function () { return descriptor.get.call(this); } : undefined,
                    set: descriptor.set ? function (value) {
                      if (this === document.documentElement) record('property', prop, value);
                      return descriptor.set.call(this, value);
                    } : undefined,
                  });
                  break;
                }
              }
              const originalSetAttribute = Element.prototype.setAttribute;
              Element.prototype.setAttribute = function (name, value) {
                if (this === document.documentElement && (name === 'lang' || name === 'dir')) record('setAttribute', name, value);
                return originalSetAttribute.call(this, name, value);
              };
              window.__flixoLocaleTrace = traces;
            });
            page.on('pageerror', (error) => events.push(`pageerror: ${error.message}`));
            page.on('console', (message) => events.push(`console:${message.type()}: ${message.text()}`));
            page.on('requestfailed', (request) => events.push(`requestfailed: ${request.url()} — ${request.failure()?.errorText ?? 'unknown'}`));
            page.on('response', (response) => {
              if (response.url().includes('/src/') && response.status() >= 400) events.push(`response:${response.status()}: ${response.url()}`);
            });
            const response = await page.goto('http://127.0.0.1:3000/ar/ai-image-generator', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(3000);
            const state = await page.evaluate(() => ({
              readyState: document.readyState,
              href: location.href,
              htmlLang: document.documentElement.getAttribute('lang'),
              htmlDir: document.documentElement.getAttribute('dir'),
              html: document.documentElement.outerHTML.slice(0, 12000),
              bodyChildren: [...document.body.children].map((node) => ({ tag: node.tagName, id: node.id, class: node.className })),
              rootHtml: document.getElementById('root')?.innerHTML.slice(0, 6000) ?? null,
              scripts: [...document.scripts].map((script) => script.src || '[inline]'),
              resources: performance.getEntriesByType('resource').map((entry) => entry.name).filter((name) => name.includes('/src/') || name.includes('.js')).slice(-100),
              localeTrace: window.__flixoLocaleTrace ?? [],
            }));
            console.log(JSON.stringify({ responseStatus: response?.status(), events, state }, null, 2));
            await browser.close();
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Run owned shard — stop at first failure
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "Matrix unit: browser=${{ matrix.browser }} shard=${{ matrix.shard }}/4"
          npx playwright test tests/localization-runtime.spec.ts \
            --project=${{ matrix.browser }} \
            --workers=6 \
            --retries=0 \
            --max-failures=1 \
            --shard=${{ matrix.shard }}/4
      - name: Upload independent diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matrix-first-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/matrix-first-server.log
            /tmp/matrix-first-html.html
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/matrix-first-server.pid ]; then kill "$(cat /tmp/matrix-first-server.pid)" 2>/dev/null || true; fi

  certification:
    name: Matrix First Certification
    needs: [matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on any matrix unit
        run: |
          set -euo pipefail
          result='${{ needs.matrix.result }}'
          echo "matrix=$result"
          test "$result" = success
          echo 'Matrix First Certification PASS: all 12 browser/shard units passed independently.'
