name: Matrix First Gate

on:
  workflow_dispatch:

permissions:
  contents: read

# Canonical matrix ownership lives in full-matrix-parallel.yml. This workflow
# is intentionally manual and diagnostic-only; it must never compete with the
# canonical matrix certification gate.
concurrency:
  group: matrix-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  PLAYWRIGHT_SERVER: preview
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  diagnostic:
    name: Matrix Diagnostic — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install browser dependencies
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Install browser
        run: npx playwright install '${{ matrix.browser }}'
      - name: Build preview
        run: npm run build
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/matrix-diagnostic-server.log 2>&1 &
          echo $! >/tmp/matrix-diagnostic-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/matrix-diagnostic-server.log || true
          exit 1
      - name: Run diagnostic shard
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npx playwright test tests/localization-runtime.spec.ts \
            --project=${{ matrix.browser }} \
            --workers=6 \
            --retries=0 \
            --max-failures=1 \
            --shard=${{ matrix.shard }}/4
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matrix-diagnostic-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/matrix-diagnostic-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/matrix-diagnostic-server.pid ]; then kill "$(cat /tmp/matrix-diagnostic-server.pid)" 2>/dev/null || true; fi
