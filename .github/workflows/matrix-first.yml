name: Matrix First Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  PLAYWRIGHT_SERVER: preview
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  prepare:
    name: Prepare Matrix Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build canonical preview once
        run: npm run build
      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          git rev-parse HEAD > dist/matrix-head-sha.txt
          sha256sum package-lock.json > dist/matrix-package-lock.sha256
      - name: Upload canonical preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: matrix-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  matrix:
    name: E2E — ${{ matrix.browser }} — shard-${{ matrix.shard }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download canonical preview artifact
        uses: actions/download-artifact@v6
        with:
          name: matrix-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Verify artifact identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(cat dist/matrix-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/matrix-package-lock.sha256
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: e2e-matrix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          executable="$(node - <<'NODE'
          const p = require('playwright');
          const b = p[process.env.BROWSER];
          process.stdout.write(b.executablePath());
          NODE
          )"
          if [[ -x "$executable" ]]; then
            echo "Browser cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install '${{ matrix.browser }}'
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/e2e-matrix-server.log 2>&1 &
          echo $! >/tmp/e2e-matrix-server.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e2e-matrix-server.log || true
          exit 1
      - name: Run complete tool matrix
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          specs=(
            tests/image-compressor.spec.ts
            tests/background-remover.spec.ts
            tests/image-upscaler.spec.ts
            tests/image-converter.spec.ts
            tests/ai-image-generator.spec.ts
            tests/object-remover.spec.ts
            tests/watermark-remover.spec.ts
            tests/image-cropper.spec.ts
            tests/image-to-svg.spec.ts
            tests/image-ocr.spec.ts
            tests/photo-colorizer.spec.ts
            tests/background-blur.spec.ts
            tests/passport-photo-maker.spec.ts
            tests/watermark-adder.spec.ts
            tests/meme-generator.spec.ts
            tests/collage-maker.spec.ts
            tests/image-effects.spec.ts
            tests/exif-cleaner.spec.ts
            tests/svg-optimizer.spec.ts
            tests/mockup-generator.spec.ts
            tests/seed.spec.ts
            tests/pix.spec.ts
          )
          echo "E2E matrix unit: browser=${{ matrix.browser }} shard=${{ matrix.shard }}/2 tools=${#specs[@]}"
          npx playwright test "${specs[@]}" \
            --project="${{ matrix.browser }}" \
            --workers=6 \
            --retries=0 \
            --max-failures=1 \
            --shard=${{ matrix.shard }}/2
      - name: Upload independent diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-matrix-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-matrix-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/e2e-matrix-server.pid ]; then kill "$(cat /tmp/e2e-matrix-server.pid)" 2>/dev/null || true; fi

  certification:
    name: Matrix First Certification
    needs: [matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on any E2E shard
        run: |
          set -euo pipefail
          result='${{ needs.matrix.result }}'
          echo "matrix=$result"
          test "$result" = success
          echo 'Matrix First Certification PASS: all 22 tools × 3 browsers covered across deterministic shards.'
