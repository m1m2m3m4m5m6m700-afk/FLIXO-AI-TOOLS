name: Matrix First Gate

# Canonical blocking browser certification pipeline.
# One exact source build is consumed by every browser/shard lane.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: matrix-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  PLAYWRIGHT_SERVER: preview
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  static-and-build:
    name: Static Gate + Single Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Localization parity and fallback guard
        run: npm run validate:i18n
      - name: Single production build + asset-chain validation
        run: npm run build
      - name: Verify build exists
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
      - name: Publish reusable production artifact
        uses: actions/upload-artifact@v6
        with:
          name: matrix-first-build-${{ env.EXPECTED_HEAD_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  matrix:
    name: Matrix First — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [static-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - browser: chromium
            shard: 1
            total_shards: 3
          - browser: chromium
            shard: 2
            total_shards: 3
          - browser: chromium
            shard: 3
            total_shards: 3
          - browser: firefox
            shard: 1
            total_shards: 3
          - browser: firefox
            shard: 2
            total_shards: 3
          - browser: firefox
            shard: 3
            total_shards: 3
          - browser: webkit
            shard: 1
            total_shards: 3
          - browser: webkit
            shard: 2
            total_shards: 3
          - browser: webkit
            shard: 3
            total_shards: 3
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download exact reusable build
        uses: actions/download-artifact@v6
        with:
          name: matrix-first-build-${{ env.EXPECTED_HEAD_SHA }}
          path: dist
      - name: Verify exact build identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -f dist/index.html
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: matrix-first-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            matrix-first-${{ runner.os }}-${{ matrix.browser }}-
      - name: Install browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          executable="$(node - <<'NODE'
          const p = require('playwright');
          const b = p[process.env.BROWSER];
          process.stdout.write(b.executablePath());
          NODE
          )"
          if [[ -x "$executable" ]]; then
            echo "Browser cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install '${{ matrix.browser }}'
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npx vite preview --host 127.0.0.1 --port 3000 >/tmp/matrix-first-server.log 2>&1 &
          echo $! >/tmp/matrix-first-server.pid
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error --http1.1 http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --show-error --http1.1 http://127.0.0.1:3000/ar/aspect-ratio-calculator >/tmp/matrix-first-readiness.html
          grep -qi '<html' /tmp/matrix-first-readiness.html
      - name: Run browser shard — fail on first failure
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npx playwright test tests/localization-runtime.spec.ts \
            --project=${{ matrix.browser }} \
            --workers=6 \
            --retries=0 \
            --max-failures=1 \
            --shard=${{ matrix.shard }}/${{ matrix.total_shards }}
      - name: Upload matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matrix-first-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/matrix-first-server.log
            /tmp/matrix-first-readiness.html
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/matrix-first-server.pid ]; then kill "$(cat /tmp/matrix-first-server.pid)" 2>/dev/null || true; fi

  certification:
    name: Matrix First Certification
    needs: [static-and-build, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require static gate and every browser shard to pass
        run: |
          set -euo pipefail
          static_result='${{ needs.static-and-build.result }}'
          matrix_result='${{ needs.matrix.result }}'
          test "$static_result" = success
          test "$matrix_result" = success
          echo 'Matrix First Certification PASS: one exact-head production build consumed by all Chromium, Firefox, and WebKit shards.'
