name: Matrix First Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  PLAYWRIGHT_SERVER: preview
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  matrix:
    name: E2E — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: image-compressor
            spec: tests/image-compressor.spec.ts
          - tool: background-remover
            spec: tests/background-remover.spec.ts
          - tool: image-upscaler
            spec: tests/image-upscaler.spec.ts
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: ai-image-generator
            spec: tests/ai-image-generator.spec.ts
          - tool: object-remover
            spec: tests/object-remover.spec.ts
          - tool: watermark-remover
            spec: tests/watermark-remover.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
          - tool: image-ocr
            spec: tests/image-ocr.spec.ts
          - tool: photo-colorizer
            spec: tests/photo-colorizer.spec.ts
          - tool: background-blur
            spec: tests/background-blur.spec.ts
          - tool: passport-photo-maker
            spec: tests/passport-photo-maker.spec.ts
          - tool: watermark-adder
            spec: tests/watermark-adder.spec.ts
          - tool: meme-generator
            spec: tests/meme-generator.spec.ts
          - tool: collage-maker
            spec: tests/collage-maker.spec.ts
          - tool: image-effects
            spec: tests/image-effects.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: svg-optimizer
            spec: tests/svg-optimizer.spec.ts
          - tool: mockup-generator
            spec: tests/mockup-generator.spec.ts
          - tool: seed
            spec: tests/seed.spec.ts
          - tool: pix
            spec: tests/pix.spec.ts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: e2e-matrix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          executable="$(node - <<'NODE'
          const p = require('playwright');
          const b = p[process.env.BROWSER];
          process.stdout.write(b.executablePath());
          NODE
          )"
          if [[ -x "$executable" ]]; then
            echo "Browser cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install '${{ matrix.browser }}'
      - name: Build preview
        run: npm run build
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/e2e-matrix-server.log 2>&1 &
          echo $! >/tmp/e2e-matrix-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e2e-matrix-server.log || true
          exit 1
      - name: Run E2E test
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "E2E matrix unit: tool=${{ matrix.tool }} browser=${{ matrix.browser }}"
          npx playwright test "${{ matrix.spec }}" \
            --project="${{ matrix.browser }}" \
            --workers=6 \
            --retries=0 \
            --max-failures=1
      - name: Upload independent diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-matrix-${{ matrix.tool }}-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-matrix-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/e2e-matrix-server.pid ]; then kill "$(cat /tmp/e2e-matrix-server.pid)" 2>/dev/null || true; fi

  certification:
    name: Matrix First Certification
    needs: [matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on any E2E unit
        run: |
          set -euo pipefail
          result='${{ needs.matrix.result }}'
          echo "matrix=$result"
          test "$result" = success
          echo 'Matrix First Certification PASS: all 22×3 browser units passed independently.'
