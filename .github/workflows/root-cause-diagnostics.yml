name: Root Cause Diagnostics

# Deep diagnostics are intentionally opt-in. Blocking evidence is owned by the required PR and release workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-cause-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  static:
    name: Root Cause — ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - area: typecheck
            command: npm run typecheck
          - area: lint
            command: npm run lint
          - area: engineering-baseline
            command: npm run validate:baseline
          - area: tool-registry
            command: npm run validate:tool-registry && npm run validate:router-registry
          - area: localization
            command: npm run validate:i18n && npm run validate:home-i18n && npm run validate:localization-full
          - area: seo-indexing
            command: npm run validate:seo && npm run validate:seo-manifest && npm run validate:use-case-seo && npm run validate:indexing
          - area: ci-contract
            command: npm run validate:ci-contract
          - area: security-integrity
            command: npm run audit:production && node --experimental-strip-types scripts/test-file-safety.mjs && node --experimental-strip-types scripts/test-output-integrity.mjs && node --experimental-strip-types scripts/test-svg-integrity.mjs
          - area: release-contracts
            command: npm run test:quickflow && node scripts/test-release-evidence.mjs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run ${{ matrix.area }} diagnostics
        env:
          CI: 'true'
          VITE_SITE_URL: https://flixoai.vercel.app
        run: ${{ matrix.command }}
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: root-cause-${{ matrix.area }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build-performance:
    name: Root Cause — build-performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate deterministic PR origin
        run: npm run validate:site-origin
      - run: npm run build
      - run: npm run validate:performance-budget
      - run: npm run report:performance-baseline
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: root-cause-build-performance
          path: |
            dist/
            diagnostics/
            .flixo-performance-report.*
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Root Cause — E2E — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright ${{ matrix.browser }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: npx playwright install-deps ${{ matrix.browser }}
      - run: npx playwright install ${{ matrix.browser }}
      - name: Run E2E on ${{ matrix.browser }}
        env:
          CI: 'true'
          VITE_SITE_URL: https://flixoai.vercel.app
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: root-cause-e2e-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Root Cause Diagnostic Summary
    if: ${{ always() }}
    needs: [static, build-performance, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo '## Root Cause Diagnostics'
            echo
            echo 'This workflow is diagnostic-only and runs only when manually requested.'
            echo 'fail-fast=false preserves independent failures for diagnosis.'
            echo "static=${{ needs.static.result }}"
            echo "build-performance=${{ needs.build-performance.result }}"
            echo "e2e=${{ needs.e2e.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
