name: FLIXO Team Wake Relay

on:
  workflow_dispatch:
    inputs:
      entry_sha:
        description: Exact execution SHA bound to the pulse
        required: true
        type: string
      pulse_id:
        description: Idempotent one-minute team pulse identifier
        required: true
        type: string
      active_operation:
        description: Whether canonical repair/test work is currently resident
        required: true
        type: string

permissions:
  actions: write
  contents: read
  checks: read

concurrency:
  group: flixo-team-wake-relay-${{ inputs.entry_sha }}
  cancel-in-progress: true

jobs:
  wake:
    name: Deliver one canonical FLIXO team wake
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted relay controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact SHA and pulse identity
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_SHA: ${{ inputs.entry_sha }}
          PULSE_ID: ${{ inputs.pulse_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENTRY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULSE_ID" =~ ^TEAM-[0-9TZ:+.-]+-[0-9]+$ ]]
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$ENTRY_SHA" = "$CURRENT_SHA"
          echo 'EXACT_SHA_WAKE_GUARD=PASS'
          echo "PULSE_ID=$PULSE_ID"

      - name: Inspect resident canonical work on exact SHA
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_SHA: ${{ inputs.entry_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_REPAIRS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_TESTS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 50 --json status,headSha --jq 'map(select((.status == "queued" or .status == "in_progress") and .headSha == "'"$ENTRY_SHA"'")) | length')"
          ACTIVE_OPERATION=false
          if [ "$ACTIVE_REPAIRS" -gt 0 ] || [ "$ACTIVE_GREEN" -gt 0 ] || [ "$ACTIVE_TESTS" -gt 0 ]; then ACTIVE_OPERATION=true; fi
          echo "ACTIVE_REPAIRS=$ACTIVE_REPAIRS"
          echo "ACTIVE_GREEN=$ACTIVE_GREEN"
          echo "ACTIVE_TESTS=$ACTIVE_TESTS"
          echo "active_operation=$ACTIVE_OPERATION" >> "$GITHUB_OUTPUT"

      - name: Dispatch the canonical Green Gate only when work is resident
        if: steps.state.outputs.active_operation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$SHA" = "${{ inputs.entry_sha }}"
          gh workflow run daily-flixo-green-gate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CANONICAL_GREEN_GATE_WAKE=DISPATCHED'
          echo 'WAKE_AUTHORITY=FLIXO_TEAM_WAKE_RELAY'
          echo 'DIRECT_AUTO_REPAIR_DISPATCH=false'
          echo 'DIRECT_PUSH=false'
