name: FLIXO Test System

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Static contracts
        run: npm run test:static
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-static-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    needs: [static]
    if: always() && needs.static.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Canonical build and build contracts
        run: npm run test:build
      - name: Fingerprint immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f dist/index.html
          git rev-parse HEAD > dist/flixo-head-sha.txt
          sha256sum package-lock.json > dist/flixo-package-lock.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flixo-build-evidence-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  browser-fast:
    name: Browser FAST — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/flixo-package-lock.sha256
      - name: Install browser
        run: |
          npx playwright install-deps '${{ matrix.browser }}'
          npx playwright install '${{ matrix.browser }}'
      - name: Start runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/flixo-browser-fast.log 2>&1 &
          echo $! >/tmp/flixo-browser-fast.pid
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/flixo-browser-fast.log
          exit 1
      - name: Run Browser FAST engine
        run: |
          set -euo pipefail
          specs=(
            tests/image-compressor.spec.ts tests/background-remover.spec.ts tests/image-upscaler.spec.ts tests/image-converter.spec.ts tests/ai-image-generator.spec.ts tests/object-remover.spec.ts tests/watermark-remover.spec.ts tests/image-cropper.spec.ts tests/image-to-svg.spec.ts tests/image-ocr.spec.ts tests/photo-colorizer.spec.ts tests/background-blur.spec.ts tests/passport-photo-maker.spec.ts tests/watermark-adder.spec.ts tests/meme-generator.spec.ts tests/collage-maker.spec.ts tests/image-effects.spec.ts tests/exif-cleaner.spec.ts tests/svg-optimizer.spec.ts tests/mockup-generator.spec.ts tests/seed.spec.ts tests/pix.spec.ts
          )
          test "${#specs[@]}" -eq 22
          npx playwright test "${specs[@]}" --project='${{ matrix.browser }}' --workers=6 --retries=0 --max-failures=1 --shard=${{ matrix.shard }}/2
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-browser-fast-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/flixo-browser-fast.log
          if-no-files-found: warn
          retention-days: 14

  browser-deep:
    name: Browser DEEP — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [build]
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/flixo-package-lock.sha256
      - name: Install browser
        run: |
          npx playwright install-deps '${{ matrix.browser }}'
          npx playwright install '${{ matrix.browser }}'
      - name: Start runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/flixo-browser-deep.log 2>&1 &
          echo $! >/tmp/flixo-browser-deep.pid
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/flixo-browser-deep.log
          exit 1
      - name: Run Browser DEEP engine
        run: npx playwright test tests/localization-runtime.spec.ts --project='${{ matrix.browser }}' --workers=6 --retries=0 --max-failures=1 --shard=${{ matrix.shard }}/3
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-browser-deep-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/flixo-browser-deep.log
          if-no-files-found: warn
          retention-days: 14

  certify:
    name: Certification
    needs: [static, build, browser-fast, browser-deep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Write exact-run manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > certification-run-manifest.json <<'JSON'
          {
            "schema_version": 1,
            "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow": "FLIXO Test System",
            "jobs": {
              "static": "${{ needs.static.result }}",
              "build": "${{ needs.build.result }}",
              "browserFast": "${{ needs.browser-fast.result }}",
              "browserDeep": "${{ needs.browser-deep.result }}"
            },
            "required": {
              "matrixFirstUnits": 66,
              "fullMatrixLocales": 20,
              "browsers": 3
            }
          }
          JSON
      - name: Enforce single certification decision
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.static.result }}' = success
          test '${{ needs.build.result }}' = success
          test '${{ needs.browser-fast.result }}' = success
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then test '${{ needs.browser-deep.result }}' = success; fi
          test "$(node -e "process.stdout.write(require('./certification-run-manifest.json').sha)")" = "$EXPECTED_SHA"
      - name: Validate zero-false-green evidence
        env:
          CERTIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFICATION_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('scripts/ci/assertion-registry.json','utf8'));
          const plan = JSON.parse(fs.readFileSync('scripts/ci/test-plan.json','utf8'));
          const jobs = JSON.parse(fs.readFileSync('certification-run-manifest.json','utf8')).jobs;
          const assertionIds = Object.keys(registry.assertions ?? {});
          const owners = new Set(Object.values(registry.assertions ?? {}).map(x => x.owner));
          const planOwners = new Set(Object.values(plan.gates ?? {}).flatMap(g => g.checks ?? []).map(c => c.id));
          if (!assertionIds.length) throw new Error('no assertions');
          for (const owner of owners) if (!planOwners.has(owner) && !/^BUILD-003$/.test(owner)) throw new Error(`unowned canonical execution owner: ${owner}`);
          if (Object.values(jobs).some(v => v === 'cancelled')) throw new Error('unauthorized cancellation');
          NODE
          echo 'GREEN = all required engines passed, exact SHA verified, evidence contract valid, and no unresolved root cause is tolerated.'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flixo-certification-${{ github.run_id }}
          path: certification-run-manifest.json
          if-no-files-found: error
          retention-days: 30
