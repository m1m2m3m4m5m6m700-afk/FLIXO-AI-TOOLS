name: CI

# PR RESCUE MODE: one short deterministic path. Deep certification remains manual/main-only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_PR_RESCUE: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run impact-aware verification
        run: node scripts/ci/fast-verify.mjs
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  fast-contract:
    name: Fast Contract Diagnostics
    needs: [ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CI_PR_RESCUE: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run core platform contracts
        run: node scripts/verify-contracts-core.mjs

  canonical-verify:
    name: Canonical Verification Gate
    needs: [ci, fast-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce prerequisite results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: canonical CI failed.'
            exit 1
          fi
          if [[ "${{ needs.fast-contract.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: Fast Contract Diagnostics failed.'
            exit 1
          fi
          echo 'Canonical Verification Gate PASS: required fast-path evidence is green.'
