name: CI

# Verification trigger marker: keeps the canonical CI contract visible in audit history.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Upload performance baseline
        uses: actions/upload-artifact@v6
        with:
          name: performance-baseline
          path: diagnostics/performance-baseline.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Socket CI
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: npx --yes @socketsecurity/cli@1.1.158 ci
      - name: Skip Socket CI when no token is configured
        if: ${{ env.SOCKET_SECURITY_API_KEY == '' }}
        run: 'echo "Socket scan skipped: configure SOCKET_SECURITY_API_KEY in repository secrets to enable the blocking supply-chain gate."'

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run fast contract verifier
        run: npm run verify:fast

  browser-smoke:
    name: Browser Smoke — ${{ matrix.tool }} — Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: npx playwright test ${{ matrix.spec }} --project=chromium
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-${{ matrix.tool }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ needs.typecheck.result == 'success' && needs.lint.result == 'success' && needs.build.result == 'success' && needs.audit.result == 'success' && needs.socket.result == 'success' && needs.security.result == 'success' && needs.fast-contract.result == 'success' && needs.browser-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, security, fast-contract, browser-smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release evidence contract
        run: node scripts/test-release-evidence.mjs
      - name: Validate file safety contract
        run: node --experimental-strip-types scripts/test-file-safety.mjs
      - name: Validate output integrity contract
        run: node --experimental-strip-types scripts/test-output-integrity.mjs
      - name: Validate SVG integrity contract
        run: node --experimental-strip-types scripts/test-svg-integrity.mjs
      - name: Run canonical verification
        run: npm run verify
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Canonical Verification'
            echo
            echo 'Canonical application gate passed for the exact commit:'
            echo '${{ github.sha }}'
            echo
            echo 'All Gate A and Gate B diagnostic jobs were green before this gate ran.'
            echo 'The full 22×3 browser matrix is promoted to the independent Full Matrix Promotion workflow.'
            echo 'Build performance budget validation and baseline reporting passed before promotion.'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, security, fast-contract, browser-smoke, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Build + Performance | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract Diagnostics | ${{ needs.fast-contract.result }} |'
            echo '| Browser Smoke (4 Chromium tools) | ${{ needs.browser-smoke.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
            echo
            echo 'Fast Contract Diagnostics fail early on source-level contract drift.'
            echo 'Browser Smoke validates critical file workflows before canonical verification.'
            echo 'Build performance budget and a reproducible asset baseline are validated before promotion.'
            echo 'The full 22×3 browser matrix runs independently as promotion/release evidence.'
            echo 'Diagnostics explain failures; Canonical Verification is the single PR/application gate.'
            echo 'Socket is fail-closed when SOCKET_SECURITY_API_KEY is configured and intentionally skipped otherwise.'
          } >> "$GITHUB_STEP_SUMMARY"
