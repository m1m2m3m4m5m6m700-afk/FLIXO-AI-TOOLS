name: CI

# Temporary CI rescue mode: fast, strict, impact-aware PR gate.
# Deep certification remains available on main/manual workflows.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history for impact analysis
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies once
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run impact-aware verification
        run: node scripts/ci/fast-verify.mjs

      - name: Publish CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: CI summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## CI — Fast Incremental' >> "$GITHUB_STEP_SUMMARY"
          if [ -f diagnostics/fast-ci-result.json ]; then
            cat diagnostics/fast-ci-result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No final fast-ci result was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
