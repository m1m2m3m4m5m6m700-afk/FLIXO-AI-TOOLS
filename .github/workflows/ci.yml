name: CI

# Canonical CI: build once, parallel evidence, one fail-closed ledger and aggregator.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  build:
    name: Runtime Build + Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Write bundle size report
        run: npm run report:bundle-size
      - name: Write immutable build manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/write-build-artifact-manifest.mjs
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: performance-baseline
          path: diagnostics/performance-baseline.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-size-report
          path: diagnostics/bundle-size.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies through Socket Firewall
        run: sfw npm ci --prefer-offline --no-audit --no-fund
      - name: Verify Socket Firewall is active
        run: sfw --help >/dev/null

  secret-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run unique core contract suite
        run: node scripts/verify-contracts-core.mjs

  s3-static-gate:
    name: S3 Static Gate
    needs: [build]
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      FLIXO_BUILD_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable build artifact
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
      - run: npm run validate:site-origin
      - name: Run S3 static certification against immutable build
        env:
          S3_BASE_REF: origin/main
        run: node scripts/validate-s3-static-gate.mjs

  production-seo:
    name: Production SEO Artifacts
    needs: [build]
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      FLIXO_BUILD_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable build artifact
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
      - name: Validate generated SEO artifacts
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-seo-production.mjs
      - name: Validate complete SEO and indexing source contract
        run: |
          npm run validate:seo
          npm run validate:seo-manifest
          npm run validate:use-case-seo
          npm run validate:indexing
          npm run validate:breadcrumb-seo
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-google-multilingual-seo.mjs
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-language-quality-strict.mjs
      - name: Final SEO/indexing certification
        run: |
          set -euo pipefail
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -Fx "Sitemap: ${VITE_SITE_URL}/sitemap.xml" dist/robots.txt
          grep -Fq 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' dist/sitemap.xml
          echo "SEO/Indexing certification GREEN: production artifacts + canonical origin + hreflang + x-default + robots + indexing contracts passed."

  evidence-ledger:
    name: Evidence Ledger
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate, production-seo]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Write fail-closed evidence ledger
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FLIXO_EVIDENCE_GATES: >-
            [
              {"gate":"typecheck","owner":"CI / TypeScript","result":"${{ needs.typecheck.result }}"},
              {"gate":"lint","owner":"CI / ESLint","result":"${{ needs.lint.result }}"},
              {"gate":"build","owner":"CI / Build","result":"${{ needs.build.result }}"},
              {"gate":"audit","owner":"CI / Production Audit","result":"${{ needs.audit.result }}"},
              {"gate":"socket","owner":"CI / Socket Supply Chain","result":"${{ needs.socket.result }}"},
              {"gate":"secret-scan","owner":"CI / Secret History Scan","result":"${{ needs.secret-scan.result }}"},
              {"gate":"codeql","owner":"CI / CodeQL","result":"${{ needs.security.result }}"},
              {"gate":"fast-contract","owner":"CI / Fast Contract Diagnostics","result":"${{ needs.fast-contract.result }}"},
              {"gate":"s3","owner":"CI / S3 Static Gate","result":"${{ needs.s3-static-gate.result }}"},
              {"gate":"production-seo","owner":"CI / Production SEO Artifacts","result":"${{ needs.production-seo.result }}"}
            ]
        run: node scripts/ci/write-evidence-ledger.mjs
      - name: Upload evidence ledger
        uses: actions/upload-artifact@v6
        with:
          name: flixo-evidence-ledger-${{ github.sha }}
          path: evidence/ci/evidence-ledger.json
          if-no-files-found: error
          retention-days: 30

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [evidence-ledger]
    steps:
      - name: Fail closed on ledger status
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.evidence-ledger.result }}' != 'success' ]]; then
            echo "Evidence Ledger did not pass: ${{ needs.evidence-ledger.result }}"
            exit 1
          fi
          echo 'Canonical Verification PASSED: evidence ledger is complete, fail-closed, and tied to the current SHA.'

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate, production-seo, evidence-ledger, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Runtime Build + Performance | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| Secret History Scan | ${{ needs.secret-scan.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract Diagnostics | ${{ needs.fast-contract.result }} |'
            echo '| S3 Static Gate | ${{ needs.s3-static-gate.result }} |'
            echo '| Production SEO Artifacts | ${{ needs.production-seo.result }} |'
            echo '| Evidence Ledger | ${{ needs.evidence-ledger.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [canonical-verify]
    steps:
      - name: Confirm canonical CI gate
        run: |
          set -euo pipefail
          if [[ '${{ needs.canonical-verify.result }}' != 'success' ]]; then
            echo "Canonical Verification did not pass: ${{ needs.canonical-verify.result }}"
            exit 1
          fi
          echo "CI gate passed for exact commit ${{ github.sha }}"
