name: FLIXO Test System

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Static + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Static contracts
        run: npm run test:static
      - name: Build contracts
        run: npm run test:build
      - name: Fingerprint immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f dist/index.html
          printf '%s\n' "$EXPECTED_SHA" > dist/flixo-head-sha.txt
          sha256sum package-lock.json > dist/flixo-package-lock.sha256
      - name: Verify static/build identity
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/flixo-head-sha.txt
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/flixo-package-lock.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flixo-static-build-evidence-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  browser_fast:
    name: Browser FAST — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/flixo-package-lock.sha256
      - name: Install browser
        run: |
          npx playwright install-deps '${{ matrix.browser }}'
          npx playwright install '${{ matrix.browser }}'
      - name: Run Browser FAST engine
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          specs=(
            tests/image-compressor.spec.ts tests/background-remover.spec.ts tests/image-upscaler.spec.ts tests/image-converter.spec.ts tests/ai-image-generator.spec.ts tests/object-remover.spec.ts tests/watermark-remover.spec.ts tests/image-cropper.spec.ts tests/image-to-svg.spec.ts tests/image-ocr.spec.ts tests/photo-colorizer.spec.ts tests/background-blur.spec.ts tests/passport-photo-maker.spec.ts tests/watermark-adder.spec.ts tests/meme-generator.spec.ts tests/collage-maker.spec.ts tests/image-effects.spec.ts tests/exif-cleaner.spec.ts tests/svg-optimizer.spec.ts tests/mockup-generator.spec.ts tests/seed.spec.ts tests/pix.spec.ts
          )
          test "${#specs[@]}" -eq 22
          npx playwright test "${specs[@]}" --project="$BROWSER" --workers=6 --retries=0 --max-failures=0 --shard="$SHARD/2"
          mkdir -p diagnostics/certification
          cat > "diagnostics/certification/browser-fast-${BROWSER}-${SHARD}.json" <<JSON
          {"evidenceClass":"PRIMARY_EXECUTION","mode":"FAST","browser":"$BROWSER","shard":$SHARD,"sha":"$EXPECTED_SHA","run_id":"${GITHUB_RUN_ID}","toolSpecs":22,"status":"PASS"}
          JSON
      - name: Validate Playwright evidence serialization
        if: always()
        run: node scripts/ci/validate-playwright-evidence.mjs playwright-report/results.json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-browser-fast-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            diagnostics/certification/
            playwright-report/
            test-results/
            /tmp/flixo-browser-fast.log
          if-no-files-found: warn
          retention-days: 14

  browser_deep:
    name: Browser DEEP — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [verify]
    if: github.event_name != 'pull_request' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/flixo-package-lock.sha256
      - name: Install browser
        run: |
          npx playwright install-deps '${{ matrix.browser }}'
          npx playwright install '${{ matrix.browser }}'
      - name: Run Browser DEEP engine
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          npx playwright test tests/localization-runtime.spec.ts --project="$BROWSER" --workers=6 --retries=0 --max-failures=0 --shard="$SHARD/3"
          mkdir -p diagnostics/certification
          cat > "diagnostics/certification/browser-deep-${BROWSER}-${SHARD}.json" <<JSON
          {"evidenceClass":"PRIMARY_EXECUTION","mode":"DEEP","browser":"$BROWSER","shard":$SHARD,"sha":"$EXPECTED_SHA","run_id":"${GITHUB_RUN_ID}","locales":20,"status":"PASS"}
          JSON
      - name: Validate Playwright evidence serialization
        if: always()
        run: node scripts/ci/validate-playwright-evidence.mjs playwright-report/results.json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-browser-deep-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            diagnostics/certification/
            playwright-report/
            test-results/
            /tmp/flixo-browser-deep.log
          if-no-files-found: warn
          retention-days: 14

  certify:
    name: Certification
    needs: [verify, browser_fast, browser_deep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Download static/build evidence
        uses: actions/download-artifact@v6
        with:
          name: flixo-static-build-evidence-${{ github.run_id }}
          path: evidence/static-build
      - name: Download FAST evidence
        uses: actions/download-artifact@v6
        with:
          pattern: flixo-browser-fast-*
          path: evidence/browser-fast
          merge-multiple: true
      - name: Download DEEP evidence
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v6
        with:
          pattern: flixo-browser-deep-*
          path: evidence/browser-deep
          merge-multiple: true
      - name: Write exact-run manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > certification-run-manifest.json <<'JSON'
          {
            "schema_version": 4,
            "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow": "FLIXO Test System",
            "jobs": {
              "static": "${{ needs.verify.result }}",
              "build": "${{ needs.verify.result }}",
              "browserFast": "${{ needs.browser_fast.result }}",
              "browserDeep": "${{ needs.browser_deep.result }}"
            },
            "required": {
              "matrixFirstUnits": 66,
              "fullMatrixLocales": 20,
              "browsers": 3
            }
          }
          JSON
      - name: Single certification engine
        env:
          CERTIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CERTIFICATION_MANIFEST: certification-run-manifest.json
        run: node scripts/ci/certify.mjs
      - name: Enforce fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/certification/global-evidence.json
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('diagnostics/certification/global-evidence.json','utf8'));
          if (r.status !== 'PASS') throw new Error(JSON.stringify(r));
          for (const [key, value] of Object.entries(r.zeroFalseGreen)) if (value !== 0) throw new Error(`${key}=${value}`);
          NODE
          echo 'GREEN = exact SHA + required coverage + valid evidence + zero independent root causes.'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flixo-certification-${{ github.run_id }}
          path: |
            certification-run-manifest.json
            diagnostics/certification/
          if-no-files-found: error
          retention-days: 30
