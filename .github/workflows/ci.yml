name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  fast-integrity:
    name: Fast Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck -- --incremental --skipLibCheck

      - name: Lint
        run: npm run lint -- --cache

      - name: Validate Registry ↔ Router
        run: |
          set -euo pipefail
          npm run validate:tool-registry
          npm run validate:router-registry

      - name: Validate contracts
        run: npm run validate:contracts
