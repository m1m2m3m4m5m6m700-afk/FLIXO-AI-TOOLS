name: CI

# Canonical CI: parallel evidence + one fail-closed aggregator.
on:
  push:
    branches:
      - main
      - 'work/**'
      - 'fix/**'
      - 's3-**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  build:
    name: Runtime Build + Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build:runtime
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Write bundle size report
        run: npm run report:bundle-size
      - uses: actions/upload-artifact@v6
        with:
          name: performance-baseline
          path: diagnostics/performance-baseline.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-size-report
          path: diagnostics/bundle-size.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run Socket CI
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: npx --yes @socketsecurity/cli@1.1.158 ci
      - name: Skip Socket CI when no token is configured
        if: ${{ env.SOCKET_SECURITY_API_KEY == '' }}
        run: echo "Socket scan skipped: configure SOCKET_SECURITY_API_KEY to enable the blocking supply-chain gate."

  secret-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run verify:contracts

  browser-smoke:
    name: Browser Smoke — ${{ matrix.tool }} — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
          - tool: performance-route-loading
            spec: tests/performance-route-loading.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - run: npx playwright install chromium
      - name: Run smoke test
        env:
          PLAYWRIGHT_SERVER: ${{ matrix.tool == 'performance-route-loading' && 'preview' || 'dev' }}
        run: npx playwright test "${{ matrix.spec }}" --project=chromium
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-${{ matrix.tool }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  s3-static-gate:
    name: S3 Static Gate
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run validate:site-origin
      - name: Run S3 static certification
        env:
          S3_BASE_REF: origin/main
        run: node scripts/validate-s3-static-gate.mjs

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ always() && (needs.typecheck.result != 'skipped') && (needs.lint.result != 'skipped') && (needs.build.result != 'skipped') && (needs.audit.result != 'skipped') && (needs.socket.result != 'skipped') && (needs.secret-scan.result != 'skipped') && (needs.security.result != 'skipped') && (needs.fast-contract.result != 'skipped') && (needs.browser-smoke.result != 'skipped') && (needs.s3-static-gate.result != 'skipped') }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, browser-smoke, s3-static-gate]
    steps:
      - name: Fail closed on any prerequisite result
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [TypeScript]="${{ needs.typecheck.result }}"
            [ESLint]="${{ needs.lint.result }}"
            [Build]="${{ needs.build.result }}"
            [Audit]="${{ needs.audit.result }}"
            [Socket]="${{ needs.socket.result }}"
            [SecretScan]="${{ needs.secret-scan.result }}"
            [CodeQL]="${{ needs.security.result }}"
            [FastContract]="${{ needs.fast-contract.result }}"
            [BrowserSmoke]="${{ needs.browser-smoke.result }}"
            [S3]="${{ needs.s3-static-gate.result }}"
          )
          failed=0
          for name in "${!results[@]}"; do
            echo "$name=${results[$name]}"
            if [[ "${results[$name]}" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo 'Canonical Verification FAILED: one or more required evidence jobs did not succeed.'
            exit 1
          fi
          echo 'Canonical Verification PASSED: every required evidence job succeeded for the exact commit.'
      - name: Write canonical evidence
        run: |
          {
            echo '## FLIXO Canonical Verification'
            echo
            echo 'All required evidence jobs succeeded for exact commit:'
            echo '${{ github.sha }}'
            echo
            echo 'Build, performance, audit, supply-chain, secret-history, CodeQL, contracts, browser smoke and S3 were each evaluated by dedicated required jobs.'
            echo 'Canonical Verification is an aggregator and intentionally does not rerun those same suites.'
            echo 'Full browser certification remains independent on main/release.'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, browser-smoke, s3-static-gate, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Runtime Build + Performance | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| Secret History Scan | ${{ needs.secret-scan.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract Diagnostics | ${{ needs.fast-contract.result }} |'
            echo '| Browser Smoke | ${{ needs.browser-smoke.result }} |'
            echo '| S3 Static Gate | ${{ needs.s3-static-gate.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [canonical-verify]
    steps:
      - name: Confirm canonical CI gate
        if: ${{ needs.canonical-verify.result != 'success' }}
        run: |
          echo "Canonical Verification did not pass: ${{ needs.canonical-verify.result }}"
          exit 1
      - name: Confirm canonical CI gate
        run: echo "CI gate passed for ${{ github.sha }}"
