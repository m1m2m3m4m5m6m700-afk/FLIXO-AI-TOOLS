name: CI

# PR and main use the same impact-aware verification engine.
# The only difference is the comparison base: PR base SHA vs the previous main commit.
# This prevents post-merge reclassification of an already-passed change into an unrelated full suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || github.sha }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_PR_RESCUE: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run impact-aware verification
        run: node scripts/ci/fast-verify.mjs
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  fast-contract:
    name: Fast Contract Diagnostics
    needs: [ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Download CI evidence
        uses: actions/download-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics
      - name: Validate fast-path evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/fast-ci-plan.json
          test -s diagnostics/fast-ci-result.json
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('diagnostics/fast-ci-result.json','utf8')); if(r.sha!==process.env.GITHUB_SHA) throw new Error('Evidence SHA mismatch'); if(r.status!=='PASS') throw new Error('Fast CI result is not PASS'); console.log('Fast contract evidence PASS');"

  canonical-verify:
    name: Canonical Verification Gate
    needs: [ci, fast-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enforce prerequisite results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: canonical CI failed.'
            exit 1
          fi
          if [[ "${{ needs.fast-contract.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: Fast Contract Diagnostics failed.'
            exit 1
          fi
          echo 'Canonical Verification Gate PASS: required fast-path evidence is green.'

  g3-foundation:
    name: G3 / Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: G3-00 Identity
        run: node scripts/ci/g3/identity.mjs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: G3-01/02/03 Environment
        if: always()
        run: node scripts/ci/g3/environment.mjs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SITE_URL: https://canonical.test
          TEST_ORIGIN: http://127.0.0.1:3000
          RUNTIME_ORIGIN: http://127.0.0.1:3000
          NODE_ENV: test
      - name: Install dependencies
        if: always()
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: G3-11 TypeScript
        if: always()
        run: npx tsc --noEmit --pretty false
      - name: G3-12 ESLint
        if: always()
        run: npm run lint
      - name: G3-13 Build
        if: always()
        run: npm run build
      - name: G3-14 Build Identity
        if: always()
        run: git rev-parse HEAD
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-foundation-${{ github.run_id }}
          path: artifacts/ci/g3/
          if-no-files-found: warn
          retention-days: 14

  g3-contracts:
    name: G3 / Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Fixed fixtures
        if: always()
        run: node scripts/ci/g3/prepare-fixtures.mjs
      - name: G3-20..31 Artifact Contract
        if: always()
        run: node --experimental-strip-types scripts/ci/g3/artifact-gates.mjs
      - name: G3-40..47 Processor
        if: always()
        run: node --experimental-strip-types scripts/ci/g3/processor.mjs
      - name: G3-90..97 Regression
        if: always()
        run: node scripts/ci/g3/regression.mjs
      - name: G3-DET Determinism
        if: always()
        run: node scripts/ci/g3/determinism.mjs
      - name: Universal Artifact Matrix
        if: always()
        run: node scripts/test-g3-artifact-integrity.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-contracts-${{ github.run_id }}
          path: artifacts/ci/g3/
          if-no-files-found: warn
          retention-days: 14

  g3-browser:
    name: G3 / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://canonical.test
      TEST_ORIGIN: http://127.0.0.1:3000
      RUNTIME_ORIGIN: http://127.0.0.1:3000
      VITE_SITE_URL: https://canonical.test
      VITE_TEST_ORIGIN: http://127.0.0.1:3000
      VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
      NODE_ENV: test
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_REUSE_SERVER: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: G3-50 Browser Installed
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Build runtime
        if: always()
        run: npm run build:runtime
      - name: Start local runtime
        if: always()
        shell: bash
        run: |
          set +e
          npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/flixo-g3-server.log 2>&1 &
          echo $! > /tmp/flixo-g3-server.pid
          exit 0
      - name: G3-50..85 Browser
        if: always()
        run: node scripts/ci/g3/browser-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-browser-${{ github.run_id }}
          path: |
            artifacts/ci/g3/
            playwright-report/
            test-results/
            /tmp/flixo-g3-server.log
          if-no-files-found: warn
          retention-days: 14

  g3-aggregator:
    name: G3 / Aggregator
    if: always()
    needs: [g3-foundation, g3-contracts, g3-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download all G3 evidence
        uses: actions/download-artifact@v6
        with:
          pattern: g3-*
          path: artifacts/ci/g3/all
          merge-multiple: true
      - name: Resolve legacy G3
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set +e
          conclusion=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="FLIXO CI — G3 Artifact Integrity Shadow")] | sort_by(.completed_at) | last | .conclusion // "NOT_FOUND"')
          echo "LEGACY_RESULT=$conclusion" >> "$GITHUB_ENV"
          echo "Legacy G3 conclusion: $conclusion"
      - name: G3 authoritative aggregation
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          LEGACY_RESULT: ${{ env.LEGACY_RESULT }}
        run: node scripts/ci/g3/aggregate.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-aggregator-${{ github.run_id }}
          path: artifacts/ci/g3/aggregator.json
          if-no-files-found: warn
          retention-days: 30
