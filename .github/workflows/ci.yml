name: FLIXO CI

on:
  pull_request:
    branches: [main, execution]
  push:
    branches: [main, execution]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: flixo-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000

jobs:
  verify:
    name: Typecheck, lint, core contracts, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Three-critic local contract tests
        run: |
          set -euo pipefail
          python3 scripts/three_critic_review.py --self-test
          python3 tests/three_critic_review.test.py
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - name: Upload npm test failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-npm-test-failure-${{ github.run_id }}
          path: npm-test.log
          if-no-files-found: error
          retention-days: 14
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Stamp exact build identity
        shell: bash
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          printf '%s\n' "$BUILD_SHA" > dist/flixo-head-sha.txt
          printf '%s\n' "$BUILD_SHA" > "dist/__flixo-identity-$BUILD_SHA.txt"
          mkdir -p "dist/__flixo/identity/$BUILD_SHA"
          printf '%s\n' "$BUILD_SHA" > "dist/__flixo/identity/$BUILD_SHA/index.txt"
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Chromium browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  trust-gate:
    name: trust-gate
    needs: [verify, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert canonical CI gates are GREEN
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$VERIFY_RESULT" = success
          test "$BROWSER_RESULT" = success
          echo 'TRUST_GATE=PASS'

  promotion-proof:
    name: Exact-SHA promotion proof
    needs: [trust-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          TRUST_RESULT: ${{ needs.trust-gate.result }}
        run: |
          set -euo pipefail
          test "$TRUST_RESULT" = success
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          if [ "$BASE_BRANCH" = "main" ]; then
            if [ "$HEAD_BRANCH" != "execution" ] && [ "$ACTOR" != "dependabot[bot]" ]; then
              echo "Unsupported main PR source: head=$HEAD_BRANCH actor=$ACTOR" >&2
              exit 1
            fi
          elif [ "$BASE_BRANCH" = "execution" ]; then
            test -n "$HEAD_BRANCH"
          else
            echo "Unsupported PR base branch: $BASE_BRANCH" >&2
            exit 1
          fi

          echo "EXACT_SHA_PROMOTION_PROOF=$EXPECTED_SHA"
