name: CI

# Verification trigger marker: keeps the canonical CI contract visible in audit history.
# CI optimization rules: preserve coverage, reduce repeated setup, and cancel obsolete PR runs.

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'fix/**'
      - 's3-**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  build:
    name: Runtime Build + Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build:runtime
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Write bundle size report
        run: npm run report:bundle-size
      - name: Upload performance baseline
        uses: actions/upload-artifact@v6
        with:
          name: performance-baseline
          path: diagnostics/performance-baseline.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bundle size report
        uses: actions/upload-artifact@v6
        with:
          name: bundle-size-report
          path: diagnostics/bundle-size.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run Socket CI
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: npx --yes @socketsecurity/cli@1.1.158 ci
      - name: Skip Socket CI when no token is configured
        if: ${{ env.SOCKET_SECURITY_API_KEY == '' }}
        run: echo "Socket scan skipped: configure SOCKET_SECURITY_API_KEY in repository secrets to enable the blocking supply-chain gate."

  secret-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run reduced contract verifier
        run: npm run verify:contracts

  browser-smoke:
    name: Browser Smoke — Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run critical browser smoke matrix in parallel workers
        run: >-
          npx playwright test
          tests/image-converter.spec.ts
          tests/image-cropper.spec.ts
          tests/exif-cleaner.spec.ts
          tests/image-to-svg.spec.ts
          --project=chromium
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  s3-static-gate:
    name: S3 Static Gate
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate canonical origin contract
        run: |
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-site-origin.mjs
      - name: Run S3 static certification
        env:
          S3_BASE_REF: origin/main
        run: node scripts/validate-s3-static-gate.mjs

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ always() && (needs.typecheck.result != 'skipped') && (needs.lint.result != 'skipped') && (needs.build.result != 'skipped') && (needs.audit.result != 'skipped') && (needs.socket.result != 'skipped') && (needs.secret-scan.result != 'skipped') && (needs.security.result != 'skipped') && (needs.fast-contract.result != 'skipped') && (needs.browser-smoke.result != 'skipped') && (needs.s3-static-gate.result != 'skipped') }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, browser-smoke, s3-static-gate]
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - name: Block canonical verification when prerequisites are not green
        if: ${{ needs.typecheck.result != 'success' || needs.lint.result != 'success' || needs.build.result != 'success' || needs.audit.result != 'success' || needs.socket.result != 'success' || needs.secret-scan.result != 'success' || needs.security.result != 'success' || needs.fast-contract.result != 'success' || needs.browser-smoke.result != 'success' || needs.s3-static-gate.result != 'success' }}
        run: |
          echo "Canonical Verification blocked by prerequisite results:"
          echo "TypeScript=${{ needs.typecheck.result }}"
          echo "ESLint=${{ needs.lint.result }}"
          echo "Build=${{ needs.build.result }}"
          echo "Audit=${{ needs.audit.result }}"
          echo "Socket=${{ needs.socket.result }}"
          echo "SecretScan=${{ needs.secret-scan.result }}"
          echo "CodeQL=${{ needs.security.result }}"
          echo "FastContract=${{ needs.fast-contract.result }}"
          echo "BrowserSmoke=${{ needs.browser-smoke.result }}"
          echo "S3=${{ needs.s3-static-gate.result }}"
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate release evidence contract
        run: node scripts/test-release-evidence.mjs
      - name: Validate file safety contract
        run: node --experimental-strip-types scripts/test-file-safety.mjs
      - name: Validate output integrity contract
        run: node --experimental-strip-types scripts/test-output-integrity.mjs
      - name: Validate SVG integrity contract
        run: node --experimental-strip-types scripts/test-svg-integrity.mjs
      - name: Validate canonical contract matrix
        run: npm run verify:contracts
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Canonical Verification'
            echo
            echo 'Canonical application gate passed for the exact commit:'
            echo '${{ github.sha }}'
            echo
            echo 'All diagnostic jobs, including the secret-history scan, were green before this gate ran.'
            echo 'S3 Static Gate passed before canonical verification.'
            echo 'The full 22×3 browser matrix is promoted to the independent Full Matrix Promotion workflow.'
            echo 'Build and performance validation passed in the dedicated build prerequisite.'
            echo 'Production audit passed in the dedicated audit prerequisite.'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, browser-smoke, s3-static-gate, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Runtime Build + Performance | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| Secret History Scan | ${{ needs.secret-scan.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract Diagnostics | ${{ needs.fast-contract.result }} |'
            echo '| Browser Smoke (4 Chromium specs, parallel workers) | ${{ needs.browser-smoke.result }} |'
            echo '| S3 Static Gate | ${{ needs.s3-static-gate.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
            echo
            echo 'Parallel diagnostic jobs preserve independent failure visibility.'
            echo 'PR runs cancel obsolete in-progress runs; main runs are never canceled by a newer push.'
            echo 'npm cache is reused and npm audit/fund/update-notifier work is disabled because supply-chain/security checks are explicit gates.'
            echo 'S3 Static Gate is dependency-free at runtime and no longer pays for an unnecessary npm install.'
            echo 'Browser smoke runs all critical specs in one Playwright invocation and reuses the browser download cache.'
            echo 'Canonical Verification reuses prerequisite evidence for build, performance, audit, lint, typecheck, security and S3 instead of rebuilding/re-auditing them.'
            echo 'The canonical gate reruns the contract matrix fail-closed for final contract evidence.'
            echo 'The full browser matrix remains an independent promotion/release gate.'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [canonical-verify]
    steps:
      - name: Confirm canonical CI gate
        if: ${{ needs.canonical-verify.result != 'success' }}
        run: |
          echo "Canonical Verification did not pass: ${{ needs.canonical-verify.result }}"
          exit 1
      - name: Confirm canonical CI gate
        run: echo "CI gate passed for ${{ github.sha }}"
