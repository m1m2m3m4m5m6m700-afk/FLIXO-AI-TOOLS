name: CI

# PR merge path: fast impact-aware diagnostics run in parallel, with deep G4 fail-fast certification.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  G4_LOCALES: 'en,ar,es,fr,de,ru,zh,hi,id,ur,ja,pt,it,ko,nl,pl,tr,vi,th,sv'
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  fast:
    name: Fast diagnostics — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [core, structure, localization, seo, security, artifact, browser, build]
    env:
      CI_PR_RESCUE: 'true'
      FAST_CI_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium for localization smoke
        if: matrix.group == 'localization'
        run: npx playwright install chromium
      - name: Run impact-aware verification group
        run: node scripts/ci/fast-verify.mjs
      - name: Upload group evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-ci-${{ matrix.group }}-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: CI
    needs: [fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Download fast diagnostic evidence
        uses: actions/download-artifact@v6
        with:
          pattern: fast-ci-*-${{ github.sha }}
          path: diagnostics
          merge-multiple: false
      - name: Aggregate fast diagnostic contract
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'diagnostics';
          const groups = ['core','structure','localization','seo','security','artifact','browser','build'];

          function findFiles(dir, name, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) findFiles(full, name, out);
              else if (entry.isFile() && entry.name === name) out.push(full);
            }
            return out;
          }

          const resultFiles = findFiles(root, 'fast-ci-result.json');
          const planFiles = findFiles(root, 'fast-ci-plan.json');
          const plansByDir = new Map(planFiles.map((file) => [path.dirname(file), file]));
          const found = new Map();
          const failures = [];

          for (const resultFile of resultFiles) {
            const dir = path.dirname(resultFile);
            const relativeParts = dir.split(path.sep);
            const group = groups.find((name) => relativeParts.includes(`fast-ci-${name}-${process.env.SHA}`));
            if (!group) continue;
            try {
              const result = JSON.parse(fs.readFileSync(resultFile, 'utf8'));
              const planPath = plansByDir.get(dir);
              if (!planPath) {
                failures.push(`${group}: missing plan evidence`);
                continue;
              }
              const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
              if (plan.sha !== process.env.SHA || result.sha !== process.env.SHA) failures.push(`${group}: SHA mismatch`);
              if (result.status !== 'PASS') failures.push(`${group}: ${result.status}`);
              found.set(group, true);
            } catch (error) {
              failures.push(`${group}: invalid evidence (${error.message})`);
            }
          }

          for (const group of groups) {
            if (!found.has(group)) failures.push(`${group}: missing evidence`);
          }
          if (failures.length) throw new Error(`Fast CI aggregate failed:\n${failures.join('\n')}`);
          console.log('Fast CI aggregate PASS: all 8 diagnostic groups valid.');
          NODE
      - name: Publish unified fast-path evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  g4-deep:
    name: G4 Universal Localization & SEO (fail-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build canonical production artifacts
        run: npm run build
      - name: Validate canonical 20-locale declaration
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a locales <<< "$G4_LOCALES"
          test "${#locales[@]}" -eq 20
          for locale in "${locales[@]}"; do test -n "$locale"; done
      - name: Static G4 locale + SEO certification
        run: |
          set -euo pipefail
          npm run verify:i18n -- --strict --report
          npm run validate:locale-integrity
          npm run validate:locale-navigation
          npm run validate:home-i18n
          npm run validate:seo
          npm run validate:seo-manifest
          npm run validate:use-case-seo
          npm run validate:indexing
          npm run validate:breadcrumb-seo
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-google-multilingual-seo.mjs
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-language-quality-strict.mjs
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -Fx "Sitemap: ${VITE_SITE_URL}/sitemap.xml" dist/robots.txt
          grep -Fq 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' dist/sitemap.xml
          grep -Fq 'hreflang="x-default"' dist/sitemap.xml
      - name: Start isolated production preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/g4-server.log 2>&1 &
          echo $! >/tmp/g4-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/g4-server.log || true
          exit 1
      - name: G4 all-public-route runtime — 20 locales — fail fast
        env:
          S4_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/localization-runtime.spec.ts --project=chromium --workers=1 --retries=0 --max-failures=1
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/g4-server.pid ]; then kill "$(cat /tmp/g4-server.pid)" 2>/dev/null || true; fi
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g4-localization-seo-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/g4-server.log
          if-no-files-found: warn
          retention-days: 14

  fast-contract:
    name: Fast Contract Diagnostics
    needs: [ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Download unified CI evidence
        uses: actions/download-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics
      - name: Validate fast-path evidence
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'diagnostics';
          const groups = ['core','structure','localization','seo','security','artifact','browser','build'];
          function findFiles(dir, name, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) findFiles(full, name, out);
              else if (entry.isFile() && entry.name === name) out.push(full);
            }
            return out;
          }
          const files = findFiles(root, 'fast-ci-result.json');
          const found = new Set();
          for (const file of files) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            const group = groups.find((name) => file.includes(`fast-ci-${name}-${process.env.SHA}`));
            if (!group) continue;
            if (result.sha !== process.env.SHA) throw new Error(`Evidence SHA mismatch in ${group}`);
            if (result.status !== 'PASS') throw new Error(`Non-PASS fast evidence in ${group}`);
            found.add(group);
          }
          for (const group of groups) if (!found.has(group)) throw new Error(`Missing fast evidence in ${group}`);
          console.log('Fast contract evidence PASS: all 8 diagnostic groups verified.');
          NODE

  canonical-verify:
    name: Canonical Verification Gate
    needs: [ci, fast-contract, g4-deep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enforce prerequisite results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: parallel fast CI aggregate failed.'
            exit 1
          fi
          if [[ "${{ needs.fast-contract.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: Fast Contract Diagnostics failed.'
            exit 1
          fi
          if [[ "${{ needs.g4-deep.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: Deep G4 certification failed.'
            exit 1
          fi
          echo 'Canonical Verification Gate PASS: fast and deep localization/SEO evidence is green.'
