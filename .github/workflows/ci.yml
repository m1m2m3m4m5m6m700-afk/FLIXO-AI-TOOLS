name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test — Static / Build / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      VITE_SITE_URL: https://flixoai.vercel.app
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FLIXO_TEST_MODE: diagnose
      FLIXO_DEPENDENCIES_READY: 'true'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_SHA=$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unified diagnostic runner
        run: npm run test:diagnose

      - name: Record repair-cycle diagnostics
        if: always()
        run: npm run diagnose:cycle

      - name: Upload unified CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: diagnostics/ci/
          if-no-files-found: warn
          retention-days: 30

  certify:
    name: CERTIFY
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless unified runner passed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.test.result }}" = "success"
          echo "CERTIFICATION: PASS"
