name: CI

# PR fast path: independent impact-aware diagnostics run in parallel.
# Deep certification remains manual/main-only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  fast:
    name: Fast diagnostics — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [core, structure, localization, seo, security, artifact, browser, build]
    env:
      CI_PR_RESCUE: 'true'
      FAST_CI_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium for localization smoke
        if: matrix.group == 'localization'
        run: npx playwright install chromium
      - name: Run impact-aware verification group
        run: node scripts/ci/fast-verify.mjs
      - name: Upload group evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-ci-${{ matrix.group }}-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: CI
    needs: [fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Download fast diagnostic evidence
        uses: actions/download-artifact@v6
        with:
          pattern: fast-ci-*-${{ github.sha }}
          path: diagnostics
          merge-multiple: false
      - name: Aggregate fast diagnostic contract
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const groups = ['core','structure','localization','seo','security','artifact','browser','build'];
          const failures = [];
          for (const group of groups) {
            const dir = path.join('diagnostics', `fast-ci-${group}-${process.env.SHA}`);
            const resultFile = path.join(dir, 'fast-ci-result.json');
            const planFile = path.join(dir, 'fast-ci-plan.json');
            if (!fs.existsSync(resultFile) || !fs.existsSync(planFile)) {
              failures.push(`${group}: missing evidence`);
              continue;
            }
            const plan = JSON.parse(fs.readFileSync(planFile, 'utf8'));
            const result = JSON.parse(fs.readFileSync(resultFile, 'utf8'));
            if (plan.sha !== process.env.SHA || result.sha !== process.env.SHA) failures.push(`${group}: SHA mismatch`);
            if (result.status !== 'PASS') failures.push(`${group}: ${result.status}`);
          }
          if (failures.length) throw new Error(`Fast CI aggregate failed:\n${failures.join('\n')}`);
          console.log('Fast CI aggregate PASS: all 8 diagnostic groups valid.');
          NODE
      - name: Publish unified fast-path evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  fast-contract:
    name: Fast Contract Diagnostics
    needs: [ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Download unified CI evidence
        uses: actions/download-artifact@v6
        with:
          name: ci-fast-evidence-${{ github.sha }}
          path: diagnostics
      - name: Validate fast-path evidence
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s diagnostics/fast-ci-core-*/fast-ci-result.json
          node -e "const fs=require('node:fs'); const p=process.cwd() + '/diagnostics'; const dirs=fs.readdirSync(p).filter(d=>d.startsWith('fast-ci-')); if(!dirs.length) throw new Error('No fast group evidence'); for(const d of dirs){const f=p+'/'+d+'/fast-ci-result.json'; if(!fs.existsSync(f)) continue; const r=JSON.parse(fs.readFileSync(f,'utf8')); if(r.sha!==process.env.SHA) throw new Error('Evidence SHA mismatch in '+d); if(r.status!=='PASS') throw new Error('Non-PASS fast evidence in '+d); } console.log('Fast contract evidence PASS');"

  canonical-verify:
    name: Canonical Verification Gate
    needs: [ci, fast-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enforce prerequisite results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: parallel fast CI aggregate failed.'
            exit 1
          fi
          if [[ "${{ needs.fast-contract.result }}" != "success" ]]; then
            echo 'Canonical Verification Gate BLOCKED: Fast Contract Diagnostics failed.'
            exit 1
          fi
          echo 'Canonical Verification Gate PASS: required fast-path evidence is green.'
