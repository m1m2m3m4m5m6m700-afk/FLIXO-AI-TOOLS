name: FLIXO CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, execution]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000

jobs:
  verify:
    name: Typecheck, lint, core contracts, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Chromium browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: flixo-build-${{ github.run_id }}
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
