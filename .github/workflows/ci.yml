name: CI

# Canonical PR verification. Matrix First is a native prerequisite and owns blocking browser certification.
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app

jobs:
  matrix-certification:
    name: Matrix First Certification
    uses: ./.github/workflows/matrix-first.yml
    secrets: inherit

  ci:
    name: CI
    needs: [matrix-certification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Run impact-aware verification
        run: node scripts/ci/fast-verify.mjs
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fast-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  fast-contract:
    name: Fast Contract Diagnostics
    needs: [matrix-certification, ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download CI evidence
        if: ${{ needs.ci.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: ci-fast-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: diagnostics
      - name: Validate fast-path evidence
        if: ${{ needs.ci.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/fast-ci-result.json
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('diagnostics/fast-ci-result.json','utf8')); if(r.sha!==process.env.EXPECTED_HEAD_SHA) throw new Error('Evidence SHA mismatch'); if(r.status!=='PASS') throw new Error('Fast CI result is not PASS'); console.log('Fast CI result PASS');"
      - name: Require native prerequisite success
        run: |
          set -euo pipefail
          test '${{ needs.matrix-certification.result }}' = success
          test '${{ needs.ci.result }}' = success

  canonical-verify:
    name: Canonical Verification Gate
    needs: [matrix-certification, ci, fast-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enforce all native prerequisite results without rerunning suites
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.matrix-certification.result }}' = success
          test '${{ needs.ci.result }}' = success
          test '${{ needs.fast-contract.result }}' = success
          echo 'Canonical Verification Gate PASS: exact-head Matrix First and fast-path evidence are both green.'
