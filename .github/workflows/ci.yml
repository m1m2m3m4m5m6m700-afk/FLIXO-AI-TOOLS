name: CI

# Canonical CI: parallel evidence + one fail-closed aggregator.
on:
  push:
    branches:
      - main
      - 'work/**'
      - 'fix/**'
      - 's3-**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  risk-plan:
    name: Change / Risk Classifier
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      affected: ${{ steps.plan.outputs.affected }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify change fail-closed
        id: plan
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${CI_BASE_SHA}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD~1"; fi
          CI_BASE_SHA="$base" node scripts/ci-risk-classifier.mjs | tee /tmp/risk.json
          lane="$(node --input-type=module -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/risk.json','utf8')).lane)")"
          affected="$(node --input-type=module -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/risk.json','utf8')).affected.join(','))")"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
      - name: Upload risk plan
        uses: actions/upload-artifact@v6
        with:
          name: ci-risk-plan
          path: diagnostics/ci-risk-plan.json
          if-no-files-found: error
          retention-days: 14

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  build:
    name: Runtime Build + Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build:runtime
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Write bundle size report
        run: npm run report:bundle-size
      - uses: actions/upload-artifact@v6
        with:
          name: performance-baseline
          path: diagnostics/performance-baseline.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-size-report
          path: diagnostics/bundle-size.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Require Socket configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SOCKET_SECURITY_API_KEY}" ]]; then
            echo 'Socket supply-chain gate is not configured; fail-closed.'
            exit 1
          fi
      - name: Run Socket CI
        run: npx --yes @socketsecurity/cli@1.1.158 ci

  secret-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      VITE_TEST_ORIGIN: https://canonical.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run unique core contract suite
        run: node scripts/verify-contracts-core.mjs

  s3-static-gate:
    name: S3 Static Gate
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run validate:site-origin
      - name: Run S3 static certification
        env:
          S3_BASE_REF: origin/main
        run: node scripts/validate-s3-static-gate.mjs

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ always() && needs.risk-plan.result != 'skipped' && needs.typecheck.result != 'skipped' && needs.lint.result != 'skipped' && needs.build.result != 'skipped' && needs.audit.result != 'skipped' && needs.socket.result != 'skipped' && needs.secret-scan.result != 'skipped' && needs.security.result != 'skipped' && needs.fast-contract.result != 'skipped' && needs.s3-static-gate.result != 'skipped' }}
    runs-on: ubuntu-latest
    needs: [risk-plan, typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate]
    steps:
      - name: Fail closed on any prerequisite result
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "RiskPlan=${{ needs.risk-plan.result }}"
            "TypeScript=${{ needs.typecheck.result }}"
            "ESLint=${{ needs.lint.result }}"
            "Build=${{ needs.build.result }}"
            "Audit=${{ needs.audit.result }}"
            "Socket=${{ needs.socket.result }}"
            "SecretScan=${{ needs.secret-scan.result }}"
            "CodeQL=${{ needs.security.result }}"
            "FastContract=${{ needs.fast-contract.result }}"
            "S3=${{ needs.s3-static-gate.result }}"
          )
          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo 'Canonical Verification FAILED: one or more required evidence jobs did not succeed.'
            exit 1
          fi
          echo 'Canonical Verification prerequisites all succeeded.'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate fail-closed evidence ledger
        env:
          CI_EXPECTED_SHA: ${{ github.sha }}
          CI_EVIDENCE_SPECS: RiskPlan,TypeScript,ESLint,Build,Audit,Socket,SecretScan,CodeQL,FastContract,S3
          CI_RESULT_RiskPlan: ${{ needs.risk-plan.result }}
          CI_RESULT_TypeScript: ${{ needs.typecheck.result }}
          CI_RESULT_ESLint: ${{ needs.lint.result }}
          CI_RESULT_Build: ${{ needs.build.result }}
          CI_RESULT_Audit: ${{ needs.audit.result }}
          CI_RESULT_Socket: ${{ needs.socket.result }}
          CI_RESULT_SecretScan: ${{ needs.secret-scan.result }}
          CI_RESULT_CodeQL: ${{ needs.security.result }}
          CI_RESULT_FastContract: ${{ needs.fast-contract.result }}
          CI_RESULT_S3: ${{ needs.s3-static-gate.result }}
        run: npm run ci:evidence
      - name: Upload canonical evidence ledger
        uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-ledger-${{ github.sha }}
          path: diagnostics/ci-evidence-ledger.json
          if-no-files-found: error
          retention-days: 30
      - name: Write canonical evidence summary
        run: |
          {
            echo '## FLIXO Canonical Verification'
            echo
            echo 'All required evidence jobs succeeded for exact commit:'
            echo '${{ github.sha }}'
            echo
            echo 'Canonical is an aggregator only; it does not rerun verification suites.'
            echo 'Risk lane: ${{ needs.risk-plan.outputs.lane }}'
            echo 'Affected domains: ${{ needs.risk-plan.outputs.affected }}'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [risk-plan, typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| Change / Risk Classifier | ${{ needs.risk-plan.result }} |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Runtime Build + Performance | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| Secret History Scan | ${{ needs.secret-scan.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract Diagnostics | ${{ needs.fast-contract.result }} |'
            echo '| S3 Static Gate | ${{ needs.s3-static-gate.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [canonical-verify]
    steps:
      - name: Confirm canonical CI gate
        if: ${{ needs.canonical-verify.result != 'success' }}
        run: |
          echo "Canonical Verification did not pass: ${{ needs.canonical-verify.result }}"
          exit 1
      - name: Confirm canonical CI gate
        run: echo "CI gate passed for ${{ github.sha }}"
