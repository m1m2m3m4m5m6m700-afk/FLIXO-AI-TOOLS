name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Socket CI
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: npx --yes @socketsecurity/cli@1.1.158 ci
      - name: Skip Socket CI when no token is configured
        if: ${{ env.SOCKET_SECURITY_API_KEY == '' }}
        run: 'echo "Socket scan skipped: configure SOCKET_SECURITY_API_KEY in repository secrets to enable the blocking supply-chain gate."'

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  e2e:
    name: E2E — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: image-compressor
            spec: tests/image-compressor.spec.ts
          - tool: background-remover
            spec: tests/background-remover.spec.ts
          - tool: image-upscaler
            spec: tests/image-upscaler.spec.ts
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: ai-image-generator
            spec: tests/ai-image-generator.spec.ts
          - tool: object-remover
            spec: tests/object-remover.spec.ts
          - tool: watermark-remover
            spec: tests/watermark-remover.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
          - tool: image-ocr
            spec: tests/image-ocr.spec.ts
          - tool: photo-colorizer
            spec: tests/photo-colorizer.spec.ts
          - tool: background-blur
            spec: tests/background-blur.spec.ts
          - tool: passport-photo-maker
            spec: tests/passport-photo-maker.spec.ts
          - tool: watermark-adder
            spec: tests/watermark-adder.spec.ts
          - tool: meme-generator
            spec: tests/meme-generator.spec.ts
          - tool: collage-maker
            spec: tests/collage-maker.spec.ts
          - tool: image-effects
            spec: tests/image-effects.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: svg-optimizer
            spec: tests/svg-optimizer.spec.ts
          - tool: mockup-generator
            spec: tests/mockup-generator.spec.ts
          - tool: seed
            spec: tests/seed.spec.ts
          - tool: pix
            spec: tests/pix.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.tool }} E2E on ${{ matrix.browser }}
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ needs.typecheck.result == 'success' && needs.lint.result == 'success' && needs.build.result == 'success' && needs.audit.result == 'success' && needs.socket.result == 'success' && needs.security.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, security, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release evidence contract
        run: node scripts/test-release-evidence.mjs
      - name: Validate output integrity contract
        run: node --experimental-strip-types scripts/test-output-integrity.mjs
      - name: Validate SVG integrity contract
        run: node --experimental-strip-types scripts/test-svg-integrity.mjs
      - name: Run canonical verification
        run: npm run verify
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Canonical Verification'
            echo
            echo 'Canonical application gate passed for the exact commit:'
            echo '${{ github.sha }}'
            echo
            echo 'All diagnostic component jobs were green before this gate ran.'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, socket, security, e2e, canonical-verify]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Per-tool E2E (66 browser jobs) | ${{ needs.e2e.result }} |'
            echo '| Canonical Verification | ${{ needs.canonical-verify.result }} |'
            echo
            echo 'E2E matrix isolates every tool/browser pair; failed jobs upload their own Playwright diagnostics artifact.'
            echo 'Diagnostics explain failures; Canonical Verification is the single promotion signal.'
            echo 'Socket is fail-closed when SOCKET_SECURITY_API_KEY is configured and intentionally skipped otherwise.'
          } >> "$GITHUB_STEP_SUMMARY"
