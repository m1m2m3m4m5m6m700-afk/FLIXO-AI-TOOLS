name: CI

# FAIL-CLOSED canonical CI: one build artifact, parallel evidence, one aggregator.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  build:
    name: Runtime Build + Performance
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build once
        run: npm run build
      - name: Validate performance budget
        run: npm run validate:performance-budget
      - name: Write performance baseline
        run: npm run report:performance-baseline
      - name: Write bundle size report
        run: npm run report:bundle-size
      - name: Write immutable build manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/write-build-artifact-manifest.mjs
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload performance evidence
        uses: actions/upload-artifact@v6
        with:
          name: performance-evidence-${{ github.sha }}
          path: |
            diagnostics/performance-baseline.json
            diagnostics/bundle-size.json
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:production

  socket:
    name: Socket Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies through Socket Firewall
        run: sfw npm ci --prefer-offline --no-audit --no-fund
      - name: Verify Socket Firewall is active
        run: sfw --help >/dev/null

  secret-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan PR history range with pinned Gitleaks
        if: ${{ github.event_name == 'pull_request' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --no-banner --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full repository history with pinned Gitleaks
        if: ${{ github.event_name != 'pull_request' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --no-banner --redact

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  fast-contract:
    name: Fast Contract Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run unique core contract suite
        run: node scripts/verify-contracts-core.mjs
      - name: Upload intelligence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-intelligence-${{ github.sha }}
          path: |
            diagnostics/change-risk-plan.json
            diagnostics/ci-slo.json
          if-no-files-found: warn
          retention-days: 30

  s3-static-gate:
    name: S3 Static Gate
    needs: [build]
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      FLIXO_BUILD_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable build artifact
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
      - run: npm run validate:site-origin
      - name: Run S3 static certification against immutable build
        env:
          S3_BASE_REF: origin/main
        run: node scripts/validate-s3-static-gate.mjs

  s4-runtime-e2e:
    name: S4 Runtime + E2E (${{ matrix.browser }} / shard ${{ matrix.shard }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
      VITE_TEST_ORIGIN: https://canonical.test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Download immutable build artifact
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.sha }}
          path: dist
      - name: Verify exact artifact commit SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_flixo_build_manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/_flixo_build_manifest.json', 'utf8'));
          if (manifest.sha !== process.env.CERTIFIED_SHA && manifest.commit_sha !== process.env.CERTIFIED_SHA) {
            throw new Error(`S4 artifact SHA mismatch: ${manifest.sha ?? manifest.commit_sha} != ${process.env.CERTIFIED_SHA}`);
          }
          console.log(`S4 artifact SHA verified: ${process.env.CERTIFIED_SHA}`);
          NODE
      - name: Verify required static assets
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Start isolated production server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/s4-server.log 2>&1 &
          echo $! > /tmp/s4-server.pid
      - name: Wait for readiness and HTTP 200
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/s4-server.log || true
          exit 1
      - name: Record server process identity
        shell: bash
        run: |
          set -euo pipefail
          PID="$(cat /tmp/s4-server.pid)"
          PGID="$(ps -o pgid= -p "$PID" | tr -d ' ')
          test -n "$PGID" && test "$PGID" != "1"
          {
            echo "S4 server PID=$PID PGID=$PGID browser=${{ matrix.browser }} shard=${{ matrix.shard }}/3"
            ps -o pid,ppid,pgid,lstart,args -p "$PID"
          } > server_process_identity.txt
      - name: Diagnose first runtime-render failure
        if: ${{ matrix.browser == 'chromium' && matrix.shard == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const diagnostics = [];
          page.on('pageerror', (error) => diagnostics.push({ type: 'pageerror', message: error.message, stack: error.stack }));
          page.on('console', (message) => { if (message.type() === 'error') diagnostics.push({ type: 'console', message: message.text() }); });
          page.on('requestfailed', (request) => diagnostics.push({ type: 'requestfailed', url: request.url(), error: request.failure()?.errorText ?? 'unknown' }));
          for (const path of ['/en', '/en/ai-captioner-srt']) {
            diagnostics.length = 0;
            await page.goto(`http://127.0.0.1:3000${path}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1000);
            const rootHtml = await page.locator('#root').innerHTML();
            console.log(`=== S4 DIAGNOSTIC ${path} ===`);
            console.log(`URL=${page.url()}`);
            console.log(`TITLE=${await page.title()}`);
            console.log(`ROOT_HTML=${rootHtml.slice(0, 5000)}`);
            console.log(`DIAGNOSTICS=${JSON.stringify(diagnostics, null, 2)}`);
            if (diagnostics.length || rootHtml.trim().length === 0) {
              console.error(`S4 RUNTIME ROOT CAUSE DETECTED on ${path}`);
              process.exit(1);
            }
          }
          await browser.close();
          NODE
      - name: Run ${{ matrix.browser }} shard ${{ matrix.shard }} with zero retries
        env:
          S4_RUNTIME_GATE: 'true'
          S4_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_SERVER: 'preview'
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3 --workers=4 --retries=0
      - name: Verify server process group is gone
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/s4-server.pid ]; then
            PID="$(cat /tmp/s4-server.pid")
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' )"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ] && kill -0 "$PID" 2>/dev/null; then
              kill -- -"$PGID" 2>/dev/null || true
            fi
          fi
      - name: Upload S4 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: s4-runtime-e2e-evidence-${{ github.sha }}-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            server_process_identity.txt
            /tmp/s4-server.log
          if-no-files-found: warn
          retention-days: 14

  evidence-ledger:
    name: Evidence Ledger
    if: ${{ always() }}
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate, s4-runtime-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Materialize gate evidence
        shell: bash
        env:
          SHA: ${{ github.sha }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          AUDIT: ${{ needs.audit.result }}
          SOCKET: ${{ needs.socket.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          CODEQL: ${{ needs.security.result }}
          FAST_CONTRACT: ${{ needs.fast-contract.result }}
          S3: ${{ needs.s3-static-gate.result }}
          S4: ${{ needs.s4-runtime-e2e.result }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          write_record() {
            local gate="$1" owner="$2" result="$3"
            local passed=0 failed=0 skipped=0 missing=0 executed=1
            if [[ "$result" == "success" ]]; then passed=1
            elif [[ "$result" == "skipped" ]]; then skipped=1
            elif [[ -z "$result" || "$result" == "unknown" ]]; then executed=0; missing=1
            else failed=1; fi
            cat > "ci-evidence/${gate}.json" <<EOF
          {
            "sha": "${SHA}",
            "gate": "${gate}",
            "owner": "${owner}",
            "expected": 1,
            "executed": ${executed},
            "passed": ${passed},
            "failed": ${failed},
            "skipped": ${skipped},
            "missing": ${missing},
            "result": "${result}"
          }
          EOF
          }
          write_record typecheck 'CI / TypeScript' "$TYPECHECK"
          write_record lint 'CI / ESLint' "$LINT"
          write_record build 'CI / Build' "$BUILD"
          write_record audit 'CI / Production Audit' "$AUDIT"
          write_record socket 'CI / Socket Supply Chain' "$SOCKET"
          write_record secret-scan 'CI / Secret History Scan' "$SECRET_SCAN"
          write_record codeql 'CI / CodeQL' "$CODEQL"
          write_record fast-contract 'CI / Fast Contract Diagnostics' "$FAST_CONTRACT"
          write_record s3 'CI / S3 Static Gate' "$S3"
          write_record s4 'CI / S4 Runtime + E2E' "$S4"
      - name: Validate fail-closed ledger
        env:
          EXACT_SHA: ${{ github.sha }}
        run: node scripts/ci/evidence-ledger.mjs
      - name: Upload evidence ledger
        uses: actions/upload-artifact@v6
        with:
          name: flixo-evidence-ledger-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 30

  canonical-verify:
    name: Canonical Verification Gate
    if: ${{ always() }}
    needs: [evidence-ledger]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on ledger result
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.evidence-ledger.result }}' != 'success' ]]; then
            echo "Canonical Verification FAILED: Evidence Ledger = ${{ needs.evidence-ledger.result }}"
            exit 1
          fi
          echo 'Canonical Verification PASSED: all canonical evidence is present, executed, and SHA-bound.'

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    needs: [typecheck, lint, build, audit, socket, secret-scan, security, fast-contract, s3-static-gate, s4-runtime-e2e, evidence-ledger, canonical-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| Socket | ${{ needs.socket.result }} |'
            echo '| Secret Scan | ${{ needs.secret-scan.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Fast Contract | ${{ needs.fast-contract.result }} |'
            echo '| S3 | ${{ needs.s3-static-gate.result }} |'
            echo '| S4 Runtime + E2E | ${{ needs.s4-runtime-e2e.result }} |'
            echo '| Evidence Ledger | ${{ needs.evidence-ledger.result }} |'
            echo '| Canonical | ${{ needs.canonical-verify.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: ${{ always() }}
    needs: [canonical-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm canonical CI gate
        run: |
          set -euo pipefail
          if [[ '${{ needs.canonical-verify.result }}' != 'success' ]]; then
            echo "CI FAILED: Canonical Verification = ${{ needs.canonical-verify.result }}"
            exit 1
          fi
          echo "CI gate passed for exact commit ${{ github.sha }}"
