name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test — Static / Build / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      VITE_SITE_URL: https://flixoai.vercel.app
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FLIXO_TEST_MODE: diagnose
      FLIXO_DEPENDENCIES_READY: 'true'
      FLIXO_MEMORY_ARTIFACT: failure-memory-${{ github.event.pull_request.number || 'main' }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_SHA=$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore prior failure memory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          artifact_name="$FLIXO_MEMORY_ARTIFACT"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=1"
          if response="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" 2>/tmp/memory-restore.err)"; then
            artifact_id="$(printf '%s' "$response" | jq -r '.artifacts[0].id // empty')"
            if [ -n "$artifact_id" ] && curl --fail-with-body -sSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o /tmp/failure-memory.zip; then
              mkdir -p diagnostics/ci
              unzip -o /tmp/failure-memory.zip -d diagnostics/ci >/dev/null
              echo "FAILURE_MEMORY_RESTORED=$artifact_id"
            else
              echo 'No usable prior failure-memory artifact; starting with local memory.'
            fi
          else
            echo 'Failure-memory restore unavailable; continuing without historical memory.'
            cat /tmp/memory-restore.err || true
          fi

      - name: Capture pre-install execution context
        run: node scripts/ci/capture-execution-context.mjs

      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unified diagnostic runner
        run: npm run test:diagnose

      - name: Record repair-cycle diagnostics
        if: always()
        run: npm run diagnose:cycle

      - name: Detect shared-root candidates
        if: always()
        run: node scripts/ci/detect-shared-root-candidates.mjs

      - name: Upload unified CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: diagnostics/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Persist failure memory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.FLIXO_MEMORY_ARTIFACT }}
          path: |
            diagnostics/ci/failure-memory.json
            diagnostics/ci/failure-clusters.json
            diagnostics/ci/root-cause-graph.json
            diagnostics/ci/repair-history.jsonl
            diagnostics/ci/shared-root-candidates.json
          if-no-files-found: warn
          retention-days: 90

  certify:
    name: CERTIFY
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless unified runner passed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.test.result }}" = "success"
          echo "CERTIFICATION: PASS"
