name: Final CI Surgery Once
on:
  push:
    branches: [protocols/i18n-assets-boundary-guards]
  pull_request:
    types: [synchronize]
permissions:
  contents: write

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  surgery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: protocols/i18n-assets-boundary-guards
      - name: Verify exact head
        run: |
          set -euo pipefail
          git fetch origin protocols/i18n-assets-boundary-guards
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/protocols/i18n-assets-boundary-guards)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Remove remaining CI polling and duplicate validator invocations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/tools/seed/index.tsx')
          s = p.read_text()
          old = "from '../../components/floating-canvas-overlay';"
          new = "from './seed-canvas-overlay';"
          if old in s:
              p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/ci.yml')
          lines = p.read_text().splitlines()
          if not any(x.strip() == 'workflow_call:' for x in lines[:20]):
              idx = next(i for i,x in enumerate(lines) if x.strip() == 'workflow_dispatch:')
              lines.insert(idx + 1, '  workflow_call:')
          start = next((i for i,x in enumerate(lines) if x == '      - name: Resolve legacy G3'), None)
          if start is not None:
              end = next((i for i in range(start + 1, len(lines)) if lines[i] == '      - name: G3 authoritative aggregation'), None)
              if end is None: raise SystemExit('G3 aggregation boundary missing')
              del lines[start:end]
          lines = [x for x in lines if not x.strip().startswith('LEGACY_RESULT:')]
          p.write_text('\n'.join(lines) + '\n')

          p = Path('.github/workflows/release-certification.yml')
          lines = p.read_text().splitlines()
          start = next((i for i,x in enumerate(lines) if x == '  engineering-gate:'), None)
          end = next((i for i in range((start or 0)+1, len(lines)) if lines[i] == '  deployment-provider:'), None)
          if start is None or end is None: raise SystemExit('release gate boundaries missing')
          e1 = '$' + '{{ needs.socket-release.result }}'
          e2 = '$' + '{{ needs.canonical-ci.result }}'
          e3 = '$' + '{{ needs.matrix-certification.result }}'
          block = [
              '  canonical-ci:',
              '    name: Canonical GitHub CI',
              '    needs: [socket-release]',
              '    uses: ./.github/workflows/ci.yml',
              '    secrets: inherit',
              '',
              '  matrix-certification:',
              '    name: Canonical Matrix First Certification',
              '    needs: [socket-release]',
              '    uses: ./.github/workflows/matrix-first.yml',
              '    secrets: inherit',
              '',
              '  engineering-gate:',
              '    name: Engineering Release Gate',
              '    needs: [socket-release, canonical-ci, matrix-certification]',
              '    runs-on: ubuntu-latest',
              '    timeout-minutes: 8',
              '    steps:',
              '      - uses: actions/checkout@v5',
              '      - uses: actions/setup-node@v5',
              '        with:',
              '          node-version-file: .nvmrc',
              '          cache: npm',
              '      - run: npm ci --prefer-offline --no-audit --no-fund',
              '      - name: Enforce native prerequisite results',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              f'          test "{e1}" = success',
              f'          test "{e2}" = success',
              f'          test "{e3}" = success',
              '      - name: Verify production surface',
              '        env:',
              '          PRODUCTION_ORIGIN: https://flixoai.vercel.app',
              '        run: node scripts/validate-production-certification.mjs',
              '      - name: Write release evidence',
              '        run: echo "Engineering gate: PASS ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"',
              '',
          ]
          p.write_text('\n'.join(lines[:start] + block + lines[end:]) + '\n')

          p = Path('package.json')
          data = json.loads(p.read_text())
          s = data['scripts']
          s.pop('validate:locale-integrity', None)
          s['verify:i18n'] = "node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-localization-complete.mjs --strict --report"
          for k in ('check','verify:contracts'):
              parts = s[k].split(' && ')
              parts = [x for x in parts if x not in ('npm run validate:locale-integrity','npm run validate:localization-complete')]
              s[k] = ' && '.join(parts)
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')

          p = Path('scripts/ci/fast-verify.mjs')
          s = p.read_text()
          old = "const sourceFiles = files.filter((file) => /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(file));"
          new = "const sourceFiles = files.filter((file) => existsSync(file) && /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(file));"
          if old in s: p.write_text(s.replace(old,new,1))
          elif new not in s: raise SystemExit('fast-verify source filter missing')

          p = Path('src/tools/pix/index.tsx')
          s = p.read_text()
          nested = '<h1 className="sr-only">Pix Studio</h1>'
          if nested in s: p.write_text(s.replace(nested,'',1))
          PY
      - name: Fail closed on topology
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/full-matrix-parallel.yml
          test ! -e .github/workflows/g1-platform-contract.yml
          test ! -e scripts/validate-locale-integrity.mjs
          if grep -R -nE 'gh api|gh run list|check-runs|LEGACY_RESULT|Resolve legacy G3|legacy-g3' .github/workflows --exclude='zz-final-ci-surgery.yml'; then exit 1; fi
          grep -q '^  workflow_call:' .github/workflows/ci.yml
          grep -q '^  workflow_call:' .github/workflows/matrix-first.yml
          grep -q -- '--retries=0' .github/workflows/matrix-first.yml
          grep -q -- '--max-failures=1' .github/workflows/matrix-first.yml
      - name: Run required validations
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run check
          npm run verify:i18n -- --strict --report
          npm run validate:tool-manifest
          npm run validate:seo-manifest
          npm run validate:language-quality
      - name: Commit every validated modification
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/zz-final-ci-surgery.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore: consolidate CI and purge legacy duplication"
          git push origin HEAD:protocols/i18n-assets-boundary-guards
