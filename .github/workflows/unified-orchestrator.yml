name: FLIXO Unified Orchestrator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Deterministic change impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Resolve exact SHA and base
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD^ 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate deterministic orchestration plan
        env:
          EXPECTED_SHA: ${{ steps.refs.outputs.sha }}
          CHANGE_BASE: ${{ steps.refs.outputs.base }}
        run: npm run orchestrate

      - uses: actions/upload-artifact@v6
        with:
          name: flixo-orchestration-${{ github.run_id }}
          path: diagnostics/orchestrator/plan.json
          if-no-files-found: error
          retention-days: 14
