name: Temporary S3 Git Graph Repair

on:
  push:
    branches: [ci/final-consolidation-v1]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch S3 Git graph and exact PR base
        shell: python
        run: |
          from pathlib import Path
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          start = text.index('  s3-static-gate:')
          end = text.index('\n  s4-runtime-e2e:', start)
          block = text[start:end]
          old = '      - uses: actions/checkout@v5\n'
          new = '      - uses: actions/checkout@v5\n        with:\n          fetch-depth: 0\n'
          if old not in block:
              raise SystemExit('S3 checkout pattern not found')
          block = block.replace(old, new, 1)
          block = block.replace('          S3_BASE_REF: origin/main\n', "          S3_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}\n", 1)
          ci.write_text(text[:start] + block + text[end:])
      - name: Remove temporary repair workflow
        run: git rm .github/workflows/_repair_s3_git_graph.yml
      - name: Commit and push permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'fix(ci): make S3 base graph deterministic'
          git push origin HEAD:ci/final-consolidation-v1
      - name: Dispatch canonical CI on repaired HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref ci/final-consolidation-v1
