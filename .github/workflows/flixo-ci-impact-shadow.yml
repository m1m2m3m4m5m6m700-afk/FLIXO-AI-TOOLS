name: FLIXO CI — Impact Analysis Shadow

# Shadow validation is retained for manual forensic comparison only.
# Canonical CI owns automated PR/main impact classification.
on:
  workflow_dispatch:

concurrency:
  group: flixo-ci-impact-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact-shadow:
    name: CI Change Impact Shadow (manual diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Impact engine semantics
        run: node --experimental-strip-types scripts/ci/impact/engine.test.mjs
      - name: Compile impact plan
        run: node --experimental-strip-types scripts/ci/impact/plan.mjs
      - name: Verify conservative unknown handling
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"escalation":' artifacts/ci/impact/impact-plan.json
          test -f artifacts/ci/impact/impact-plan.json
      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-impact-analysis-${{ github.sha }}
          path: artifacts/ci/impact/
          if-no-files-found: error
          retention-days: 14
