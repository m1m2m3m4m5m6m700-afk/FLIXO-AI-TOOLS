name: Consolidate historical branches

on:
  push:
    branches: [review]

permissions:
  contents: write

jobs:
  cleanup:
    name: Keep only canonical branches
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot branch names
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt

      - name: Delete historical branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          : > /tmp/delete-errors
          grep -Ev '^(main|execution|review)$' /tmp/branches.txt > /tmp/delete-list || true

          delete_one() {
            branch="$1"
            [ -n "$branch" ] || return 0
            echo "Deleting historical branch: $branch"
            if ! gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              if ! gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
                return 0
              fi
              printf '%s\n' "$branch" >> /tmp/delete-errors
            fi
          }
          export -f delete_one

          xargs -r -n1 -P20 bash -c 'delete_one "$1"' _ < /tmp/delete-list

          if [ -s /tmp/delete-errors ]; then
            echo "::error::Some branch deletions failed:"
            cat /tmp/delete-errors
            exit 1
          fi

          echo "Canonical branch set retained: main execution review"
