name: FLIXO Execution Bot Watchdog

run-name: FLIXO Execution Bot Watchdog ${{ github.run_id }}

# Push wake surface for the execution repair supervisor.
# Canonical workflow_run + schedule monitoring is provided by daily-flixo-green-gate.yml.
# This watcher is intentionally small and fail-safe: it records the exact execution
# state and dispatches the canonical repair chain for actionable failures.

on:
  push:
    branches: [execution]
  workflow_dispatch:
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - Repository Security Baseline
      - Claude Security Review
    types: [completed]
    branches: [execution]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: flixo-execution-bot-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Wake, inspect exact execution SHA, dispatch repair
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate dispatch target without executing execution code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_WORKFLOW="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/auto-repair.yml?ref=execution" --jq '.content' | base64 --decode)"
          printf '%s\n' "$TARGET_WORKFLOW" > /tmp/auto-repair-execution.yml
          grep -Eq '^on:' /tmp/auto-repair-execution.yml
          grep -Eq '^  workflow_dispatch:' /tmp/auto-repair-execution.yml
          ! grep -Eq '^  workflow_run:' /tmp/auto-repair-execution.yml
          grep -Eq 'ref: execution' /tmp/auto-repair-execution.yml
          echo 'WATCHDOG_TARGET_VALIDATION=PASS'
          echo 'WATCHDOG_EXECUTION_CODE_EXECUTED=false'

      - name: Inspect exact execution SHA
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          export EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/execution" --jq '          FAILED_RUN_ID=""
          EVENT_NAME="${{ github.event_name }}"
          EVENT_RUN_ID="${{ github.event.workflow_run.id || '' }}"
          EVENT_RUN_SHA="${{ github.event.workflow_run.head_sha || '' }}"
          EVENT_RUN_BRANCH="${{ github.event.workflow_run.head_branch || '' }}"
          EVENT_CONCLUSION="${{ github.event.workflow_run.conclusion || '' }}"

          if [ "$EVENT_NAME" = "workflow_run" ] &&
             [ "$EVENT_RUN_BRANCH" = "execution" ] &&
             [ "$EVENT_RUN_SHA" = "$EXECUTION_SHA" ] &&
             { [ "$EVENT_CONCLUSION" = "failure" ] ||
               [ "$EVENT_CONCLUSION" = "timed_out" ] ||
               [ "$EVENT_CONCLUSION" = "cancelled" ] ||
               [ "$EVENT_CONCLUSION" = "action_required" ]; }; then
            FAILED_RUN_ID="$EVENT_RUN_ID"
            echo "IMMEDIATE_RED_WAKE=true run=$FAILED_RUN_ID sha=$EVENT_RUN_SHA"
          else
            FAILED_RUN_ID="$(jq -r '
              [.[] |
                select(.headSha == $ENV.EXECUTION_SHA and
                  (.conclusion == "failure" or
                   .conclusion == "timed_out" or
                   .conclusion == "cancelled" or
                   .conclusion == "action_required")) |
                select((.workflowName // "") as $w |
                  ($w | test("Auto Repair|Execution Bot Watchdog|Daily·FLIXO Green Gate|auto-repair-merge-gate|execution-sync|agent-repair-handoff"; "i")) | not)] |
              sort_by(.createdAt) |
              first |
              .databaseId // empty
            ' /tmp/execution-runs.json)"
          fiwName // "") as $w |
                ($w | test("Auto Repair|Execution Bot Watchdog|Daily·FLIXO Green Gate|auto-repair-merge-gate|execution-sync|agent-repair-handoff"; "i")) | not)] |
            sort_by(.updatedAt) |
            last |
            .databaseId // empty
          ' /tmp/execution-runs.json)"

          if [ -n "$FAILED_RUN_ID" ]; then
            echo "failed_run_id=$FAILED_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "state=RED" >> "$GITHUB_OUTPUT"
          else
            echo "failed_run_id=" >> "$GITHUB_OUTPUT"
            echo "state=NO_RED" >> "$GITHUB_OUTPUT"
          fi

          echo "EXECUTION_SHA=$EXECUTION_SHA"
          echo "WATCHDOG_TRIGGER=$EVENT_NAME"
          echo "WATCHDOG_STATE=${FAILED_RUN_ID:+RED:$FAILED_RUN_ID}"
          echo "${FAILED_RUN_ID:-NO_RED}"

      - name: Dispatch canonical repair chain
        if: steps.observe.outputs.state == 'RED'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.observe.outputs.failed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_RUN_ID"

          CHAIN_ID="push-watch-$TARGET_RUN_ID"
          EXISTS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 100 --json displayTitle \
            --jq '.[].displayTitle' | grep -Fxc "FLIXO Auto Repair Chain $CHAIN_ID" || true)"

          if [ "$EXISTS" -eq 0 ]; then
            gh workflow run auto-repair.yml --repo "$GITHUB_REPOSITORY" --ref execution \
              -f "target_run_id=$TARGET_RUN_ID" \
              -f "chain_id=$CHAIN_ID"
            echo "REPAIR_WAKE=DISPATCHED target_run_id=$TARGET_RUN_ID chain_id=$CHAIN_ID"
          else
            echo "REPAIR_WAKE=ALREADY_TRACKED target_run_id=$TARGET_RUN_ID chain_id=$CHAIN_ID"
          fi

      - name: Publish watchdog state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "FLIXO_EXECUTION_BOT_WATCHDOG=ACTIVE"
          echo "OBSERVED_STATE=${{ steps.observe.outputs.state || 'UNKNOWN' }}"
          echo "TARGET_RUN_ID=${{ steps.observe.outputs.failed_run_id || '' }}"
          test -s /tmp/execution-sha
          cat /tmp/execution-sha
