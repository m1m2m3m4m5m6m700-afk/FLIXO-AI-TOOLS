name: FLIXO Execution Bot Watchdog

on:
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - FLIXO Auto Repair Bot
      - Repository Security Baseline
      - Claude Security Review
    types: [completed]
    branches: [execution]
  # Independent periodic wake: if the repair chain vanishes, the observer recreates the wake.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [execution, main]

permissions:
  actions: write
  contents: read

concurrency:
  # Serialize all watchdog observations for the same exact source SHA.
  # Multiple required-workflow completions for one SHA must collapse into one observer wake.
  group: flixo-execution-watchdog-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  wake:
    name: Exact-SHA observer wake
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion != 'success' ||
        github.event.workflow_run.name == 'FLIXO Auto Repair Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact watchdog source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'schedule' && 'execution' || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact watchdog checkout
        env:
          EXPECTED_WATCHDOG_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'schedule' && '' || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_WATCHDOG_SHA="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_WATCHDOG_SHA" ]; then
            test "$EXPECTED_WATCHDOG_SHA" = "$ACTUAL_WATCHDOG_SHA"
            echo "WATCHDOG_CHECKOUT_MODE=EXACT_WORKFLOW_RUN_SHA"
          else
            test -n "$ACTUAL_WATCHDOG_SHA"
            echo "WATCHDOG_CHECKOUT_MODE=CURRENT_EXECUTION_REF"
          fi
      - name: Check source SHA freshness
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_EXECUTION_SHA="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/execution | awk '{print $1}')"
          test -n "$SOURCE_RUN_SHA"
          printf 'CURRENT_EXECUTION_SHA=%s\nSOURCE_RUN_SHA=%s\n' "$CURRENT_EXECUTION_SHA" "$SOURCE_RUN_SHA"
          if [ "$CURRENT_EXECUTION_SHA" != "$SOURCE_RUN_SHA" ]; then
            echo "STALE_WATCHDOG_EVENT=true: source run is no longer the current execution head."
            exit 0
          fi

      - name: Decide scheduled wake from durable GREEN evidence
        id: scheduled_wake
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          LATEST="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --branch execution --commit "$EXECUTION_SHA" --limit 20 --json status,conclusion,headSha)"
          ACTIVE="$(printf '%s' "$LATEST" | jq -r 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          GREEN="$(printf '%s' "$LATEST" | jq -r --arg sha "$EXECUTION_SHA" 'map(select(.headSha == $sha and .status == "completed" and .conclusion == "success")) | length')"
          if [ "$ACTIVE" -gt 0 ] || [ "$GREEN" -gt 0 ]; then
            echo 'WATCHDOG_SCHEDULED_WAKE_NOT_REQUIRED=true'
            echo 'wake=false' >> "$GITHUB_OUTPUT"
          else
            echo 'WATCHDOG_SCHEDULED_WAKE_REQUIRED=true'
            echo 'wake=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Wake whole FLIXO cell on first push and prepare all workers
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_WAKE_EVENT: push
          FLIXO_WAKE_BRANCH: execution
          FLIXO_CELL_WAKE_OUTPUT: /tmp/flixo-cell-wake.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          EXPECTED_PUSH_SHA="$GITHUB_SHA"
          test "$EXECUTION_SHA" = "$EXPECTED_PUSH_SHA"
          FLIXO_WAKE_SHA="$EXECUTION_SHA" node scripts/ci/cell-wake-preparation.mjs
          test -s /tmp/flixo-cell-wake.json
          node scripts/ci/test-cell-wake-preparation.mjs
          node scripts/ci/action-repair-five-workers.mjs --role=wake --status=PUSH_READY --target-sha="$EXECUTION_SHA" --run-id="$GITHUB_RUN_ID" --fingerprint="PUSH:$EXECUTION_SHA" --output=/tmp/flixo-cell-wake-coordinator.json
          test -s /tmp/flixo-cell-wake-coordinator.json
          echo "CELL_WAKE_READY=true"

      - name: Ensure canonical Test System exists for exact SHA without duplicate dispatch
        if: github.event_name != 'schedule' || steps.scheduled_wake.outputs.wake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          echo "WATCHDOG_EXPECTED_TEST_SHA=$EXECUTION_SHA"

          if [ "${{ github.event_name }}" = "push" ]; then
            OPEN_PR_COUNT="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --json number --jq 'length')"
            if [ "$OPEN_PR_COUNT" -gt 0 ]; then
              echo "WATCHDOG_PR_CANONICAL_PATH=true"
              echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_PR_CANONICAL"
              echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
              exit 0
            fi
          fi

          RUN_STATE="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "FLIXO Test System" \
            --commit "$EXECUTION_SHA" \
            --limit 20 \
            --json databaseId,status,conclusion,headSha \
            | jq -r --arg sha "$EXECUTION_SHA" '
                [ .[]
                  | select(.headSha == $sha)
                  | select(.status == "queued" or .status == "in_progress" or .status == "completed")
                ]
                | sort_by(.databaseId)
                | last // {}
                | [(.status // ""), (.conclusion // "")]
                | @tsv'
          )"
          STATUS="$(printf '%s' "$RUN_STATE" | cut -f1)"
          CONCLUSION="$(printf '%s' "$RUN_STATE" | cut -f2)"

          if [ "$STATUS" = "queued" ] || [ "$STATUS" = "in_progress" ]; then
            echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_ACTIVE"
            echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
            exit 0
          fi

          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
            echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_GREEN"
            echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
            exit 0
          fi

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref execution
          FOUND="false"
          for attempt in $(seq 1 30); do
            ACTIVE_COUNT="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "FLIXO Test System" --branch execution --commit "$EXECUTION_SHA" --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
            if [ "$ACTIVE_COUNT" -gt 0 ]; then
              FOUND="true"
              break
            fi
            sleep 2
          done
          test "$FOUND" = "true" || {
            echo "FAIL CLOSED: canonical FLIXO Test System did not start for exact SHA $EXECUTION_SHA."
            exit 1
          }
          echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=true"
          echo "WATCHDOG_CANONICAL_SHA=$EXECUTION_SHA"

      - name: Ensure canonical Green Gate observer exists
        if: github.event_name == 'push' || (github.event_name == 'schedule' && steps.scheduled_wake.outputs.wake == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          ACTIVE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --branch execution --commit "$EXECUTION_SHA" --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --branch execution --commit "$EXECUTION_SHA" --limit 20 --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$ACTIVE" -gt 0 ] || [ "$GREEN" -gt 0 ]; then
            echo 'WATCHDOG_GREEN_GATE_DISPATCH=NOOP'
            exit 0
          fi
          gh workflow run daily-flixo-green-gate.yml --repo "$GITHUB_REPOSITORY" --ref execution
          echo 'WATCHDOG_CANONICAL_GREEN_GATE_DISPATCH=true'
      - name: Publish whole-cell wake evidence
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-cell-wake-${{ github.run_id }}
          path: |
            /tmp/flixo-cell-wake.json
            /tmp/flixo-cell-wake-coordinator.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record watchdog evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics/watchdog
          CURRENT_EXECUTION_SHA="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/execution | awk '{print $1}')"
          printf '%s\n' "$(cat <<JSON
          {"schemaVersion":1,"protocol":"FLIXO-EXECUTION-BOT-WATCHDOG-v1","executionSha":"$CURRENT_EXECUTION_SHA","sourceRunId":"${{ github.event.workflow_run.id || '' }}","sourceRunSha":"${{ github.event.workflow_run.head_sha || '' }}","action":"WAKE_CANONICAL_OBSERVER","repairDispatcher":"daily-flixo-green-gate.yml","directRepairDispatch":false}
          JSON
          )" > diagnostics/watchdog/evidence.json
