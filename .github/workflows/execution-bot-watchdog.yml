name: FLIXO Execution Bot Watchdog

on:
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - FLIXO Auto Repair Bot
      - Repository Security Baseline
      - Claude Security Review
    types: [completed]
    branches: [execution]
  # Independent periodic wake: if the repair chain vanishes, the observer recreates the wake.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [execution, main]

permissions:
  # The watchdog may wake the trusted Daily·FLIXO Green Gate on the first RED.
  # It still has no direct Auto Repair dispatch authority.
  actions: write
  contents: read

concurrency:
  # Supersede older watchdog observations for the same exact source SHA.
  # Required-workflow completions for one SHA must leave only the newest observer wake.
  group: flixo-execution-watchdog-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  wake:
    name: Exact-SHA observer wake
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion != 'success' ||
        github.event.workflow_run.name == 'FLIXO Auto Repair Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted watchdog source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Privileged workflow_run must never execute code from an event-controlled SHA.
          # Observe execution through GitHub APIs; execute controller code only from protected main.
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted watchdog checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL_WATCHDOG_SHA="$(git rev-parse HEAD)"
          TRUSTED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test -n "$ACTUAL_WATCHDOG_SHA"
          test -n "$TRUSTED_MAIN_SHA"
          test "$ACTUAL_WATCHDOG_SHA" = "$TRUSTED_MAIN_SHA"
          echo "WATCHDOG_CHECKOUT_MODE=TRUSTED_MAIN"
          echo "WATCHDOG_TRUSTED_SOURCE_SHA=$TRUSTED_MAIN_SHA"
      - name: Capture exact execution state
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          case "$EVENT_BRANCH" in
            main|execution) ;;
            *) echo "FAIL CLOSED: unexpected watchdog event branch"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$EVENT_BRANCH" = "execution" ]; then
            EXECUTION_SHA="$EVENT_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            [[ "$SOURCE_RUN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            EXECUTION_SHA="$SOURCE_RUN_SHA"
          else
            EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          fi
          test -n "$EXECUTION_SHA"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          echo "event_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "event_branch=$EVENT_BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test -n "$SOURCE_RUN_SHA"
            LIVE_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            test -n "$LIVE_EXECUTION_SHA"
            printf 'LIVE_EXECUTION_SHA=%s\nSOURCE_RUN_SHA=%s\n' "$LIVE_EXECUTION_SHA" "$SOURCE_RUN_SHA"
            if [ "$LIVE_EXECUTION_SHA" != "$SOURCE_RUN_SHA" ]; then
              echo "STALE_WATCHDOG_EVENT=true: source run is no longer the current execution head."
              echo "stale=true" >> "$GITHUB_OUTPUT"
            else
              echo "stale=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$EVENT_BRANCH" = "execution" ] && [ "$EVENT_SHA" != "$EXECUTION_SHA" ]; then
              echo "STALE_WATCHDOG_EVENT=true: push event is no longer the current execution head."
              echo "stale=true" >> "$GITHUB_OUTPUT"
            else
              echo "stale=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Dispatch canonical Green Gate on the first RED signal
        if: >-
          github.event_name == 'workflow_run' &&
          steps.source.outputs.stale != 'true' &&
          (
            github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'timed_out'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="${{ steps.source.outputs.execution_sha }}"
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test -n "$EXECUTION_SHA"

          ACTIVE_GREEN_GATES="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow daily-flixo-green-gate.yml \
            --branch execution \
            --limit 50 \
            --json databaseId,status,headSha \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress") and .headSha == "'"$EXECUTION_SHA"'")] | length')"

          if [ "$ACTIVE_GREEN_GATES" -gt 0 ]; then
            echo 'FIRST_RED_SIGNAL=true'
            echo 'RED_WAKE_ALREADY_BACKED_BY_ACTIVE_GREEN_GATE=true'
            echo "RED_WAKE_TARGET_SHA=$EXECUTION_SHA"
            exit 0
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flixo-green-gate.yml/dispatches" \
            -f ref=main

          echo 'FIRST_RED_SIGNAL=true'
          echo 'CANONICAL_GREEN_GATE_DISPATCHED=true'
          echo 'CANONICAL_REPAIR_DISPATCH=false'
          echo "RED_WAKE_TARGET_SHA=$EXECUTION_SHA"
          echo "RED_WAKE_SOURCE_RUN_ID=${{ github.event.workflow_run.id }}"
          echo "RED_WAKE_SOURCE_WORKFLOW=${{ github.event.workflow_run.name }}"

      - name: Decide scheduled wake from durable GREEN evidence
        id: scheduled_wake
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100")"
          ACTIVE="$(printf '%s' "$LATEST" | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/daily-flixo-green-gate.yml" and .head_sha == $ENV_SHA and (.status == "queued" or .status == "in_progress"))] | length' --arg ENV_SHA "$EXECUTION_SHA")"
          GREEN="$(printf '%s' "$LATEST" | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/daily-flixo-green-gate.yml" and .head_sha == $ENV_SHA and .status == "completed" and .conclusion == "success")] | length' --arg ENV_SHA "$EXECUTION_SHA")"
          if [ "$ACTIVE" -gt 0 ] || [ "$GREEN" -gt 0 ]; then
            echo 'WATCHDOG_SCHEDULED_WAKE_NOT_REQUIRED=true'
            echo 'wake=false' >> "$GITHUB_OUTPUT"
          else
            echo 'WATCHDOG_SCHEDULED_WAKE_REQUIRED=true'
            echo 'wake=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Record exact execution push wake
        if: github.event_name == 'push' && github.ref_name == 'execution' && steps.source.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$SOURCE_EXECUTION_SHA"
          EXPECTED_PUSH_SHA="$GITHUB_SHA"
          test "$EXECUTION_SHA" = "$EXPECTED_PUSH_SHA"
          echo "CELL_WAKE_READY=true"
          echo "CELL_WAKE_MODE=API_ONLY"
          echo "CELL_WAKE_TARGET_SHA=$EXECUTION_SHA"

      - name: Verify canonical Test System exists for exact SHA
        if: (github.event_name != 'schedule' || steps.scheduled_wake.outputs.wake == 'true') && steps.source.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$SOURCE_EXECUTION_SHA"
          test -n "$EXECUTION_SHA"
          echo "WATCHDOG_EXPECTED_TEST_SHA=$EXECUTION_SHA"
      - name: Validate mission continuity contract
        if: steps.source.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/ci/mission-continuity-engine.mjs ]; then
            node scripts/ci/mission-continuity-engine.mjs validate
          else
            echo "MISSION_CONTINUITY_TRUSTED_SOURCE_NOT_YET_INSTALLED=true"
          fi


          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "WATCHDOG_PUSH_CANONICAL_TEST_SYSTEM_EXPECTED=true"
            echo "WATCHDOG_PUSH_CANONICAL_SHA=$EXECUTION_SHA"
            echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_PUSH_TRIGGER"
            echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
            exit 0
          fi

          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100" |
            jq -r --arg sha "$EXECUTION_SHA" '
              [ .workflow_runs[]
                | select(.path == ".github/workflows/ci.yml" and .head_sha == $sha)
                | select(.status == "queued" or .status == "in_progress" or .status == "completed")
              ]
              | sort_by(.id)
              | last // {}
              | [(.status // ""), (.conclusion // "")]
              | @tsv'
          )"
          STATUS="$(printf '%s' "$RUN_STATE" | cut -f1)"
          CONCLUSION="$(printf '%s' "$RUN_STATE" | cut -f2)"

          if [ "$STATUS" = "queued" ] || [ "$STATUS" = "in_progress" ]; then
            echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_ACTIVE"
            echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
            exit 0
          fi

          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
            echo "WATCHDOG_TEST_SYSTEM_DISPATCH=NOOP_GREEN"
            echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=false"
            exit 0
          fi

          echo "WATCHDOG_TEST_SYSTEM_DISPATCH=OBSERVATION_ONLY"
          FOUND="false"
          for attempt in $(seq 1 1); do
            ACTIVE_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100" |
              jq -r --arg sha "$EXECUTION_SHA" '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length')"
            if [ "$ACTIVE_COUNT" -gt 0 ]; then
              FOUND="true"
              break
            fi
            sleep 2
          done
          test "$FOUND" = "true" || {
            echo "FAIL CLOSED: canonical FLIXO Test System did not start for exact SHA $EXECUTION_SHA."
            exit 1
          }
          echo "WATCHDOG_CANONICAL_TEST_SYSTEM_STARTED=true"
          echo "WATCHDOG_CANONICAL_SHA=$EXECUTION_SHA"

      - name: Ensure canonical Green Gate observer exists
        if: (github.event_name == 'push' || (github.event_name == 'schedule' && steps.scheduled_wake.outputs.wake == 'true')) && steps.source.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$SOURCE_EXECUTION_SHA"
          test -n "$EXECUTION_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "WATCHDOG_GREEN_GATE_TRIGGER_EXPECTED=true"
            exit 0
          fi
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXECUTION_SHA&per_page=100")"
          ACTIVE="$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/daily-flixo-green-gate.yml" and .head_sha == $ENV_SHA and (.status == "queued" or .status == "in_progress"))] | length' --arg ENV_SHA "$EXECUTION_SHA")"
          GREEN="$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/daily-flixo-green-gate.yml" and .head_sha == $ENV_SHA and .status == "completed" and .conclusion == "success")] | length' --arg ENV_SHA "$EXECUTION_SHA")"
          if [ "$ACTIVE" -gt 0 ] || [ "$GREEN" -gt 0 ]; then
            echo 'WATCHDOG_GREEN_GATE_DISPATCH=NOOP'
            exit 0
          fi
          echo "WATCHDOG_GREEN_GATE_DISPATCH=CANONICAL_REPAIR_WAKE"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flixo-green-gate.yml/dispatches" \
            -f ref=main
          echo 'WATCHDOG_CANONICAL_GREEN_GATE_DISPATCH=true'
          echo "WATCHDOG_GREEN_GATE_TARGET_SHA=$EXECUTION_SHA"
      - name: Record watchdog evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_SOURCE_RUN_ID" ]; then
            case "$EVENT_SOURCE_RUN_ID" in
              ''|*[!0-9]*) echo 'FAIL CLOSED: invalid workflow_run source id'; exit 1 ;;
            esac
          fi
          if [ -n "$EVENT_SOURCE_RUN_SHA" ]; then
            [[ "$EVENT_SOURCE_RUN_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo 'FAIL CLOSED: invalid workflow_run source SHA'
              exit 1
            }
          fi
          mkdir -p diagnostics/watchdog
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            CURRENT_EXECUTION_SHA="$GITHUB_SHA"
          else
            CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          fi
          SOURCE_RUN_ID="$EVENT_SOURCE_RUN_ID"
          SOURCE_RUN_SHA="$EVENT_SOURCE_RUN_SHA"
          FIRST_RED_WAKE=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] &&
             [ "$SOURCE_RUN_SHA" = "$CURRENT_EXECUTION_SHA" ] &&
             [ "${{ github.event.workflow_run.conclusion || '' }}" != "success" ] &&
             [ "${{ steps.source.outputs.stale }}" = "false" ]; then
            FIRST_RED_WAKE=true
          fi
          jq -n \
            --arg executionSha "$CURRENT_EXECUTION_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg sourceRunSha "$SOURCE_RUN_SHA" \
            --argjson firstRedWake "$FIRST_RED_WAKE" \
            '{
              schemaVersion: 1,
              protocol: "FLIXO-EXECUTION-BOT-WATCHDOG-v1",
              executionSha: $executionSha,
              sourceRunId: $sourceRunId,
              sourceRunSha: $sourceRunSha,
              action: "WAKE_CANONICAL_OBSERVER",
              repairDispatcher: "daily-flixo-green-gate.yml",
              firstRedWake: $firstRedWake,
              directRepairDispatch: false
            }' > diagnostics/watchdog/evidence.json
          test -s diagnostics/watchdog/evidence.json
          jq -e '.schemaVersion == 1 and .protocol == "FLIXO-EXECUTION-BOT-WATCHDOG-v1" and (.executionSha | test("^[0-9a-f]{40}$"))' diagnostics/watchdog/evidence.json >/dev/null

      - name: Publish watchdog wake evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-watchdog-evidence-${{ github.run_id }}
          path: diagnostics/watchdog/evidence.json
          if-no-files-found: error
          retention-days: 30
