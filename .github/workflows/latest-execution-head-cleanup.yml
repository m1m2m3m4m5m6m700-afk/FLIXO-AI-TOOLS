name: FLIXO Latest Execution HEAD Cleanup

on:
  push:
    branches: [execution]
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: flixo-latest-execution-head-cleanup
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete stale execution-head runs and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact cleanup source SHA
        shell: bash
        env:
          EXPECTED_CLEANUP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CLEANUP_SHA"
      - name: Run repository latest-execution-head cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_STALE_EXECUTION_GRACE_DAYS: '14'
        run: node scripts/ci/latest-execution-head-cleanup.mjs

      - name: Publish cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-latest-execution-head-cleanup-${{ github.run_id }}
          path: /tmp/latest-execution-head-cleanup-summary.json
          if-no-files-found: ignore
          retention-days: 7
