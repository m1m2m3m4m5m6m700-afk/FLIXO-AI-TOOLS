name: FLIXO Repair Agent — Error Intake Gateway
run-name: FLIXO Repair Agent Intake ${{ github.event.workflow_run.id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to ingest'
        required: true
        type: string
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - FLIXO Continuous Delivery
      - Repository Security Baseline
      - Claude Security Review
      - Daily·FLIXO Green Gate
      - FLIXO Auto Repair Bot
      - FLIXO Auto Repair Chain
      - FLIXO Auto Repair Merge Gate
      - FLIXO Agent Repair Supervisor
      - FLIXO Agent Repair Heartbeat
      - FLIXO Master Agent Activation Relay
      - FLIXO Agent Communication Relay
      - FLIXO Agent Repair Handoff Gate
      - Agent Recovery Gate
      - Admin 006 Persistence Roundtrip
      - Bundle Boundary Contract
      - CI SLO Report
      - Dependency Health
      - Dependency Usage Classification v2
      - Deploy FLIXOAI
      - Error Memory Root Cause
      - Execution Bot Watchdog
      - Execution Sync
      - Phase3 Chain Compatibility
      - Repair Lease Live Race
      - Root Cause Diagnostics
      - SEO Production Certification
      - Test Matrix Contract
      - Code Read-Only Scout
    types: [completed]
    branches: [execution, main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: flixo-repair-agent-intake-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: Capture every CI error and route to Agent Council
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted intake gateway
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve completed workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt=1
            local max_attempts=5
            local delay=2
            local output
            while true; do
              if output="$($@ 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "TRANSIENT_GITHUB_API_FAILURE attempt=$attempt/$max_attempts; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          RUN_ID="$EVENT_RUN_ID"
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; fi
          if [ -z "$RUN_ID" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo 'INTAKE_SCHEDULE_RESCUE_MODE=true'
            RUN_LIST_JSON="$(gh_retry gh run list --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId,name,conclusion,headSha,headBranch,createdAt)"
            RUN_ID="$(jq -r '
              [ .[]
                | select(.headBranch == "execution" or .headBranch == "main")
                | select(.name != "FLIXO Repair Agent — Error Intake Gateway")
                | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")
              ]
              | sort_by(.createdAt)
              | last.databaseId // empty
            ' <<<"$RUN_LIST_JSON")"
            if [ -z "$RUN_ID" ]; then
              echo 'SCHEDULE_RESCUE_NO_ACTIONABLE_RUN=true'
              exit 0
            fi
            echo "SCHEDULE_RESCUE_RUN_ID=$RUN_ID"
          fi
          test -n "$RUN_ID"
          META="$(gh_retry gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,name,conclusion,headSha,headBranch,status,updatedAt)"
          CONCLUSION="$(jq -r '.conclusion // empty' <<<"$META")"
          case "$CONCLUSION" in
            failure|timed_out|cancelled|action_required) ;;
            *) echo "No actionable error: conclusion=$CONCLUSION"; exit 0 ;;
          esac
          FAILED_SHA="$(jq -r '.headSha' <<<"$META")"
          WORKFLOW="$(jq -r '.name' <<<"$META")"
          BRANCH="$(jq -r '.headBranch' <<<"$META")"
          CURRENT_SHA="$(gh_retry gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          printf '%s\n' "$RUN_ID" >/tmp/run-id
          printf '%s\n' "$FAILED_SHA" >/tmp/failed-sha
          printf '%s\n' "$WORKFLOW" >/tmp/workflow
          printf '%s\n' "$BRANCH" >/tmp/branch
          printf '%s\n' "$CONCLUSION" >/tmp/conclusion
          printf '%s\n' "$CURRENT_SHA" >/tmp/current-sha

      - name: Capture logs once at the gateway
        if: hashFiles('/tmp/run-id') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/repair-agent-intake
          RUN_ID="$(cat /tmp/run-id)"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/repair-agent-intake/failure.log 2>&1 || true
          test -s /tmp/repair-agent-intake/failure.log || printf 'LOG_CAPTURE_EMPTY run=%s\n' "$RUN_ID" > /tmp/repair-agent-intake/failure.log

      - name: Build canonical Repair Agent incident
        if: hashFiles('/tmp/run-id') != ''
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/repair-agent-intake.mjs             --run-id="$(cat /tmp/run-id)"             --workflow="$(cat /tmp/workflow)"             --conclusion="$(cat /tmp/conclusion)"             --failed-sha="$(cat /tmp/failed-sha)"             --branch="$(cat /tmp/branch)"             --current-sha="$(cat /tmp/current-sha)"             --log=/tmp/repair-agent-intake/failure.log             --evidence=/tmp/repair-agent-intake/incident.json > /tmp/repair-agent-intake/output.json
          jq -e '.message.recipient == "ALL_AGENTS"' /tmp/repair-agent-intake/output.json >/dev/null
          jq -e '.incident.failureFingerprint != null' /tmp/repair-agent-intake/output.json >/dev/null

      - name: Deliver incident once to Agent Council
        if: hashFiles('/tmp/run-id') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          INCIDENT_ID="$(jq -r '.incident.incidentId' /tmp/repair-agent-intake/output.json)"
          COUNCIL_PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          test -n "$COUNCIL_PR_NUMBER"
                    RECEIPT="<!-- repair-agent-incident:$INCIDENT_ID -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$RECEIPT"; then
            echo "REPAIR_AGENT_INTAKE_DUPLICATE=NO_OP"
            exit 0
          fi
          jq -r '.issueComment' /tmp/repair-agent-intake/output.json > /tmp/repair-agent-intake/comment.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments" --raw-field body="$(cat /tmp/repair-agent-intake/comment.md)" >/dev/null
          echo 'REPAIR_AGENT_ERROR_DELIVERED_TO_COUNCIL=true'
          echo 'OTHER_AGENTS_LOG_POLLING_REQUIRED=false'

      - name: Preserve central intake evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-agent-incident-${{ github.run_id }}
          path: /tmp/repair-agent-intake
          if-no-files-found: ignore
          retention-days: 30
