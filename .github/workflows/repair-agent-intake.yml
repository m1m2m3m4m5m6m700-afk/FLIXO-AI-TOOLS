name: FLIXO Repair Agent — Error Intake Gateway
run-name: FLIXO Repair Agent Intake ${{ github.event.workflow_run.id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to ingest'
        required: true
        type: string
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact Execution
      - Repository Security Baseline
      - Claude Security Review
    types: [completed]
    branches: [execution, main]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  # Every completed source run gets an independent intake slot; one incident must never
  # cancel another incident merely because both came from the same canonical branch.
  group: flixo-repair-agent-intake-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    name: Capture every CI error and route to Agent Council
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted intake gateway
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cancel stale workflow_run source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/assert-workflow-run-current.mjs
      - name: Resolve completed workflow run
        id: resolve_run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt=1
            local max_attempts=5
            local delay=2
            local output
            while true; do
              if output="$($@ 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "TRANSIENT_GITHUB_API_FAILURE attempt=$attempt/$max_attempts; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          RUN_ID="$EVENT_RUN_ID"
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; fi
          if [ -z "$RUN_ID" ]; then
            echo 'has_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$RUN_ID"
          case "$RUN_ID" in
            ""|*[!0-9]*) echo "FAIL CLOSED: run_id must be numeric."; exit 1 ;;
          esac
          META="$(gh_retry gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,name,path,conclusion,headSha,headBranch,status,updatedAt)"
          CONCLUSION="$(jq -r '.conclusion // empty' <<<"$META")"
          case "$CONCLUSION" in
            failure|timed_out|action_required) ;;
            *) echo "No actionable error: conclusion=$CONCLUSION"; exit 0 ;;
          esac
          FAILED_SHA="$(jq -r '.headSha' <<<"$META")"
          WORKFLOW="$(jq -r '.name' <<<"$META")"
          WORKFLOW_PATH="$(jq -r '.path // empty' <<<"$META")"
          BRANCH="$(jq -r '.headBranch' <<<"$META")"
          case "$WORKFLOW:$WORKFLOW_PATH" in
            "FLIXO Test System:.github/workflows/ci.yml"|"FLIXO WP0 Trust Baseline:.github/workflows/wp0-trust-baseline.yml"|"FLIXO Test Impact Execution:.github/workflows/test-impact-execution.yml"|"Repository Security Baseline:.github/workflows/repository-security-baseline.yml"|"Claude Security Review:.github/workflows/claude-security-review.yml") ;;
            *) echo "FAIL CLOSED: unapproved workflow source: $WORKFLOW path=$WORKFLOW_PATH"; exit 1 ;;
          esac
          case "$BRANCH" in
            execution|main) ;;
            *) echo "FAIL CLOSED: workflow head branch is outside the canonical trust boundary."; exit 1 ;;
          esac
          [[ "$FAILED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          case "$BRANCH" in
            execution)
              CURRENT_SHA="$(gh_retry gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
              ;;
            main)
              CURRENT_SHA="$(gh_retry gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              ;;
            *)
              echo "FAIL CLOSED: workflow head branch is outside the canonical trust boundary."
              exit 1
              ;;
          esac
          printf '%s\n' "$RUN_ID" >/tmp/run-id
          printf '%s\n' "$FAILED_SHA" >/tmp/failed-sha
          printf '%s\n' "$WORKFLOW" >/tmp/workflow
          printf '%s\n' "$BRANCH" >/tmp/branch
          printf '%s\n' "$CONCLUSION" >/tmp/conclusion
          [[ "$CURRENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ "$FAILED_SHA" != "$CURRENT_SHA" ]; then
            echo "FAIL CLOSED: requested source run $FAILED_SHA is superseded by current $CURRENT_SHA."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            echo "STALE_MANUAL_INTAKE_CANCEL_REQUESTED=true"
            exit 1
          fi
          printf '%s\n' "$CURRENT_SHA" >/tmp/current-sha
          echo 'has_run=true' >> "$GITHUB_OUTPUT"

      - name: Capture logs once at the gateway
        if: steps.resolve_run.outputs.has_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/repair-agent-intake
          RUN_ID="$(cat /tmp/run-id)"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/repair-agent-intake/failure.log 2>&1 || true
          test -s /tmp/repair-agent-intake/failure.log || printf 'LOG_CAPTURE_EMPTY run=%s\n' "$RUN_ID" > /tmp/repair-agent-intake/failure.log

      - name: Build canonical Repair Agent incident
        if: steps.resolve_run.outputs.has_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/repair-agent-intake.mjs             --run-id="$(cat /tmp/run-id)"             --workflow="$(cat /tmp/workflow)"             --conclusion="$(cat /tmp/conclusion)"             --failed-sha="$(cat /tmp/failed-sha)"             --branch="$(cat /tmp/branch)"             --current-sha="$(cat /tmp/current-sha)"             --log=/tmp/repair-agent-intake/failure.log             --evidence=/tmp/repair-agent-intake/incident.json > /tmp/repair-agent-intake/output.json
          jq -e '.message.recipient == "ALL_AGENTS"' /tmp/repair-agent-intake/output.json >/dev/null
          jq -e '.incident.failureFingerprint != null' /tmp/repair-agent-intake/output.json >/dev/null

      - name: Block stale incident delivery
        if: steps.resolve_run.outputs.has_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.incident.staleTarget' /tmp/repair-agent-intake/output.json)" = "true" ]; then
            echo 'STALE_INCIDENT_NOT_DELIVERED_TO_CURRENT_RCA=true'
            echo 'STALE_INCIDENT_REQUIRES_EXACT_SHA_REQUALIFICATION=true'
            exit 0
          fi

      - name: Deliver incident once to Agent Council
        if: steps.resolve_run.outputs.has_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.incident.staleTarget' /tmp/repair-agent-intake/output.json)" = "true" ]; then exit 0; fi
          INCIDENT_ID="$(jq -r '.incident.incidentId' /tmp/repair-agent-intake/output.json)"
          COUNCIL_PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          COUNCIL_TARGET_KIND="CANONICAL_EXECUTION_PR"
          COUNCIL_TARGET_NUMBER="$COUNCIL_PR_NUMBER"
          if [ -z "$COUNCIL_TARGET_NUMBER" ]; then
            # After execution→main merge there may be no open integration PR. The
            # incident must still reach the canonical Agent Council issue instead
            # of turning successful error capture into a secondary intake failure.
            COUNCIL_TARGET_KIND="AGENT_COUNCIL_ISSUE"
            COUNCIL_TARGET_NUMBER="765"
          fi
          case "$COUNCIL_TARGET_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid Agent Council target.'; exit 1 ;;
          esac
          RECEIPT="<!-- repair-agent-incident:$INCIDENT_ID -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_TARGET_NUMBER/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$RECEIPT"; then
            echo "REPAIR_AGENT_INTAKE_DUPLICATE=NO_OP"
            echo "REPAIR_AGENT_COUNCIL_TARGET=$COUNCIL_TARGET_KIND#$COUNCIL_TARGET_NUMBER"
            exit 0
          fi
          jq -r '.issueComment' /tmp/repair-agent-intake/output.json > /tmp/repair-agent-intake/comment.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_TARGET_NUMBER/comments" --raw-field body="$(cat /tmp/repair-agent-intake/comment.md)" >/dev/null
          echo 'REPAIR_AGENT_ERROR_DELIVERED_TO_COUNCIL=true'
          echo "REPAIR_AGENT_COUNCIL_TARGET=$COUNCIL_TARGET_KIND#$COUNCIL_TARGET_NUMBER"
          echo 'OTHER_AGENTS_LOG_POLLING_REQUIRED=false'

      - name: Preserve central intake evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-agent-incident-${{ github.run_id }}
          path: /tmp/repair-agent-intake
          if-no-files-found: ignore
          retention-days: 30
