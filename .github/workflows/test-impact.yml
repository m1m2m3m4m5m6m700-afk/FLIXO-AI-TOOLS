name: FLIXO Test Impact

on:
  # One canonical push-triggered verification is sufficient for each exact execution SHA.
  # PRs consume the same check-runs from that head commit; avoid duplicate heavy execution.
  push:
    branches: [main, execution]
  workflow_dispatch:

# Each exact commit SHA has its own execution slot; supersession is handled by the trusted controller, which cancels active stale work; exact-SHA gates reject any cancellation race.
# The surviving run still validates the exact SHA before publishing evidence.
concurrency:
  group: flixo-test-impact-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Test Impact Graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fail closed when this commit is superseded
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: node scripts/ci/assert-current-commit.mjs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Build impact plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/ci/test-impact.mjs --base="$BASE_SHA"
      - name: Verify impact evidence identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s diagnostics/ci/test-impact.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('diagnostics/ci/test-impact.json', 'utf8'));
          const expected = process.env.EXPECTED_SHA;
          if (p.sha !== expected) throw new Error(`Impact SHA mismatch: ${p.sha} != ${expected}`);
          if (p.evidenceClass !== 'PRIMARY_EXECUTION') throw new Error('Impact evidence must be PRIMARY_EXECUTION');
          if (!Array.isArray(p.commands) || p.commands.length === 0) throw new Error('Impact plan must contain commands');
          if (!Array.isArray(p.domains) || p.domains.length === 0) throw new Error('Impact plan must contain domains');
          NODE
      - name: Verify evidence reducer contract
        run: node scripts/ci/test-evidence-reducer.mjs
      - name: Upload impact evidence
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: flixo-test-impact-${{ github.run_id }}
          path: diagnostics/ci/test-impact.json
          if-no-files-found: error
          retention-days: 14
