name: Temporary Lock Harmonization

on:
  push:
    branches:
      - remediation/dependency-lock-harmonization-20260908

permissions:
  contents: write

jobs:
  harmonize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: remediation/dependency-lock-harmonization-20260908
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile from committed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify npm ci lock parity
        run: npm ci --ignore-scripts --no-audit --no-fund --dry-run

      - name: Commit lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_lock-harmonization-20260908.yml
          git add package-lock.json .github/workflows/_lock-harmonization-20260908.yml
          if git diff --cached --quiet; then
            echo 'No lockfile change produced.'
            exit 1
          fi
          git commit -m 'fix: harmonize package lock with committed manifest'
          git push origin HEAD:remediation/dependency-lock-harmonization-20260908
