name: FLIXO Engineering Work Package Guard

on:
  push:
    branches: [execution]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

env:
  # New certified linear-publication epoch begins at the first normalized execution SHA.
  # Historical pre-normalization bursts remain preserved in Git objects; this guard evaluates
  # only the post-normalization repair/control-plane lineage.
  FLIXO_WP_BASE_SHA: 8d32b4735f8338bcb370ccaac418895a5ff05717
  # Sensitive-runtime proof coverage is likewise restarted at the normalized control boundary.
  FLIXO_PROOF_BASE_SHA: 8d32b4735f8338bcb370ccaac418895a5ff05717

jobs:
  work-package-guard:
    name: Work Package / RCA / Proof Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Enforce RED-lock against new additions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GREEN_FIRST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/green-first-addition-policy.mjs
      - name: Validate work-package burst policy
        run: node scripts/ci/work-package-policy.mjs "$FLIXO_WP_BASE_SHA" HEAD
      - name: Validate adjacent runtime proof coverage
        run: node scripts/ci/validate-runtime-proof-coverage.mjs "$FLIXO_PROOF_BASE_SHA" HEAD
      - name: Lock canonical control contracts
        run: node scripts/ci/validate-control-contract-locks.mjs
      - name: Validate agent work-package contract
        run: node scripts/ci/test-agent-work-package-contract.mjs
