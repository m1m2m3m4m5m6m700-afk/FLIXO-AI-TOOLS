name: FLIXO Engineering Work Package Guard

on:
  push:
    branches: [execution]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FLIXO_WP_BASE_SHA: fddba49348fa48e65be4f0ed28ba07c8a8af8d9f
  FLIXO_PROOF_BASE_SHA: fddba49348fa48e65be4f0ed28ba07c8a8af8d9f

jobs:
  work-package-guard:
    name: Work Package / RCA / Proof Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Validate work-package burst policy
        run: node scripts/ci/work-package-policy.mjs "$FLIXO_WP_BASE_SHA" HEAD
      - name: Validate adjacent runtime proof coverage
        run: node scripts/ci/validate-runtime-proof-coverage.mjs "$FLIXO_PROOF_BASE_SHA" HEAD
      - name: Lock canonical control contracts
        run: node scripts/ci/validate-control-contract-locks.mjs
      - name: Validate agent work-package contract
        run: node scripts/ci/test-agent-work-package-contract.mjs
