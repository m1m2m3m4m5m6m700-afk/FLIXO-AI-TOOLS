  aggregator:
    name: Aggregator — Root Cause Report
    needs:
      - ci_001
      - ci_002
      - ci_003
      - ci_004
      - ci_005
      - ci_006
      - ci_007
      - ci_008
      - ci_009
      - ci_010
      - ci_011
      - ci_012
      - ci_013
      - ci_014
      - ci_015
      - ci_016
      - ci_017
      - ci_018
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Phase 0 baseline artifact
        shell: bash
        run: test -f ci.yml.backup
      - name: Download all CI evidence
        uses: actions/download-artifact@v5
        with:
          pattern: ci-*-*
          path: artifacts
          merge-multiple: false
      - name: Generate error-report.json
        env:
          GITHUB_SHA: ${{ github.sha }}
          ERROR_ARTIFACT_ROOT: artifacts
        run: |
          node scripts/collect-errors.mjs || true
          test -s error-report.json
          cat error-report.json
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: error-report-${{ github.run_id }}
          path: error-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Final 100/100 fail-closed gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('error-report.json', 'utf8'));
          if (r.summary?.total !== 0) throw new Error(`100/100 FAILED: ${r.summary?.total ?? 'unknown'} error(s)`);
          if (r.summary?.receivedResults !== 18) throw new Error(`100/100 FAILED: received ${r.summary?.receivedResults ?? 'unknown'} / 18 results`);
          if (r.execution?.missingEvidence?.length) throw new Error(`100/100 FAILED: missing ${r.execution.missingEvidence.join(', ')}`);
          if (r.execution?.duplicateEvidence?.length) throw new Error(`100/100 FAILED: duplicate ${r.execution.duplicateEvidence.join(', ')}`);
          if (r.execution?.parseErrors?.length) throw new Error('100/100 FAILED: parse errors present');
          console.log('100/100 PASS');
          NODE
