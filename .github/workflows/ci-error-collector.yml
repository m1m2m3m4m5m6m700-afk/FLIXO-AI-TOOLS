name: FLIXO CI — Error Collector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  CI: 'true'

jobs:
  test-001-typecheck:
    name: TEST-001 — Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run TEST-001
        shell: bash
        run: |
          set +e
          npm run typecheck -- --incremental --skipLibCheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          printf '{"testId":"TEST-001","testName":"TypeScript Type Checking","category":"typecheck","priority":"P0","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("typecheck.log","utf8")))')" > result.json
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-001-typecheck-${{ github.run_id }}
          path: |
            typecheck.log
            result.json
          if-no-files-found: error

  test-002-lint:
    name: TEST-002 — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run TEST-002
        shell: bash
        run: |
          set +e
          npm run lint -- --cache --format json --output-file eslint-report.json 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          printf '{"testId":"TEST-002","testName":"ESLint Code Quality","category":"lint","priority":"P0","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("lint.log","utf8")))')" > result.json
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-002-lint-${{ github.run_id }}
          path: |
            lint.log
            eslint-report.json
            result.json
          if-no-files-found: warn

  test-003-contracts:
    name: TEST-003 — Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run TEST-003
        shell: bash
        run: |
          set +e
          : > contracts.log
          npm run validate:router-registry >>contracts.log 2>&1
          s1=$?
          npm run validate:contracts >>contracts.log 2>&1
          s2=$?
          status=$(( s1 || s2 ))
          printf '{"testId":"TEST-003","testName":"Registry & Contracts Validation","category":"contracts","priority":"P0","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("contracts.log","utf8")))')" > result.json
          cat contracts.log
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-003-contracts-${{ github.run_id }}
          path: |
            contracts.log
            result.json
          if-no-files-found: error

  test-004-unit-tests:
    name: TEST-004 — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run TEST-004
        shell: bash
        run: |
          set +e
          npm run test:unit 2>&1 | tee unit.log
          status=${PIPESTATUS[0]}
          printf '{"testId":"TEST-004","testName":"Unit Tests","category":"unit","priority":"P1","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("unit.log","utf8")))')" > result.json
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-004-unit-tests-${{ github.run_id }}
          path: |
            unit.log
            result.json
          if-no-files-found: error

  test-005-integration-tests:
    name: TEST-005 — Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run TEST-005
        shell: bash
        run: |
          set +e
          npm run build:runtime 2>&1 | tee integration-build.log
          build_status=${PIPESTATUS[0]}
          test_status=0
          if [ "$build_status" -eq 0 ]; then
            npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/flixo-integration-server.log 2>&1 &
            pid=$!
            ready=1
            for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && { ready=0; break; }; sleep 1; done
            if [ "$ready" -eq 0 ]; then
              npm exec playwright test tests/integration/ --project=chromium --workers=1 --retries=0 2>&1 | tee integration.log
              test_status=${PIPESTATUS[0]}
            else
              echo 'Integration preview did not become ready.' | tee integration.log
              test_status=1
            fi
            kill "$pid" 2>/dev/null || true
          fi
          status=$(( build_status || test_status ))
          { cat integration-build.log 2>/dev/null || true; cat integration.log 2>/dev/null || true; cat /tmp/flixo-integration-server.log 2>/dev/null || true; } > integration-combined.log
          printf '{"testId":"TEST-005","testName":"Integration Tests","category":"integration","priority":"P1","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("integration-combined.log","utf8")))')" > result.json
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-005-integration-tests-${{ github.run_id }}
          path: |
            integration-build.log
            integration.log
            integration-combined.log
            result.json
            /tmp/flixo-integration-server.log
          if-no-files-found: warn

  test-006-e2e-matrix:
    name: TEST-006 — E2E / ${{ matrix.browser }} / shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install browser dependencies
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Install browser
        run: npx playwright install '${{ matrix.browser }}'
      - name: Run TEST-006
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          test_status=0
          if [ "$build_status" -eq 0 ]; then
            npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/flixo-e2e-server.log 2>&1 &
            pid=$!
            ready=1
            for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && { ready=0; break; }; sleep 1; done
            if [ "$ready" -eq 0 ]; then
              npm exec playwright test --project='${{ matrix.browser }}' --workers=4 --retries=0 --shard='${{ matrix.shard }}/4' 2>&1 | tee e2e.log
              test_status=${PIPESTATUS[0]}
            else
              echo 'E2E preview did not become ready.' | tee e2e.log
              test_status=1
            fi
            kill "$pid" 2>/dev/null || true
          fi
          status=$(( build_status || test_status ))
          { cat build.log 2>/dev/null || true; cat e2e.log 2>/dev/null || true; cat /tmp/flixo-e2e-server.log 2>/dev/null || true; } > e2e-combined.log
          printf '{"testId":"TEST-006","testName":"End-to-End Tests","category":"e2e","priority":"P1","browser":"${{ matrix.browser }}","shard":"${{ matrix.shard }}/4","status":"%s","output":%s}\n' "$([ "$status" -eq 0 ] && echo success || echo failure)" "$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("e2e-combined.log","utf8")))')" > result.json
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-006-e2e-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            build.log
            e2e.log
            e2e-combined.log
            result.json
            playwright-report/
            test-results/
            /tmp/flixo-e2e-server.log
          if-no-files-found: warn
          retention-days: 14

  aggregator:
    name: Aggregator — Root Cause Report
    needs:
      - test-001-typecheck
      - test-002-lint
      - test-003-contracts
      - test-004-unit-tests
      - test-005-integration-tests
      - test-006-e2e-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download all evidence
        uses: actions/download-artifact@v5
        with:
          pattern: test-*-*
          path: artifacts
          merge-multiple: false
      - name: Generate report
        env:
          SETUP_RESULT: success
          GITHUB_SHA: ${{ github.sha }}
          ERROR_ARTIFACT_ROOT: artifacts
        run: |
          node scripts/collect-errors.mjs
          test -s error-report.json
          cat error-report.json
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: error-report-${{ github.run_id }}
          path: error-report.json
          if-no-files-found: error
          retention-days: 14
      - name: 100/100 fail-closed gate
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('error-report.json','utf8')); if(!r.summary || r.summary.total!==0) throw new Error('100/100 FAILED: '+(r.summary?.total ?? 'unknown')+' collected error(s)'); if(r.summary.receivedResults!==17) throw new Error('100/100 FAILED: incomplete evidence'); console.log('100/100 PASS');"
