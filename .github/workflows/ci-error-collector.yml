name: FLIXO CI — Comprehensive Error Collector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-error-collector-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  S4_EXTERNAL_SERVER: 'true'
  CI: 'true'

jobs:
  ci_001:
    name: CI-001 — TypeScript Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Execute CI-001
        run: node scripts/run-ci-error-job.mjs CI-001 || true
      - name: Upload CI-001 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-001-typecheck-${{ github.run_id }}
          path: ci-error-results/CI-001/
          if-no-files-found: error
          retention-days: 14

  ci_002:
    name: CI-002 — ESLint Code Quality
