name: SEO Production Certification

# Release/diagnostic certification only. PR blocking SEO evidence is owned by the canonical CI artifact consumer.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-seo:
    name: Production SEO Artifacts
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      FLIXO_GENERATED_OUTPUT_DIR: dist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build production SEO artifacts
        run: npm run build
      - name: Validate generated sitemap and robots artifacts
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-seo-production.mjs
      - name: Validate complete SEO and indexing source contract
        run: |
          npm run validate:seo
          npm run validate:seo-manifest
          npm run validate:use-case-seo
          npm run validate:indexing
          npm run validate:breadcrumb-seo
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-google-multilingual-seo.mjs
          node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-language-quality-strict.mjs
      - name: Final SEO/indexing certification
        run: |
          set -euo pipefail
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -Fx "Sitemap: ${VITE_SITE_URL}/sitemap.xml" dist/robots.txt
          grep -Fq 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' dist/sitemap.xml
          echo "SEO/Indexing certification GREEN: production artifacts + canonical origin + hreflang + x-default + robots + indexing contracts passed."
