name: FLIXO Auto Repair Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: flixo-auto-repair-watchdog
  cancel-in-progress: false

jobs:
  wake-repair-agent:
    name: Detect fresh RED runs and wake the repair agent
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find fresh failed runs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          candidate=''
          while IFS=$'\t' read -r run_id created conclusion workflow; do
            [ -n "$run_id" ] || continue
            created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
            age=$((now-created_epoch))
            if [ "$age" -ge 0 ] && [ "$age" -le 900 ] && { [ "$conclusion" = failure ] || [ "$conclusion" = timed_out ]; }; then
              case "$workflow" in
                *Auto\ Repair*|*Watchdog*) continue ;;
              esac
              candidate="$run_id"
              echo "Detected fresh RED run: $run_id ($workflow)"
              break
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --limit 50 --json databaseId,createdAt,conclusion,name --jq '.[] | [.databaseId,.createdAt,.conclusion,.name] | @tsv')
          echo "target_run_id=$candidate" >> "$GITHUB_OUTPUT"

      - name: Check whether a repair agent is already active
        id: active
        if: steps.detect.outputs.target_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --status in_progress --status queued --limit 5 --json databaseId --jq 'length')
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Wake repair agent for the first fresh RED
        if: steps.detect.outputs.target_run_id != '' && steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.detect.outputs.target_run_id }}
        run: |
          set -euo pipefail
          gh workflow run auto-repair.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref execution \
            -f target_run_id="$TARGET_RUN_ID" \
            -f chain_id="watchdog-$TARGET_RUN_ID"
          echo "Repair agent awakened for run $TARGET_RUN_ID"

      - name: Report no-op state
        if: steps.detect.outputs.target_run_id == '' || steps.active.outputs.active != '0'
        run: echo 'No new RED requiring a wake-up, or a repair cycle is already active.'
