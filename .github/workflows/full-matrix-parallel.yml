name: Full Matrix Parallel

# Full Matrix starts with the same repository event as CI. It intentionally
# does not use workflow_run, so it runs in parallel instead of after CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-matrix-parallel-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  SITE_URL: https://flixoai.vercel.app
  CI_SHARD_COUNT: '6'
  CI_MAX_SHARDS: '6'
  CI_RUNNER_RESERVE: '0'
  CI_RUNNER_BUDGET: '18'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  source-build:
    name: Full Matrix — Source Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build certification artifact once
        run: npm run build
      - name: Write immutable build manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/write-build-artifact-manifest.mjs
      - name: Verify static artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Upload Full Matrix source artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  weighted-plan:
    name: Full Matrix — Weighted Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Generate deterministic weighted browser matrix
        id: plan
        env:
          CI_SHARD_COUNT: '6'
          CI_MAX_SHARDS: '6'
          CI_RUNNER_RESERVE: '0'
          CI_RUNNER_BUDGET: '18'
          CI_BROWSERS: chromium,firefox,webkit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/weighted-shard-plan.mjs

  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    needs: [source-build, weighted-plan]
    strategy:
      fail-fast: false
      # All 18 browser/shard jobs are eligible to run at once. GitHub may queue
      # excess jobs only when the account/repository concurrency limit is lower.
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.weighted-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      SITE_URL: https://flixoai.vercel.app
    steps:
      - name: Start precise timing
        id: timing
        shell: bash
        run: echo "started_at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Record runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner=$(hostname)"
            echo "nproc=$(nproc)"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "browser=${{ matrix.browser }}"
            echo "shard=${{ matrix.shard }}/${{ matrix.total_shards }}"
            echo "memory="; free -h
            echo "disk="; df -h .
          } > full-matrix-runner-diagnostics.txt
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
            ${{ runner.os }}-playwright-
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Record cache diagnostics
        shell: bash
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: echo "playwright_cache_hit=${CACHE_HIT:-false}" >> full-matrix-runner-diagnostics.txt
      - name: Download Full Matrix source artifact
        uses: actions/download-artifact@v7
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
      - name: Verify exact artifact commit SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_flixo_build_manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/_flixo_build_manifest.json', 'utf8'));
          if (manifest.sha !== process.env.CERTIFIED_SHA && manifest.commit_sha !== process.env.CERTIFIED_SHA) {
            throw new Error(`Full Matrix artifact SHA mismatch: ${manifest.sha ?? manifest.commit_sha} != ${process.env.CERTIFIED_SHA}`);
          }
          console.log(`Full Matrix artifact SHA verified: ${process.env.CERTIFIED_SHA}`);
          NODE
      - name: Verify required static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Start isolated preview server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/full-matrix-server.log 2>&1 &
          echo $! > /tmp/full-matrix-server.pid
      - name: Wait for readiness and HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/full-matrix-server.log || true
          exit 1
      - name: Run assigned weighted suite set
        id: e2e
        env:
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REUSE_SERVER: 'true'
          S4_EXTERNAL_SERVER: 'true'
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(node --input-type=module -e "for (const suite of JSON.parse(process.env.TESTS_JSON)) console.log(suite)")
          specs=()
          for suite in "${suites[@]}"; do
            if [[ "$suite" == "localization" ]]; then
              specs+=("tests/localization-smoke.spec.ts")
            else
              spec="tests/${suite}.spec.ts"
              test -f "$spec"
              specs+=("$spec")
            fi
          done
          npx playwright test "${specs[@]}" --project=${{ matrix.browser }} --retries=0
      - name: Write shard evidence
        if: ${{ always() }}
        env:
          CERTIFIED_SHA: ${{ github.sha }}
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
          STARTED_AT_MS: ${{ steps.timing.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-matrix-evidence
          END_AT_MS="$(date +%s%3N)"
          node --input-type=module <<'NODE'
          import { writeFileSync, existsSync, readFileSync } from 'node:fs';
          const tests = JSON.parse(process.env.TESTS_JSON);
          const passed = process.env.TEST_OUTCOME === 'success';
          const resultPath = 'playwright-report/results.json';
          const result = existsSync(resultPath) ? JSON.parse(readFileSync(resultPath, 'utf8')) : null;
          const suiteStatuses = [];
          const walk = (suite) => {
            for (const spec of suite?.specs ?? []) {
              const statuses = (spec.tests ?? []).map((test) => (test.results ?? []).map((r) => r.status)).flat();
              suiteStatuses.push({ title: spec.title, file: spec.file, statuses });
            }
            for (const child of suite?.suites ?? []) walk(child);
          };
          for (const suite of result?.suites ?? []) walk(suite);
          const executedSuites = suiteStatuses.length ? [...new Set(suiteStatuses.map((s) => s.file.split('/').pop().replace(/\\.spec\\.(?:ts|js)$/, '')))] : (passed ? tests : []);
          const failedSuites = suiteStatuses.filter((s) => s.statuses.some((status) => ['failed', 'timedOut', 'interrupted'].includes(status))).map((s) => s.title);
          const skippedSuites = suiteStatuses.filter((s) => s.statuses.length && s.statuses.every((status) => status === 'skipped')).map((s) => s.title);
          const record = {
            schema_version: 2,
            sha: process.env.CERTIFIED_SHA,
            browser: '${{ matrix.browser }}',
            shard: ${{ matrix.shard }},
            expected_suites: tests.length,
            executed_suites: executedSuites,
            failed: passed ? 0 : Math.max(1, failedSuites.length),
            skipped: passed ? skippedSuites.length : skippedSuites.length,
            status: process.env.TEST_OUTCOME,
            failed_suites: failedSuites,
            skipped_suites: skippedSuites,
            started_at_ms: Number(process.env.STARTED_AT_MS),
            finished_at_ms: Number(process.env.END_AT_MS || Date.now()),
            duration_ms: Math.max(0, Number(process.env.END_AT_MS || Date.now()) - Number(process.env.STARTED_AT_MS)),
          };
          writeFileSync(`full-matrix-evidence/${record.browser}-shard-${record.shard}.json`, JSON.stringify(record, null, 2));
          NODE
      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-evidence-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.sha }}
          path: full-matrix-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/full-matrix-server.log
            full-matrix-runner-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated preview server
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/full-matrix-server.pid ]; then
            PID="$(cat /tmp/full-matrix-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' )"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ] && kill -0 "$PID" 2>/dev/null; then
              kill -- -"$PGID" 2>/dev/null || true
            fi
          fi

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download all shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: full-matrix-evidence-*
          path: full-matrix-evidence
          merge-multiple: true
      - name: Require evidence files
        shell: bash
        run: |
          set -euo pipefail
          test -d full-matrix-evidence
          compgen -G 'full-matrix-evidence/*.json' >/dev/null
      - name: Validate exact 23 × 3 certification
        env:
          EXACT_SHA: ${{ github.sha }}
          EVIDENCE_ROOT: full-matrix-evidence
        run: node scripts/ci/validate-full-matrix-evidence.mjs
      - name: Write certification summary
        run: |
          {
            echo '## FLIXO Full Matrix Certification'
            echo
            echo "Exact SHA: ${{ github.sha }}"
            echo '23 suites × 3 browsers = 69 suite/browser executions.'
            echo 'Full Matrix ran in parallel with canonical CI.'
            echo '18 browser/shard runners are eligible to execute concurrently.'
          } >> "$GITHUB_STEP_SUMMARY"
