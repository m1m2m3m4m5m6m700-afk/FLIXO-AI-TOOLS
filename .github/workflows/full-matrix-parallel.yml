name: Full Matrix Parallel

# Canonical full certification surface. It runs directly on PR/main events
# and keeps one simple contract: planner -> browser shards -> evidence -> promotion.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-matrix-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  SITE_URL: https://flixoai.vercel.app
  CI_SHARD_COUNT: '6'
  CI_MAX_SHARDS: '6'
  CI_RUNNER_RESERVE: '0'
  CI_RUNNER_BUDGET: '18'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  source-build:
    name: Full Matrix — Source Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build certification artifact once
        run: npm run build
      - name: Write immutable build manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/write-build-artifact-manifest.mjs
      - name: Verify static artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Upload Full Matrix source artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  weighted-plan:
    name: Full Matrix — Weighted Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate deterministic weighted browser matrix
        env:
          CI_SHARD_COUNT: '6'
          CI_MAX_SHARDS: '6'
          CI_RUNNER_RESERVE: '0'
          CI_RUNNER_BUDGET: '18'
          CI_BROWSERS: chromium,firefox,webkit
        shell: bash
        run: node scripts/ci/weighted-shard-plan.mjs

  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    needs: [source-build, weighted-plan]
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.weighted-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
            ${{ runner.os }}-playwright-
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Download Full Matrix source artifact
        uses: actions/download-artifact@v7
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
      - name: Verify exact artifact commit SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_flixo_build_manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/_flixo_build_manifest.json', 'utf8'));
          const certified = process.env.CERTIFIED_SHA;
          if (manifest.sha !== certified && manifest.commit_sha !== certified) {
            throw new Error(`Full Matrix artifact SHA mismatch: ${manifest.sha ?? manifest.commit_sha} != ${certified}`);
          }
          NODE
      - name: Verify required static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Start isolated preview server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/full-matrix-server.log 2>&1 &
          echo $! > /tmp/full-matrix-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/full-matrix-server.log
          exit 1
      - name: Run assigned weighted suite set
        id: e2e
        env:
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REUSE_SERVER: 'true'
          S4_EXTERNAL_SERVER: 'true'
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(node --input-type=module -e "for (const suite of JSON.parse(process.env.TESTS_JSON)) console.log(suite)")
          specs=()
          for suite in "${suites[@]}"; do
            if [[ "$suite" == "localization" ]]; then
              specs+=("tests/localization-smoke.spec.ts")
            else
              spec="tests/${suite}.spec.ts"
              test -f "$spec"
              specs+=("$spec")
            fi
          done
          test "${#specs[@]}" -eq "${#suites[@]}"
          npx playwright test "${specs[@]}" --project=${{ matrix.browser }} --retries=0
      - name: Write shard evidence
        if: ${{ always() }}
        env:
          CERTIFIED_SHA: ${{ github.sha }}
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-matrix-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const tests = JSON.parse(process.env.TESTS_JSON);
          if (!Array.isArray(tests) || tests.length === 0) throw new Error('Shard suite list is empty.');
          const status = process.env.TEST_OUTCOME;
          const passed = status === 'success';
          const record = {
            schema_version: 3,
            sha: process.env.CERTIFIED_SHA,
            browser: '${{ matrix.browser }}',
            shard: ${{ matrix.shard }},
            executed_suites: passed ? tests : [],
            failed: passed ? 0 : 1,
            skipped: 0,
            status,
          };

          writeFileSync(
            `full-matrix-evidence/${record.browser}-shard-${record.shard}.json`,
            JSON.stringify(record, null, 2),
          );
          NODE
      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-evidence-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.sha }}
          path: full-matrix-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/full-matrix-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated preview server
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/full-matrix-server.pid ]; then
            PID="$(cat /tmp/full-matrix-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' )"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ] && kill -0 "$PID" 2>/dev/null; then
              kill -- -"$PGID" 2>/dev/null || true
            fi
          fi

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download all shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: full-matrix-evidence-*
          path: full-matrix-evidence
          merge-multiple: true
      - name: Require evidence files
        shell: bash
        run: |
          set -euo pipefail
          test -d full-matrix-evidence
          count="$(find full-matrix-evidence -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$count" -eq 18
      - name: Validate exact 23 × 3 certification
        env:
          EXACT_SHA: ${{ github.sha }}
          EVIDENCE_ROOT: full-matrix-evidence
        run: node scripts/ci/validate-full-matrix-evidence.mjs
      - name: Write certification summary
        run: |
          {
            echo '## FLIXO Full Matrix Certification'
            echo
            echo "Exact SHA: ${{ github.sha }}"
            echo '23 suites × 3 browsers = 69 suite/browser executions.'
            echo 'Canonical suite IDs come directly from ci/test-duration-history.json.'
            echo 'All 18 browser/shard evidence records passed exact-SHA validation.'
          } >> "$GITHUB_STEP_SUMMARY"
