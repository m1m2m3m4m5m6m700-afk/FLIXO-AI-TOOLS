name: Full Matrix Parallel

# Full public-route × canonical-locale × browser verification is a deep/release gate.
# PR fast path is owned by Matrix First Certification and targeted impact verification.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-matrix-parallel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  prepare:
    name: Prepare Full Matrix Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build production preview once
        run: npm run build
      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          git rev-parse HEAD > dist/full-matrix-head-sha.txt
          sha256sum package-lock.json > dist/full-matrix-package-lock.sha256
      - name: Upload immutable preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  matrix:
    name: Full Matrix — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      S4_EXTERNAL_SERVER: 'true'
      PLAYWRIGHT_SERVER: preview
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed dependency graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable preview artifact
        uses: actions/download-artifact@v6
        with:
          name: full-matrix-preview-${{ github.sha }}
          path: dist
      - name: Verify artifact identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat dist/full-matrix-head-sha.txt)" = "$EXPECTED_SHA"
          sha256sum -c dist/full-matrix-package-lock.sha256
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-full-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          executable="$(node - <<'NODE'
          const p = require('playwright');
          const b = p[process.env.BROWSER];
          process.stdout.write(b.executablePath());
          NODE
          )"
          if [[ -x "$executable" ]]; then
            echo "Playwright browser cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install '${{ matrix.browser }}'
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/full-matrix-server.log 2>&1 &
          echo $! >/tmp/full-matrix-server.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/full-matrix-server.log || true
          exit 1
      - name: Verify all public routes × all canonical locales
        timeout-minutes: 15
        run: npx playwright test tests/localization-runtime.spec.ts --project=${{ matrix.browser }} --workers=6 --retries=0 --max-failures=1 --shard=${{ matrix.shard }}/3
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/full-matrix-server.pid ]; then kill "$(cat /tmp/full-matrix-server.pid)" 2>/dev/null || true; fi
      - name: Upload matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/full-matrix-server.log
          if-no-files-found: warn
          retention-days: 14

  certification:
    name: Full Matrix Parallel Certification
    needs: [matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser/shard job to pass
        run: |
          set -euo pipefail
          result='${{ needs.matrix.result }}'
          test "$result" = success
          echo 'Full Matrix Parallel PASS: complete public-route × canonical-locale coverage across Chromium, Firefox, and WebKit.'
