name: Full Matrix Parallel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  source_build:
    name: Full Matrix Source Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Write immutable build manifest
        run: node scripts/ci/write-build-artifact-manifest.mjs
      - name: Publish immutable source artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  weighted_plan:
    name: Full Matrix Weighted Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Build weighted shard plan
        id: plan
        env:
          CI_SHARD_COUNT: 6
          CI_MAX_SHARDS: 18
          CI_RUNNER_BUDGET: 8
          CI_RUNNER_RESERVE: 2
          CI_BROWSERS: chromium,firefox,webkit
        run: node scripts/ci/weighted-shard-plan.mjs

  matrix:
    name: Full Matrix — ${{ matrix.browser }} / shard-${{ matrix.shard }}
    needs: [source_build, weighted_plan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.weighted_plan.outputs.matrix) }}
    env:
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      S4_EXTERNAL_SERVER: 'true'
      PLAYWRIGHT_SERVER: preview
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable source artifact
        uses: actions/download-artifact@v7
        with:
          name: full-matrix-source-${{ github.sha }}
          path: dist
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps '${{ matrix.browser }}'
      - name: Install browser
        timeout-minutes: 8
        run: npx playwright install '${{ matrix.browser }}'
      - name: Resolve and run shard
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_flixo_build_manifest.json
          for test_file in ${{ join(matrix.tests, ' ') }}; do
            test -f "tests/${test_file}.spec.ts"
          done
          specs=()
          for test_file in ${{ join(matrix.tests, ' ') }}; do specs+=("tests/${test_file}.spec.ts"); done
          npx playwright test "${specs[@]}" \
            --project=${{ matrix.browser }} \
            --workers=6 \
            --retries=0 \
            --max-failures=1
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.browser }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            dist/_flixo_build_manifest.json
          if-no-files-found: warn
          retention-days: 14

  certification:
    name: Full Matrix Certification
    needs: [matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on incomplete or failed matrix
        run: |
          set -euo pipefail
          result='${{ needs.matrix.result }}'
          echo "matrix=$result"
          test "$result" = success || {
            echo "Full Matrix certification failed: one or more browser/shard units did not pass."
            exit 1
          }
          echo 'Full Matrix Certification PASS: all planned browser/shard units passed.'
