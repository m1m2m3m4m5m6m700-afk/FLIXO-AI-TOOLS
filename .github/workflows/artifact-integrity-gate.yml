name: G3 Universal Artifact Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact-integrity:
    name: G3 Artifact Integrity Matrix
    runs-on: ubuntu-latest
    env:
      CI: true
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Universal artifact integrity matrix
        run: node --experimental-strip-types scripts/test-output-integrity.mjs

      - name: Existing SVG integrity contract
        run: node --experimental-strip-types scripts/test-svg-integrity.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Artifact download integration
        run: npx playwright test tests/image-converter.spec.ts --project=chromium
