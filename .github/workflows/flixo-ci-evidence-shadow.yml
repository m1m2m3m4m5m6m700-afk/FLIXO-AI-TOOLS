name: FLIXO CI — Evidence Ledger Shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-ci-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence-shadow:
    name: CI Evidence Ledger Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/ci/evidence
          npx tsc --noEmit --pretty false 2>&1 | tee artifacts/ci/evidence/typescript.log
      - name: Record TypeScript gate evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/evidence
          printf '%s\n' '{"gate":"typescript","outcome":"${{ steps.typecheck.outcome }}","headSha":"${{ github.event.pull_request.head.sha || github.sha }}"}' > artifacts/ci/evidence/typescript.json
      - name: Evidence ledger semantics
        if: steps.typecheck.outcome == 'success'
        run: node --experimental-strip-types scripts/ci/evidence/ledger.test.mjs
      - name: Evidence ledger self-test
        if: steps.typecheck.outcome == 'success'
        run: node --experimental-strip-types scripts/ci/evidence/self-test.mjs
      - name: Verify evidence output
        if: steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/ci/evidence/manifest.json
          test "$(find artifacts/ci/evidence -name '*.json' | wc -l)" -ge 2
      - name: Upload evidence ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-evidence-ledger-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ci/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce TypeScript gate
        if: always()
        run: test "${{ steps.typecheck.outcome }}" = success
