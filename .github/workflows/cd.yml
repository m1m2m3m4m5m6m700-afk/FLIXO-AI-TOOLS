name: FLIXO Continuous Delivery

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: flixo-cd-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

env:
  FLIXO_PRODUCTION_ORIGIN: https://flixoai.vercel.app

jobs:
  promote:
    name: Promote exact certified SHA after merge to main
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.merge_commit_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.FLIXO_PRODUCTION_ORIGIN }}
    steps:
      - name: Resolve merged main SHA
        id: sha
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          sha="$MERGE_SHA"
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 1

      - name: Prove promotion SHA is current main
        id: guard
        shell: bash
        env:
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          git fetch --no-tags --depth=1 origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"

          if [ "$head_sha" = "$PROMOTION_SHA" ] && [ "$main_sha" = "$PROMOTION_SHA" ]; then
            echo "Exact promotion SHA is current main: $PROMOTION_SHA"
            printf 'skip_deploy=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reason="PROMOTION_SHA_NOT_CURRENT_MAIN"
          if [ "$head_sha" != "$PROMOTION_SHA" ]; then
            reason="CHECKOUT_SHA_MISMATCH"
          elif [ "$main_sha" != "$PROMOTION_SHA" ]; then
            reason="STALE_PROMOTION_SHA"
          fi

          jq -n \
            --arg status "SKIPPED_STALE_SHA" \
            --arg sha "$PROMOTION_SHA" \
            --arg currentMain "$main_sha" \
            --arg checkedOut "$head_sha" \
            --arg reason "$reason" \
            --arg origin "$FLIXO_PRODUCTION_ORIGIN" \
            '{status:$status,sha:$sha,currentMain:$currentMain,checkedOut:$checkedOut,reason:$reason,origin:$origin,stage:"CURRENT_MAIN_GUARD"}' \
            > production-deployment-evidence.json

          echo "Merged-main promotion rejected: $reason"
          printf 'skip_deploy=false\n' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Resolve certified CI run by exact SHA
        id: ci
        if: steps.guard.outputs.skip_deploy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -u
          evidence=production-deployment-evidence.json
          run_id=''
          resolution=''

          runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PROMOTION_SHA}&event=push&per_page=20")" || runs='{}'
            run_id="$(jq -r '[.workflow_runs[] | select(.head_sha == env.PROMOTION_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success")] | sort_by(.id) | last.id // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              resolution=MANUAL_EXACT_SHA_CI_RUN
            else
              resolution=NO_CERTIFIED_CI_RUN_FOR_SHA
            fi

          if [ -n "$run_id" ]; then
            echo "Certified CI run: $run_id ($resolution)"
            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n \
            --arg status FAIL \
            --arg sha "$PROMOTION_SHA" \
            --arg reason "$resolution" \
            --arg origin "$FLIXO_PRODUCTION_ORIGIN" \
            '{status:$status,sha:$sha,reason:$reason,origin:$origin,stage:"CI_CERTIFICATION"}' \
            > "$evidence"
          echo "Certified CI resolution failed: $resolution"
          exit 1

      - name: Download certified build artifact
        if: steps.guard.outputs.skip_deploy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.ci.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          gh run download "$SOURCE_RUN_ID" -n "flixo-build-${SOURCE_RUN_ID}" -D /tmp/artifact
          test "$(cat /tmp/artifact/flixo-head-sha.txt)" = "$PROMOTION_SHA"
          test -s /tmp/artifact/__flixo/build-identity.json
          test -s /tmp/artifact/__flixo/artifact-hash.txt
          test "$(jq -r '.schemaVersion' /tmp/artifact/__flixo/build-identity.json)" = "2"
          test "$(jq -r '.producer' /tmp/artifact/__flixo/build-identity.json)" = "scripts/ci/runtime/build-identity.mjs"
          test "$(jq -r '.commitSha' /tmp/artifact/__flixo/build-identity.json)" = "$PROMOTION_SHA"
          test "$(jq -r '.artifactHash' /tmp/artifact/__flixo/build-identity.json)" = "$(cat /tmp/artifact/__flixo/artifact-hash.txt)"

      - name: Deploy immutable build to Vercel
        id: deploy
        if: steps.guard.outputs.skip_deploy != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LgeIYyf9ERfG3gNswQO4MiPX
          VERCEL_PROJECT_ID: prj_FdFbUWMAZepEfvwhttAiLcYJqY0d
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "team_LgeIYyf9ERfG3gNswQO4MiPX"
          test "$VERCEL_PROJECT_ID" = "prj_FdFbUWMAZepEfvwhttAiLcYJqY0d"
          deploy_log=/tmp/vercel-deploy.log
          if npx --yes vercel@59.16.0 deploy /tmp/artifact --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes 2>&1 | tee "$deploy_log"; then
            deployment_url="$(grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' "$deploy_log" | tail -1 || true)"
            printf 'deployment_attempt=SUCCESS\n' >> "$GITHUB_OUTPUT"
            printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
            printf 'external_blocker=NONE\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deployment_attempt=BLOCKED_OR_FAILED\n' >> "$GITHUB_OUTPUT"
            printf 'deployment_url=\n' >> "$GITHUB_OUTPUT"
            if grep -q 'api-deployments-free-per-day' "$deploy_log"; then
              printf 'external_blocker=VERCEL_DEPLOYMENT_QUOTA\n' >> "$GITHUB_OUTPUT"
            else
              printf 'external_blocker=UNKNOWN\n' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Production identity proof
        if: steps.guard.outputs.skip_deploy != 'true'
        env:
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          PRODUCTION_ORIGIN: ${{ env.FLIXO_PRODUCTION_ORIGIN }}
          DEPLOYMENT_ATTEMPT: ${{ steps.deploy.outputs.deployment_attempt }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXTERNAL_BLOCKER: ${{ steps.deploy.outputs.external_blocker }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LgeIYyf9ERfG3gNswQO4MiPX
        shell: bash
        run: |
          set -u
          evidence=production-deployment-evidence.json
          deployment_probe_sha=''
          deployment_probe_status=NOT_EXECUTED
          canonical_sha=''
          canonical_html=FAIL
          admin_html=FAIL
          status=FAIL
          reason=UNKNOWN

          probe_sha() {
            local url="$1"
            local observed=''
            deployment_probe_status=FAIL
            observed="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "$url" | tr -d '\r\n')" || true
            if [ "$observed" = "$PROMOTION_SHA" ]; then
              deployment_probe_sha="$observed"
              deployment_probe_status=PASS
              return 0
            fi
            if [ -n "$VERCEL_TOKEN" ]; then
              observed="$(npx --yes vercel@59.16.0 curl "$url" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>/dev/null | tr -d '\r\n')" || true
            fi
            deployment_probe_sha="$observed"
            if [ "$observed" = "$PROMOTION_SHA" ]; then deployment_probe_status=PASS; return 0; fi
            return 1
          }

          if [ -n "$DEPLOYMENT_URL" ]; then probe_sha "$DEPLOYMENT_URL/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA" || true; fi

          if curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/production.html "$PRODUCTION_ORIGIN/?__flixo_sha=$PROMOTION_SHA" && test -s /tmp/production.html && grep -qi '<html' /tmp/production.html; then
            canonical_html=PASS
          elif [ -n "$VERCEL_TOKEN" ] && npx --yes vercel@59.16.0 curl "$PRODUCTION_ORIGIN/?__flixo_sha=$PROMOTION_SHA" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" > /tmp/production.html 2>/dev/null && test -s /tmp/production.html && grep -qi '<html' /tmp/production.html; then
            canonical_html=PASS
          fi

          if curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/admin.html "$PRODUCTION_ORIGIN/admin?__flixo_sha=$PROMOTION_SHA" && test -s /tmp/admin.html && grep -qi '<html' /tmp/admin.html; then
            admin_html=PASS
          elif [ -n "$VERCEL_TOKEN" ] && npx --yes vercel@59.16.0 curl "$PRODUCTION_ORIGIN/admin?__flixo_sha=$PROMOTION_SHA" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" > /tmp/admin.html 2>/dev/null && test -s /tmp/admin.html && grep -qi '<html' /tmp/admin.html; then
            admin_html=PASS
          fi

          canonical_sha="$(curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA" | tr -d '\r\n')" || true
          if [ "$canonical_sha" != "$PROMOTION_SHA" ] && [ -n "$VERCEL_TOKEN" ]; then
            canonical_sha="$(npx --yes vercel@59.16.0 curl "$PRODUCTION_ORIGIN/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>/dev/null | tr -d '\r\n')" || true
          fi

          if [ "$canonical_sha" = "$PROMOTION_SHA" ] && [ "$canonical_html" = PASS ] && [ "$admin_html" = PASS ]; then
            status=PASS; reason=EXACT_PRODUCTION_IDENTITY_AND_ADMIN_ROUTE
          elif [ "$EXTERNAL_BLOCKER" = "VERCEL_DEPLOYMENT_QUOTA" ]; then
            status=BLOCKED_EXTERNAL; reason=VERCEL_DEPLOYMENT_QUOTA
          elif [ "$admin_html" != PASS ]; then
            reason=ADMIN_ROUTE_UNPROVEN
          elif [ -n "$DEPLOYMENT_URL" ] && [ "$deployment_probe_status" != PASS ]; then
            reason=CANONICAL_ALIAS_UNPROVEN
          elif [ -z "$DEPLOYMENT_URL" ]; then
            reason=DEPLOYMENT_URL_MISSING
          else
            reason=CANONICAL_ALIAS_MISMATCH
          fi

          jq -n --arg status "$status" --arg sha "$PROMOTION_SHA" --arg deploymentSha "$deployment_probe_sha" --arg deploymentProbeStatus "$deployment_probe_status" --arg canonicalSha "$canonical_sha" --arg origin "$PRODUCTION_ORIGIN" --arg deploymentUrl "${DEPLOYMENT_URL:-}" --arg deploymentAttempt "${DEPLOYMENT_ATTEMPT:-}" --arg externalBlocker "${EXTERNAL_BLOCKER:-}" --arg canonicalHtml "$canonical_html" --arg adminHtml "$admin_html" --arg reason "$reason" '{status:$status,sha:$sha,deploymentSha:$deploymentSha,deploymentProbeStatus:$deploymentProbeStatus,canonicalSha:$canonicalSha,origin:$origin,deploymentUrl:$deploymentUrl,deploymentAttempt:$deploymentAttempt,externalBlocker:$externalBlocker,canonicalHtml:$canonicalHtml,adminHtml:$adminHtml,reason:$reason}' > "$evidence"

          if [ "$status" = BLOCKED_EXTERNAL ]; then exit 0; fi
          if [ "$status" != PASS ]; then echo "Production identity proof failed: $reason"; exit 1; fi

      - name: Write skipped deployment evidence
        if: always() && steps.guard.outputs.skip_deploy == 'true'
        shell: bash
        run: |
          test -s production-deployment-evidence.json

      - name: Run Phase 2 Release Integrity Agent
        if: steps.guard.outputs.skip_deploy != 'true'
        env:
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2-release.json
          FLIXO_PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          FLIXO_MAIN_SHA: ${{ steps.sha.outputs.sha }}
          FLIXO_CI_CONCLUSION: success
          FLIXO_DEPLOYMENT_EVIDENCE_PATH: production-deployment-evidence.json
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/ci/auto-repair/ai-phase2.mjs --release
          STATUS="$(jq -r '.releaseIntegrity.status' /tmp/flixo-ai-phase2-release.json)"
          case "$STATUS" in
            PASS|BLOCKED_EXTERNAL) ;;
            *) echo "Release Integrity Agent blocked promotion: $STATUS"; exit 1 ;;
          esac

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-cd-evidence-${{ steps.sha.outputs.sha }}
          path: production-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30