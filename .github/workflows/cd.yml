name: FLIXO Continuous Delivery

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact main commit SHA to promote"
        required: true
        type: string

concurrency:
  group: flixo-cd-${{ github.event.workflow_run.head_sha || inputs.sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

env:
  FLIXO_PRODUCTION_ORIGIN: https://flixoai.vercel.app

jobs:
  promote:
    name: Promote exact certified SHA
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.FLIXO_PRODUCTION_ORIGIN }}
    steps:
      - name: Resolve promotion SHA
        id: sha
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${MANUAL_SHA:-$EVENT_SHA}"
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 1

      - name: Prove promotion SHA is current main
        shell: bash
        env:
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$PROMOTION_SHA"
          test "$(git rev-parse origin/main)" = "$PROMOTION_SHA"

      - name: Verify canonical CI conclusion
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PROMOTION_SHA}&event=push&per_page=20")"
          count="$(jq '[.workflow_runs[] | select(.head_sha == env.PROMOTION_SHA and .head_branch == "main" and .conclusion == "success")] | length' <<<"$run_json")"
          test "$count" -ge 1

      - name: Download certified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$SOURCE_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PROMOTION_SHA}&event=push&per_page=20" \
              | jq -r '[.workflow_runs[] | select(.head_sha == env.PROMOTION_SHA and .head_branch == "main" and .conclusion == "success")] | sort_by(.id) | last.id')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p /tmp/artifact
          gh run download "$run_id" -n "flixo-build-${run_id}" -D /tmp/artifact
          test "$(cat /tmp/artifact/flixo-head-sha.txt)" = "$PROMOTION_SHA"

      - name: Deploy immutable build to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LgeIYyf9ERfG3gNswQO4MiPX
          VERCEL_PROJECT_ID: prj_FdFbUWMAZepEfvwhttAiLcYJqY0d
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "team_LgeIYyf9ERfG3gNswQO4MiPX"
          test "$VERCEL_PROJECT_ID" = "prj_FdFbUWMAZepEfvwhttAiLcYJqY0d"
          deploy_log=/tmp/vercel-deploy.log
          if npx --yes vercel@59.16.0 deploy /tmp/artifact --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes 2>&1 | tee "$deploy_log"; then
            deployment_url="$(grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' "$deploy_log" | tail -1 || true)"
            printf 'deployment_attempt=SUCCESS\n' >> "$GITHUB_OUTPUT"
            printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          else
            printf 'deployment_attempt=BLOCKED_OR_FAILED\n' >> "$GITHUB_OUTPUT"
            printf 'deployment_url=\n' >> "$GITHUB_OUTPUT"
            echo 'Vercel deployment attempt did not complete; production identity proof remains authoritative.'
          fi

      - name: Production identity proof
        env:
          PROMOTION_SHA: ${{ steps.sha.outputs.sha }}
          PRODUCTION_ORIGIN: ${{ env.FLIXO_PRODUCTION_ORIGIN }}
          DEPLOYMENT_ATTEMPT: ${{ steps.deploy.outputs.deployment_attempt }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LgeIYyf9ERfG3gNswQO4MiPX
        shell: bash
        run: |
          set -u
          evidence=production-deployment-evidence.json
          direct_sha=''
          canonical_sha=''
          canonical_html=FAIL
          status=FAIL
          reason=UNKNOWN

          probe_sha() {
            local url="$1"
            direct_sha="$(curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$url" | tr -d '\r\n')" || true

            if [ "$direct_sha" = "$PROMOTION_SHA" ]; then
              return 0
            fi

            if [ -n "$VERCEL_TOKEN" ]; then
              direct_sha="$(npx --yes vercel@59.16.0 curl "$url" \
                --token="$VERCEL_TOKEN" \
                --scope="$VERCEL_ORG_ID" \
                2>/dev/null | tr -d '\r\n')" || true
            fi

            [ "$direct_sha" = "$PROMOTION_SHA" ]
          }

          if [ -z "$DEPLOYMENT_URL" ]; then
            reason=DEPLOYMENT_URL_MISSING
          else
            if probe_sha "$DEPLOYMENT_URL/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA"; then
              if curl --fail --silent --show-error --location \
                --retry 10 --retry-delay 5 --retry-all-errors \
                --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/production.html \
                "$PRODUCTION_ORIGIN/?__flixo_sha=$PROMOTION_SHA" &&
                 test -s /tmp/production.html &&
                 grep -qi '<html' /tmp/production.html; then
                canonical_html=PASS
              elif [ -n "$VERCEL_TOKEN" ] && \
                   npx --yes vercel@59.16.0 curl "$PRODUCTION_ORIGIN/?__flixo_sha=$PROMOTION_SHA" \
                     --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" > /tmp/production.html 2>/dev/null &&
                   test -s /tmp/production.html &&
                   grep -qi '<html' /tmp/production.html; then
                canonical_html=PASS
              fi

              canonical_sha="$(curl --fail --silent --show-error --location \
                --retry 10 --retry-delay 5 --retry-all-errors \
                --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$PRODUCTION_ORIGIN/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA" \
                | tr -d '\r\n')" || true

              if [ "$canonical_sha" != "$PROMOTION_SHA" ] && [ -n "$VERCEL_TOKEN" ]; then
                canonical_sha="$(npx --yes vercel@59.16.0 curl \
                  "$PRODUCTION_ORIGIN/flixo-head-sha.txt?__flixo_sha=$PROMOTION_SHA" \
                  --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" \
                  2>/dev/null | tr -d '\r\n')" || true
              fi

              if [ "$canonical_sha" = "$PROMOTION_SHA" ] && [ "$canonical_html" = PASS ]; then
                status=PASS
                reason=EXACT_PRODUCTION_IDENTITY
              else
                reason=CANONICAL_ALIAS_MISMATCH
              fi
            else
              reason=DEPLOYMENT_IDENTITY_MISMATCH
            fi
          fi

          printf '%s\n' \
            '{"status":"'"$status"'","sha":"'"$PROMOTION_SHA"'","deploymentSha":"'"$direct_sha"'","canonicalSha":"'"$canonical_sha"'","origin":"'"$PRODUCTION_ORIGIN"'","deploymentUrl":"'"$DEPLOYMENT_URL"'","deploymentAttempt":"'"$DEPLOYMENT_ATTEMPT"'","canonicalHtml":"'"$canonical_html"'","reason":"'"$reason"'"}' \
            > "$evidence"

          if [ "$status" != PASS ]; then
            echo "Production identity proof failed: $reason"
            exit 1
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-cd-evidence-${{ steps.sha.outputs.sha }}
          path: production-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
