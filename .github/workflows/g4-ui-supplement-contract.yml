name: G4 UI Supplement Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/lib/i18n/**'
      - 'tests/tool-ui-runtime-supplement.mjs'
      - '.github/workflows/g4-ui-supplement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/lib/i18n/**'
      - 'tests/tool-ui-runtime-supplement.mjs'
      - '.github/workflows/g4-ui-supplement-contract.yml'

permissions:
  contents: read

jobs:
  supplement-contract:
    name: G4 Localization Architecture Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate declarative localization architecture
        run: node tests/tool-ui-runtime-supplement.mjs
