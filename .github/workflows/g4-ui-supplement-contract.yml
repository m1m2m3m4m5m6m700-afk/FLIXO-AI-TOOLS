name: G4 UI Supplement Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/i18n/tool-ui-runtime-supplement.ts'
      - 'tests/tool-ui-runtime-supplement.mjs'
      - '.github/workflows/g4-ui-supplement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/i18n/tool-ui-runtime-supplement.ts'
      - 'tests/tool-ui-runtime-supplement.mjs'
      - '.github/workflows/g4-ui-supplement-contract.yml'

permissions:
  contents: read

jobs:
  supplement-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate supplement source
        run: node --check src/lib/i18n/tool-ui-runtime-supplement.ts
      - name: Validate representative mappings
        run: node tests/tool-ui-runtime-supplement.mjs
