name: FLIXO — Ultra Recovery Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - ci/g3-012-legacy-push-parity
      - recovery/legacy-fixes-20260831
      - recovery/final-g4-contracts-20260831

permissions:
  contents: read

concurrency:
  group: ultra-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  self-test:
    name: Ultra — Contract Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run Ultra contract tests
        run: node --experimental-strip-types --test scripts/ci/ultra-investigate.test.mjs

  investigate:
    name: Ultra — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        suite: [toolchain, architecture, localization, seo, security, artifact, runtime, browser, build]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browsers
        if: matrix.suite == 'runtime' || matrix.suite == 'browser'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ultra-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: matrix.suite == 'runtime' || matrix.suite == 'browser'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          executable="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          if [[ -x "$executable" ]]; then
            echo "Playwright Chromium cache hit: $executable"
            exit 0
          fi
          timeout --preserve-status 420s npx playwright install chromium
      - name: Verify Chromium executable
        if: matrix.suite == 'runtime' || matrix.suite == 'browser'
        run: |
          set -euo pipefail
          executable="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$executable"
      - name: Run Ultra investigator suite
        env:
          INVESTIGATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INVESTIGATION_SUITE: ${{ matrix.suite }}
        run: node --experimental-strip-types scripts/ci/ultra-investigate.mjs --suite "$INVESTIGATION_SUITE"
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ultra-investigation-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostics/investigation/${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Ultra — Fail-Closed Aggregate
    needs: [investigate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download exact-run suite evidence
        uses: actions/download-artifact@v6
        with:
          pattern: ultra-investigation-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostics/investigation
          merge-multiple: true
      - name: Aggregate evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/ci/ultra-investigate-aggregate.mjs
      - name: Guard official evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/ultra-investigate-guard.mjs diagnostics/investigation/aggregate.json
      - name: Validate against shared Evidence Ledger
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_ROOT: ci-evidence
        run: node scripts/ci/evidence-ledger.mjs
      - name: Upload aggregate and ledger evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ultra-investigation-aggregate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            diagnostics/investigation/aggregate.json
            ci-evidence/ultra-recovery.json
          if-no-files-found: error
          retention-days: 30

  official-gate:
    name: Ultra Recovery Gate — OFFICIAL
    needs: [self-test, investigate, aggregate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download official aggregate and ledger
        uses: actions/download-artifact@v6
        with:
          name: ultra-investigation-aggregate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Require complete official Ultra evidence
        env:
          SELF_TEST_RESULT: ${{ needs.self-test.result }}
          INVESTIGATE_RESULT: ${{ needs.investigate.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_ROOT: ci-evidence
        run: |
          set -euo pipefail
          test "$SELF_TEST_RESULT" = success || { echo "self-test=$SELF_TEST_RESULT"; exit 1; }
          test "$INVESTIGATE_RESULT" = success || { echo "investigate=$INVESTIGATE_RESULT"; exit 1; }
          test "$AGGREGATE_RESULT" = success || { echo "aggregate=$AGGREGATE_RESULT"; exit 1; }
          node scripts/ci/ultra-investigate-guard.mjs diagnostics/investigation/aggregate.json
          node scripts/ci/evidence-ledger.mjs
          echo "ULTRA OFFICIAL GATE PASS: exact-head, complete nine-suite evidence, zero failures, zero root causes, zero unknowns, shared ledger PASS."
