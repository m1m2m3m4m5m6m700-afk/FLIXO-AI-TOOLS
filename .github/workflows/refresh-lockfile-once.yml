name: One-time lockfile refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: hashFiles('diagnostics/.lock-refresh-trigger') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile and remove one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
          else
            git add package-lock.json
          fi
          rm -f diagnostics/.lock-refresh-trigger .github/workflows/refresh-lockfile-once.yml
          git add -u .github/workflows/refresh-lockfile-once.yml diagnostics/.lock-refresh-trigger
          if git diff --cached --quiet; then
            echo 'No lockfile or cleanup changes required.'
            exit 0
          fi
          git commit -m 'fix(deps): synchronize lockfile after dependency cleanup'
          git push origin HEAD:main
