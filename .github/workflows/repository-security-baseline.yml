name: Repository Security Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/repository-security-baseline.mjs'
      - 'docs/security.md'
      - '.github/CODEOWNERS'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/repository-security-baseline.mjs'
      - 'docs/security.md'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes stale security-baseline evidence for the same PR/branch.
# The active run still validates its exact SHA.
concurrency:
  group: repository-security-baseline-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Workflow trust baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run repository security baseline
        run: node scripts/ci/repository-security-baseline.mjs
