name: FLIXO Agent Repair Supervisor

on:
  push:
    branches:
      - execution
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: flixo-agent-repair-supervisor
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: read

jobs:
  supervise:
    name: Monitor current branch heads until GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Monitor main and execution continuously
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 1500 ))
          REQUIRED='FLIXO Test System|FLIXO WP0 Trust Baseline|FLIXO Test Impact|FLIXO Test Impact Execution|FLIXO Continuous Delivery|Repository Security Baseline|Claude Security Review|Daily·FLIXO Green Gate'

          get_with_backoff() {
            local attempt=0
            local delay=15
            local output
            local error_file
            error_file="$(mktemp)"
            while [ "$attempt" -lt 4 ]; do
              if output="$(gh "$@" 2>"$error_file")"; then
                rm -f "$error_file"
                printf '%s' "$output"
                return 0
              fi
              if grep -Eqi 'rate limit|HTTP 403|API rate limit exceeded|secondary rate limit' "$error_file"; then
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 4 ]; then
                  cat "$error_file" >&2
                  rm -f "$error_file"
                  return 75
                fi
                echo "GITHUB_API_RATE_LIMIT_BACKOFF attempt=$attempt sleep=${delay}s" >&2
                sleep "$delay"
                delay=$((delay * 2))
                continue
              fi
              cat "$error_file" >&2
              rm -f "$error_file"
              return 1
            done
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ALL_GREEN=true

            BRANCH_DATA="$(get_with_backoff api "repos/$GITHUB_REPOSITORY/branches?per_page=100")" || {
              rc=$?
              if [ "$rc" -eq 75 ]; then
                echo 'SUPERVISOR_BLOCKED_EXTERNAL=GITHUB_API_RATE_LIMIT'
              fi
              exit "$rc"
            }

            RUNS_CACHE_MAIN="$(get_with_backoff run list --repo "$GITHUB_REPOSITORY" --branch main --limit 100 --json databaseId,name,status,conclusion,headSha,createdAt)" || {
              rc=$?
              if [ "$rc" -eq 75 ]; then
                echo 'SUPERVISOR_BLOCKED_EXTERNAL=GITHUB_API_RATE_LIMIT'
              fi
              exit "$rc"
            }
            RUNS_CACHE_EXECUTION="$(get_with_backoff run list --repo "$GITHUB_REPOSITORY" --branch execution --limit 100 --json databaseId,name,status,conclusion,headSha,createdAt)" || {
              rc=$?
              if [ "$rc" -eq 75 ]; then
                echo 'SUPERVISOR_BLOCKED_EXTERNAL=GITHUB_API_RATE_LIMIT'
              fi
              exit "$rc"
            }

            for BRANCH in main execution; do
              SHA="$(printf '%s' "$BRANCH_DATA" | jq -r --arg branch "$BRANCH" '.[] | select(.name == $branch) | .commit.sha')"
              test -n "$SHA" && test "$SHA" != "null"

              if [ "$BRANCH" = "main" ]; then
                RUNS="$RUNS_CACHE_MAIN"
              else
                RUNS="$RUNS_CACHE_EXECUTION"
              fi

              GREEN="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" 'map(select(.headSha == $sha and .name == "Daily·FLIXO Green Gate" and .conclusion == "success")) | sort_by(.createdAt) | last.databaseId // empty')"
              FAILED="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" --arg names "$REQUIRED" 'map(select(.headSha == $sha and (.name as $n | ($names | split("|") | index($n) != null)))) | map(select(.conclusion == "failure" or .conclusion == "timed_out")) | sort_by(.createdAt) | last.databaseId // empty')"

              if [ -n "$GREEN" ]; then
                echo "GREEN branch=$BRANCH sha=$SHA run=$GREEN"
                continue
              fi

              ALL_GREEN=false
              if [ -n "$FAILED" ]; then
                echo "RED_OBSERVED branch=$BRANCH sha=$SHA run=$FAILED repair_owner=Daily·FLIXO Green Gate"
              else
                echo "WAITING_FOR_GREEN branch=$BRANCH sha=$SHA"
              fi
            done

            if [ "$ALL_GREEN" = true ]; then
              echo 'SUPERVISOR_TERMINAL=GREEN'
              echo 'status=green' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 90
          done

          echo 'SUPERVISOR_WINDOW_EXHAUSTED_NON_GREEN'
          echo 'status=continue' >> "$GITHUB_OUTPUT"
      - name: Record terminal state
        if: always()
        run: |
          set -euo pipefail
          RESULT="${{ steps.observe.outputs.status || 'unknown' }}"
          echo "SUPERVISOR_RESULT=$RESULT"
          if [ "$RESULT" = 'green' ]; then
            echo 'SUPERVISOR_TERMINAL=GREEN'
            exit 0
          fi
          echo 'SUPERVISOR_TERMINAL=NON_GREEN_OR_EXTERNAL_BLOCK'
          exit 1
