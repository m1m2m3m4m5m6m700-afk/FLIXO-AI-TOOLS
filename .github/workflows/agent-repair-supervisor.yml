name: FLIXO Agent Repair Supervisor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: flixo-agent-repair-supervisor-observer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: read

jobs:
  supervise:
    name: Observe current branch heads and report RED until GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load and validate central Council directive
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce Council directive
        run: node scripts/ci/test-council-directive.mjs

      - name: Establish Council oversight contract
        run: |
          set -euo pipefail
          node scripts/ci/test-council-directive.mjs
          node scripts/ci/test-repair-control-plane.mjs
          node scripts/ci/test-repair-lease.mjs
          node scripts/ci/agent-liveness-protocol.mjs validate
          node scripts/ci/test-agent-liveness-protocol.mjs
          echo 'COUNCIL_OVERSIGHT_CONTRACT=PASS'
          echo 'COUNCIL_ROLE=SUPERVISOR'
          echo 'COUNCIL_AUTHORITY=OBSERVE_COORDINATE_HANDOFF_ONLY'
          echo 'COUNCIL_GREEN_AUTHORITY=Daily·FLIXO Green Gate'

      - name: Observe main and execution without dispatch authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED='FLIXO Test System|FLIXO WP0 Trust Baseline|FLIXO Test Impact|FLIXO Test Impact Execution|FLIXO Continuous Delivery|Repository Security Baseline|Claude Security Review|Daily·FLIXO Green Gate'
          for BRANCH in main execution; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --commit "$SHA" --limit 100 --json databaseId,name,status,conclusion,headSha,createdAt)"
            GREEN="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" 'map(select(.headSha == $sha and .name == "Daily·FLIXO Green Gate" and .conclusion == "success")) | sort_by(.createdAt) | last.databaseId // empty')"
            FAILED="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" --arg names "$REQUIRED" 'map(select(.headSha == $sha and (.name as $n | ($names | split("|") | index($n) != null)))) | map(select(.conclusion == "failure" or .conclusion == "timed_out")) | sort_by(.createdAt) | last.databaseId // empty')"
            if [ -n "$GREEN" ]; then
              echo "GREEN branch=$BRANCH sha=$SHA verification_run=$GREEN"
            elif [ -n "$FAILED" ]; then
              echo "RED_OBSERVED branch=$BRANCH sha=$SHA run=$FAILED"
              echo "COUNCIL_DECISION=ESCALATE_TO_CANONICAL_REPAIR_GATE"
              echo "DISPATCH_AUTHORITY=CANONICAL_REPAIR_GATE_ONLY"
            else
              echo "WAITING branch=$BRANCH sha=$SHA"
            fi
          done