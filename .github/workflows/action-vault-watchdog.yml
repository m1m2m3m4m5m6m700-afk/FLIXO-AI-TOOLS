name: FLIXO Action Vault Watchdog

on:
  push:
    branches: [execution]
    paths:
      - 'diagnostics/auto-repair/action-vault/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-action-vault-watchdog-${{ github.sha }}
  cancel-in-progress: true

jobs:
  wake-and-target:
    name: Wake Action Vault agents and target impacted surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact changed SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact before/after SHA
        id: sha
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          AFTER_SHA="$EVENT_AFTER"
          BEFORE_SHA="$EVENT_BEFORE"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^")"
          fi
          test "$(git rev-parse "$AFTER_SHA")" = "$AFTER_SHA"
          test "$(git rev-parse "$BEFORE_SHA")" = "$BEFORE_SHA"
          echo "before=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Wake three resident agents
        env:
          SHA: ${{ steps.sha.outputs.after }}
          BEFORE_SHA: ${{ steps.sha.outputs.before }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TASK="ACTION-VAULT-CHANGE:${SHA}"
          FP="VAULT_CHANGE:${SHA}"
          node scripts/ci/action-three-bot-collaboration.mjs --op=start --task="$TASK" --fingerprint="$FP" --sha="$SHA" --run-id="$RUN_ID" --output=/tmp/action-vault-collaboration.json
          node scripts/ci/action-bot-chat.mjs --op=open --from=ACTION-MASTER --task="$TASK" --fingerprint="$FP" --sha="$SHA"
          node scripts/ci/action-bot-chat.mjs --op=assign --from=ACTION-MASTER --to=ACTION-HISTORIAN-3 --task="$TASK" --fingerprint="$FP" --sha="$SHA" --objective="VAULT CHANGE WAKE: index exact changed paths, preserve provenance, and prepare historical evidence."
          node scripts/ci/action-bot-chat.mjs --op=assign --from=ACTION-MASTER --to=ACTION-REPAIR-2 --task="$TASK" --fingerprint="$FP" --sha="$SHA" --objective="VAULT CHANGE WAKE: inspect changed contract surface independently, challenge possible regressions, and prepare counter-hypotheses."
          node scripts/ci/action-bot-chat.mjs --op=assign --from=ACTION-MASTER --to=ACTION-REPAIR --task="$TASK" --fingerprint="$FP" --sha="$SHA" --objective="VAULT CHANGE WAKE: prepare bounded repair path for the changed Action Vault surface; do not mutate until a RED and collaboration evidence exist."
          printf '%s\n' "TASK=$TASK" "FINGERPRINT=$FP" "BEFORE_SHA=$BEFORE_SHA" "AFTER_SHA=$SHA" > /tmp/action-vault-wake.txt

      - name: Derive impacted surface
        env:
          BEFORE_SHA: ${{ steps.sha.outputs.before }}
          AFTER_SHA: ${{ steps.sha.outputs.after }}
        run: |
          set -euo pipefail
          node scripts/ci/action-vault-targeted-test.mjs --before="$BEFORE_SHA" --after="$AFTER_SHA" --output=/tmp/action-vault-targeted-plan.json
          jq -e '.protocol == "ACTION-VAULT-TARGETED-REPAIR-v1"' /tmp/action-vault-targeted-plan.json >/dev/null

      - name: Run only targeted vault contract tests
        env:
          BEFORE_SHA: ${{ steps.sha.outputs.before }}
          AFTER_SHA: ${{ steps.sha.outputs.after }}
        run: |
          set -euo pipefail
          node scripts/ci/action-vault-targeted-test.mjs --before="$BEFORE_SHA" --after="$AFTER_SHA" --execute=true --output=/tmp/action-vault-targeted-execution.json

      - name: Publish agent wake and targeted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-action-vault-wake-${{ github.run_id }}
          path: |
            /tmp/action-vault-wake.txt
            /tmp/action-vault-collaboration.json
            /tmp/action-vault-targeted-plan.json
            /tmp/action-vault-targeted-execution.json
            diagnostics/auto-repair/action-vault/chat.jsonl
            diagnostics/auto-repair/action-vault/chat-index.json
            diagnostics/auto-repair/action-vault/current-collaboration.json
          if-no-files-found: ignore
          retention-days: 14

