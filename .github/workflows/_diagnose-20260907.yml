name: FLIXO Remediation Diagnostic 20260907

on:
  push:
    branches:
      - repair/2026-09-07-session-001

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript diagnostic (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false