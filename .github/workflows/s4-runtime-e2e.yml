name: S4 Runtime + E2E Gate

# Blocking runtime owner. The canonical CI build is produced once; S4 consumes that immutable artifact.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: s4-runtime-e2e-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test

jobs:
  s4-runtime-e2e:
    name: S4 Runtime + E2E
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)

      - name: Install all Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Consume canonical CI build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.event.workflow_run.head_sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build runtime artifact once for manual certification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VITE_SITE_URL: https://flixoai.vercel.app
        run: npm run build

      - name: Verify exact artifact commit SHA
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_flixo_build_manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = process.env.CERTIFIED_SHA;
          const manifest = JSON.parse(readFileSync('dist/_flixo_build_manifest.json', 'utf8'));
          if (manifest.sha !== expected && manifest.commit_sha !== expected) {
            throw new Error(`S4 artifact SHA mismatch: ${manifest.sha ?? manifest.commit_sha} != ${expected}`);
          }
          console.log(`S4 artifact SHA verified: ${expected}`);
          NODE

      - name: Verify required static assets
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json

      - name: Start isolated production server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/s4-server.log 2>&1 &
          echo $! > /tmp/s4-server.pid

      - name: Wait for readiness and HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              echo 'S4 PASS: server readiness + HTTP 200'
              exit 0
            fi
            sleep 1
          done
          echo 'S4 FAIL: server did not become ready with HTTP 200'
          cat /tmp/s4-server.log || true
          exit 1

      - name: Record server process identity
        shell: bash
        run: |
          set -euo pipefail
          PID="$(cat /tmp/s4-server.pid)"
          PGID="$(ps -o pgid= -p "$PID" | tr -d ' ')"
          test -n "$PGID"
          test "$PGID" != "1"
          {
            echo "S4 server PID=$PID PGID=$PGID"
            ps -o pid,ppid,pgid,lstart,args -p "$PID"
            ps -eo pid,ppid,pgid,lstart,args | awk -v pgid="$PGID" '$3 == pgid {print}'
          } > server_process_identity.txt
          cat server_process_identity.txt

      - name: Diagnose first runtime-render failure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const diagnostics = [];
          page.on('pageerror', (error) => diagnostics.push({ type: 'pageerror', message: error.message, stack: error.stack }));
          page.on('console', (message) => {
            if (message.type() === 'error') diagnostics.push({ type: 'console', message: message.text() });
          });
          page.on('requestfailed', (request) => diagnostics.push({ type: 'requestfailed', url: request.url(), error: request.failure()?.errorText ?? 'unknown' }));
          for (const path of ['/en', '/en/ai-captioner-srt']) {
            diagnostics.length = 0;
            await page.goto(`http://127.0.0.1:3000${path}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1000);
            const body = await page.locator('body').innerText();
            const rootHtml = await page.locator('#root').innerHTML();
            console.log(`=== S4 DIAGNOSTIC ${path} ===`);
            console.log(`URL=${page.url()}`);
            console.log(`TITLE=${await page.title()}`);
            console.log(`BODY_TEXT=${body.slice(0, 3000)}`);
            console.log(`ROOT_HTML=${rootHtml.slice(0, 5000)}`);
            console.log(`DIAGNOSTICS=${JSON.stringify(diagnostics, null, 2)}`);
            if (diagnostics.length || rootHtml.trim().length === 0) {
              console.error(`S4 RUNTIME ROOT CAUSE DETECTED on ${path}`);
              process.exitCode = 1;
              break;
            }
          }
          await browser.close();
          if (process.exitCode) process.exit(process.exitCode);
          NODE

      - name: Run Chromium Firefox WebKit with zero retries
        env:
          S4_RUNTIME_GATE: 'true'
          S4_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_SERVER: 'preview'
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: xvfb-run -a npx playwright test --workers=1 --retries=0 --headed

      - name: Validate S4 aggregate outcome
        env:
          S4_REQUIRED_PROJECTS: chromium,firefox,webkit
        run: node scripts/validate-s4-e2e.mjs

      - name: Verify server process group is gone
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/s4-server.pid ]; then
            PID="$(cat /tmp/s4-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ')"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ]; then
              kill -- -"$PGID" 2>/dev/null || true
            fi
            wait "$PID" 2>/dev/null || true
          fi
          sleep 1
          if pgrep -af 'vite preview --host 127.0.0.1 --port 3000' >/dev/null; then
            echo 'S4 FAIL: preview process group remains after cleanup'
            pgrep -af 'vite preview --host 127.0.0.1 --port 3000'
            exit 1
          fi
          echo 'S4 PASS: clean server shutdown'

      - name: Upload S4 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: s4-runtime-e2e-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            playwright-report/
            test-results/
            server_process_identity.txt
            /tmp/s4-server.log
          if-no-files-found: warn
          retention-days: 14
