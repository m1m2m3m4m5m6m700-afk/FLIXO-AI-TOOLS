name: S4 Runtime + E2E Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 's4-**'
  workflow_dispatch:

concurrency:
  group: s4-runtime-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shard-plan:
    name: S4 Adaptive Shard Plan
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      indices: ${{ steps.plan.outputs.indices }}
      basis: ${{ steps.plan.outputs.basis }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: plan
        shell: bash
        env:
          CI_SHARD_COUNT: ${{ vars.FLIXO_S4_SHARD_COUNT || '4' }}
          CI_SHARD_HISTORY: diagnostics/ci-shard-history.json
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          node scripts/ci-weighted-shards.mjs > diagnostics/s4-shard-plan.json
          cat diagnostics/s4-shard-plan.json
          count="$(node -e "const p=JSON.parse(require('fs').readFileSync('diagnostics/s4-shard-plan.json','utf8')); process.stdout.write(String(p.requested_shards))")"
          basis="$(node -e "const p=JSON.parse(require('fs').readFileSync('diagnostics/s4-shard-plan.json','utf8')); process.stdout.write(p.basis)")"
          indices="$(node -e "const p=JSON.parse(require('fs').readFileSync('diagnostics/s4-shard-plan.json','utf8')); process.stdout.write(JSON.stringify(p.shards.map(s => s.index)))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
          echo "indices=$indices" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: s4-shard-plan
          path: diagnostics/s4-shard-plan.json
          if-no-files-found: error
          retention-days: 14

  runtime-e2e:
    name: S4 Runtime + E2E — ${{ matrix.browser }} — shard ${{ matrix.shard }}/${{ needs.shard-plan.outputs.count }}
    needs: [shard-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: ${{ fromJSON(needs.shard-plan.outputs.indices) }}
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
      VITE_TEST_ORIGIN: https://canonical.test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start isolated production server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run build >/tmp/s4-build.log 2>&1
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/s4-server.log 2>&1 &
          echo $! > /tmp/s4-server.pid
      - name: Wait for readiness and HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/s4-build.log || true
          cat /tmp/s4-server.log || true
          exit 1
      - name: Run browser shard
        env:
          S4_RUNTIME_GATE: 'true'
          S4_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: >-
          xvfb-run -a npx playwright test
          --project=${{ matrix.browser }}
          --workers=1
          --retries=0
          --shard=${{ matrix.shard }}/${{ needs.shard-plan.outputs.count }}
      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: s4-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            /tmp/s4-build.log
            /tmp/s4-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify server shutdown
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/s4-server.pid ]; then
            PID="$(cat /tmp/s4-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ')"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ]; then kill -- -"$PGID" 2>/dev/null || true; fi
          fi
