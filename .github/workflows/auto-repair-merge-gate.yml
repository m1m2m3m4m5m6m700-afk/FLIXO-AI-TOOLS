name: FLIXO Auto Repair Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  checks: read
  pull-requests: write

concurrency:
  group: flixo-two-branch-merge-gate
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'execution' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reconcile current execution divergence with canonical main once, fail-closed
        uses: actions/checkout@v5
        with:
          ref: execution
          fetch-depth: 0

      - name: Verify execution is synchronized with canonical main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_HEAD="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName,headRefOid --jq '.headRefName+"|"+.baseRefName+"|"+.headRefOid')"
          test "${PR_HEAD%%|*}" = "execution"
          PR_BASE="$(printf '%s' "$PR_HEAD" | cut -d'|' -f2)"
          EXPECTED_SHA="$(printf '%s' "$PR_HEAD" | cut -d'|' -f3)"
          test "$PR_BASE" = "main"
          git fetch --no-tags origin main execution
          test "$(git branch --show-current)" = "execution"
          EXECUTION_SHA="$(git rev-parse origin/execution)"
          CANONICAL_MAIN="$(git rev-parse origin/main)"
          test "$EXECUTION_SHA" = "$EXPECTED_SHA"
          if ! git merge-base --is-ancestor "$CANONICAL_MAIN" "$EXECUTION_SHA"; then
            echo "FAIL CLOSED: execution $EXECUTION_SHA does not contain canonical main $CANONICAL_MAIN."
            echo "The dedicated Execution Canonical Sync must reconcile the branch before merge can proceed."
            exit 1
          fi
          echo "Execution contains canonical main: main=$CANONICAL_MAIN execution=$EXECUTION_SHA"
      - name: Wait for exact-head repository check-runs; isolate external deployment-provider status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          deadline=$((SECONDS + 3300))
          while true; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > /tmp/check-runs.json
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate" and (.name | ascii_downcase) != "github-advanced-security" and (.name | ascii_downcase) != "github advanced security" and (.name | ascii_downcase) != "code scanning ai findings")] | group_by(.name) | map(max_by((.completed_at // .started_at // "")))' /tmp/check-runs.json > /tmp/repository-check-runs.json
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) == "vercel" or (.name | ascii_downcase) == "vercel deployment" or (.name | ascii_downcase) == "github-advanced-security" or (.name | ascii_downcase) == "github advanced security" or (.name | ascii_downcase) == "code scanning ai findings")] | group_by(.name) | map(max_by((.completed_at // .started_at // "")))' /tmp/check-runs.json > /tmp/external-vercel.json

            if jq -e 'length == 0 or any(.[]; .status != "completed" or .conclusion != "success")' /tmp/repository-check-runs.json >/tmp/non-green-checks.json; then
              jq '.[] | select(.status != "completed" or .conclusion != "success") | {name,status,conclusion}' /tmp/repository-check-runs.json
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo 'Timed out waiting for exact-head repository check-runs.'
                exit 1
              fi
              sleep 20
              continue
            fi
            break
          done
          echo 'Exact-head repository check-runs are GREEN.'
          echo 'Vercel status is recorded separately as external deployment-provider evidence:'
          cat /tmp/external-vercel.json

      - name: Require exact-head repository GREEN evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > /tmp/check-runs-final.json
          jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate" and (.name | ascii_downcase) != "github-advanced-security" and (.name | ascii_downcase) != "github advanced security" and (.name | ascii_downcase) != "code scanning ai findings") | select(.status != "completed" or .conclusion != "success")] | length == 0' /tmp/check-runs-final.json

      - name: Execute canonical merge only after exact-SHA repository GREEN proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"

      - name: Verify merged main identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '.state+"|"+(.mergedAt//"")')"
          case "$state" in
            MERGED\|*) ;;
            *) echo "Canonical execution -> main merge was not completed: $state"; exit 1 ;;
          esac
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$main_sha" && test "$main_sha" != "null"
          echo "Canonical main after merge: $main_sha"
