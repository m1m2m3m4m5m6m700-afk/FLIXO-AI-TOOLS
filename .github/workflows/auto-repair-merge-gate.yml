name: FLIXO Auto Repair Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  checks: read
  pull-requests: write

concurrency:
  group: flixo-two-branch-merge-gate
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'execution' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Freeze exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_HEAD="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName,headRefOid,headRepositoryOwner --jq '.headRefName+"|"+.baseRefName+"|"+.headRefOid+"|"+.headRepositoryOwner.login')"
          test "${PR_HEAD%%|*}" = execution
          PR_BASE="$(printf '%s' "$PR_HEAD" | cut -d'|' -f2)"
          EXPECTED_SHA="$(printf '%s' "$PR_HEAD" | cut -d'|' -f3)"
          HEAD_OWNER="$(printf '%s' "$PR_HEAD" | cut -d'|' -f4)"
          test "$PR_BASE" = main
          test "$HEAD_OWNER" = "${GITHUB_REPOSITORY%%/*}"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner --jq '.headRepositoryOwner.login')" = "${GITHUB_REPOSITORY%%/*}"
          printf '%s\n' "$EXPECTED_SHA" > /tmp/flixo-verified-head-sha

      - name: Wait for exact-head repository and required security GREEN
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          deadline=$((SECONDS + 3300))
          fetch_check_runs() {
            local output="$1"
            local delay=20
            for attempt in 1 2 3 4 5 6; do
              if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$output"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                echo 'GitHub check-run API remained unavailable after retry budget.'
                return 1
              fi
              echo "GitHub check-run API unavailable/rate-limited; retrying in ${delay}s (attempt ${attempt}/6)."
              sleep "$delay"
              case "$delay" in
                20) delay=40 ;;
                40) delay=80 ;;
                80) delay=160 ;;
                160) delay=320 ;;
                320) delay=640 ;;
              esac
            done
          }
          while true; do
            ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "HEAD_CHANGED=$ACTUAL_SHA expected=$EXPECTED_SHA"; exit 1; }
            fetch_check_runs /tmp/check-runs.json
            gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name,state > /tmp/required-checks.json
            jq -e 'length > 0' /tmp/required-checks.json >/dev/null || { echo 'FAIL CLOSED: GitHub reported no required checks for this PR.'; exit 1; }
            jq -e 'all(.[]; .state == "SUCCESS")' /tmp/required-checks.json >/dev/null || {
              echo 'FAIL CLOSED: one or more GitHub-required checks are not successful.'
              cat /tmp/required-checks.json
              exit 1
            }
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate")] | group_by(.name) | map(max_by((.completed_at // .started_at // "")))' /tmp/check-runs.json > /tmp/repository-check-runs.json
            if ! jq -e 'length > 0 and all(.[]; .status == "completed" and .conclusion == "success")' /tmp/repository-check-runs.json >/dev/null; then
              if [ "$SECONDS" -ge "$deadline" ]; then echo 'Timed out waiting for exact-head repository checks.'; exit 1; fi
              sleep 20
              continue
            fi
            SECURITY_COUNT="$(jq -s '[.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))] | unique_by(.id) | length' /tmp/check-runs.json)"
            test "$SECURITY_COUNT" -gt 0 || { echo 'FAIL CLOSED: required security check is missing from exact-head checks.'; exit 1; }
            jq -s -e 'all([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))]; .status == "completed" and .conclusion == "success")' /tmp/check-runs.json
            if jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) == "vercel" or (.name | ascii_downcase) == "vercel deployment")] | length > 0 and any(.[]; .status != "completed" or .conclusion != "success")' /tmp/check-runs.json >/dev/null; then
              echo 'EXTERNAL_UNRESOLVED=vercel'
              jq -s '[.[].check_runs[] | select((.name | ascii_downcase) == "vercel" or (.name | ascii_downcase) == "vercel deployment")] | unique_by(.id)' /tmp/check-runs.json
              if [ "$SECONDS" -ge "$deadline" ]; then echo 'Timed out with EXTERNAL_UNRESOLVED provider status.'; exit 1; fi
              sleep 20
              continue
            fi
            break
          done
          echo 'EXACT_SHA_REPOSITORY_GREEN=true'
          echo 'EXACT_SHA_SECURITY_GREEN=true'
          echo 'EXTERNAL_UNRESOLVED=false'

      - name: Recheck exact-head proof immediately before merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fetch_check_runs() {
            local output="$1"
            local delay=20
            for attempt in 1 2 3 4 5 6; do
              if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$output"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                echo 'GitHub check-run API remained unavailable after retry budget.'
                return 1
              fi
              echo "GitHub check-run API unavailable/rate-limited; retrying in ${delay}s (attempt ${attempt}/6)."
              sleep "$delay"
              case "$delay" in
                20) delay=40 ;;
                40) delay=80 ;;
                80) delay=160 ;;
                160) delay=320 ;;
                320) delay=640 ;;
              esac
            done
          }
          fetch_check_runs /tmp/check-runs-final.json
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name,state > /tmp/required-checks-final.json
          jq -e 'length > 0' /tmp/required-checks-final.json >/dev/null || { echo 'FAIL CLOSED: GitHub reported no required checks for this PR.'; exit 1; }
          jq -e 'all(.[]; .state == "SUCCESS")' /tmp/required-checks-final.json >/dev/null || {
            echo 'FAIL CLOSED: one or more GitHub-required checks are not successful.'
            cat /tmp/required-checks-final.json
            exit 1
          }
          jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate") | select(.status != "completed" or .conclusion != "success")] | length == 0' /tmp/check-runs-final.json
          jq -s -e 'any([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))])' /tmp/check-runs-final.json
          jq -s -e 'all([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))]; .status == "completed" and .conclusion == "success")' /tmp/check-runs-final.json
          if jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) == "vercel" or (.name | ascii_downcase) == "vercel deployment")] | length > 0 and any(.[]; .status != "completed" or .conclusion != "success")' /tmp/check-runs-final.json >/dev/null; then
            echo 'EXTERNAL_UNRESOLVED=vercel'
            exit 1
          fi

      - name: Execute canonical merge only after exact-SHA GREEN proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"

      - name: Verify merged main identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '.state+"|"+(.mergedAt//"")')"
          case "$state" in
            MERGED\|*) ;;
            *) echo "Canonical execution -> main merge was not completed: $state"; exit 1 ;;
          esac
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$main_sha" && test "$main_sha" != "null"
          echo "Canonical main after merge: $main_sha"
