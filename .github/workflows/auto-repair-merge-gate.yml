name: FLIXO Auto Repair Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  checks: read
  pull-requests: write

concurrency:
  group: flixo-two-branch-merge-gate
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'execution' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for exact-head repository check-runs; isolate external deployment-provider status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          deadline=$((SECONDS + 3300))
          while true; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > /tmp/check-runs.json
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate")] | unique_by(.id)' /tmp/check-runs.json > /tmp/repository-check-runs.json
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) == "vercel" or (.name | ascii_downcase) == "vercel deployment")] | unique_by(.id)' /tmp/check-runs.json > /tmp/external-vercel.json

            if jq -e 'length == 0 or any(.[]; .status != "completed" or .conclusion != "success")' /tmp/repository-check-runs.json >/tmp/non-green-checks.json; then
              jq '.[] | select(.status != "completed" or .conclusion != "success") | {name,status,conclusion}' /tmp/repository-check-runs.json
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo 'Timed out waiting for exact-head repository check-runs.'
                exit 1
              fi
              sleep 20
              continue
            fi
            break
          done
          echo 'Exact-head repository check-runs are GREEN.'
          echo 'Vercel status is recorded separately as external deployment-provider evidence:'
          cat /tmp/external-vercel.json

      - name: Require exact-head repository GREEN evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "HEAD_CHANGED=$ACTUAL_SHA expected=$EXPECTED_SHA"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > /tmp/check-runs-final.json
          jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate") | select(.status != "completed" or .conclusion != "success")] | length == 0' /tmp/check-runs-final.json

      - name: Execute canonical merge only after exact-SHA repository GREEN proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"

      - name: Verify merged main identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '.state+"|"+(.mergedAt//"")')"
          case "$state" in
            MERGED\|*) ;;
            *) echo "Canonical execution -> main merge was not completed: $state"; exit 1 ;;
          esac
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$main_sha" && test "$main_sha" != "null"
          echo "Canonical main after merge: $main_sha"
