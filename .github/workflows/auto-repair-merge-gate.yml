name: FLIXO Auto Repair Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  checks: read
  pull-requests: write

concurrency:
  group: flixo-two-branch-merge-gate
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'execution' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Freeze exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_HEAD="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName,headRefOid,headRepositoryOwner --jq '.headRefName+"|"+.baseRefName+"|"+.headRefOid+"|"+.headRepositoryOwner.login')"
          test "${PR_HEAD%%|*}" = execution
          PR_BASE="$(printf '%s' "$PR_HEAD" | cut -d'|' -f2)"
          EXPECTED_SHA="$(printf '%s' "$PR_HEAD" | cut -d'|' -f3)"
          HEAD_OWNER="$(printf '%s' "$PR_HEAD" | cut -d'|' -f4)"
          test "$PR_BASE" = main
          test "$HEAD_OWNER" = "${GITHUB_REPOSITORY%%/*}"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner --jq '.headRepositoryOwner.login')" = "${GITHUB_REPOSITORY%%/*}"
          printf '%s\n' "$EXPECTED_SHA" > /tmp/flixo-verified-head-sha

      - name: Wait for exact-head repository and required security GREEN
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          deadline=$((SECONDS + 3300))
          fetch_check_runs() {
            local output="$1"
            local delay=20
            for attempt in 1 2 3 4 5 6; do
              if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$output"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                echo 'GitHub check-run API remained unavailable after retry budget.'
                return 1
              fi
              echo "GitHub check-run API unavailable/rate-limited; retrying in ${delay}s (attempt ${attempt}/6)."
              sleep "$delay"
              case "$delay" in
                20) delay=40 ;;
                40) delay=80 ;;
                80) delay=160 ;;
                160) delay=320 ;;
                320) delay=640 ;;
              esac
            done
          }
          while true; do
            ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "HEAD_CHANGED=$ACTUAL_SHA expected=$EXPECTED_SHA"; exit 1; }
            fetch_check_runs /tmp/check-runs.json
            cat > /tmp/canonical-required-checks.txt <<'EOF'
Static + Build
Browser Dependencies
Browser FAST — chromium / shard-1
Browser FAST — chromium / shard-2
Browser FAST — firefox / shard-1
Browser FAST — firefox / shard-2
Browser FAST — webkit / shard-1
Browser FAST — webkit / shard-2
Browser DEEP — chromium / shard-1
Browser DEEP — chromium / shard-2
Browser DEEP — chromium / shard-3
Browser DEEP — chromium / shard-4
Browser DEEP — chromium / shard-5
Browser DEEP — chromium / shard-6
Browser DEEP — chromium / shard-7
Browser DEEP — firefox / shard-1
Browser DEEP — firefox / shard-2
Browser DEEP — firefox / shard-3
Browser DEEP — firefox / shard-4
Browser DEEP — firefox / shard-5
Browser DEEP — firefox / shard-6
Browser DEEP — firefox / shard-7
Browser DEEP — webkit / shard-1
Browser DEEP — webkit / shard-2
Browser DEEP — webkit / shard-3
Browser DEEP — webkit / shard-4
Browser DEEP — webkit / shard-5
Browser DEEP — webkit / shard-6
Browser DEEP — webkit / shard-7
Certification
WP0 Trust Baseline — Single Verification Path
Impact Verification Execution
EOF
            while IFS= read -r required; do
              test -n "$required"
              jq -s -e --arg name "$required" 'any([.[].check_runs[]]; .name == $name and .status == "completed" and .conclusion == "success")' /tmp/check-runs.json >/dev/null || {
                echo "FAIL CLOSED: canonical required check missing or not successful: $required"
                exit 1
              }
            done < /tmp/canonical-required-checks.txt
            jq -s '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate" and (.name | ascii_downcase) != "claude security review (advisory)")] | group_by(.name) | map(max_by((.completed_at // .started_at // "")))' /tmp/check-runs.json > /tmp/repository-check-runs.json
            if ! jq -e 'length > 0 and all(.[]; .status == "completed" and .conclusion == "success")' /tmp/repository-check-runs.json >/dev/null; then
              if [ "$SECONDS" -ge "$deadline" ]; then echo 'Timed out waiting for exact-head repository checks.'; exit 1; fi
              sleep 20
              continue
            fi
            SECURITY_COUNT="$(jq -s '[.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))] | unique_by(.id) | length' /tmp/check-runs.json)"
            test "$SECURITY_COUNT" -gt 0 || { echo 'FAIL CLOSED: required security check is missing from exact-head checks.'; exit 1; }
            jq -s -e 'all([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))]; .status == "completed" and .conclusion == "success")' /tmp/check-runs.json
            gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status" > /tmp/statuses.json || true
            VERCEL_STATE="$(jq -r '[.statuses[] | select((.context // "") | ascii_downcase | startswith("vercel"))] | if length == 0 then "MISSING" else .[-1].state end' /tmp/statuses.json 2>/dev/null || printf '%s' MISSING)"
            echo "EXTERNAL_VERCEL_STATUS=$VERCEL_STATE"
            echo 'EXTERNAL_PROVIDER_GATE=INFORMATIONAL'
            # Vercel provider/quota state is external to repository CI and is not a source-repair target.
            break
          done
          echo 'EXACT_SHA_REPOSITORY_GREEN=true'
          echo 'EXACT_SHA_SECURITY_GREEN=true'
          echo 'EXTERNAL_UNRESOLVED=false'

      - name: Recheck exact-head proof immediately before merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fetch_check_runs() {
            local output="$1"
            local delay=20
            for attempt in 1 2 3 4 5 6; do
              if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$output"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                echo 'GitHub check-run API remained unavailable after retry budget.'
                return 1
              fi
              echo "GitHub check-run API unavailable/rate-limited; retrying in ${delay}s (attempt ${attempt}/6)."
              sleep "$delay"
              case "$delay" in
                20) delay=40 ;;
                40) delay=80 ;;
                80) delay=160 ;;
                160) delay=320 ;;
                320) delay=640 ;;
              esac
            done
          }
          fetch_check_runs /tmp/check-runs-final.json
          cat > /tmp/canonical-required-checks-final.txt <<'EOF'
Static + Build
Browser Dependencies
Browser FAST — chromium / shard-1
Browser FAST — chromium / shard-2
Browser FAST — firefox / shard-1
Browser FAST — firefox / shard-2
Browser FAST — webkit / shard-1
Browser FAST — webkit / shard-2
Browser DEEP — chromium / shard-1
Browser DEEP — chromium / shard-2
Browser DEEP — chromium / shard-3
Browser DEEP — chromium / shard-4
Browser DEEP — chromium / shard-5
Browser DEEP — chromium / shard-6
Browser DEEP — chromium / shard-7
Browser DEEP — firefox / shard-1
Browser DEEP — firefox / shard-2
Browser DEEP — firefox / shard-3
Browser DEEP — firefox / shard-4
Browser DEEP — firefox / shard-5
Browser DEEP — firefox / shard-6
Browser DEEP — firefox / shard-7
Browser DEEP — webkit / shard-1
Browser DEEP — webkit / shard-2
Browser DEEP — webkit / shard-3
Browser DEEP — webkit / shard-4
Browser DEEP — webkit / shard-5
Browser DEEP — webkit / shard-6
Browser DEEP — webkit / shard-7
Certification
WP0 Trust Baseline — Single Verification Path
Impact Verification Execution
EOF
          while IFS= read -r required; do
            test -n "$required"
            jq -s -e --arg name "$required" 'any([.[].check_runs[]]; .name == $name and .status == "completed" and .conclusion == "success")' /tmp/check-runs-final.json >/dev/null || {
              echo "FAIL CLOSED: canonical required check missing or not successful: $required"
              exit 1
            }
          done < /tmp/canonical-required-checks-final.txt
          jq -s -e '[.[].check_runs[] | select((.name | ascii_downcase) != "vercel" and (.name | ascii_downcase) != "vercel deployment" and (.name | ascii_downcase) != "flixo auto repair merge gate" and (.name | ascii_downcase) != "gate" and (.name | ascii_downcase) != "claude security review (advisory)") | select(.status != "completed" or .conclusion != "success")] | length == 0' /tmp/check-runs-final.json
          jq -s -e 'any([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))])' /tmp/check-runs-final.json
          jq -s -e 'all([.[].check_runs[] | select((.name | ascii_downcase) | test("codeql|github-advanced-security|github advanced security|code scanning ai findings"))]; .status == "completed" and .conclusion == "success")' /tmp/check-runs-final.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status" > /tmp/statuses-final.json || true
          VERCEL_STATE="$(jq -r '[.statuses[] | select((.context // "") | ascii_downcase | startswith("vercel"))] | if length == 0 then "MISSING" else .[-1].state end' /tmp/statuses-final.json 2>/dev/null || printf '%s' MISSING)"
          echo "EXTERNAL_VERCEL_STATUS_FINAL=$VERCEL_STATE"
          echo 'EXTERNAL_PROVIDER_GATE=INFORMATIONAL'

      - name: Execute canonical fast-forward promotion only after exact-SHA GREEN proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$MAIN_SHA" && test "$MAIN_SHA" != "null"
          COMPARE="$(gh api "repos/$GITHUB_REPOSITORY/compare/$MAIN_SHA...$EXPECTED_SHA")"
          STATUS="$(printf '%s' "$COMPARE" | jq -r '.status')"
          AHEAD_BY="$(printf '%s' "$COMPARE" | jq -r '.ahead_by')"
          BEHIND_BY="$(printf '%s' "$COMPARE" | jq -r '.behind_by')"
          test "$STATUS" = "ahead"
          test "$AHEAD_BY" -gt 0
          test "$BEHIND_BY" -eq 0

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main"             -f "sha=$EXPECTED_SHA"             -F "force=false"

          MAIN_AFTER="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$MAIN_AFTER" = "$EXPECTED_SHA"
          echo "FAST_FORWARD_PROMOTION=true"
          echo "CERTIFIED_SHA=$EXPECTED_SHA"
          echo "MAIN_SHA=$MAIN_AFTER"

      - name: Verify post-promotion main identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-verified-head-sha)"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$MAIN_SHA" = "$EXPECTED_SHA"
          PR_HEAD="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$PR_HEAD" = "$EXPECTED_SHA"
          echo "POST_PROMOTION_EXACT_SHA_PROOF=true"
          echo "MAIN_EQUALS_CERTIFIED=true"
          echo "PR_HEAD_EQUALS_CERTIFIED=true"
