name: FLIXO Auto Repair Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: flixo-auto-repair-merge-gate-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Exact-SHA promotion proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve canonical PR and exact execution SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_STATE: ${{ github.event.pull_request.state || '' }}
        shell: bash
        run: |
          set -euo pipefail

          gh_with_backoff() {
            local attempt=0
            local delay=10
            local err
            err="$(mktemp)"
            while [ "$attempt" -lt 4 ]; do
              if gh "$@" 2>"$err"; then
                rm -f "$err"
                return 0
              fi
              if grep -Eqi 'rate limit|HTTP 403|API rate limit exceeded|secondary rate limit' "$err"; then
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 4 ]; then
                  cat "$err" >&2
                  rm -f "$err"
                  return 75
                fi
                echo "GITHUB_API_RATE_LIMIT_BACKOFF attempt=$attempt sleep=${delay}s" >&2
                sleep "$delay"
                delay=$((delay * 2))
                continue
              fi
              cat "$err" >&2
              rm -f "$err"
              return 1
            done
          }

          PR_NUMBER="$PR_NUMBER_INPUT"
          BASE="$PR_BASE_REF"
          HEAD_BRANCH="$PR_HEAD_REF"
          HEAD_SHA="$PR_HEAD_SHA"
          STATE="$PR_STATE"

          if [ -z "$PR_NUMBER" ]; then
            PR_JSON="$(gh_with_backoff pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number,state,baseRefName,headRefName,headRefOid --jq '.[0]')" || {
              rc=$?
              [ "$rc" -eq 75 ] && echo 'FAIL CLOSED: GitHub API rate limited while resolving canonical PR.'
              exit "$rc"
            }
            test -n "$PR_JSON" || { echo "FAIL CLOSED: no open execution→main PR."; exit 1; }
            PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.number')"
            BASE="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
            HEAD_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"