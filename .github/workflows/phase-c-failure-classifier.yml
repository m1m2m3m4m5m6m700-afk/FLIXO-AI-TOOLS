name: Phase C Failure Classifier

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/contracts/ci-contracts.ts'
      - 'src/lib/contracts/failure-classifier.ts'
      - 'scripts/test-failure-classifier.mjs'
      - '.github/workflows/phase-c-failure-classifier.yml'

permissions:
  contents: read

concurrency:
  group: phase-c-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  classifier:
    name: Failure Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate classifier
        run: node --experimental-strip-types scripts/test-failure-classifier.mjs
