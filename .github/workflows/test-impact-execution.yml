name: FLIXO Test Impact Execution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-test-impact-execution-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read

env:
  IMPACT_MAX_CONCURRENCY: '12'
  IMPACT_DEPENDENCIES_READY: 'true'
  PLAYWRIGHT_TEST_PORT: '3100'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  impact-execution:
    name: Impact Verification Execution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build impact plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/ci/test-impact.mjs --mode=pr --base="$BASE_SHA"
      - name: Detect runtime requirements
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/ci/test-impact.json
          if node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("diagnostics/ci/test-impact.json","utf8")); process.exit(p.commands.includes("npm run test:browser") ? 0 : 1)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore shared dependency cache
        id: impact-deps-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: flixo-browser-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.nvmrc') }}-playwright-local
      - name: Install dependencies on cache miss
        if: steps.impact-deps-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Provision browser runtime when Impact requires it
        if: steps.runtime.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium firefox webkit
      - name: Verify dependency identity
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/playwright
          npx playwright --version
          sha256sum package-lock.json
      - name: Verify browser runtime when required
        if: steps.runtime.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --dry-run chromium firefox webkit
      - name: Execute selected verification
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SITE_URL: 'https://flixoai.vercel.app'
          VITE_SITE_URL: 'https://flixoai.vercel.app'
        run: node scripts/ci/test-impact.mjs --mode=pr --base="$BASE_SHA" --execute
      - name: Verify impact execution evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s diagnostics/ci/test-impact.json
          test -s diagnostics/ci/test-impact-execution.json
          node - <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('diagnostics/ci/test-impact.json', 'utf8'));
          const execution = JSON.parse(fs.readFileSync('diagnostics/ci/test-impact-execution.json', 'utf8'));
          const expected = process.env.EXPECTED_SHA;
          if (plan.sha !== expected) throw new Error(`Impact SHA mismatch: ${plan.sha} != ${expected}`);
          if (execution.sha !== expected) throw new Error(`Execution SHA mismatch: ${execution.sha} != ${expected}`);
          if (plan.evidenceClass !== 'PRIMARY_EXECUTION') throw new Error('Impact evidence must be PRIMARY_EXECUTION');
          if (execution.status !== 'PASS') throw new Error(`Impact execution status: ${execution.status}`);
          if (execution.executionMaxConcurrency !== 12) throw new Error('Unexpected impact concurrency');
          if (execution.dependenciesPreinstalled !== true) throw new Error('Impact execution must use workflow-installed dependencies');
          if (!Array.isArray(execution.results) || execution.results.length !== execution.commands.length) {
            throw new Error('Impact execution result coverage mismatch');
          }
          if (execution.results.some((r) => r.status !== 'PASS')) throw new Error('Impact verification contains failures');
          NODE
      - name: Verify evidence reducer contract
        if: success()
        run: node scripts/ci/test-evidence-reducer.mjs
      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-test-impact-execution-${{ github.run_id }}
          path: diagnostics/ci/
          if-no-files-found: warn
          retention-days: 14
