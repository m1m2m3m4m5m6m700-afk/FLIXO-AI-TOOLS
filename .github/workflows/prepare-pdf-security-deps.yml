name: Prepare PDF Security Dependencies

on:
  push:
    branches:
      - feature/tool-pdf-unlock-protect

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'chore(pdf-security): lock dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install PDF security engines
        run: npm install --save-exact @pdfsmaller/pdf-encrypt@1.2.0 @pdfsmaller/pdf-decrypt@1.0.1
      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/prepare-pdf-security-deps.yml
      - name: Commit dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/prepare-pdf-security-deps.yml
          git commit -m 'chore(pdf-security): lock dependencies' || exit 0
          git push
