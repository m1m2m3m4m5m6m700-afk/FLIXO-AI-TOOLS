name: Dependency Usage Classification v2

# Deep dependency diagnostics: main/manual only during PR rescue mode.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer main commit supersedes older dependency-classification runs.
# Keep only the newest run for the branch to reduce runner usage and queue time.
concurrency:
  group: dependency-usage-classification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classification:
    name: Dependency usage classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: node scripts/test-dependency-usage-classification.mjs
      - name: Generate inventory
        if: always()
        env:
          DEPENDENCY_USAGE_JSON: diagnostics/dependency-usage.json
        run: |
          mkdir -p diagnostics
          node scripts/report-dependency-usage.mjs > diagnostics/dependency-usage.txt || true
      - name: Upload dependency usage report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: dependency-usage-v2-${{ github.sha }}
          path: |
            diagnostics/dependency-usage.txt
            diagnostics/dependency-usage.json
          if-no-files-found: error
          retention-days: 14
      - name: Report artifact-service status
        if: always()
        run: |
          if [ "${{ steps.upload-report.outcome }}" != "success" ]; then
            echo "Dependency usage artifact upload unavailable; diagnostic artifact delivery is non-gating." >&2
          fi
