name: FLIXO Agent Repair Heartbeat

run-name: FLIXO Agent Repair Heartbeat ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: flixo-agent-repair-heartbeat
  cancel-in-progress: false

jobs:
  wake-supervisor:
    name: Restore continuous supervisor when RED or unfinished
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout liveness contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1
          persist-credentials: false

      - name: Validate no-sleep liveness contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'OPEN_WORK_SLEEP=FORBIDDEN'
          echo 'STALE_HEARTBEAT_ACTION=RECOVER_AND_CONTINUE'

      - name: Verify five-minute heartbeat workflow compliance
        id: heartbeat_compliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/scheduled-wakes.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/current-wake.json
          jq -s 'add' /tmp/flixo-heartbeat/scheduled-wakes.json /tmp/flixo-heartbeat/current-wake.json > /tmp/flixo-heartbeat/wake-runs.json
          node scripts/ci/wake-compliance.mjs /tmp/flixo-heartbeat/wake-runs.json /tmp/flixo-heartbeat/wake-compliance.json
          jq -e '.status == "PASS" or .status == "BASELINE_REQUIRED"' /tmp/flixo-heartbeat/wake-compliance.json >/dev/null

      - name: Publish heartbeat compliance evidence
        if: always() && steps.heartbeat_compliance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-heartbeat-compliance-${{ github.run_id }}
          path: /tmp/flixo-heartbeat/wake-compliance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check supervisor liveness and current GREEN state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_SUPERVISORS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-supervisor.yml --limit 20 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_GREEN_GATES="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_REPAIRS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          if [ "$ACTIVE_SUPERVISORS" -gt 0 ] || [ "$ACTIVE_GREEN_GATES" -gt 0 ] || [ "$ACTIVE_REPAIRS" -gt 0 ]; then
            echo "SUPERVISOR_ALREADY_ACTIVE=$ACTIVE_SUPERVISORS"
            echo "GREEN_GATE_ALREADY_ACTIVE=$ACTIVE_GREEN_GATES"
            echo "AUTO_REPAIR_ALREADY_ACTIVE=$ACTIVE_REPAIRS"
            echo "wake=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEED_WAKE=false
          REQUIRED='FLIXO Test System|FLIXO WP0 Trust Baseline|FLIXO Test Impact|FLIXO Test Impact Execution|FLIXO Continuous Delivery|Repository Security Baseline|Claude Security Review|Daily·FLIXO Green Gate|FLIXO Auto Repair Bot'
          for BRANCH in main execution; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --commit "$SHA" --limit 100 --json databaseId,name,status,conclusion,headSha,createdAt)"
            GREEN="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" 'map(select(.headSha == $sha and .name == "Daily·FLIXO Green Gate" and .conclusion == "success")) | last.databaseId // empty')"
            FAILED="$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" --arg names "$REQUIRED" 'map(select(.headSha == $sha and (.name as $n | ($names | split("|") | index($n) != null)))) | map(select(.conclusion == "failure" or .conclusion == "timed_out")) | last.databaseId // empty')"
            if [ -z "$GREEN" ] || [ -n "$FAILED" ]; then
              NEED_WAKE=true
              echo "SUPERVISOR_NEEDED branch=$BRANCH sha=$SHA green=${GREEN:-none} failed=${FAILED:-none}"
            else
              echo "BRANCH_GREEN branch=$BRANCH sha=$SHA run=$GREEN"
            fi
          done
          echo "wake=$NEED_WAKE" >> "$GITHUB_OUTPUT"

      - name: Wake supervisor only when GREEN is not proven
        if: steps.state.outputs.wake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agent-repair-supervisor.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'SUPERVISOR_WAKE_DISPATCHED=true'
          echo 'CANONICAL_GREEN_GATE_WAKE_DEFERRED_TO_SCHEDULE_OR_CANONICAL_WORKFLOW_RUN=true'
