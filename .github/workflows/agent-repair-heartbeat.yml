name: FLIXO Agent Repair Heartbeat

run-name: FLIXO Agent Repair Heartbeat ${{ github.run_id }}

on:
  push:
    branches: [execution]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - FLIXO Agent Repair Heartbeat
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: flixo-agent-repair-heartbeat-resident-main
  # Started residency runs are never cancelled. Completion re-arms the next run;
  # the five-minute schedule remains the independent fallback wake.
  cancel-in-progress: false

jobs:
  resident-watch:
    name: Keep the repair plane resident and wake canonical Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout liveness contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Re-arm continuous residency after every completed heartbeat
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          ACTIVE_OTHER="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 20 --json databaseId,status --jq '[.[] | select((.status == "queued" or .status == "in_progress") and .databaseId != (env.SOURCE_RUN_ID|tonumber))] | length')"
          if [ "$ACTIVE_OTHER" -gt 0 ]; then
            echo "CONTINUOUS_RESIDENCY_REARM=DEFERRED_ACTIVE_RUNS=$ACTIVE_OTHER"
            exit 0
          fi
          echo "CONTINUOUS_RESIDENCY_REARM=DISPATCH_AFTER=$SOURCE_CONCLUSION"
          gh workflow run agent-repair-heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CONTINUOUS_RESIDENCY_REARM=DISPATCHED'

      - name: Validate permanent-residency liveness contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'RESIDENT_AGENT=true'
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'HEARTBEAT_24X7_MODE=true'
          echo 'SCHEDULE_WAKE_FLOOR_MINUTES=5'
          echo 'OPEN_WORK_SLEEP=FORBIDDEN'
          echo 'STALE_HEARTBEAT_ACTION=RECOVER_AND_CONTINUE'
          echo 'GREEN_DOES_NOT_SUSPEND_RESIDENCY=true'
          echo 'MANUAL_WAKE_REQUIRED=false'
          echo 'SELF_DISABLE_ALLOWED=false'
          echo 'SELF_ABORT_ALLOWED=false'
          echo 'RUN_END_DOES_NOT_END_TASK=true'
          echo 'RESIDENT_LOGICAL_BOTS=100'
          echo 'RESIDENT_ROSTER=CELL-001..CELL-100'
          echo 'STARTED_RUN_CANCELLATION=FORBIDDEN'
          echo 'CONTINUOUS_REARM=WORKFLOW_RUN_COMPLETION_OR_SCHEDULE_FALLBACK'

      - name: Emit six real one-minute wake pulses with differentiated roles
        env:
          FLIXO_HEARTBEAT_PATH: /tmp/flixo-heartbeat/heartbeat.json
          FLIXO_TEAM_PULSE_PATH: /tmp/flixo-heartbeat/flixo-team-pulse.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          for TICK in 1 2 3 4 5 6; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            ACTIVE_REPAIRS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
            ACTIVE_GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
            ACTIVE_TESTS="$(gh run list --repo \"$GITHUB_REPOSITORY\" --workflow ci.yml --limit 50 --json status,headSha | jq --arg sha \"$SHA\" 'map(select((.status == \"queued\" or .status == \"in_progress\") and .headSha == $sha)) | length')"
            ACTIVE_OPERATION=false
            if [ "$ACTIVE_REPAIRS" -gt 0 ] || [ "$ACTIVE_GREEN" -gt 0 ] || [ "$ACTIVE_TESTS" -gt 0 ]; then
              ACTIVE_OPERATION=true
            fi
            MINUTE_KEY="$(date -u +%Y-%m-%dT%H:%M)"
            node scripts/ci/agent-liveness-protocol.mjs heartbeat --task="HEARTBEAT:$GITHUB_RUN_ID:$TICK" --state=ACTIVE --sha="$SHA" --progress=false --file="$FLIXO_HEARTBEAT_PATH"
            jq -e --arg sha "$SHA" '.protocolId=="AGENT_LIVENESS_PROTOCOL" and .state=="ACTIVE" and .exactSha==$sha and .progress==false' "$FLIXO_HEARTBEAT_PATH" >/dev/null
            node scripts/ci/flixo-ten-pulse.mjs --sha="$SHA" --run-id="$GITHUB_RUN_ID" --minute="$MINUTE_KEY" --active-operation="$ACTIVE_OPERATION" --output="$FLIXO_TEAM_PULSE_PATH"
            jq -e --arg sha "$SHA" '.pulseCount==1 and .onePulsePerHeartbeat==true and .residentBotCount==100 and (.residentBotIds|length)==100 and .residentBotIds[0]=="CELL-001" and .residentBotIds[99]=="CELL-100" and .pulses[0].action=="WAKE_ALL_AGENTS" and .pulses[0].wakeScope=="ALL_AGENTS" and .pulses[0].targetSha==$sha and (.pulses[0].pulseType != "CANONICAL_TEAM_HEARTBEAT") and (.pulses[0].pulseIndex >= 0)' "$FLIXO_TEAM_PULSE_PATH" >/dev/null
            PULSE_ID="$(jq -r '.pulses[0].pulseId' "$FLIXO_TEAM_PULSE_PATH")"
            gh workflow run flixo-team-wake-relay.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f "entry_sha=$SHA" \
              -f "pulse_id=$PULSE_ID" \
              -f "active_operation=$ACTIVE_OPERATION"
            echo "HEARTBEAT_TICK=$TICK"
            echo "HEARTBEAT_MINUTE=$MINUTE_KEY"
            echo "HEARTBEAT_EXACT_SHA=$SHA"
            echo "PULSE_TYPE=$(jq -r '.pulses[0].pulseType' "$FLIXO_TEAM_PULSE_PATH")"
            echo "PULSE_OWNER=$(jq -r '.pulses[0].pulseOwner' "$FLIXO_TEAM_PULSE_PATH")"
            echo "ACTIVE_OPERATION=$ACTIVE_OPERATION"
            echo 'CANONICAL_TEAM_PULSE=1'
            echo 'WAKE_RELAY_DISPATCHED=1'
            if [ "$TICK" -lt 6 ]; then sleep 60; fi
          done
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'SCHEDULE_INTERVAL_MINUTES=5'
          echo 'HEARTBEAT_WINDOW_SECONDS=360'
      - name: Verify five-minute schedule with one-minute internal beats compliance
        id: heartbeat_compliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/scheduled-wakes.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/current-wake.json
          jq -s 'map(if type == "array" then . else [.] end) | add' /tmp/flixo-heartbeat/scheduled-wakes.json /tmp/flixo-heartbeat/current-wake.json > /tmp/flixo-heartbeat/wake-runs.json
          node scripts/ci/wake-compliance.mjs /tmp/flixo-heartbeat/wake-runs.json /tmp/flixo-heartbeat/wake-compliance.json
          jq -e '.status == "PASS" or .status == "BASELINE_REQUIRED"' /tmp/flixo-heartbeat/wake-compliance.json >/dev/null

      - name: Publish canonical team pulse and idle-sweep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-team-pulse-${{ github.run_id }}
          path: |
            /tmp/flixo-heartbeat/flixo-team-pulse.json
            /tmp/flixo-heartbeat/flixo-team-idle-pulse.json
            /tmp/flixo-heartbeat/flixo-full-repository-scan.json
            /tmp/flixo-heartbeat/flixo-bot-development-plan.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish heartbeat compliance evidence
        if: always() && steps.heartbeat_compliance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-heartbeat-compliance-${{ github.run_id }}
          path: |
            /tmp/flixo-heartbeat/wake-compliance.json
            /tmp/flixo-heartbeat/heartbeat.json
          if-no-files-found: warn
          retention-days: 14

      - name: Observe every Repair Bot reaction from the active repair session
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_BEHAVIOR_TRACE_PATH: /tmp/flixo-repair-behavior-trace.json
        run: |
          set -euo pipefail
          node scripts/ci/repair-session-observer.mjs
          test -s /tmp/flixo-repair-behavior-trace.json
          jq -e '.protocol=="FLIXO-REPAIR-BOT-BEHAVIOR-TRACE-v1" and .traceHash != null' /tmp/flixo-repair-behavior-trace.json >/dev/null
      - name: Publish Repair Bot behavior trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-behavior-trace-${{ github.run_id }}
          path: /tmp/flixo-repair-behavior-trace.json
          if-no-files-found: error
          retention-days: 30
      - name: Determine whether canonical work is resident
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          ACTIVE_REPAIRS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --limit 50 --json status --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_TESTS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 50 --json status,headSha --jq 'map(select((.status == "queued" or .status == "in_progress") and .headSha == "'"$EXECUTION_SHA"'")) | length')"
          ACTIVE_OPERATION=false
          if [ "$ACTIVE_REPAIRS" -gt 0 ] || [ "$ACTIVE_GREEN" -gt 0 ] || [ "$ACTIVE_TESTS" -gt 0 ]; then
            ACTIVE_OPERATION=true
          fi
          echo "EXECUTION_SHA=$EXECUTION_SHA"
          echo "ACTIVE_REPAIRS=$ACTIVE_REPAIRS"
          echo "ACTIVE_GREEN=$ACTIVE_GREEN"
          echo "ACTIVE_TESTS=$ACTIVE_TESTS"
          echo "ACTIVE_OPERATION=$ACTIVE_OPERATION"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          echo "active_operation=$ACTIVE_OPERATION" >> "$GITHUB_OUTPUT"

      - name: Emit one canonical pulse and wake the full team
        id: pulse
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          node scripts/ci/flixo-ten-pulse.mjs \
            --sha="${{ steps.state.outputs.execution_sha }}" \
            --run-id="$GITHUB_RUN_ID" \
            --minute="$(date -u +%Y-%m-%dT%H:%M)" \
            --active-operation="${{ steps.state.outputs.active_operation }}" \
            --output=/tmp/flixo-heartbeat/flixo-team-pulse.json
          jq -e '.pulseCount==1 and .onePulsePerHeartbeat==true and (.pulses|length==1) and .pulses[0].action=="WAKE_ALL_AGENTS" and .pulses[0].wakeScope=="ALL_AGENTS" and .pulses[0].targetSha=="'"${{ steps.state.outputs.execution_sha }}"'"' /tmp/flixo-heartbeat/flixo-team-pulse.json >/dev/null
          echo 'CANONICAL_HEARTBEAT_PULSES=1'
          echo 'ONE_PULSE_WAKE_SCOPE=ALL_AGENTS'
          echo "ACTIVE_OPERATION=${{ steps.state.outputs.active_operation }}"
      - name: Deliver canonical team wake through exact-SHA relay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PULSE_ID="$(jq -r '.pulses[0].pulseId' /tmp/flixo-heartbeat/flixo-team-pulse.json)"
          gh workflow run flixo-team-wake-relay.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "entry_sha=${{ steps.state.outputs.execution_sha }}" \
            -f "pulse_id=$PULSE_ID" \
            -f "active_operation=${{ steps.state.outputs.active_operation }}"
          echo 'WAKE_RELAY_DISPATCHED=1'
          echo 'DIRECT_AUTO_REPAIR_DISPATCH=false'
          echo 'DIRECT_PUSH=false'

      - name: Full repository read-only sweep when no operation is active
        if: steps.state.outputs.active_operation == 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          node scripts/ci/flixo-ten-pulse.mjs scan-plan \
            --sha="${{ steps.state.outputs.execution_sha }}" \
            --run-id="$GITHUB_RUN_ID" \
            --minute="$(date -u +%Y-%m-%dT%H:%M)" \
            --active-operation=false \
            --output=/tmp/flixo-heartbeat/flixo-team-idle-pulse.json \
            --plan-output=/tmp/flixo-heartbeat/flixo-bot-development-plan.md \
            --scan-output=/tmp/flixo-heartbeat/flixo-full-repository-scan.json
          test -s /tmp/flixo-heartbeat/flixo-bot-development-plan.md
          test -s /tmp/flixo-heartbeat/flixo-full-repository-scan.json
          echo 'IDLE_MODE=FULL_REPOSITORY_READ_ONLY_SCAN'
          echo 'PLAN_TARGET=المهام.md'

