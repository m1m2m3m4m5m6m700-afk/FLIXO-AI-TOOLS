name: FLIXO Agent Repair Heartbeat

run-name: FLIXO Agent Repair Heartbeat ${{ github.run_id }}

on:
  push:
    branches: [execution]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  # Heartbeat emits only liveness/wake evidence. Privileged renewal stays in trusted Watchdog.
  actions: read
  contents: read

concurrency:
  group: flixo-agent-repair-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resident-watch:
    name: Keep the repair plane resident and wake canonical Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout liveness contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The heartbeat is read-only; privileged recovery remains with trusted canonical observers.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate permanent-residency liveness contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'RESIDENT_AGENT=true'
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'HEARTBEAT_24X7_MODE=true'
          echo 'SCHEDULE_WAKE_FLOOR_MINUTES=5'
          echo 'OPEN_WORK_SLEEP=FORBIDDEN'
          echo 'STALE_HEARTBEAT_ACTION=RECOVER_AND_CONTINUE'
          echo 'GREEN_DOES_NOT_SUSPEND_RESIDENCY=true'
          echo 'MANUAL_WAKE_REQUIRED=false'
          echo 'SELF_DISABLE_ALLOWED=false'
          echo 'SELF_ABORT_ALLOWED=false'
          echo 'RUN_END_DOES_NOT_END_TASK=true'

      - name: Emit canonical one-minute repair heartbeat continuously
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_HEARTBEAT_PATH: /tmp/flixo-heartbeat/heartbeat.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          PREVIOUS_HEARTBEAT_SHA=""
          for TICK in $(seq 1 45); do
            SHA="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/execution | awk '{print $1}')"
            [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            if [ -n "${PREVIOUS_HEARTBEAT_SHA:-}" ] && [ "$SHA" != "$PREVIOUS_HEARTBEAT_SHA" ]; then
              echo "HEARTBEAT_HEAD_ROLLOVER=true"
              echo "HEARTBEAT_PREVIOUS_TARGET_SHA=$PREVIOUS_HEARTBEAT_SHA"
              echo "HEARTBEAT_CURRENT_TARGET_SHA=$SHA"
            fi
            PREVIOUS_HEARTBEAT_SHA="$SHA"
            node scripts/ci/agent-liveness-protocol.mjs heartbeat --task="HEARTBEAT:$GITHUB_RUN_ID:$TICK" --state=ACTIVE --sha="$SHA" --progress=false --file="$FLIXO_HEARTBEAT_PATH"
            jq -e --arg sha "$SHA" '.protocolId=="AGENT_LIVENESS_PROTOCOL" and .state=="ACTIVE" and .exactSha==$sha and .progress==false' "$FLIXO_HEARTBEAT_PATH" >/dev/null
            node scripts/ci/action-repair-five-workers.mjs --role=wake --status=RED_INTERNAL --target-sha="$SHA" --run-id="$GITHUB_RUN_ID-$TICK" --fingerprint="HEARTBEAT-$GITHUB_RUN_ID-$TICK" --output=/tmp/flixo-heartbeat/action-wake-$TICK.json
            PULSE_INDEX=$(( $(date -u +%s) / 60 % 10 ))
            case "$PULSE_INDEX" in
              0) PULSE_OWNER="FLIXO1"; PULSE_TYPE="RCA_AND_ARCHITECTURE" ;;
              1) PULSE_OWNER="FLIXO2"; PULSE_TYPE="CODE_PATH_AND_RUNTIME" ;;
              2) PULSE_OWNER="FLIXO3"; PULSE_TYPE="TEST_CONTRACTS" ;;
              3) PULSE_OWNER="FLIXO4"; PULSE_TYPE="CI_AND_WORKFLOWS" ;;
              4) PULSE_OWNER="FLIXO5"; PULSE_TYPE="BROWSER_RUNTIME_AND_SECURITY" ;;
              5) PULSE_OWNER="FLIXO6"; PULSE_TYPE="INDEPENDENT_FALSIFICATION" ;;
              6) PULSE_OWNER="FLIXO7"; PULSE_TYPE="REPAIR_STRATEGY_AND_DEPENDENCIES" ;;
              7) PULSE_OWNER="FLIXO8"; PULSE_TYPE="IMPLEMENTATION_AND_REGRESSION" ;;
              8) PULSE_OWNER="FLIXO9"; PULSE_TYPE="EXACT_SHA_FALSE_GREEN_AND_SECURITY" ;;
              9) PULSE_OWNER="FLIXO10"; PULSE_TYPE="FINAL_VERIFICATION_AND_DEVELOPMENT_PLAN" ;;
              *) echo "FAIL CLOSED: invalid pulse index"; exit 1 ;;
            esac
            jq -n --arg sha "$SHA" --arg runId "$GITHUB_RUN_ID" --arg owner "$PULSE_OWNER" --arg pulseType "$PULSE_TYPE" --argjson tick "$TICK" --argjson pulseIndex "$PULSE_INDEX" '{schemaVersion:2,protocol:"FLIXO-TEAM-PULSE-CONTROLLER-v2",runId:$runId,targetSha:$sha,activeOperation:true,mode:"ACTIVE_OPERATION",pulseCount:1,pulseIndex:$pulseIndex,pulseOwner:$owner,pulseType:$pulseType,pulses:[{action:"WAKE_ALL_AGENTS",wakeScope:"ALL_AGENTS",targetSha:$sha,pulseOrdinal:1,cadence:"EVERY_MINUTE",pulseOwner:$owner,pulseType:$pulseType}],allAgentsWakeCount:10,actionRepairWakeCount:10,residentWakeCount:10,teamMemberCount:10,residentBotCount:10,residentBotIds:["FLIXO1","FLIXO2","FLIXO3","FLIXO4","FLIXO5","FLIXO6","FLIXO7","FLIXO8","FLIXO9","FLIXO10"],residentState:"ACTIVE_OPERATION",sleep:false,idle:false,readOnlyWhenResident:true,sourceMutationAllowed:false,onePulsePerHeartbeat:true,tick:$tick}' > /tmp/flixo-heartbeat/flixo-team-pulse-$TICK.json
            jq -e --arg sha "$SHA" '.pulseCount==1 and (.pulses|length)==1 and .pulses[0].action=="WAKE_ALL_AGENTS" and .pulses[0].wakeScope=="ALL_AGENTS" and .pulses[0].targetSha==$sha and .allAgentsWakeCount==10 and .sleep==false and .idle==false' /tmp/flixo-heartbeat/flixo-team-pulse-$TICK.json >/dev/null
            jq -e --arg sha "$SHA" '.action=="WAKE_ACTION_REPAIR_SQUAD" and .actionRepairSquadReady==true and .targetSha==$sha and .mutationAuthority==false and .directDispatch==false' /tmp/flixo-heartbeat/action-wake-$TICK.json >/dev/null
            echo 'CANONICAL_TEAM_PULSE=1'
            echo 'ONE_PULSE_WAKE_SCOPE=ALL_AGENTS'
            echo 'RESIDENT_SLEEP=false'
            echo 'RESIDENT_IDLE=false'
            echo "HEARTBEAT_EMITTED=true"
            echo "HEARTBEAT_TICK=$TICK"
            echo "HEARTBEAT_EXACT_SHA=$SHA"
            if [ "$TICK" -lt 45 ]; then sleep 60; fi
          done
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'HEARTBEAT_WINDOW_SECONDS=2700'
          echo 'HEARTBEAT_MINIMUM_ACTIVE_WINDOW_SECONDS=2700'
      - name: Verify five-minute heartbeat compliance
        id: heartbeat_compliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/scheduled-wakes.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/current-wake.json
          jq -s 'map(if type == "array" then . else [.] end) | add' /tmp/flixo-heartbeat/scheduled-wakes.json /tmp/flixo-heartbeat/current-wake.json > /tmp/flixo-heartbeat/wake-runs.json
          node scripts/ci/wake-compliance.mjs /tmp/flixo-heartbeat/wake-runs.json /tmp/flixo-heartbeat/wake-compliance.json
          jq -e '.status == "PASS" or .status == "BASELINE_REQUIRED"' /tmp/flixo-heartbeat/wake-compliance.json >/dev/null

      - name: Publish heartbeat compliance evidence
        if: always() && steps.heartbeat_compliance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-heartbeat-compliance-${{ github.run_id }}
          path: |
            /tmp/flixo-heartbeat/wake-compliance.json
            /tmp/flixo-heartbeat/heartbeat.json
          if-no-files-found: warn
          retention-days: 14

      - name: Observe every Repair Bot reaction from the active repair session
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_BEHAVIOR_TRACE_PATH: /tmp/flixo-repair-behavior-trace.json
        run: |
          set -euo pipefail
          node scripts/ci/repair-session-observer.mjs
          test -s /tmp/flixo-repair-behavior-trace.json
          jq -e '.protocol=="FLIXO-REPAIR-BOT-BEHAVIOR-TRACE-v1" and .traceHash != null' /tmp/flixo-repair-behavior-trace.json >/dev/null
      - name: Publish Repair Bot behavior trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-behavior-trace-${{ github.run_id }}
          path: /tmp/flixo-repair-behavior-trace.json
          if-no-files-found: error
          retention-days: 30
