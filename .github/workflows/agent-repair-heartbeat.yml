name: FLIXO Agent Repair Heartbeat

run-name: FLIXO Agent Repair Heartbeat ${{ github.run_id }}

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: flixo-agent-repair-heartbeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resident-watch:
    name: Keep the repair plane resident and wake canonical Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout liveness contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1
          persist-credentials: false

      - name: Validate permanent-residency liveness contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'RESIDENT_AGENT=true'
          echo 'HEARTBEAT_INTERVAL_MINUTES=5'
          echo 'OPEN_WORK_SLEEP=FORBIDDEN'
          echo 'STALE_HEARTBEAT_ACTION=RECOVER_AND_CONTINUE'
          echo 'GREEN_DOES_NOT_SUSPEND_RESIDENCY=true'
          echo 'MANUAL_WAKE_REQUIRED=false'
          echo 'SELF_DISABLE_ALLOWED=false'
          echo 'SELF_ABORT_ALLOWED=false'
          echo 'RUN_END_DOES_NOT_END_TASK=true'

      - name: Verify five-minute heartbeat compliance
        id: heartbeat_compliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/scheduled-wakes.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/current-wake.json
          jq -s 'add' /tmp/flixo-heartbeat/scheduled-wakes.json /tmp/flixo-heartbeat/current-wake.json > /tmp/flixo-heartbeat/wake-runs.json
          node scripts/ci/wake-compliance.mjs /tmp/flixo-heartbeat/wake-runs.json /tmp/flixo-heartbeat/wake-compliance.json
          jq -e '.status == "PASS" or .status == "BASELINE_REQUIRED"' /tmp/flixo-heartbeat/wake-compliance.json >/dev/null

      - name: Publish heartbeat compliance evidence
        if: always() && steps.heartbeat_compliance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-heartbeat-compliance-${{ github.run_id }}
          path: /tmp/flixo-heartbeat/wake-compliance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Determine whether canonical repair work is already resident
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          ACTIVE_GREEN_GATES="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --limit 50 --json status,headSha --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          ACTIVE_REPAIRS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-repair.yml --limit 50 --json status,headSha --jq 'map(select(.status == "queued" or .status == "in_progress")) | length')"
          GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --branch execution --commit "$EXECUTION_SHA" --limit 50 --json databaseId,status,conclusion,headSha,createdAt --jq 'map(select(.headSha == "'"$EXECUTION_SHA"'" and .conclusion == "success")) | sort_by(.createdAt) | last.databaseId // empty')"

          echo "EXECUTION_SHA=$EXECUTION_SHA"
          echo "ACTIVE_GREEN_GATES=$ACTIVE_GREEN_GATES"
          echo "ACTIVE_REPAIRS=$ACTIVE_REPAIRS"
          echo "LAST_GREEN_GATE=${GREEN:-none}"

          if [ "$ACTIVE_GREEN_GATES" -gt 0 ] || [ "$ACTIVE_REPAIRS" -gt 0 ]; then
            echo 'RESIDENT_WORK_ALREADY_ACTIVE=true'
            echo 'wake=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$GREEN" ]; then
            echo 'CANONICAL_GREEN_ALREADY_PROVEN=true'
            echo 'wake=false' >> "$GITHUB_OUTPUT"
          else
            echo 'CANONICAL_GREEN_NOT_PROVEN=true'
            echo 'wake=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Wake canonical Green Gate automatically
        if: steps.state.outputs.wake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run daily-flixo-green-gate.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'AUTOMATIC_GREEN_GATE_WAKE=true'
          echo 'HUMAN_MANUAL_REPAIR_LAUNCH=false'
          echo 'REPAIR_DISPATCH_REMAINS_CANONICAL_GREEN_GATE_AUTHORITY=true'
