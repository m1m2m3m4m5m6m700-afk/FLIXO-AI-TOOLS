name: FLIXO Agent Repair Heartbeat

run-name: FLIXO Agent Repair Heartbeat ${{ github.run_id }}

on:
  push:
    branches: [execution]
  # Scheduled resident bootstrap is owned exclusively by the trusted Watchdog.
  # This prevents one resident window from being multiplied every five minutes.
  workflow_dispatch:

permissions:
  # Heartbeat emits only liveness/wake evidence. Privileged renewal stays in trusted Watchdog.
  # Single guardian lane: trusted Watchdog owns privileged renewal; Heartbeat remains read-only observation/wake evidence.
  actions: read
  contents: read

concurrency:
  group: flixo-agent-repair-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resident-watch:
    name: Keep the repair plane resident and wake canonical Green Gate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout liveness contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The heartbeat is read-only; privileged recovery remains with trusted canonical observers.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate permanent-residency liveness contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'RESIDENT_AGENT=true'
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'ACTIVE_BOT_COUNT=5'
          echo 'ACTIVE_BOT_COMMITMENT_MINUTES=60'
          echo 'ACTIVE_BOT_COHORT_COUNT=40'
          echo 'LOGICAL_BOT_CYCLE=200_TO_1'
          echo 'NEXT_COHORT_READY_REQUIRED=true'
          echo 'ACTIVE_RUNTIME_CAPACITY=5'
          echo 'HEARTBEAT_24X7_MODE=true'
          echo 'SCHEDULE_WAKE_FLOOR_MINUTES=5'
          echo 'OPEN_WORK_SLEEP=FORBIDDEN'
          echo 'STALE_HEARTBEAT_ACTION=RECOVER_AND_CONTINUE'
          echo 'GREEN_DOES_NOT_SUSPEND_RESIDENCY=true'
          echo 'MANUAL_WAKE_REQUIRED=false'
          echo 'SELF_DISABLE_ALLOWED=false'
          echo 'SELF_ABORT_ALLOWED=false'
          echo 'RUN_END_DOES_NOT_END_TASK=true'

      - name: Emit canonical one-minute repair heartbeat continuously
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_HEARTBEAT_PATH: /tmp/flixo-heartbeat/heartbeat.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          PREVIOUS_HEARTBEAT_SHA=""
          WORKTREE_PATH="/tmp/flixo-execution-source"
          WORKTREE_SHA=""
          CURRENT_COHORT_INDEX=""
          CURRENT_COHORT_STARTED_EPOCH=""
          CYCLE_NUMBER=""
          for TICK in $(seq 1 61); do
            LIVE_SHA="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/execution | awk '{print $1}')"
            [[ "$LIVE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            SHA="$LIVE_SHA"
            if [ "$WORKTREE_SHA" != "$SHA" ]; then
              git fetch origin "refs/heads/execution:refs/remotes/origin/execution" --depth=1
              FETCHED_SHA="$(git rev-parse refs/remotes/origin/execution)"
              [[ "$FETCHED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
              SHA="$FETCHED_SHA"
              if [ -e "$WORKTREE_PATH/.git" ]; then git worktree remove --force "$WORKTREE_PATH"; elif [ -d "$WORKTREE_PATH" ]; then rm -rf "$WORKTREE_PATH"; fi
              git worktree add --detach "$WORKTREE_PATH" "$SHA"
              WORKTREE_SHA="$SHA"
            fi
            [[ "$WORKTREE_SHA" == "$SHA" ]]
            if [ -z "$CURRENT_COHORT_INDEX" ]; then
              BOOTSTRAP_OUTPUT="/tmp/flixo-heartbeat/bootstrap-rotation-$TICK.json"
              NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              (cd "$WORKTREE_PATH" && node scripts/ci/five-bot-rotation.mjs --sha="$SHA" --now="$NOW" --output="$BOOTSTRAP_OUTPUT")
              CURRENT_COHORT_INDEX="$(jq -r '.cohortIndex' "$BOOTSTRAP_OUTPUT")"
              CYCLE_NUMBER="$(jq -r '.cycleNumber' "$BOOTSTRAP_OUTPUT")"
              CURRENT_COHORT_STARTED_EPOCH="$(date +%s)"
            fi
            [[ "$CURRENT_COHORT_INDEX" =~ ^[0-9]+$ ]]
            NOW_EPOCH="$(date +%s)"
            ELAPSED_SECONDS=$((NOW_EPOCH-CURRENT_COHORT_STARTED_EPOCH))
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ROTATION_OUTPUT="/tmp/flixo-heartbeat/five-bot-rotation-$TICK.json"
            (cd "$WORKTREE_PATH" && node scripts/ci/five-bot-rotation.mjs --sha="$SHA" --now="$NOW" --cohort-index="$CURRENT_COHORT_INDEX" --cycle-number="$CYCLE_NUMBER" --output="$ROTATION_OUTPUT")
            (cd "$WORKTREE_PATH" && node scripts/ci/action-repair-five-workers.mjs --role=wake --status=RED_INTERNAL --target-sha="$SHA" --run-id="$GITHUB_RUN_ID-$TICK" --fingerprint="HEARTBEAT-$GITHUB_RUN_ID-$TICK" --cohort-index="$CURRENT_COHORT_INDEX" --cycle-number="$CYCLE_NUMBER" --output=/tmp/flixo-heartbeat/action-wake-$TICK.json)
            jq -e --arg sha "$SHA" '.action=="WAKE_ALL_ACTION_REPAIR_TEAM" and .actionRepairSquadReady==true and .targetSha==$sha and .activeCohortSize==5 and (.activeBotIds|length)==5 and (.nextBotIds|length)==5 and (.nextCohortReadyCount==5) and .fiveBotResidency.requiredBotCount==5 and .fiveBotResidency.postTaskCloseState=="READY_RESIDENT" and .fiveBotResidency.retainResidentUntilJourneyComplete==true and  .fiveBotResidency.journeyLogicalBotCount==200 and  .fiveBotResidency.journeyCohortCount==40 and .fiveBotResidency.journeyCohortSize==5 and .fiveBotResidency.sleep==false and .fiveBotResidency.idle==false and .withdrawal==false' /tmp/flixo-heartbeat/action-wake-$TICK.json >/dev/null
            if [ "$ELAPSED_SECONDS" -ge 3600 ]; then
              NEXT_COHORT_INDEX=$(( (CURRENT_COHORT_INDEX + 1) % 24 ))
              HANDOFF_OUTPUT="/tmp/flixo-heartbeat/handoff-$TICK.json"
              if (cd "$WORKTREE_PATH" && node scripts/ci/five-bot-handoff-gate.mjs --packet="/tmp/flixo-heartbeat/action-wake-$TICK.json" --sha="$SHA" --expected-cohort="$NEXT_COHORT_INDEX" --output="$HANDOFF_OUTPUT"); then
                CURRENT_COHORT_INDEX="$NEXT_COHORT_INDEX"
                if [ "$CURRENT_COHORT_INDEX" -eq 0 ]; then CYCLE_NUMBER=$((CYCLE_NUMBER+1)); fi
                CURRENT_COHORT_STARTED_EPOCH="$NOW_EPOCH"
                echo 'ACTIVE_COHORT_HANDOFF=HANDOFF_COMMITTED'
                (cd "$WORKTREE_PATH" && node scripts/ci/five-bot-rotation.mjs --sha="$SHA" --now="$NOW" --cohort-index="$CURRENT_COHORT_INDEX" --cycle-number="$CYCLE_NUMBER" --output="$ROTATION_OUTPUT")
                (cd "$WORKTREE_PATH" && node scripts/ci/action-repair-five-workers.mjs --role=wake --status=RED_INTERNAL --target-sha="$SHA" --run-id="$GITHUB_RUN_ID-$TICK-HANDOFF" --fingerprint="HANDOFF-$GITHUB_RUN_ID-$TICK" --cohort-index="$CURRENT_COHORT_INDEX" --cycle-number="$CYCLE_NUMBER" --output=/tmp/flixo-heartbeat/action-wake-$TICK.json)
              else
                echo 'ACTIVE_COHORT_HANDOFF=HANDOFF_PENDING'
                echo 'ACTIVE_COHORT_RELEASE_BLOCKED=true'
                echo 'CURRENT_FIVE_REMAIN_ACTIVE_UNTIL_FIVE_READY=true'
              fi
            else
              echo 'ACTIVE_COHORT_HANDOFF=COMMITMENT_ACTIVE'
            fi
            PREVIOUS_HEARTBEAT_SHA="$SHA"
            (cd "$WORKTREE_PATH" && node scripts/ci/agent-liveness-protocol.mjs heartbeat --task="HEARTBEAT:$GITHUB_RUN_ID:$TICK" --state=ACTIVE --sha="$SHA" --progress=false --file="$FLIXO_HEARTBEAT_PATH")
            jq -e --arg sha "$SHA" '.protocolId=="AGENT_LIVENESS_PROTOCOL" and .state=="ACTIVE" and .exactSha==$sha and .progress==false' "$FLIXO_HEARTBEAT_PATH" >/dev/null
            PULSE_OUTPUT="/tmp/flixo-heartbeat/flixo-team-pulse-$TICK.json"
            (cd "$WORKTREE_PATH" && node scripts/ci/flixo-ten-pulse.mjs --sha="$SHA" --run-id="$GITHUB_RUN_ID-$TICK" --minute="$NOW" --active-operation=true --cohort-index="$CURRENT_COHORT_INDEX" --cycle-number="$CYCLE_NUMBER" --output="$PULSE_OUTPUT")
            jq -e --arg sha "$SHA" '.protocol=="FLIXO-TEAM-PULSE-CONTROLLER-v3" and .targetSha==$sha and .pulseCount==1 and ( .logicalBotIds|length)==120 and .activeBotCount==5 and (.activeBotIds|length)==5 and (.nextBotIds|length)==5 and .allAgentsWakeCount==10 and .sleep==false and .idle==false and .fiveBotResidency.requiredBotCount==5 and .fiveBotResidency.postTaskCloseState=="READY_RESIDENT" and .fiveBotResidency.retainResidentUntilJourneyComplete==true and  .fiveBotResidency.journeyLogicalBotCount==200 and  .fiveBotResidency.journeyCohortCount==40' "$PULSE_OUTPUT" >/dev/null
            echo 'CANONICAL_TEAM_PULSE=1'
            echo 'ONE_PULSE_WAKE_SCOPE=ALL_AGENTS'
            echo 'RESIDENT_SLEEP=false'
            echo 'RESIDENT_IDLE=false'
            echo "HEARTBEAT_EMITTED=true"
            echo "HEARTBEAT_TICK=$TICK"
            echo "HEARTBEAT_EXACT_SHA=$SHA"
            if [ "$TICK" -lt 61 ]; then sleep 60; fi
          done
          echo 'HEARTBEAT_INTERVAL_SECONDS=60'
          echo 'HEARTBEAT_WINDOW_SECONDS=3600'
          echo 'HEARTBEAT_MINIMUM_ACTIVE_WINDOW_SECONDS=3600'
          echo 'ACTIVE_COHORT_COMMITMENT_SECONDS=3600'
          echo 'ACTIVE_COHORT_HANDOFF=NEXT_5_READY_BEFORE_RELEASE'
          echo 'ACTIVE_COHORTS_PER_200_BOT_CYCLE=40'
          echo 'ACTIVE_COHORT_HANDOFF_GATE=FIVE_READY_EXACT_SHA'
          echo 'ACTIVE_COHORT_RELEASE_BLOCKED_UNTIL_READY=true'
          echo 'FIVE_BOT_POST_CLOSE_STATE=READY_RESIDENT'
          echo 'FIVE_BOT_REMAIN_RESIDENT_UNTIL_200_JOURNEY_COMPLETE=true'
          echo 'FIVE_BOT_SLEEP_DURING_200_JOURNEY=false'
          echo 'FIVE_BOT_IDLE_DURING_200_JOURNEY=false'
          if [ -e "$WORKTREE_PATH/.git" ]; then git worktree remove --force "$WORKTREE_PATH"; fi
      - name: Verify five-minute heartbeat compliance
        id: heartbeat_compliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-heartbeat
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-repair-heartbeat.yml --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/scheduled-wakes.json
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,startedAt,headSha,event > /tmp/flixo-heartbeat/current-wake.json
          jq -s 'map(if type == "array" then . else [.] end) | add' /tmp/flixo-heartbeat/scheduled-wakes.json /tmp/flixo-heartbeat/current-wake.json > /tmp/flixo-heartbeat/wake-runs.json
          node scripts/ci/wake-compliance.mjs /tmp/flixo-heartbeat/wake-runs.json /tmp/flixo-heartbeat/wake-compliance.json
          jq -e '.status == "PASS" or .status == "BASELINE_REQUIRED"' /tmp/flixo-heartbeat/wake-compliance.json >/dev/null

      - name: Publish heartbeat compliance evidence
        if: always() && steps.heartbeat_compliance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-heartbeat-compliance-${{ github.run_id }}
          path: |
            /tmp/flixo-heartbeat/wake-compliance.json
            /tmp/flixo-heartbeat/heartbeat.json
          if-no-files-found: warn
          retention-days: 14

      - name: Observe every Repair Bot reaction from the active repair session
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_BEHAVIOR_TRACE_PATH: /tmp/flixo-repair-behavior-trace.json
        run: |
          set -euo pipefail
          node scripts/ci/repair-session-observer.mjs
          test -s /tmp/flixo-repair-behavior-trace.json
          jq -e '.protocol=="FLIXO-REPAIR-BOT-BEHAVIOR-TRACE-v1" and .traceHash != null' /tmp/flixo-repair-behavior-trace.json >/dev/null
      - name: Publish Repair Bot behavior trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-behavior-trace-${{ github.run_id }}
          path: /tmp/flixo-repair-behavior-trace.json
          if-no-files-found: error
          retention-days: 30
