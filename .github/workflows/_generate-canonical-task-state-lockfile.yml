name: Generate canonical task-state lockfile

on:
  push:
    branches:
      - architecture/canonical-task-state

permissions:
  contents: write
  actions: write

jobs:
  generate:
    if: ${{ github.ref_name == 'architecture/canonical-task-state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove bootstrap workflow
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/_generate-canonical-task-state-lockfile.yml
          git commit -m "build(runtime): regenerate canonical npm lockfile"
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Trigger canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: gh workflow run "FLIXO CI" --ref "$HEAD_BRANCH"
