name: FLIXO Auto Repair Bot

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

# One repair lane only. Failures are diagnosed/learned in one run and, when
# certifiable, accumulated into the single repair branch/PR. Learning-only
# outcomes never create a second branch, PR, or repair workflow.
concurrency:
  group: flixo-auto-repair-main
  cancel-in-progress: false

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
  FLIXO_REPAIR_BRANCH: bot/auto-repair

jobs:
  repair:
    name: Single-lane diagnose, repair and learn
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted repair engine from current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize failed SHA as isolated repair target
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FAILED_SHA"
          git worktree add --detach /tmp/flixo-repair-target "$FAILED_SHA"
          printf '%s\n' "$FAILED_SHA" > /tmp/flixo-failed-sha

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install target dependencies
        id: install_target
        continue-on-error: true
        working-directory: /tmp/flixo-repair-target
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Record target dependency-install failure
        if: steps.install_target.outcome != 'success'
        run: |
          printf '%s\n' 'target-dependency-install-failed' > /tmp/flixo-engine-outcome
          printf '%s\n' 'unrepaired' > /tmp/flixo-learning-outcome
          printf '%s\n' '{"rootCause":"target_dependency_install_failure"}' > /tmp/flixo-root-cause.json

      - name: Capture failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1 || true
          test -s "$FLIXO_FAILURE_LOG" || printf '%s\n' 'No failed log payload was available.' > "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$RUN_ID"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}"
            grep -E -i 'error|failed|failure|timeout|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(' "$FLIXO_FAILURE_LOG" | tail -n 300 || true
          } > /tmp/flixo-repair-summary.txt

      - name: Classify root cause
        if: steps.install_target.outcome == 'success'
        run: node scripts/ci/auto-repair-classifier.mjs

      - name: Run bounded repair engine against isolated target
        if: steps.install_target.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: /tmp/flixo-repair-target
        run: node scripts/ci/auto-repair-engine.mjs

      - name: Verify only a genuinely verified repair
        id: verify
        if: always()
        working-directory: /tmp/flixo-repair-target
        run: |
          set -euo pipefail
          if [ "${{ steps.install_target.outcome }}" != "success" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Target dependencies could not be installed; repair is not certifiable.'
            exit 0
          fi
          test -f /tmp/flixo-repair-evidence.json || {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'No repair evidence was produced; nothing is certified.'
            exit 0
          }
          OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          echo "REPAIR_OUTCOME=$OUTCOME"
          if [ "$OUTCOME" != "verified-repair" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo "Repair outcome '$OUTCOME' is not a verified repair; no source repair will be published."
            exit 0
          fi
          git diff --quiet && {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Engine reported verified-repair but produced no source diff; refusing certification.'
            exit 0
          }
          npm run typecheck
          npm run test:static
          npm run test:build
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Record learning outcome for every diagnosed failure
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          FLIXO_FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FLIXO_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -f /tmp/flixo-root-cause.json || printf '%s\n' '{"rootCause":"unknown"}' > /tmp/flixo-root-cause.json
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          if [ -f /tmp/flixo-repair-evidence.json ]; then
            RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||'')")
            ENGINE_OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          else
            RULE=''
            ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          fi
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$ENGINE_OUTCOME" = "verified-repair" ]; then
            LEARNING_OUTCOME='success'
          else
            LEARNING_OUTCOME='unrepaired'
          fi
          FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" FLIXO_LEARNING_OUTCOME="$LEARNING_OUTCOME" FLIXO_VERIFICATION="$ENGINE_OUTCOME" node scripts/ci/auto-repair-learning.mjs
          printf '%s\n' "$ENGINE_OUTCOME" > /tmp/flixo-engine-outcome
          printf '%s\n' "$LEARNING_OUTCOME" > /tmp/flixo-learning-outcome

      - name: Carry verified learning memory into the repair candidate
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-repair-target/diagnostics/auto-repair
          cp diagnostics/auto-repair/memory.json /tmp/flixo-repair-target/diagnostics/auto-repair/memory.json

      - name: Publish verified repair to the single repair branch
        if: steps.verify.outputs.verified == 'true' && !cancelled()
        run: |
          set -euo pipefail
          cd /tmp/flixo-repair-target
          git config user.name 'flixo-auto-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$FLIXO_REPAIR_BRANCH" || true
          if git ls-remote --exit-code --heads origin "$FLIXO_REPAIR_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$FLIXO_REPAIR_BRANCH"
            git switch -C "$FLIXO_REPAIR_BRANCH" "origin/$FLIXO_REPAIR_BRANCH"
            git merge --no-edit --no-ff "${{ github.event.workflow_run.head_sha }}" || {
              echo 'Single repair branch has diverged from the failed SHA; refusing unsafe accumulation.'
              exit 1
            }
            git checkout --theirs .
            git add -A
          else
            git switch -c "$FLIXO_REPAIR_BRANCH"
          fi
          git add -A
          git diff --cached --quiet && {
            echo 'No new verified repair changes to publish.'
            exit 0
          }
          git commit -m "fix(ci): accumulate verified repair from run ${{ github.event.workflow_run.id }}"
          git push --set-upstream origin "$FLIXO_REPAIR_BRANCH"

      - name: Open or reuse the single draft repair PR
        if: steps.verify.outputs.verified == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$FLIXO_REPAIR_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --title "fix(ci): consolidated automatic repairs" \
              --body "## FLIXO Auto Repair Bot\n\nSingle repair lane. Verified repairs are accumulated in one branch and one draft PR.\n\nLatest failed run: $RUN_ID\nLatest failed SHA: $FAILED_SHA\n\nUnverified failures remain diagnostics/learning only and never create a second repair PR."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$FLIXO_REPAIR_BRANCH" --draft \
              --title "fix(ci): consolidated automatic repairs" \
              --body "## FLIXO Auto Repair Bot\n\nThis is the single repair lane for verified automatic CI repairs.\n\nLatest failed run: $RUN_ID\nLatest failed SHA: $FAILED_SHA\n\nOnly independently verified source repairs are accumulated here."
          fi

      - name: Publish learning and diagnostic artifacts only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-auto-repair-${{ github.event.workflow_run.id }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-root-cause.json
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-engine-outcome
            /tmp/flixo-learning-outcome
            diagnostics/auto-repair/memory.json
          if-no-files-found: warn
          retention-days: 30
