name: FLIXO Auto Repair Bot

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: flixo-auto-repair-main
  cancel-in-progress: true

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json

jobs:
  repair:
    name: Diagnose, learn and safely repair main CI failures
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact failed SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Capture failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1 || true
          test -s "$FLIXO_FAILURE_LOG" || printf '%s\n' 'No failed log payload was available.' > "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$RUN_ID"
            echo 'head_sha=${{ github.event.workflow_run.head_sha }}'
            grep -E -i 'error|failed|failure|timeout|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(' "$FLIXO_FAILURE_LOG" | tail -n 300 || true
          } > /tmp/flixo-repair-summary.txt

      - name: Classify root cause
        run: node scripts/ci/auto-repair-classifier.mjs

      - name: Run bounded learning-aware repair engine
        run: node scripts/ci/auto-repair-engine.mjs

      - name: Verify repair before publishing
        id: verify
        if: hashFiles('/tmp/flixo-repair-evidence.json') != ''
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes were produced; no repair PR will be created.'
            exit 0
          fi
          npm run typecheck
          npm run test:static
          npm run test:build

      - name: Record verified learning outcome
        if: always() && hashFiles('/tmp/flixo-repair-evidence.json') != ''
        env:
          FLIXO_LEARNING_OUTCOME: ${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}
          FLIXO_VERIFICATION: ${{ steps.verify.outcome }}
          FLIXO_ROOT_CAUSE: ${{ '' }}
        run: |
          set -euo pipefail
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selectedRule||'')")
          FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" node scripts/ci/auto-repair-learning.mjs

      - name: Create repair branch
        if: steps.verify.outcome == 'success' && !cancelled()
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          BRANCH="bot/auto-repair-${{ github.event.workflow_run.id }}"
          git switch -c "$BRANCH"
          git config user.name 'flixo-auto-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(ci): apply safe automatic repair from run ${{ github.event.workflow_run.id }}"
          git push --set-upstream origin "$BRANCH"
          echo "REPAIR_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open repair PR
        if: steps.verify.outcome == 'success' && env.REPAIR_BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$REPAIR_BRANCH" \
            --draft \
            --title "fix(ci): automatic repair for failed run $RUN_ID" \
            --body "## FLIXO Auto Repair Bot\n\nFailed canonical CI run: $RUN_ID\n\nFailed SHA: $FAILED_SHA\n\nThe bot uses deterministic classification, bounded playbooks, historical scoring and post-repair verification.\n\nNo direct push to main is performed by the repair bot."

      - name: Publish diagnostic and learning artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-auto-repair-${{ github.event.workflow_run.id }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-root-cause.json
            /tmp/flixo-repair-evidence.json
            diagnostics/auto-repair/memory.json
          if-no-files-found: warn
          retention-days: 30
