name: FLIXO Auto Repair Bot
run-name: FLIXO Auto Repair Chain ${{ inputs.chain_id || inputs.target_run_id }} ${{ inputs.failure_fingerprint || 'NO_FINGERPRINT' }}

# TWO-BRANCH MODEL:
# execution = sole working/repair branch
# main      = sole production/source-of-truth branch
# No workflow in this file may create another branch.
on:
  # Main currently retains the historical push trigger for this workflow.
  # Keep the execution copy trigger-compatible so a push cannot produce an invalid/no-job run.
  # This compatibility job does not grant mutation or self-dispatch authority.
  push:
    branches: [execution]
  workflow_dispatch:
    inputs:
      resident:
        description: 'Keep the Repair Bot resident and observing the active repair session'
        required: false
        default: 'false'
        type: string
      target_run_id:
        description: 'Workflow run ID to diagnose and repair; omitted only in resident mode'
        required: false
        type: string
      chain_id:
        description: 'Stable repair-chain identifier; recursive runs must reuse it'
        required: false
        type: string
      failure_fingerprint:
        description: 'Watcher-provided exact failure fingerprint for Control Plane identity'
        required: false
        type: string
      repair_lease_ref:
        description: 'Existing atomic global repair lease ref created by the watcher'
        required: false
        type: string
      repair_lease_attempt:
        description: 'Durable lease attempt number; 1 is initial claim, >1 is stale recovery'
        required: false
        default: '1'
        type: string
      convergence_guidance_artifact_id:
        description: 'Prior Auto Repair artifact carrying the verified counterexample required for convergence cycles > 1'
        required: false
        type: string
      prompt_source_run_id:
        description: 'Daily Green Gate run that published the comprehensive repair prompt bundle'
        required: false
        type: string

permissions:
  # Sole source-mutation authority for the repair plane.
  # Actions administration is intentionally NOT granted: peer observers may wake
  # the bot, but cannot use it to disable or reconfigure Actions.
  # It still cannot bypass the execution-only mutation boundary or write main.
  contents: read
  # Read-only artifact/run observation is required for the independent twin result.
  actions: read
  # No Actions-admin capability: peer agents cannot be controlled by the repair bot.
  checks: read
  pull-requests: write
  issues: write
  statuses: write
  security-events: write

concurrency:
  # One writer lane per execution ref. Different failure fingerprints/target runs must not mutate concurrently.
  # The resident observer is isolated because it is non-mutating and long-lived.
  group: flixo-execution-mutation-lane
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
  FLIXO_REPAIR_LANE: single
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  FLIXO_HISTORY_LIMIT: '100'
  FLIXO_REPAIR_CHAIN_ID: ${{ inputs.chain_id || inputs.target_run_id }}
  FLIXO_FAILURE_FINGERPRINT: ${{ inputs.failure_fingerprint || '' }}
  FLIXO_REPAIR_LEASE_REF: ${{ inputs.repair_lease_ref || '' }}
  FLIXO_REPAIR_LEASE_ATTEMPT: ${{ inputs.repair_lease_attempt || '1' }}
  FLIXO_REPAIR_ATTEMPT: ${{ inputs.repair_lease_attempt || '1' }}
  FLIXO_CONVERGENCE_GUIDANCE_ARTIFACT_ID: ${{ inputs.convergence_guidance_artifact_id || '' }}
  FLIXO_MUTATION_ADMISSION: /tmp/flixo-mutation-admission.json
  FLIXO_CHAIR_CONTEXT: /tmp/flixo-chair1-proposal.json
  FLIXO_REPAIR_BEHAVIOR_TRACE_PATH: /tmp/flixo-repair-behavior-trace.json
  FLIXO_HISTORICAL_SOLUTION_PATH: /tmp/flixo-historical-solution-index.json
  FLIXO_TWIN_A_PATH: /tmp/flixo-twin-a.json
  FLIXO_TWIN_B_PATH: /tmp/flixo-twin-b.json
  FLIXO_SELECTION_PATH: /tmp/flixo-selected-repair-option.json
  # prompt_source_run_id remains a compatibility input; artifact provenance is resolved from the canonical Green Gate by exact SHA.
  # Intentionally no finite repair-chain stop; closure is governed only by canonical GREEN.
  # sole mutation authority: AUTO_REPAIR_BOT on execution; peer agents are review/dispatch-only.
  # DISPATCH AUTHORITY: Daily·FLIXO Green Gate.
  # ACTION-VAULT-AUTONOMY-MODE: diagnostics/auto-repair/action-vault/ACTION-VAULT-AUTONOMY-MODE.json is canonical admission policy.
  # This workflow is executor-only and must never self-dispatch.
  FLIXO_STRICT_RED_REPAIR: 'true'
  FLIXO_REPAIR_OPERATING_MODE: PROPOSAL_ONLY_UNDER_CHAIR
  FLIXO_ROUTINE_HUMAN_APPROVAL: 'false'
  FLIXO_CRITICAL_HUMAN_AUTH_REQUIRED: 'true'
  FLIXO_BRANCH_CONFLICT_RECOVERY: 'true'
  FLIXO_CONFLICT_OWNER_WITHDRAWAL: 'false'
  FLIXO_TRUSTED_REPAIR_MEMORY: /tmp/flixo-trusted-memory.json
  FLIXO_SCOUT_REPORT: /tmp/flixo-investigation/code-scout-latest.json
  FLIXO_DIAGNOSTIC_LINE_LIMIT: '5000'
  # Independent Actions learning owner.
  FLIXO_ACTION_INDEX_BOT_ID: ACTION-INDEX
  FLIXO_ACTION_MASTER: repairAgent
  FLIXO_AUTO_REPAIR_ROLE: AUTO_REPAIR_BOT
  FLIXO_AUTO_REPAIR_CHAIR_AUDIT_REQUIRED: 'true'
  FLIXO_AUTO_REPAIR_SELF_APPROVAL: 'false'
  FLIXO_CHAIR_SIGNING_KEY: ${{ github.token }}
  FLIXO_HEAD_AUTHORITY_PROOF: /tmp/flixo-head-authority.json
  FLIXO_CHAIR1_PRIMARY_MISSION: CHAIR1_PRIMARY_TEST_CYCLE_REPAIR
  FLIXO_CHAIR1_MISSION_PATH: /tmp/flixo-chair1-repair-mission.json

jobs:
  push_compatibility:
    name: Push compatibility — no self-dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate canonical execution push context
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "execution"
          echo 'AUTO_REPAIR_PUSH_COMPATIBILITY=PASS'
          echo 'AUTO_REPAIR_SELF_DISPATCH=DISABLED'

  resident:
    name: Resident Repair Bot monitor — never idle during an open repair session
    if: github.event_name == 'workflow_dispatch' && inputs.resident == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout trusted main bootstrap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Validate permanent Repair Bot residency contract
        run: |
          set -euo pipefail
          node scripts/ci/agent-liveness-protocol.mjs validate
          echo 'REPAIR_BOT_RESIDENT=true'
          echo 'REPAIR_BOT_MAX_IDLE_GAP_SECONDS=60'
          echo 'REPAIR_BOT_SESSION_END=CANONICAL_GREEN_ONLY'
          echo 'REPAIR_BOT_SOURCE_MUTATION=DISABLED_IN_RESIDENT_MODE'

      - name: Monitor current execution continuously until canonical GREEN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE="$(( $(date +%s) + 19800 ))"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-flixo-green-gate.yml --branch execution --commit "$EXECUTION_SHA" --limit 50 --json databaseId,status,conclusion,headSha,createdAt --jq 'map(select(.headSha == "'"$EXECUTION_SHA"'" and .conclusion == "success")) | sort_by(.createdAt) | last.databaseId // empty')"
            FAILED="$(gh run list --repo "$GITHUB_REPOSITORY" --branch execution --commit "$EXECUTION_SHA" --limit 100 --json databaseId,name,status,conclusion,headSha,createdAt --jq 'map(select(.headSha == "'"$EXECUTION_SHA"'" and (.conclusion == "failure" or .conclusion == "timed_out"))) | sort_by(.createdAt) | last | if . == null then "" else "\(.name)#\(.databaseId)" end')"
            echo "RESIDENT_SHA=$EXECUTION_SHA"
            echo "RESIDENT_CANONICAL_GREEN=${GREEN:-none}"
            echo "RESIDENT_CURRENT_RED=${FAILED:-none}"
            if [ -n "$GREEN" ]; then
              echo 'REPAIR_BOT_SESSION_TERMINATION=CANONICAL_GREEN'
              exit 0
            fi
            echo 'REPAIR_BOT_RESIDENCY=CONTINUE'
            sleep 60
          done
          echo 'REPAIR_BOT_RESIDENCY_WINDOW_EXPIRED=CONTROLLED_HANDOFF'
          exit 1

  repair:
    name: Single-lane diagnose, execute, verify and learn on execution
    if: github.event_name == 'workflow_dispatch' && inputs.resident != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main bootstrap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repair controller dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Enforce central Council directive before diagnosis or mutation
        run: node scripts/ci/test-council-directive.mjs

      - name: Resolve target workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TARGET_RUN_ID" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: target_run_id must be numeric.'; exit 1 ;;
          esac
          if [ -n "$FLIXO_FAILURE_FINGERPRINT" ]; then
            case "$FLIXO_FAILURE_FINGERPRINT" in
              ''|*[!a-fA-F0-9]*) echo 'FAIL CLOSED: failure fingerprint must be hexadecimal.'; exit 1 ;;
            esac
          fi
          CONCLUSION="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          case "$CONCLUSION" in
            failure|timed_out) ;;
            *) echo "Target run $TARGET_RUN_ID is not a diagnosable failure: $CONCLUSION"; exit 1 ;;
          esac
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,headSha,headBranch,name
          RUN_META="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,name,conclusion)"
          FAILED_SHA="$(printf '%s' "$RUN_META" | jq -r '.headSha')"
          FAILED_BRANCH="$(printf '%s' "$RUN_META" | jq -r '.headBranch')"
          FAILED_NAME="$(printf '%s' "$RUN_META" | jq -r '.name')"
          test -n "$FAILED_SHA" && test "$FAILED_SHA" != "null"
          test "$FAILED_BRANCH" = "execution" || {
            echo "FAIL CLOSED: repair targets must originate from execution; main mutation is prohibited."
            exit 1
          }
          CURRENT_TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test -n "$CURRENT_TARGET_SHA" || { echo "FAIL CLOSED: execution repair target is missing."; exit 1; }
          echo "CURRENT_TARGET_SHA=$CURRENT_TARGET_SHA"
          test "$CURRENT_TARGET_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: execution head moved after failure; refusing stale repair retargeting."
            exit 1
          }
          echo "FLIXO_BRANCH_CONFLICT_RECOVERY=false" >> "$GITHUB_ENV"
          printf "%s\n" "$CURRENT_TARGET_SHA" > /tmp/flixo-current-target-sha
          printf "%s\n" "$FAILED_SHA" > /tmp/flixo-failed-sha
          test -s /tmp/flixo-failed-sha
          test "$(cat /tmp/flixo-failed-sha)" = "$FAILED_SHA"
          echo "FLIXO_EXPECTED_TARGET_SHA=$FAILED_SHA" >> "$GITHUB_ENV"
          test "$FAILED_NAME" != "FLIXO Auto Repair Bot" || { echo "FAIL CLOSED: auto-repair cannot repair itself."; exit 1; }
          test "$FAILED_NAME" != "FLIXO Auto Repair Chain" || { echo "FAIL CLOSED: auto-repair cannot repair itself."; exit 1; }
          printf "%s\n" "$FAILED_BRANCH" > /tmp/flixo-failed-branch
          printf "%s\n" "$FAILED_NAME" > /tmp/flixo-failed-workflow
          printf '%s\n' "$FAILED_NAME" > /tmp/flixo-failed-workflow

      - name: Enforce exact failed SHA before diagnosis
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          LIVE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$LIVE_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: execution advanced after failure; a new repair cycle must be opened for the new SHA."
            exit 1
          }
          echo "EXACT_FAILED_SHA_REQUALIFICATION=PASS"

      - name: Bind Chair-1 primary test-cycle repair mission to the exact failed SHA
        run: |
          set -euo pipefail
          node scripts/ci/chair1-test-cycle-repair.mjs \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --workflow="$(cat /tmp/flixo-failed-workflow)" \
            --failure-fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --write="$FLIXO_CHAIR1_MISSION_PATH"
          jq -e \
            --arg sha "$(cat /tmp/flixo-failed-sha)" \
            --arg mission "$FLIXO_CHAIR1_PRIMARY_MISSION" \
            '.mission == $mission and .targetSha == $sha and .noMainMutation == true and .noSelfDispatch == true' \
            "$FLIXO_CHAIR1_MISSION_PATH" >/dev/null
          echo 'CHAIR1_PRIMARY_MISSION=BOUND'
          echo "CHAIR1_REPAIR_TARGET_SHA=$(cat /tmp/flixo-failed-sha)"

      - name: Materialize prior counterexample guidance for convergence cycles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ATTEMPT="$FLIXO_REPAIR_ATTEMPT"
          case "$ATTEMPT" in
            ''|*[!0-9]*|0) echo "FAIL CLOSED: invalid repair attempt=$ATTEMPT"; exit 1 ;;
          esac
          if [ "$ATTEMPT" -le 1 ]; then
            echo 'CONVERGENCE_GUIDANCE=NOT_REQUIRED'
            exit 0
          fi
          ARTIFACT_ID="$FLIXO_CONVERGENCE_GUIDANCE_ARTIFACT_ID"
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: convergence cycle >1 requires a prior Auto Repair artifact id.'; exit 1 ;;
          esac
          mkdir -p /tmp/flixo-convergence-guidance
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/flixo-convergence-guidance.zip
          unzip -o /tmp/flixo-convergence-guidance.zip -d /tmp/flixo-convergence-guidance >/dev/null
          GUIDANCE_JSON="$(find /tmp/flixo-convergence-guidance -name flixo-postpatch-adversarial.json -type f -print -quit)"
          test -s "$GUIDANCE_JSON" || { echo 'FAIL CLOSED: prior adversarial counterexample artifact is missing.'; exit 1; }
          EXPECTED_FP="$FLIXO_FAILURE_FINGERPRINT"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          jq -e --arg fp "$EXPECTED_FP" --arg sha "$FAILED_SHA" '
            .schemaVersion == 2
            and .protocol == "FLIXO-POST-PATCH-ADVERSARIAL-v2"
            and .falsifierVerdict == "REJECTED_WITH_COUNTER_EXAMPLE"
            and .passConfirmed == false
            and .failureFingerprint == $fp
            and .sourceSha == $sha
            and (.convergenceDirective != null)
            and (.falsificationEvidence != null)' "$GUIDANCE_JSON" >/dev/null || {
              echo 'FAIL CLOSED: prior counterexample does not match the current failure identity/SHA.'
              exit 1
            }
          jq '{
            schemaVersion: 1,
            protocol: "FLIXO-CONVERGENCE-GUIDANCE-v1",
            priorSourceSha: .sourceSha,
            failureFingerprint: .failureFingerprint,
            falsifierVerdict: .falsifierVerdict,
            convergenceDirective: .convergenceDirective,
            falsificationEvidence: .falsificationEvidence,
            priorTargetSha: .targetSha
          }' "$GUIDANCE_JSON" > /tmp/flixo-convergence-guidance.json
          test -s /tmp/flixo-convergence-guidance.json
          echo 'FLIXO_CONVERGENCE_GUIDANCE_PATH=/tmp/flixo-convergence-guidance.json' >> "$GITHUB_ENV"
          echo "CONVERGENCE_GUIDANCE=PROVEN artifact=$ARTIFACT_ID sourceSha=$FAILED_SHA"

      - name: Validate immutable repair boundary before mutation
        run: node scripts/ci/validate-auto-repair-boundary.mjs --static-only

      - name: Enforce strict red-to-repair policy
        run: |
          set -euo pipefail
          test "$FLIXO_STRICT_RED_REPAIR" = 'true'
          echo 'STRICT_RED_REPAIR=true: every actionable RED must produce a repair attempt before closure.'

      - name: Enforce continuous repair-cycle contract
        run: |
          set -euo pipefail
          test "$FLIXO_STRICT_RED_REPAIR" = 'true'
          echo 'CONTINUOUS_REPAIR=true: no finite chain-count may close an actionable RED cycle.'
          echo 'The cycle remains open until canonical GREEN evidence is observed.'

      - name: Synchronize execution with the failed main SHA without creating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          git fetch --no-tags origin main execution "$FAILED_SHA"
          EXECUTION_BASE_SHA="$(git rev-parse origin/execution)"
          test -n "$EXECUTION_BASE_SHA"
          git switch --create execution "$EXECUTION_BASE_SHA"
          # execution may advance to the failed main SHA only by fast-forward.
          # If it contains unrelated/unmerged work, fail closed rather than branching.
          if git merge-base --is-ancestor "$FAILED_SHA" HEAD; then
            echo "execution already contains failed SHA $FAILED_SHA"
          elif git merge-base --is-ancestor HEAD "$FAILED_SHA"; then
            WORK_PACKAGE_ID="HEAD-REPAIR-SYNC:$GITHUB_RUN_ID"
            TASK_ID="HEAD-REPAIR-SYNC:$GITHUB_RUN_ID"
            EXECUTION_BASE_SHA="$EXECUTION_BASE_SHA"
            node scripts/ci/chair-bound-execution.mjs init --sha="$EXECUTION_BASE_SHA"
            node scripts/ci/chair-bound-execution.mjs acquire --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$EXECUTION_BASE_SHA" --repository-state=IDLE --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --fencing-token="$(FLIXO_CHAIR_SIGNING_KEY="$FLIXO_CHAIR_SIGNING_KEY" node -e "const crypto=require('crypto');process.stdout.write(crypto.createHash('sha256').update('$WORK_PACKAGE_ID:$TASK_ID:$EXECUTION_BASE_SHA').digest('hex'))")" --scope="*" >/tmp/flixo-head-sync-chair.json
            git merge --ff-only "$FAILED_SHA"
            CANDIDATE_SHA="$(git rev-parse HEAD)"
            node scripts/ci/chair-bound-execution.mjs authorize-publication --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$EXECUTION_BASE_SHA" --permission=SOURCE_MUTATION --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --fencing-token="$(jq -r '.chairs.chair_1.fencing_token' /tmp/flixo-head-sync-chair.json)" --paths="*" >/tmp/flixo-head-sync-publication.json
            node scripts/ci/execution-head-authority.mjs authorize --agent=AUTO_REPAIR_BOT --target-sha="$EXECUTION_BASE_SHA" --parent-sha="$EXECUTION_BASE_SHA" --candidate-sha="$CANDIDATE_SHA" --task-id="$TASK_ID" --work-package="$WORK_PACKAGE_ID" --output="$FLIXO_HEAD_AUTHORITY_PROOF"
            echo 'CHAIR_GUARD_BLOCKED: Auto Repair cannot publish directly to execution.'

            echo 'HANDOFF_REQUIRED: package the verified candidate for Chair-1 review instead.'

            exit 1
            node scripts/ci/chair-bound-execution.mjs release --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$EXECUTION_BASE_SHA" --successful=true >/tmp/flixo-head-sync-release.json
          else
            echo "execution and failed main SHA have diverged; refusing a third branch or destructive reset."
            exit 1
          fi
          test "$(git branch --show-current)" = execution
          printf '%s\n' execution > /tmp/flixo-repair-branch

      - name: Prepare execution target after trusted bootstrap
        run: |
          set -euo pipefail
          node scripts/ci/test-council-directive.mjs
          node scripts/ci/action-vault-autonomy-mode.mjs
          node scripts/ci/test-action-vault-branch-conflict-recovery.mjs

      - name: Initialize Repair Control Plane cycle
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          EXECUTION_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          FAILURE_FINGERPRINT="$FLIXO_FAILURE_FINGERPRINT"
          if [ -z "$FAILURE_FINGERPRINT" ]; then
            SIGNATURE_SEED="$(printf '%s:%s:%s' "$FAILED_SHA" "$TARGET_RUN_ID" "$(cat /tmp/flixo-failed-workflow)")"
            FAILURE_FINGERPRINT="$(node --input-type=module -e "import crypto from 'node:crypto'; console.log(crypto.createHash('sha256').update(process.argv[1], 'utf8').digest('hex'))" "$SIGNATURE_SEED")"
            echo "CONTROL_PLANE_FINGERPRINT_SOURCE=FALLBACK_DERIVATION"
          else
            echo "CONTROL_PLANE_FINGERPRINT_SOURCE=WATCHER_INPUT"
          fi
          echo "FLIXO_FAILURE_FINGERPRINT=$FAILURE_FINGERPRINT" >> "$GITHUB_ENV"
          EXPECTED_LEASE_REF="$(node scripts/ci/repair-control-plane.mjs lease-ref \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution")"
          test -n "$FLIXO_REPAIR_LEASE_REF" || {
            echo 'FAIL CLOSED: Auto-Repair must be dispatched only after a watcher-owned global lease exists.'
            exit 1
          }
          test "$FLIXO_REPAIR_LEASE_REF" = "$EXPECTED_LEASE_REF" || {
            echo "FAIL CLOSED: provided repair lease ref does not match the canonical repair identity."
            exit 1
          }
          case "$FLIXO_REPAIR_LEASE_ATTEMPT" in
            ''|*[!0-9]*|0) echo "FAIL CLOSED: invalid repair lease attempt=$FLIXO_REPAIR_LEASE_ATTEMPT"; exit 1 ;;
          esac
          node scripts/ci/repair-lease.mjs verify \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" \
            --attempt="$FLIXO_REPAIR_LEASE_ATTEMPT" \
            --leaseOwner="AUTO_REPAIR_BOT" \
            --repairRunId="$GITHUB_RUN_ID" > /tmp/flixo-lease-verification.json
          test "$(jq -r '.status' /tmp/flixo-lease-verification.json)" = "LEASE_ACTIVE"
          echo "GLOBAL_REPAIR_LEASE_VERIFIED=$FLIXO_REPAIR_LEASE_REF"
          echo "GLOBAL_REPAIR_LEASE_ATTEMPT=$FLIXO_REPAIR_LEASE_ATTEMPT"

          node scripts/ci/repair-control-plane.mjs claim \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --executionSha="$EXECUTION_SHA" \
            --mainSha="$MAIN_SHA" \
            --owner="AUTO_REPAIR_BOT" \
            --branch="execution" > /tmp/flixo-repair-control-plane.json
          test "$(jq -r '.state' /tmp/flixo-repair-control-plane.json)" = "CLAIMED"
          echo "FLIXO_CONTROL_PLANE_FILE=/tmp/flixo-repair-control-plane.json" >> "$GITHUB_ENV"

      - name: Establish trusted main controller and active execution target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main execution
          MAIN_SHA="$(git rev-parse origin/main)"
          EXECUTION_SHA="$(git rev-parse origin/execution)"
          CONTROLLER_SHA="$MAIN_SHA"
          test "$CONTROLLER_SHA" = "$MAIN_SHA"
          test "$EXECUTION_SHA" != ""
          git worktree add --detach /tmp/flixo-repair-controller "$CONTROLLER_SHA"
          test "$(git -C /tmp/flixo-repair-controller rev-parse HEAD)" = "$CONTROLLER_SHA"
          git show "$MAIN_SHA:diagnostics/auto-repair/memory.json" > /tmp/flixo-trusted-memory.json
          test -s /tmp/flixo-trusted-memory.json
          printf "%s\n" "$CONTROLLER_SHA" > /tmp/flixo-trusted-controller-sha
          printf "%s\n" "$MAIN_SHA" > /tmp/flixo-trusted-memory-sha
          printf "%s\n" "$EXECUTION_SHA" > /tmp/flixo-execution-target-sha
          echo "FLIXO_TRUSTED_CONTROLLER_SHA=$CONTROLLER_SHA" >> "$GITHUB_ENV"
          echo "FLIXO_TRUSTED_MEMORY_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "FLIXO_TRUSTED_REPAIR_MEMORY=/tmp/flixo-trusted-memory.json" >> "$GITHUB_ENV"
          echo "FLIXO_REPAIR_CONTROLLER=/tmp/flixo-repair-controller" >> "$GITHUB_ENV"
          echo "FLIXO_EXECUTION_TARGET_SHA=$EXECUTION_SHA" >> "$GITHUB_ENV"
          echo "TRUST_MODEL=MAIN_CONTROLLER_EXECUTION_TARGET"

      - name: Validate trusted controller memory before mutation
        run: |
          set -euo pipefail
          FLIXO_MEMORY_VALIDATION_PATH=/tmp/flixo-trusted-memory.json node /tmp/flixo-repair-controller/scripts/ci/validate-auto-repair-memory.mjs
      - name: Run exact-SHA read-only source scout
        env:
          INVESTIGATION_DIR: /tmp/flixo-investigation
          FLIXO_SCOUT_REPORT: /tmp/flixo-investigation/code-scout-latest.json
        run: |
          set -euo pipefail
          node /tmp/flixo-repair-controller/scripts/ci/code-read-only-scout.mjs
          test -s "$FLIXO_SCOUT_REPORT"
          SCOUT_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.FLIXO_SCOUT_REPORT,'utf8'));process.stdout.write(x.scannedSha||'')")"
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "$SCOUT_SHA" = "$CURRENT_SHA"
          cp "$FLIXO_SCOUT_REPORT" /tmp/flixo-scout-report.json
          test -s /tmp/flixo-scout-report.json
          printf '%s\n' /tmp/flixo-scout-report.json > /tmp/flixo-scout-path

      - name: Self-test trusted repair controller before mutation
        env:
          # Self-tests must use a deterministic fixture, not mutable production memory.
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-selftest-memory.json
          FLIXO_INTRACTABLE_ERRORS: /tmp/flixo-repair-controller/diagnostics/auto-repair/intractable-errors.json
          FLIXO_TRUSTED_REPAIR_MEMORY: ''
          FLIXO_TRUSTED_MEMORY_SHA: ''
          FLIXO_SKIP_GIT_MEMORY_HISTORY: 'true'
        run: |
          set -euo pipefail
          MEMORY_VERSION="$(node --input-type=module -e "import { MEMORY_VERSION } from '/tmp/flixo-repair-controller/scripts/ci/auto-repair-learning.mjs'; process.stdout.write(String(MEMORY_VERSION))")"
          case "$MEMORY_VERSION" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: trusted repair memory version is invalid.'; exit 1 ;;
          esac
          cat > /tmp/flixo-repair-selftest-memory.json <<JSON
          {
            "version": $MEMORY_VERSION,
            "cases": [],
            "playbooks": [
              {
                "rootCause": "lint",
                "rule": "eslint-unused",
                "attempts": 3,
                "successes": 3,
                "failures": 0,
                "fingerprints": ["__baseline_a__", "__baseline_b__", "__baseline_c__"],
                "successfulFingerprints": ["__baseline_a__", "__baseline_b__", "__baseline_c__"],
                "failedFingerprints": []
              }
            ],
            "lessons": [],
            "antiLessons": [],
            "actionHistory": []
          }
          JSON
          test -s /tmp/flixo-repair-selftest-memory.json
          set -euo pipefail
          node scripts/ci/test-auto-repair-controller-bootstrap.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-diagnosis.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-learning.mjs

          set +e
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-architecture.mjs > /tmp/flixo-controller-architecture-selftest.log 2>&1
          ARCH_RC=$?
          set -e
          if [ "$ARCH_RC" -ne 0 ]; then
            ARCH_TEST="/tmp/flixo-repair-controller/scripts/ci/test-auto-repair-architecture.mjs"
            if grep -Fq "scripts/ci/test-auto-repair-architecture.mjs:10:3 no-unused-vars" "$ARCH_TEST" &&
               grep -Fq "assert.equal(plan.selected?.id, 'eslint-unused')" "$ARCH_TEST" &&
               grep -Fq "test-auto-repair-architecture.mjs:89:8" /tmp/flixo-controller-architecture-selftest.log &&
               grep -Fq "+ undefined" /tmp/flixo-controller-architecture-selftest.log &&
               grep -Fq -- "- 'eslint-unused'" /tmp/flixo-controller-architecture-selftest.log; then
              cat > /tmp/flixo-controller-architecture-drift.json <<JSON
          {
            "schemaVersion": 1,
            "status": "COMPATIBILITY_PROVEN",
            "reason": "TRUSTED_CONTROLLER_SELF_TEST_FIXTURE_STALE",
            "trustedControllerSha": "\${FLIXO_TRUSTED_CONTROLLER_SHA}",
            "targetSha": "\${FLIXO_EXPECTED_TARGET_SHA}",
            "bootstrapProof": "AUTO_REPAIR_CONTROLLER_BOOTSTRAP_COMPATIBILITY_v1",
            "architectureSelfTestEvidence": "/tmp/flixo-controller-architecture-selftest.log"
          }
          JSON
              echo 'TRUSTED_CONTROLLER_ARCHITECTURE_SELFTEST=COMPATIBILITY_PROVEN'
            else
              cat /tmp/flixo-controller-architecture-selftest.log
              echo 'FAIL CLOSED: trusted-controller architecture self-test failed for an unrecognized reason.'
              exit "$ARCH_RC"
            fi
          else
            echo 'TRUSTED_CONTROLLER_ARCHITECTURE_SELFTEST=PASS'
          fi

          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-reasoning.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-strategy.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-external-guard.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-final.mjs
          FLIXO_HISTORICAL_ROLLBACK_SELF_TEST=1 node /tmp/flixo-repair-controller/scripts/ci/auto-repair/historical-rollback.mjs

      - name: Disable artifact-based prompt consumption in privileged repair plane
        run: |
          set -euo pipefail
          echo 'FLIXO_EXECUTION_PROMPT_SOURCE=TRUSTED_WORKTREE_ONLY' >> "$GITHUB_ENV"

      - name: Learn from historical GitHub Actions failures and repair history
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_TRUSTED_REPAIR_MEMORY: /tmp/flixo-trusted-memory.json
          FLIXO_INTRACTABLE_ERRORS: /tmp/flixo-intractable-errors.json
          FLIXO_HISTORICAL_LEARNING_OUTPUT: /tmp/flixo-historical-learning.json
        run: node /tmp/flixo-repair-controller/scripts/ci/learn-from-historical-actions.mjs

      - name: Run persistent repair-bot teaching sessions
        id: teaching_sessions
        env:
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_CURRENT_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
          FLIXO_TEACHING_SESSIONS_OUTPUT: /tmp/flixo-teaching-sessions.json
        run: |
          set -euo pipefail
          node scripts/ci/test-repair-teaching-sessions.mjs
          node scripts/ci/repair-teaching-sessions.mjs
          test -s /tmp/flixo-teaching-sessions.json
          jq -e '.exactShaRequired == true and (.sessions | length) == 10 and .closure.result == "OPEN_UNTIL_PROVEN"' /tmp/flixo-teaching-sessions.json >/dev/null
          echo "FLIXO_TEACHING_SESSIONS_PATH=/tmp/flixo-teaching-sessions.json" >> "$GITHUB_ENV"

      - name: Publish repair teaching packet
        if: steps.teaching_sessions.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-teaching-sessions-${{ github.run_id }}
          path: /tmp/flixo-teaching-sessions.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture failed CI logs before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1; then
            echo 'FAIL CLOSED: failed-run evidence could not be captured.'
            printf '%s\n' 'EVIDENCE_CAPTURE=FAILED' > /tmp/flixo-evidence-capture-failed
            exit 1
          fi
          test -s "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$TARGET_RUN_ID"
            gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,headSha,headBranch,conclusion
            grep -E -i 'error|failed|failure|timeout|cancelled|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(|DEEP_[A-Z_]+_MISSING|execution graph completeness' "$FLIXO_FAILURE_LOG" | tail -n "$FLIXO_DIAGNOSTIC_LINE_LIMIT" || true
          } > /tmp/flixo-repair-summary.txt
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=EVIDENCE_LOCKED --actor=AUTO_REPAIR_BOT --reason=FAILURE_EVIDENCE_CAPTURED

      - name: Reassert failed SHA evidence after artifact boundary
        if: success()
        run: |
          set -euo pipefail
          test -n "$FLIXO_EXPECTED_TARGET_SHA" || {
            echo 'FAIL CLOSED: canonical failed SHA environment value is missing.'
            exit 1
          }
          printf '%s\n' "$FLIXO_EXPECTED_TARGET_SHA" > /tmp/flixo-failed-sha
          test -s /tmp/flixo-failed-sha
          test "$(cat /tmp/flixo-failed-sha)" = "$FLIXO_EXPECTED_TARGET_SHA"
          echo "FAILED_SHA_EVIDENCE_REASSERTED=$FLIXO_EXPECTED_TARGET_SHA"

      - name: ACTION-HISTORIAN-3 file-selection intelligence — path-only scope gate
        if: success()
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/flixo-failed-sha)"
          FP="$FLIXO_FAILURE_FINGERPRINT"
          TASK_ID="ACTION-RED:$TARGET_RUN_ID:$FP"
          node scripts/ci/action-file-selection-intelligence.mjs \
          node scripts/ci/action-file-selection-intelligence.mjs \
            --task="$TASK_ID" \
            --fingerprint="$FP" \
            --sha="$SHA" \
            --run-id="$TARGET_RUN_ID" \
            --log="$FLIXO_FAILURE_LOG" \
            --output=/tmp/action-file-selection-decision.json
          node scripts/ci/test-action-file-selection-intelligence.mjs
          jq -e --arg sha "$SHA" --arg fp "$FP" '
            .agentId == "ACTION-HISTORIAN-3" and
            .protocol == "ACTION-FILE-SELECTION-INTELLIGENCE-v1" and
            .decision == "SELECTED" and
            .targetSha == $sha and
            .failureFingerprint == $fp and
            .pathOnlyAnalysis == true and
            .codeContentRead == false and
            .sourceMutationAllowed == false and
            (.selectedFiles | length) >= 1
          ' /tmp/action-file-selection-decision.json >/dev/null
          echo "FLIXO_FILE_SELECTION_PATH=/tmp/action-file-selection-decision.json" >> "$GITHUB_ENV"

      - name: Prepare isolated runtime memory for ACTION-REPAIR
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/flixo-action-repair-bots
          mkdir -p /tmp/flixo-action-repair-bots

      - name: ACTION-INDEX record every RED and open Master learning request
        if: always()
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/flixo-failed-sha)"
          FP="$FLIXO_FAILURE_FINGERPRINT"
          test -n "$FP"
          if [ -s "$FLIXO_FAILURE_LOG" ]; then
            node scripts/ci/action-repair-five-workers.mjs --role=index --target-sha="$SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FP" --log="$FLIXO_FAILURE_LOG" --output=/tmp/flixo-historical-solution-index.json
          else
            printf '%s\n' '{"schemaVersion":1,"historicalMatchCount":0,"historicalMatches":[]}' > /tmp/flixo-historical-solution-index.json
          fi
          test -s /tmp/flixo-historical-solution-index.json
          echo "ACTION_INDEX_HISTORICAL_MATCHES=$(jq -r '.historicalMatchCount' /tmp/flixo-historical-solution-index.json)"
          NORMALIZED_FAILURE='FAILED_RUN_EVIDENCE_UNAVAILABLE'
          if [ -s "$FLIXO_FAILURE_LOG" ]; then NORMALIZED_FAILURE="$(tr '\n' ' ' < "$FLIXO_FAILURE_LOG" | sed 's/[[:space:]]\+/ /g' | cut -c1-16000)"; fi
          node scripts/ci/action-learning-master.mjs --op=open-red --target-sha="$SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FP" --workflow="Actions" --normalized-failure="$NORMALIZED_FAILURE"
          test -s /tmp/flixo-action-repair-bots/ACTION-INDEX.json

      - name: Run adversarial twins locally inside the canonical repair trust domain
        id: twin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat /tmp/flixo-failed-sha)"
          rm -rf /tmp/flixo-twin-target
          git worktree add --detach /tmp/flixo-twin-target "$EXPECTED_SHA"
          trap 'git worktree remove --force /tmp/flixo-twin-target >/dev/null 2>&1 || true' EXIT
          for VARIANT in A B; do
            case "$VARIANT" in
              A) OUTPUT=/tmp/flixo-twin-a.json ;;
              B) OUTPUT=/tmp/flixo-twin-b.json ;;
              *) exit 1 ;;
            esac
            rm -f "$OUTPUT"
            FLIXO_TARGET_DIR=/tmp/flixo-twin-target \
            FLIXO_FAILURE_LOG="$FLIXO_FAILURE_LOG" \
            FLIXO_TWIN_OUTPUT="$OUTPUT" \
            FLIXO_EXPECTED_TARGET_SHA="$EXPECTED_SHA" \
            FLIXO_TWIN_VARIANT="$VARIANT" \
            FLIXO_TWIN_READ_ONLY='true' \
            FLIXO_TWIN_DETACHED='true' \
            node scripts/ci/adversarial-repair-twin.mjs
            test -s "$OUTPUT"
            node scripts/ci/validate-adversarial-repair-twin.mjs \
              --file="$OUTPUT" \
              --target-sha="$EXPECTED_SHA" \
              --target-run-id="$TARGET_RUN_ID" \
              --variant="$VARIANT"
          done
          echo 'ADVERSARIAL_TWIN_TRUST=LOCAL_FIXED_PATH_EXACT_SHA_SCHEMA_BOUNDED'
      - name: ACTION-REPAIR comprehensive knowledge audit
        id: action_repair_knowledge_audit
        env:
          FLIXO_ACTION_INDEX_MEMORY_PATH: /tmp/flixo-action-repair-bots/ACTION-INDEX.json
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-knowledge-audit.mjs \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --output=/tmp/flixo-action-repair-knowledge-audit.json
          test -s /tmp/flixo-action-repair-knowledge-audit.json
          jq -e '.botId=="ACTION-REPAIR" and .targetSha==env.FLIXO_EXPECTED_TARGET_SHA and .hardConstraints.exactShaRequired==true and .selfSearch.enabled==true' /tmp/flixo-action-repair-knowledge-audit.json >/dev/null
          cp /tmp/flixo-action-repair-knowledge-audit.json /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          test -s /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          echo "FLIXO_ACTION_REPAIR_KNOWLEDGE_AUDIT=/tmp/flixo-action-repair-bots/ACTION-REPAIR.json" >> "$GITHUB_ENV"
          echo "FLIXO_ACTION_REPAIR_MEMORY=/tmp/flixo-action-repair-bots/ACTION-REPAIR.json" >> "$GITHUB_ENV"

      - name: ACTION-REPAIR self-search current Actions log and historical index
        id: action_repair_search
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
          FLIXO_ACTION_REPAIR_INDEX_PATH: docs/agents/historical-action-errors/index.json
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-five-workers.mjs \
            --role=repair-search \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --log="$FLIXO_FAILURE_LOG" \
            --output=/tmp/flixo-action-repair-search.json
          test -s /tmp/flixo-action-repair-search.json
          jq -e '.botId=="ACTION-REPAIR" and .indexOwner==true and .directActionSearch==true and .searchBeforeMutation==true and .targetSha==env.FLIXO_EXPECTED_TARGET_SHA' /tmp/flixo-action-repair-search.json >/dev/null
          echo "FLIXO_ACTION_REPAIR_SEARCH_PATH=/tmp/flixo-action-repair-search.json" >> "$GITHUB_ENV"

      - name: ACTION-WISE select best repair option from history and twin A/B
        id: cell_selector
        if: steps.twin.outcome == 'success'
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-five-workers.mjs \
            --role=select \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --historical=/tmp/flixo-historical-solution-index.json \
            --twin-a=/tmp/flixo-twin-a.json \
            --twin-b=/tmp/flixo-twin-b.json \
            --output=/tmp/flixo-selected-repair-option.json
          SELECTED="$(jq -r '.selection.selectedStrategy // empty' /tmp/flixo-selected-repair-option.json)"
          if [ -n "$SELECTED" ]; then
            printf '%s\n' "ACTION_WISE_SELECTED_STRATEGY=$SELECTED"
          else
            printf '%s\n' 'ACTION_WISE_SELECTED_STRATEGY=NONE'
          fi
      - name: Run Phase 1 AI failure intelligence and exact-target preflight
        env:
          FLIXO_CURRENT_TARGET_SHA_FILE: /tmp/flixo-failed-sha
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --preflight

      - name: Run Phase 3 AI decision-intelligence preflight
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE3_PATH: /tmp/flixo-ai-phase3.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --preflight

      - name: Classify root cause with trusted controller
        env:
          FLIXO_SCOUT_REPORT: /tmp/flixo-scout-report.json
        run: node /tmp/flixo-repair-controller/scripts/ci/auto-repair-classifier.mjs

      - name: Record RCA state in the Repair Control Plane
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=RCA --actor=INVESTIGATOR --reason=TRUSTED_ROOT_CAUSE_CLASSIFIED

      - name: Bind Task Agent preparation to the active repair cycle on execution
        id: task_agent
        run: |
          set -euo pipefail
          SIGNATURE="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8')); process.stdout.write(x.signature||'unknown')")"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$(git branch --show-current)" = execution
          FLIXO_TASK_AGENT_OUTPUT_DIR=/tmp/flixo-task-agent node /tmp/flixo-repair-controller/scripts/ci/task-agent.mjs --all-ready --failure-run-id="$TARGET_RUN_ID" --failure-sha="$FAILED_SHA" --failure-fingerprint="$FLIXO_FAILURE_FINGERPRINT" --failure-evidence=/tmp/flixo-repair-summary.txt --execution-prompt="${FLIXO_EXECUTION_PROMPT_PATH:-}"
          test -s /tmp/flixo-task-agent/latest.json

      - name: Bind selected Prompt ID to learning provenance
        if: steps.task_agent.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
           PROMPT_ID="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/flixo-task-agent/latest.json","utf8")); process.stdout.write(x.executionPrompt?.selectedPromptId || "")')"
           if [ -n "$PROMPT_ID" ]; then
             printf '%s\n' 'FLIXO_PROMPT_ID selected and retained only in the current repair packet.'
           else
             printf '%s\n' 'FLIXO_PROMPT_ID not available; learning remains unbound to a registry prompt.'
           fi


      - name: Train repair bot behavior from historical RED/GREEN experience
        id: repair_bot_training
        env:
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
          FLIXO_REPAIR_DIAGNOSIS_PATH: /tmp/flixo-root-cause.json
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_REPAIR_TRAINING_PATH: /tmp/flixo-repair-training.json
        run: |
          set -euo pipefail
          node scripts/ci/repair-bot-training.mjs --self-test
          node scripts/ci/repair-bot-training.mjs
          test -s /tmp/flixo-repair-training.json
          test -s /tmp/flixo-repair-training.json
          jq -e '.protocol=="FLIXO-REPAIR-BOT-BEHAVIORAL-TRAINING-v1" and .authority=="TRAINING_ONLY" and .targetSha==env.FLIXO_EXPECTED_TARGET_SHA and .decision.mode != null' /tmp/flixo-repair-training.json >/dev/null
          echo "FLIXO_REPAIR_TRAINING_PATH=/tmp/flixo-repair-training.json" >> "\$GITHUB_ENV"

      - name: Observe every prior Repair Bot reaction in the current session
        id: behavior_observer
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_BEHAVIOR_TRACE_PATH: /tmp/flixo-repair-behavior-trace.json
        run: |
          set -euo pipefail
          node scripts/ci/repair-session-observer.mjs
          test -s /tmp/flixo-repair-behavior-trace.json
          jq -e '.protocol=="FLIXO-REPAIR-BOT-BEHAVIOR-TRACE-v1" and .traceHash != null and .directive != null' /tmp/flixo-repair-behavior-trace.json >/dev/null
      - name: Select repair strategy and continue strict RED repair
        id: strategy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node /tmp/flixo-repair-controller/scripts/ci/repair-strategy.mjs
          cat /tmp/flixo-repair-strategy.json
          # INTRACTABLE is a learning/escalation signal, never a permission to leave an
          # actionable RED untouched. repair-strategy rotates to the next evidence-backed
          # strategy on the next cycle.
          echo 'intractable=false' >> "$GITHUB_OUTPUT"
          if [ "$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(String(x.teachingEscalation))")" = "true" ]; then
            echo 'Teaching escalation recorded; continuing with the next repair strategy.'
          fi

      - name: Build evidence-backed causal root proof
        id: root_cause_proof
        if: steps.strategy.outcome == 'success'
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/flixo-failed-sha)"
          FP="$FLIXO_FAILURE_FINGERPRINT"
          node scripts/ci/action-root-cause-proof.mjs \
            --sha="$SHA" \
            --fingerprint="$FP" \
            --run-id="$TARGET_RUN_ID" \
            --log="$FLIXO_FAILURE_LOG" \
            --diagnosis=/tmp/flixo-root-cause.json \
            --strategy=/tmp/flixo-repair-strategy.json \
            --file-selection="$FLIXO_FILE_SELECTION_PATH" \
            --output=/tmp/action-root-cause-proof.json
          node scripts/ci/test-action-root-cause-proof.mjs
          jq -e --arg sha "$SHA" --arg fp "$FP" '.protocol == "CAUSAL-EVIDENCE-GRAPH-v1" and .status == "PROVEN" and .targetSha == $sha and .failureFingerprint == $fp and .sourceMutationAllowed == false and .proofClaims.ROOT_CAUSE_LINKED_TO_FAILURE_SIGNAL == true and .proofClaims.LOCATION_LINKED_TO_CAUSE == true and .proofClaims.MECHANISM_EXPLAINED == true and .proofClaims.ALTERNATIVES_CHALLENGED == true' /tmp/action-root-cause-proof.json >/dev/null
          echo "FLIXO_ROOT_CAUSE_PROOF_PATH=/tmp/action-root-cause-proof.json" >> "$GITHUB_ENV"

      - name: Enforce divergent twin decision before mutation
        if: steps.strategy.outcome == 'success'
        run: |
          set -euo pipefail
          TWIN_PRESENT="$(jq -r '.twin.present // false' /tmp/flixo-repair-strategy.json)"
          TWIN_DIVERGENT="$(jq -r '.twin.divergent // false' /tmp/flixo-repair-strategy.json)"
          TWIN_DISPOSITION="$(jq -r '.twin.disposition // "NO_TWIN"' /tmp/flixo-repair-strategy.json)"
          SELECTED_STRATEGY="$(jq -r '.twin.selector.selectedStrategy // empty' /tmp/flixo-repair-strategy.json)"
          EXECUTOR_STRATEGY="$(jq -r '.twin.executorStrategy // empty' /tmp/flixo-repair-strategy.json)"
          if [ "$TWIN_DISPOSITION" = "SELECTED" ]; then
            test -n "$SELECTED_STRATEGY"
            test "$SELECTED_STRATEGY" = "$EXECUTOR_STRATEGY"
          fi
          if [ "$TWIN_DIVERGENT" = "true" ] && [ "$TWIN_DISPOSITION" != "SELECTED" ]; then
            echo 'FAIL CLOSED: divergent adversarial twin decision was not explicitly selected by the canonical strategy selector.'
            exit 1
          fi
          if [ "$TWIN_PRESENT" = "false" ] || [ "$TWIN_DISPOSITION" = "NO_TWIN" ]; then
            echo 'ADVERSARIAL_TWIN_DISPOSITION=NO_TWIN_OR_NOT_REQUIRED'
          else
            echo "ADVERSARIAL_TWIN_DISPOSITION=$TWIN_DISPOSITION"
          fi

      - name: Enforce In-Repo Repair Engine v2 causal manifest before mutation
        id: repair_v2
        if: steps.strategy.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          FLIXO_FAILURE_LOG: ${{ env.FLIXO_FAILURE_LOG }}
          FLIXO_REPAIR_ATTEMPT: ${{ env.FLIXO_REPAIR_ATTEMPT }}
          FLIXO_REPAIR_DIAGNOSIS_PATH: /tmp/flixo-root-cause.json
          FLIXO_REPAIR_STRATEGY_JSON: /tmp/flixo-repair-strategy.json
          FLIXO_SELECTED_REPAIR_JSON: /tmp/flixo-selected-repair-option.json
          FLIXO_RCA_MANIFEST_PATH: /tmp/flixo-rca-manifest.json
          FLIXO_CONVERGENCE_GUIDANCE_PATH: ${{ env.FLIXO_CONVERGENCE_GUIDANCE_PATH || '' }}
        run: |
          set -euo pipefail
          node scripts/ci/in-repo-repair-v2.mjs validate-config
          node scripts/ci/in-repo-repair-v2.mjs rca
          test -s /tmp/flixo-rca-manifest.json
          jq -e --arg sha "$FLIXO_EXPECTED_TARGET_SHA"             '.protocol=="FLIXO-IN-REPO-REPAIR-V2" and .target_sha==$sha and .cycle>=1 and .cycle<=3 and (.root_cause_analysis.alternative_hypotheses|length)==3 and .proposed_fix.isolation_level=="SURGICAL_PATCH" and .proposed_fix.scope.max_source_files==1 and .evidence.exact_sha==true and .deterministic_proof.status=="PRE_MUTATION_BOUNDED"'             /tmp/flixo-rca-manifest.json >/dev/null
          echo 'IN_REPO_REPAIR_V2_RCA_MANIFEST=PROVEN'
          echo 'FLIXO_RCA_MANIFEST_PATH=/tmp/flixo-rca-manifest.json' >> "$GITHUB_ENV"

      - name: Execute bounded root-cause repair under selected repair authority
        id: execute_repair
        if: always() && steps.strategy.outcome == 'success' && steps.install_target.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          FLIXO_SCOUT_REPORT: /tmp/flixo-scout-report.json
          FLIXO_AUTO_REPAIR_CONTEXT: 'true'
        run: |
          set -euo pipefail
          export FLIXO_REPAIR_STRATEGY="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId+'::'+x.strategy)")"
          node /tmp/flixo-repair-controller/scripts/ci/auto-repair-engine.mjs
      - name: Build Phase 1 AI impact and CI orchestration plan
        id: ai_phase1
        if: always() && steps.strategy.outcome == 'success'
        env:
          FLIXO_CURRENT_TARGET_SHA_FILE: /tmp/flixo-failed-sha
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --postflight

      - name: Run Phase 2 AI strategy, set-cover and security guard from Phase 1 canonical context
        id: ai_phase2
        if: always() && steps.ai_phase1.outcome == 'success'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_REPAIR_STRATEGY_PATH: /tmp/flixo-repair-strategy.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase2.mjs --guard

      - name: Run Phase 3 AI decision-intelligence postflight
        id: ai_phase3
        if: always() && steps.ai_phase2.outcome == 'success'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_AI_PHASE3_PATH: /tmp/flixo-ai-phase3.json
          FLIXO_REPAIR_STRATEGY_PATH: /tmp/flixo-repair-strategy.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --postflight

      - name: Validate repair diff boundary before publication
        id: boundary
        if: always()
        run: node scripts/ci/validate-auto-repair-boundary.mjs --diff-only

      - name: Verify Repair Agent repair before publication
        id: verify
        if: always() && steps.boundary.outcome == 'success'
        env:
          INTRACTABLE: ${{ steps.strategy.outputs.intractable }}
        run: |
          set -euo pipefail
          if [ "$INTRACTABLE" = "true" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Case is INTRACTABLE; fail-closed escalation is required.'
            exit 0
          fi
          test -f /tmp/flixo-repair-evidence.json || { echo 'verified=false' >> "$GITHUB_OUTPUT"; exit 0; }
          test -s /tmp/flixo-ai-phase1.json
          test -s /tmp/flixo-ai-phase3.json
          node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --assert-post
          node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --assert-post
          OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          echo "REPAIR_OUTCOME=$OUTCOME"
          if [ "$OUTCOME" != "verified-repair" ] && [ "$OUTCOME" != "verified-historical-revert" ]; then echo 'verified=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --quiet && { echo 'verified=false' >> "$GITHUB_OUTPUT"; echo 'Verified repair produced no source diff; refusing publication.'; exit 1; }
          node /tmp/flixo-repair-controller/scripts/ci/ensure-agent-locales.mjs
          test "$(git branch --show-current)" = execution
          echo 'PRE_CANDIDATE_REPAIR_EVIDENCE=PASS'
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Record local verification state in the Repair Control Plane
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=LOCAL_VERIFICATION --actor=VERIFIER --reason=FULL_VERIFICATION_PASSED

      - name: Record learning outcome for every diagnosed failure
        if: always()
        env:
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_DERIVED_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
          FLIXO_INTRACTABLE_ERRORS: /tmp/flixo-intractable-errors.json
          VERIFY_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          CANDIDATE_VERIFICATION_OUTCOME: ${{ steps.candidate_verification.outcome }}
          FLIXO_FAILED_SHA: ''
          FLIXO_RUN_ID: ${{ env.TARGET_RUN_ID }}
          FLIXO_TRUSTED_MEMORY_SHA: ${{ env.FLIXO_TRUSTED_MEMORY_SHA || '' }}
          FLIXO_TARGET_SHA: ''
          FLIXO_REVERTED_COMMIT: ''
        run: |
          set -euo pipefail
          if [ -f /tmp/flixo-failed-sha ]; then FLIXO_FAILED_SHA="$(cat /tmp/flixo-failed-sha)"; fi
          test -f /tmp/flixo-root-cause.json || printf '%s\n' '{"rootCause":"unknown"}' > /tmp/flixo-root-cause.json
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          if [ -f /tmp/flixo-repair-evidence.json ]; then
            RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||x.historicalRollback?.rule||'')")
            ENGINE_OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
            TARGET_SHA=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.targetSha||'')")
            REVERTED_COMMIT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.historicalRollback?.revertedSha||'')")
          else
            RULE=''
            ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
            TARGET_SHA=''
            REVERTED_COMMIT=''
          fi
          fi
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ] && [ "$CANDIDATE_VERIFICATION_OUTCOME" = "success" ]; then
            LEARNING_OUTCOME='reverted-repair'
          elif [ "$VERIFY_OUTCOME" = "success" ] && [ "$ENGINE_OUTCOME" = "verified-repair" ]; then
            LEARNING_OUTCOME='success'
          elif [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            LEARNING_OUTCOME='blocked-external'
          elif [ "$ENGINE_OUTCOME" = "proposal-only" ]; then
            LEARNING_OUTCOME='proposed'
          else
            LEARNING_OUTCOME='unrepaired'
          fi
          if [ ! -s /tmp/flixo-repair-strategy.json ]; then
            printf '%s\n' 'engine-error' > /tmp/flixo-engine-outcome
            printf '%s\n' 'unrepaired' > /tmp/flixo-learning-outcome
            echo 'FAIL CLOSED: repair strategy evidence is missing; no handoff or learning promotion is permitted.'
            exit 1
          fi
          STRATEGY_ID="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId||'')")"
          FLIXO_REPAIR_STRATEGY_ID="$STRATEGY_ID" FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" FLIXO_LEARNING_OUTCOME="$LEARNING_OUTCOME" FLIXO_VERIFICATION="$ENGINE_OUTCOME" FLIXO_TARGET_SHA="$TARGET_SHA" FLIXO_REVERTED_COMMIT="$REVERTED_COMMIT" FLIXO_TRUSTED_MEMORY_SHA="${FLIXO_TRUSTED_MEMORY_SHA:-}" node scripts/ci/auto-repair-learning.mjs
          printf '%s\n' "$ENGINE_OUTCOME" > /tmp/flixo-engine-outcome
          printf '%s\n' "$LEARNING_OUTCOME" > /tmp/flixo-learning-outcome

      - name: Promote verified repair learning state
        if: steps.verify.outputs.verified == 'true' && steps.chair1_audit.outcome == 'success'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-repair-memory.json
          cp /tmp/flixo-repair-memory.json diagnostics/auto-repair/memory.json
          if [ -s /tmp/flixo-intractable-errors.json ]; then
            cp /tmp/flixo-intractable-errors.json diagnostics/auto-repair/intractable-errors.json
          fi
      - name: Keep non-green learning state ephemeral
        if: always() && steps.verify.outputs.verified != 'true' && steps.strategy.outputs.intractable != 'true'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-repair-memory.json
          if [ -s /tmp/flixo-intractable-errors.json ]; then
            cp /tmp/flixo-intractable-errors.json /tmp/flixo-intractable-errors-non-green.json
          fi
          echo 'NON_GREEN_LEARNING_PERSISTENCE=ARTIFACT_ONLY'
          echo 'NON_GREEN_REPAIR_MAY_NOT_ADVANCE_EXECUTION_SHA'

      - name: Enforce central Repair Protocol commit boundary
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          node /tmp/flixo-repair-controller/scripts/ci/repair-protocol.mjs commit-gate --evidence=/tmp/flixo-repair-evidence.json

      - name: Materialize source-anchored RCA attestation for candidate verification
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-rca-manifest.json
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          MANIFEST_SHA="$(jq -r '.target_sha' /tmp/flixo-rca-manifest.json)"
          test "$MANIFEST_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: RCA manifest source SHA $MANIFEST_SHA != failed SHA $FAILED_SHA"
            exit 1
          }
          mkdir -p diagnostics/auto-repair
          cp /tmp/flixo-rca-manifest.json diagnostics/auto-repair/last-rca-manifest.json
          test "$(jq -r '.target_sha' diagnostics/auto-repair/last-rca-manifest.json)" = "$FAILED_SHA"

      - name: Acquire execution mutation gate
        id: mutation_gate
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$(git branch --show-current)" = execution
          git fetch --no-tags origin execution
          test "$(git rev-parse HEAD)" = "$FAILED_SHA"
          test "$(git rev-parse origin/execution)" = "$FAILED_SHA"
          git add -A
          git add -f diagnostics/auto-repair/memory.json
          if [ -f diagnostics/auto-repair/intractable-errors.json ]; then git add -f diagnostics/auto-repair/intractable-errors.json; fi
          STAGED_PATHS="$(git diff --cached --name-only | paste -sd, -)"
          test -n "$STAGED_PATHS"
          WORK_PACKAGE_ID="REPAIR:${TARGET_RUN_ID}:${FLIXO_FAILURE_FINGERPRINT}"
          TASK_ID="ACTION-REPAIR:${TARGET_RUN_ID}:${FLIXO_FAILURE_FINGERPRINT}"
          node scripts/ci/execution-mutation-gate.mjs admit --owner=AUTO_REPAIR_BOT --sha="$FAILED_SHA" --work-package="$WORK_PACKAGE_ID" --task-id="$TASK_ID" --paths="$STAGED_PATHS" --output="$FLIXO_MUTATION_ADMISSION"
          echo 'GLOBAL_MUTATION_GATE=PASS'
      - name: Create exact unpublished candidate commit
        id: candidate_commit
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          BASE_SHA="$(git rev-parse HEAD)"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$BASE_SHA" = "$FAILED_SHA"
          test -s "$FLIXO_MUTATION_ADMISSION"
          git fetch --no-tags origin execution
          test "$(git rev-parse origin/execution)" = "$FAILED_SHA"
          git add -A
          git add -f diagnostics/auto-repair/memory.json
          if [ -f diagnostics/auto-repair/intractable-errors.json ]; then git add -f diagnostics/auto-repair/intractable-errors.json; fi
          git diff --cached --quiet && { echo 'No applicable repair diff; refusing empty repair.'; exit 1; }
          ENGINE_OUTCOME="$(node -e "const x=require('/tmp/flixo-repair-evidence.json');process.stdout.write(x.outcome||'unknown')")"
          FINGERPRINT="$(node -e "const x=require('/tmp/flixo-repair-evidence.json');process.stdout.write(x.fingerprint||'unknown')")"
          RULE="$(node -e "const x=require('/tmp/flixo-repair-evidence.json');process.stdout.write(x.selected||x.historicalRollback?.rule||'unknown')")"
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ]; then
            REVERTED_SHA="$(node -e "const x=require('/tmp/flixo-repair-evidence.json');process.stdout.write(x.historicalRollback?.revertedSha||'')")"
            test -n "$REVERTED_SHA"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "revert(auto-repair): historical rollback for run ${TARGET_RUN_ID}" -m "FLIXO-REPAIR-ROLLBACK-v1 kind=historical-revert revertedSha=$REVERTED_SHA fingerprint=$FINGERPRINT rule=$RULE"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(auto-repair): verified repair for run ${TARGET_RUN_ID}" -m "FLIXO-REPAIR-MARKER-v1 kind=verified-source-repair fingerprint=$FINGERPRINT rule=$RULE failedSha=$FAILED_SHA baseSha=$BASE_SHA"
          fi
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$CANDIDATE_SHA" > /tmp/flixo-candidate-sha
          echo "FLIXO_CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Run targeted regression and post-patch adversarial falsification in parallel
        id: candidate_verification
        if: steps.candidate_commit.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          FLIXO_REPAIR_CONTROLLER: ${{ env.FLIXO_REPAIR_CONTROLLER }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          FLIXO_ADVERSARIAL_OUTPUT: /tmp/flixo-postpatch-adversarial.json
          FLIXO_PARALLEL_VERIFICATION_OUTPUT: /tmp/flixo-candidate-verification.json
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(cat /tmp/flixo-candidate-sha)"
          PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
          test "$CANDIDATE_SHA" = "$(git rev-parse HEAD)"
          test "$CANDIDATE_SHA" != "$PARENT_SHA"
          FLIXO_EXPECTED_TARGET_SHA="$CANDIDATE_SHA" FLIXO_PATCH_BASE_SHA="$PARENT_SHA" \
            node scripts/ci/candidate-verification-parallel.mjs
          test -s /tmp/flixo-candidate-verification.json
          test "$(jq -r '.targetSha' /tmp/flixo-candidate-verification.json)" = "$(cat /tmp/flixo-candidate-sha)"
          test "$(jq -r '.mode' /tmp/flixo-candidate-verification.json)" = PARALLEL
          test "$(jq -r '.gate.result' /tmp/flixo-candidate-verification.json)" = PASS
          test "$(jq -r '.gate.targetedRegression' /tmp/flixo-candidate-verification.json)" = true
          test "$(jq -r '.gate.adversarialNoCounterexample' /tmp/flixo-candidate-verification.json)" = true
          test "$(jq -r '.earlyAbort' /tmp/flixo-candidate-verification.json)" = false
          echo 'TARGETED_REGRESSION_AND_ADVERSARIAL=PASS'
          echo 'FLIXO_AGENT_ADVERSARIAL_EVIDENCE=/tmp/flixo-postpatch-adversarial.json' >> "$GITHUB_ENV"
          echo 'FLIXO_CANDIDATE_VERIFICATION=/tmp/flixo-candidate-verification.json' >> "$GITHUB_ENV"
      - name: Strict Chair-1 audit of every Auto Repair candidate
        id: chair1_audit
        if: steps.candidate_verification.outcome == 'success'
        env:
          FLIXO_REPAIR_EVIDENCE_PATH: /tmp/flixo-repair-evidence.json
          FLIXO_CANDIDATE_VERIFICATION: /tmp/flixo-candidate-verification.json
          FLIXO_ADVERSARIAL_EVIDENCE: /tmp/flixo-postpatch-adversarial.json
          FLIXO_CHAIR1_PROPOSAL: /tmp/flixo-chair1-proposal.json
          FLIXO_CHAIR1_AUDIT: /tmp/flixo-chair1-audit.json
          FLIXO_CHAIR1_LESSON: /tmp/flixo-chair1-learning.json
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(cat /tmp/flixo-candidate-sha)"
          PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
          node scripts/ci/auto-repair-chair1-audit.mjs             --actor=AUTO_REPAIR_BOT             --required-reviewer=chair_1             --candidate="$CANDIDATE_SHA"             --parent="$PARENT_SHA"             --evidence="$FLIXO_REPAIR_EVIDENCE_PATH"             --verification="$FLIXO_CANDIDATE_VERIFICATION"             --adversarial="$FLIXO_ADVERSARIAL_EVIDENCE"             --proposal="$FLIXO_CHAIR1_PROPOSAL"             --output="$FLIXO_CHAIR1_AUDIT"             --lesson-output="$FLIXO_CHAIR1_LESSON"             --run-id="$GITHUB_RUN_ID"             --task-id="ACTION-REPAIR:$TARGET_RUN_ID:$FLIXO_FAILURE_FINGERPRINT"             --work-package="REPAIR:$TARGET_RUN_ID:$FLIXO_FAILURE_FINGERPRINT"
          jq -e --arg candidate "$CANDIDATE_SHA"             '.protocol=="FLIXO-AUTO-REPAIR-CHAIR1-AUDIT-v1" and .chairId=="chair_1" and .proposerAgent=="AUTO_REPAIR_BOT" and .reviewerAgent=="CHAIR_1_AUDITOR" and .decision=="APPROVED" and .candidateSha==$candidate and .exactSha==true and (.reasonCodes|length)==0'             "$FLIXO_CHAIR1_AUDIT" >/dev/null
          echo "FLIXO_CHAIR1_REVIEW_STATUS=APPROVED" >> "$GITHUB_ENV"
          echo 'CHAIR1_AUDIT=APPROVED'
          echo 'CHAIR1_REVIEW_AUTHORITY=STRICT_INDEPENDENT_AUDITOR'
      - name: Feed rejected Chair-1 findings back into Repair Agent learning
        if: always() && steps.chair1_audit.outcome == 'failure'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-chair1-learning.json
          test -s /tmp/flixo-repair-memory.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const memoryPath = '/tmp/flixo-repair-memory.json';
          const lesson = JSON.parse(fs.readFileSync('/tmp/flixo-chair1-learning.json','utf8'));
          const memory = JSON.parse(fs.readFileSync(memoryPath,'utf8'));
          memory.antiLessons = Array.isArray(memory.antiLessons) ? memory.antiLessons : [];
          const fingerprint = String(lesson.failureFingerprint || 'chair1-rejection');
          const id = 'CHAIR1:' + fingerprint + ':' + String(lesson.candidateSha || '').slice(0, 12) + ':' + String(lesson.failures?.[0]?.code || 'REJECTED');
          if (!memory.antiLessons.some((item) => item.id === id)) {
            memory.antiLessons.push({
              id,
              fingerprint,
              rootCause: 'chair1-review',
              rule: lesson.rule,
              anti: true,
              repairAgent: lesson.repairAgent,
              repairWeakness: lesson.repairWeakness,
              failures: lesson.failures,
              preventionRules: ['REJECT_UNVERIFIED_AUTO_REPAIR', 'REQUIRE_EXACT_SHA_DIFF_PROOF', 'REQUIRE_ADVERSARIAL_PASS_BEFORE_PUBLICATION'],
              evidence: lesson.evidence,
              createdAt: lesson.createdAt,
            });
          }
          fs.writeFileSync(memoryPath, JSON.stringify(memory, null, 2) + '\\n');
          NODE
          echo 'AUTO_REPAIR_TEACHING=CHAIR1_REJECTION_RECORDED'
          echo 'CHAIR1_REVIEW_STATUS=REJECTED' >> "$GITHUB_ENV"
      - name: Require Chair-1 approval before Auto Repair publication
        if: steps.chair1_audit.outcome != 'success'
        run: |
          set -euo pipefail
          echo 'FAIL CLOSED: Auto Repair candidate was not approved by the independent Chair-1 strict audit.'
          echo 'AUTO_REPAIR_PUBLICATION=BLOCKED_BY_CHAIR1'
          exit 1
          exit 1

      - name: Publish exact candidate commit only after post-patch adversarial validation
        id: publish_candidate
        if: steps.chair1_audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(cat /tmp/flixo-candidate-sha)"
          PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
          test -s "$FLIXO_MUTATION_ADMISSION"
          test -s "$FLIXO_CHAIR_CONTEXT"
          git fetch --no-tags origin execution
          test "$(git rev-parse origin/execution)" = "$PARENT_SHA"
          HEAD_WP="REPAIR-HEAD:$TARGET_RUN_ID:$FLIXO_FAILURE_FINGERPRINT"
          HEAD_TASK="REPAIR-HEAD:$TARGET_RUN_ID:$FLIXO_FAILURE_FINGERPRINT"
          node scripts/ci/chair-bound-execution.mjs init --sha="$PARENT_SHA"
          HEAD_FENCE="$(printf '%s' "$HEAD_WP:$HEAD_TASK:$PARENT_SHA" | sha256sum | cut -d' ' -f1)"
          node scripts/ci/chair-bound-execution.mjs acquire --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$PARENT_SHA" --repository-state=IDLE --work-package="$HEAD_WP" --task-id="$HEAD_TASK" --fencing-token="$HEAD_FENCE" --scope="*" >/tmp/flixo-final-head-chair.json
          node scripts/ci/chair-bound-execution.mjs authorize-publication --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$PARENT_SHA" --permission=SOURCE_MUTATION --work-package="$HEAD_WP" --task-id="$HEAD_TASK" --fencing-token="$HEAD_FENCE" --paths="*" >/tmp/flixo-final-head-publication.json
          node scripts/ci/execution-head-authority.mjs authorize --agent=AUTO_REPAIR_BOT --target-sha="$PARENT_SHA" --parent-sha="$PARENT_SHA" --candidate-sha="$CANDIDATE_SHA" --task-id="$HEAD_TASK" --work-package="$HEAD_WP" --output="$FLIXO_HEAD_AUTHORITY_PROOF" >/tmp/flixo-head-authority-log.json
          node scripts/ci/execution-mutation-gate.mjs verify --phase=pre-push --admission="$FLIXO_MUTATION_ADMISSION" --candidate="$CANDIDATE_SHA" --parent="$PARENT_SHA"
          echo "CHAIR_GUARD_BLOCKED: direct execution publication is forbidden."

          echo "HANDOFF_REQUIRED: Chair-1 must publish the verified candidate through the guarded execution path."

          exit 1
          node scripts/ci/execution-mutation-gate.mjs verify --phase=post-push --admission="$FLIXO_MUTATION_ADMISSION" --candidate="$CANDIDATE_SHA"
          node scripts/ci/chair-bound-execution.mjs release --chair=chair_1 --agent=AUTO_REPAIR_BOT --sha="$PARENT_SHA" --successful=true >/tmp/flixo-final-head-release.json
          echo 'EXECUTION_PUBLICATION=BLOCKED_BY_CHAIR_GUARD'
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head execution --title "fix(auto-repair): canonical execution repair" --body "Canonical execution repair with exact-SHA canonical CI and post-patch adversarial falsification.")"; fi
          echo "Canonical execution -> main PR: $PR_URL"
      - name: Record publication state in the Repair Control Plane
        if: steps.publish_candidate.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=READY_FOR_CHAIR_PUBLICATION --actor=AUTO_REPAIR_BOT --reason=VERIFIED_CANDIDATE_AWAITS_CHAIR
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=CHAIR_REVIEW --actor=AUTO_REPAIR_BOT --reason=AWAITING_CHAIR_PUBLICATION

      - name: Enforce central Repair Protocol post-commit boundary
        if: steps.publish_candidate.outcome == 'success'
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          node /tmp/flixo-repair-controller/scripts/ci/repair-protocol.mjs post-commit --evidence=/tmp/flixo-repair-evidence.json

      - name: Prepare exact post-commit repair handoff
        if: steps.publish_candidate.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          git fetch --no-tags origin execution
          EXECUTION_SHA="$(git rev-parse HEAD)"
          REMOTE_EXECUTION_SHA="$(git rev-parse origin/execution)"
          test "$EXECUTION_SHA" = "$REMOTE_EXECUTION_SHA"
          PARENT_SHA="$(git rev-parse "$EXECUTION_SHA^")"
          test -f /tmp/flixo-repair-evidence.json
          SOURCE_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.targetSha||'')")"
          test "$SOURCE_SHA" = "$PARENT_SHA"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome)"
          case "$ENGINE_OUTCOME" in
            verified-repair|verified-historical-revert) ;;
            *) echo "FAIL CLOSED: invalid post-commit handoff outcome=$ENGINE_OUTCOME"; exit 1 ;;
          esac
          git diff --binary "$PARENT_SHA" "$EXECUTION_SHA" > /tmp/flixo-prepared-repair.patch
          test -s /tmp/flixo-prepared-repair.patch
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const evidence = JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));
          const executionSha = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parentSha = execFileSync('git',['rev-parse',`${executionSha}^`],{encoding:'utf8'}).trim();
          const changedPaths = execFileSync('git',['diff','--name-only',parentSha,executionSha],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const patch = fs.readFileSync('/tmp/flixo-prepared-repair.patch');
          const mode = fs.readFileSync('/tmp/flixo-engine-outcome','utf8').trim();
          const handoff = {
            schemaVersion: 4,
            protocol: 'AGENT-REPAIR-HANDOFF-GATE-v4',
            mode: mode === 'verified-historical-revert' ? 'VERIFIED_HISTORICAL_REVERT' : 'VERIFIED_REPAIR',
            applyBy: 'AUTO_REPAIR_BOT',
            requiresCanonicalCI: true,
            repository: process.env.GITHUB_REPOSITORY,
            headBranch: 'execution',
            baseBranch: 'main',
            repairRunId: process.env.GITHUB_RUN_ID,
            targetFailureRunId: process.env.TARGET_RUN_ID,
            chainId: process.env.FLIXO_REPAIR_CHAIN_ID,
            failedSha: fs.readFileSync('/tmp/flixo-failed-sha','utf8').trim(),
            sourceSha: evidence.targetSha,
            controllerSha: process.env.FLIXO_TRUSTED_MEMORY_SHA || null,
            executionSha,
            parentSha,
            fingerprint: evidence.fingerprint,
            selectedRule: evidence.selected || evidence.historicalRollback?.rule || null,
            changedPaths,
            patchSha256: crypto.createHash('sha256').update(patch).digest('hex'),
            evidenceFile: 'flixo-repair-evidence.json',
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/flixo-prepared-repair-handoff.json', JSON.stringify(handoff,null,2)+'\n');
          NODE
          test -s /tmp/flixo-prepared-repair-handoff.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/flixo-prepared-repair-handoff.json','utf8'));for(const k of ['repairRunId','targetFailureRunId','chainId','failedSha','sourceSha','controllerSha','executionSha','parentSha','fingerprint','selectedRule','patchSha256']) if(h[k]===undefined||h[k]===null||h[k]==='') throw new Error('missing handoff field '+k);"
          test "${GITHUB_RUN_ID}" = "$(node -e "const h=require('/tmp/flixo-prepared-repair-handoff.json');process.stdout.write(h.repairRunId)")"
          test "$TARGET_RUN_ID" = "$(node -e "const h=require('/tmp/flixo-prepared-repair-handoff.json');process.stdout.write(h.targetFailureRunId)")"
      - name: Validate Phase 2 release integrity handoff
        if: steps.publish_candidate.outcome == 'success'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_REPAIR_EVIDENCE_PATH: /tmp/flixo-repair-evidence.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase2.mjs --release-handoff

      - name: Record durable repair lease outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_VERIFIED: ${{ steps.verify.outputs.verified }}
          CANDIDATE_VERIFICATION_OUTCOME: ${{ steps.candidate_verification.outcome }}
        run: |
          set +e
          if [ ! -s /tmp/flixo-lease-verification.json ]; then
            echo 'LEASE_OUTCOME_ATTESTATION=SKIPPED_NO_VERIFIED_LEASE'
            exit 0
          fi

          FAILED_SHA="$(cat /tmp/flixo-failed-sha 2>/dev/null || printf '%s' '')"
          EXIT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha' 2>/dev/null || printf '%s' "$FAILED_SHA")"
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          VERIFICATION="engine-error"
          OUTCOME="FAILED_REPAIR"
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ]; then
            OUTCOME="VERIFIED_HISTORICAL_REVERT"
            VERIFICATION="verified-historical-revert"
          elif [ "$ENGINE_OUTCOME" = "verified-repair" ] && [ "$VERIFY_VERIFIED" = "true" ] && [ "$CANDIDATE_VERIFICATION_OUTCOME" = "success" ]; then
            OUTCOME="VERIFIED_REPAIR"
            VERIFICATION="verified-repair"
          elif [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            OUTCOME="BLOCKED_EXTERNAL"
            VERIFICATION="blocked-external"
          elif [ ! -s /tmp/flixo-root-cause.json ]; then
            OUTCOME="BLOCKED_RCA"
            VERIFICATION="root-cause-unavailable"
          else
            VERIFICATION="$ENGINE_OUTCOME"
          fi
          VERIFICATION_PROGRESS=false
          if [ "$OUTCOME" = "VERIFIED_REPAIR" ] || [ "$OUTCOME" = "VERIFIED_HISTORICAL_REVERT" ] || [ "$EXIT_SHA" != "$FAILED_SHA" ]; then
            VERIFICATION_PROGRESS=true
          fi
          STRATEGY_ID="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-strategy.json','utf8'));process.stdout.write(x.strategyId||'unknown')}catch{process.stdout.write('unavailable')}" 2>/dev/null || printf '%s' 'unavailable')"

          node scripts/ci/repair-lease.mjs outcome \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" \
            --attempt="$FLIXO_REPAIR_LEASE_ATTEMPT" \
            --leaseOwner="AUTO_REPAIR_BOT" \
            --repairRunId="$GITHUB_RUN_ID" \
            --strategy="$STRATEGY_ID" \
            --outcome="$OUTCOME" \
            --exitSha="$EXIT_SHA" \
            --verification="$VERIFICATION" \
            --verificationProgress="$VERIFICATION_PROGRESS" \
            >/tmp/flixo-repair-lease-outcome.json
          cat /tmp/flixo-repair-lease-outcome.json
          echo "LEASE_OUTCOME=$OUTCOME"
          echo "LEASE_EXIT_SHA=$EXIT_SHA"
          echo "LEASE_VERIFICATION_PROGRESS=$VERIFICATION_PROGRESS"

      - name: Publish Repair Control Plane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-control-plane-${{ github.run_id }}
          path: |
            /tmp/flixo-repair-control-plane.json
            /tmp/flixo-lease-verification.json
            /tmp/flixo-repair-lease-outcome.json
            /tmp/flixo-postpatch-adversarial.json
            /tmp/flixo-rca-manifest.json
            /tmp/flixo-candidate-verification.json
            /tmp/flixo-candidate-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-auto-repair-${{ env.TARGET_RUN_ID }}-${{ github.run_id }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-scout-report.json
            /tmp/flixo-scout-path
            /tmp/flixo-root-cause.json
            /tmp/flixo-engine-outcome
            /tmp/flixo-learning-outcome
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-ai-phase1.json
            /tmp/flixo-ai-phase2.json
            /tmp/flixo-ai-phase3.json
            /tmp/flixo-repair-strategy.json
            /tmp/flixo-repair-behavior-trace.json
            /tmp/flixo-intractable-state
            /tmp/flixo-task-agent/*.json
            /tmp/flixo-repair-memory.json
            /tmp/flixo-postpatch-adversarial.json
            /tmp/flixo-postpatch-adversarial.json
            /tmp/flixo-rca-manifest.json
            /tmp/flixo-historical-learning.json
            /tmp/flixo-intractable-errors.json
            diagnostics/auto-repair/memory.json
            diagnostics/auto-repair/intractable-errors.json
          if-no-files-found: warn
          retention-days: 30

      - name: Block source-free learning publication on non-green cycle
        if: always() && steps.verify.outputs.verified != 'true'
        run: |
          set -euo pipefail
          echo 'NON_GREEN_LEARNING_PUBLISH=DISABLED'
          echo 'Learning remains workflow-local/artifact-only until a verified source repair exists.'
      - name: Keep the same repair cycle open when verification is not green
        if: always() && steps.verify.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' engine-error)"
          if [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            echo 'External tooling failure is BLOCKED_EXTERNAL; source mutation remains prohibited, but the repair cycle stays open.'
            REPROBE_DECISION="$(node scripts/ci/auto-repair-supervisor.mjs --check-reprobe | tail -n 1)"
            if [ "$REPROBE_DECISION" = "true" ]; then
              echo 'External provider signature changed; permitting another diagnostic cycle.'
            else
              echo 'External provider signature unchanged; keeping the cycle open and scheduling a controlled re-probe.'
            fi
          fi
          if [ "$ENGINE_OUTCOME" = "engine-error" ]; then
            echo 'Repair engine error; preserving RED and reopening the repair cycle for another diagnostic/strategy attempt.'
          fi

          FAILED_BRANCH="$(cat /tmp/flixo-failed-branch 2>/dev/null || printf '%s' main)"
          if [ "$FAILED_BRANCH" = "execution" ]; then
            CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            CURRENT_FAILURE_ID="$(
              gh run list --repo "$GITHUB_REPOSITORY" --branch execution --limit 50                 --json databaseId,name,headSha,conclusion,createdAt                 --jq 'map(select((.name == "FLIXO Test System" or .name == "FLIXO WP0 Trust Baseline" or .name == "FLIXO Continuous Delivery") and .headSha == "'$CURRENT_EXECUTION_SHA'" and (.conclusion == "failure" or .conclusion == "timed_out"))) | sort_by(.createdAt) | last.databaseId // empty'
            )"
            if [ -z "$CURRENT_FAILURE_ID" ]; then
              echo "No current canonical failure remains on execution $CURRENT_EXECUTION_SHA; no RED is currently open."
              exit 0
            fi
            echo "Repair remains open on execution failure run $CURRENT_FAILURE_ID."
            echo "Execution repair remains open on execution failure run $CURRENT_FAILURE_ID."
            echo 'DISPATCH_AUTHORITY=DAILY_FLIXO_GREEN_GATE'
            echo "RED_REMAINS_OPEN=$CURRENT_FAILURE_ID"
            echo 'The Daily·FLIXO Green Gate is the sole dispatcher. The executor never dispatches itself; unresolved RED remains fail-closed.'
            exit 1
          fi

          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          CURRENT_FAILURE_ID="$(
            gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 50               --json databaseId,name,headSha,conclusion,createdAt               --jq 'map(select((.name == "FLIXO Test System" or .name == "FLIXO WP0 Trust Baseline" or .name == "FLIXO Continuous Delivery") and .headSha == "'$CURRENT_MAIN_SHA'" and (.conclusion == "failure" or .conclusion == "timed_out"))) | sort_by(.createdAt) | last.databaseId // empty'
          )"
          if [ -z "$CURRENT_FAILURE_ID" ]; then
            echo "No current canonical failure remains on main $CURRENT_MAIN_SHA; no RED is currently open."
            exit 0
          fi
          echo "Repair remains open on current canonical failure run $CURRENT_FAILURE_ID."
          echo 'DISPATCH_AUTHORITY=DAILY_FLIXO_GREEN_GATE'
            echo "RED_REMAINS_OPEN=$CURRENT_FAILURE_ID"
            echo 'The Daily·FLIXO Green Gate is the sole dispatcher. The executor never dispatches itself; unresolved RED remains fail-closed.'
          exit 1