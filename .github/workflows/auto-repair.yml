name: FLIXO Auto Repair Bot
run-name: FLIXO Auto Repair Chain ${{ inputs.chain_id || inputs.target_run_id }}

# TWO-BRANCH MODEL:
# execution = sole working/repair branch
# main      = sole production/source-of-truth branch
# No workflow in this file may create another branch.
on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Workflow run ID to diagnose and repair'
        required: true
        type: string
      chain_id:
        description: 'Stable repair-chain identifier; recursive runs must reuse it'
        required: false
        type: string
      failure_fingerprint:
        description: 'Watcher-provided exact failure fingerprint for Control Plane identity'
        required: false
        type: string
      repair_lease_ref:
        description: 'Existing atomic global repair lease ref created by the watcher'
        required: false
        type: string
      repair_lease_attempt:
        description: 'Durable lease attempt number; 1 is initial claim, >1 is stale recovery'
        required: false
        default: '1'
        type: string
      prompt_source_run_id:
        description: 'Daily Green Gate run that published the comprehensive repair prompt bundle'
        required: false
        type: string

permissions:
  # Sole source-mutation authority for the repair plane.
  # Actions administration is intentionally NOT granted: peer observers may wake
  # the bot, but cannot use it to disable or reconfigure Actions.
  # It still cannot bypass the execution-only mutation boundary or write main.
  contents: write
  # Read-only artifact/run observation is required for the independent twin result.
  actions: read
  # No Actions-admin capability: peer agents cannot be controlled by the repair bot.
  checks: read
  pull-requests: write
  issues: write
  statuses: write
  security-events: write

concurrency:
  # Serialize one canonical repair chain; the chain identity includes branch, SHA, fingerprint and target run ID.
  group: flixo-auto-repair-execution-${{ inputs.chain_id || inputs.target_run_id }}
  cancel-in-progress: false

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
  FLIXO_REPAIR_LANE: single
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  FLIXO_HISTORY_LIMIT: '100'
  FLIXO_REPAIR_CHAIN_ID: ${{ inputs.chain_id || inputs.target_run_id }}
  FLIXO_FAILURE_FINGERPRINT: ${{ inputs.failure_fingerprint || '' }}
  FLIXO_REPAIR_LEASE_REF: ${{ inputs.repair_lease_ref || '' }}
  FLIXO_REPAIR_LEASE_ATTEMPT: ${{ inputs.repair_lease_attempt || '1' }}
  FLIXO_REPAIR_ATTEMPT: ${{ inputs.repair_lease_attempt || '1' }}
  FLIXO_PROMPT_SOURCE_RUN_ID: ${{ inputs.prompt_source_run_id || '' }}
  # Intentionally no finite repair-chain stop; closure is governed only by canonical GREEN.
  # DISPATCH AUTHORITY: Daily·FLIXO Green Gate.
  # This workflow is executor-only and must never self-dispatch.
  FLIXO_STRICT_RED_REPAIR: 'true'
  FLIXO_TRUSTED_REPAIR_MEMORY: /tmp/flixo-trusted-memory.json
  FLIXO_SCOUT_REPORT: /tmp/flixo-investigation/code-scout-latest.json
  FLIXO_DIAGNOSTIC_LINE_LIMIT: '5000'
  FLIXO_REPAIR_ATTEMPT_LEDGER: /tmp/flixo-repair-attempt-ledger.json
  # Independent Actions learning owner.
  FLIXO_ACTION_INDEX_BOT_ID: ACTION-INDEX
  FLIXO_ACTION_MASTER: repairAgent

jobs:
  adversarial_twin:
    name: Read-only adversarial twin — independent challenge
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      twin_a: ${{ steps.publish_twin_outputs.outputs.twin_a }}
      twin_b: ${{ steps.publish_twin_outputs.outputs.twin_b }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout execution for read-only analysis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact failed SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_META="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,conclusion,name)"
          FAILED_SHA="$(printf '%s' "$RUN_META" | jq -r '.headSha')"
          FAILED_BRANCH="$(printf '%s' "$RUN_META" | jq -r '.headBranch')"
          CONCLUSION="$(printf '%s' "$RUN_META" | jq -r '.conclusion')"
          test "$CONCLUSION" = failure || test "$CONCLUSION" = timed_out
          test "$FAILED_BRANCH" = main || test "$FAILED_BRANCH" = execution
          test "$FAILED_SHA" != "null" && test -n "$FAILED_SHA"
          git fetch --no-tags origin "$FAILED_SHA"
          rm -rf /tmp/flixo-twin-target
          git worktree add --detach /tmp/flixo-twin-target "$FAILED_SHA"
          test "$(git -C /tmp/flixo-twin-target rev-parse HEAD)" = "$FAILED_SHA"
          echo "failed_sha=$FAILED_SHA" >> "$GITHUB_OUTPUT"

      - name: Capture exact failed-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-twin
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/flixo-twin/failure.log
          test -s /tmp/flixo-twin/failure.log

      - name: Fast-scan Action failure signal
        env:
          FLIXO_ACTION_VAULT_FAILURE_LOG: /tmp/flixo-twin/failure.log
          FLIXO_ACTION_VAULT_TARGET_SHA: ${{ steps.target.outputs.failed_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/action-fast-reader.mjs --input="$FLIXO_ACTION_VAULT_FAILURE_LOG" --output=/tmp/flixo-fast-failure.json

      - name: Run FLIXO adversarial twin — read only
        env:
          FLIXO_TARGET_DIR: /tmp/flixo-twin-target
          FLIXO_FAILURE_LOG: /tmp/flixo-twin/failure.log
          FLIXO_TWIN_OUTPUT: /tmp/flixo-twin/twin-result.json
          FLIXO_EXPECTED_TARGET_SHA: ${{ steps.target.outputs.failed_sha }}
          FLIXO_TWIN_READ_ONLY: 'true'
          FLIXO_TWIN_DETACHED: 'true'
        run: |
          set -euo pipefail
          for VARIANT in A B; do
            case "$VARIANT" in A) OUTPUT=/tmp/flixo-twin/twin-a.json ;; B) OUTPUT=/tmp/flixo-twin/twin-b.json ;; esac
            FLIXO_TWIN_VARIANT="$VARIANT" FLIXO_TWIN_OUTPUT="$OUTPUT" node scripts/ci/adversarial-repair-twin.mjs
            jq -e --arg variant "$VARIANT" '.mutationAuthority == false and .repositoryWrite == false and .actionsWrite == false and .targetSha == env.FLIXO_EXPECTED_TARGET_SHA and .twinVariant == $variant' "$OUTPUT" >/dev/null
          done

      - name: Publish validated twin outputs
        id: publish_twin_outputs
        env:
          FLIXO_EXPECTED_TARGET_SHA: ${{ steps.target.outputs.failed_sha }}
        run: |
          set -euo pipefail
          for TWIN in a b; do
            jq -e --arg sha "$FLIXO_EXPECTED_TARGET_SHA" '.targetSha == $sha and .mutationAuthority == false and .repositoryWrite == false and .actionsWrite == false' "/tmp/flixo-twin/twin-$TWIN.json" >/dev/null
          done
          printf '%s\n' "twin_a=$(base64 -w0 /tmp/flixo-twin/twin-a.json)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "twin_b=$(base64 -w0 /tmp/flixo-twin/twin-b.json)" >> "$GITHUB_OUTPUT"

  repair:
    name: Single-lane diagnose, execute, verify and learn on execution
    needs: adversarial_twin
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.adversarial_twin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical execution branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce central Council directive before diagnosis or mutation
        run: node scripts/ci/test-council-directive.mjs

      - name: Resolve target workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          case "$CONCLUSION" in
            failure|timed_out) ;;
            *) echo "Target run $TARGET_RUN_ID is not a diagnosable failure: $CONCLUSION"; exit 1 ;;
          esac
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,headSha,headBranch,name
          RUN_META="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,name,conclusion)"
          FAILED_SHA="$(printf '%s' "$RUN_META" | jq -r '.headSha')"
          FAILED_BRANCH="$(printf '%s' "$RUN_META" | jq -r '.headBranch')"
          FAILED_NAME="$(printf '%s' "$RUN_META" | jq -r '.name')"
          test -n "$FAILED_SHA" && test "$FAILED_SHA" != "null"
          test "$FAILED_BRANCH" = "main" || test "$FAILED_BRANCH" = "execution"
          CURRENT_TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FAILED_BRANCH" --jq '.object.sha')"
          test "$CURRENT_TARGET_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: repair target $FAILED_SHA is superseded by current $FAILED_BRANCH SHA $CURRENT_TARGET_SHA."
            exit 1
          }
          printf '%s\n' "$CURRENT_TARGET_SHA" > /tmp/flixo-current-target-sha
          printf '%s\n' "$FAILED_SHA" > /tmp/flixo-failed-sha
          test -s /tmp/flixo-failed-sha
          test "$(cat /tmp/flixo-failed-sha)" = "$FAILED_SHA"
          echo "FLIXO_EXPECTED_TARGET_SHA=$FAILED_SHA" >> "$GITHUB_ENV"
          test "$FAILED_NAME" != "FLIXO Auto Repair Bot" || { echo 'FAIL CLOSED: auto-repair cannot repair itself.'; exit 1; }
          test "$FAILED_NAME" != "FLIXO Auto Repair Chain" || { echo 'FAIL CLOSED: auto-repair cannot repair itself.'; exit 1; }
          printf '%s\n' "$FAILED_BRANCH" > /tmp/flixo-failed-branch
          printf '%s\n' "$FAILED_NAME" > /tmp/flixo-failed-workflow

      - name: Validate immutable repair boundary before mutation
        run: node scripts/ci/validate-auto-repair-boundary.mjs --static-only

      - name: Enforce strict red-to-repair policy
        run: |
          set -euo pipefail
          test "$FLIXO_STRICT_RED_REPAIR" = 'true'
          echo 'STRICT_RED_REPAIR=true: every actionable RED must produce a repair attempt before closure.'

      - name: Enforce continuous repair-cycle contract
        run: |
          set -euo pipefail
          test "$FLIXO_STRICT_RED_REPAIR" = 'true'
          echo 'CONTINUOUS_REPAIR=true: no finite chain-count may close an actionable RED cycle.'
          echo 'The cycle remains open until canonical GREEN evidence is observed.'

      - name: Synchronize execution with the failed main SHA without creating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          git fetch --no-tags origin main execution "$FAILED_SHA"
          git checkout execution
          git reset --hard origin/execution
          # execution may advance to the failed main SHA only by fast-forward.
          # If it contains unrelated/unmerged work, fail closed rather than branching.
          if git merge-base --is-ancestor "$FAILED_SHA" HEAD; then
            echo "execution already contains failed SHA $FAILED_SHA"
          elif git merge-base --is-ancestor HEAD "$FAILED_SHA"; then
            git merge --ff-only "$FAILED_SHA"
            git push origin execution
          else
            echo "execution and failed main SHA have diverged; refusing a third branch or destructive reset."
            exit 1
          fi
          test "$(git branch --show-current)" = execution
          printf '%s\n' execution > /tmp/flixo-repair-branch

      - name: Initialize Repair Control Plane cycle
        run: |
          set -euo pipefail
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          EXECUTION_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          FAILURE_FINGERPRINT="$FLIXO_FAILURE_FINGERPRINT"
          if [ -z "$FAILURE_FINGERPRINT" ]; then
            SIGNATURE_SEED="$(printf '%s:%s:%s' "$FAILED_SHA" "$TARGET_RUN_ID" "$(cat /tmp/flixo-failed-workflow)")"
            FAILURE_FINGERPRINT="$(node --input-type=module -e "import crypto from 'node:crypto'; console.log(crypto.createHash('sha256').update(process.argv[1], 'utf8').digest('hex'))" "$SIGNATURE_SEED")"
            echo "CONTROL_PLANE_FINGERPRINT_SOURCE=FALLBACK_DERIVATION"
          else
            echo "CONTROL_PLANE_FINGERPRINT_SOURCE=WATCHER_INPUT"
          fi
          echo "FLIXO_FAILURE_FINGERPRINT=$FAILURE_FINGERPRINT" >> "$GITHUB_ENV"
          EXPECTED_LEASE_REF="$(node scripts/ci/repair-control-plane.mjs lease-ref \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution")"
          test -n "$FLIXO_REPAIR_LEASE_REF" || {
            echo 'FAIL CLOSED: Auto-Repair must be dispatched only after a watcher-owned global lease exists.'
            exit 1
          }
          test "$FLIXO_REPAIR_LEASE_REF" = "$EXPECTED_LEASE_REF" || {
            echo "FAIL CLOSED: provided repair lease ref does not match the canonical repair identity."
            exit 1
          }
          case "$FLIXO_REPAIR_LEASE_ATTEMPT" in
            ''|*[!0-9]*|0) echo "FAIL CLOSED: invalid repair lease attempt=$FLIXO_REPAIR_LEASE_ATTEMPT"; exit 1 ;;
          esac
          node scripts/ci/repair-lease.mjs verify \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" \
            --attempt="$FLIXO_REPAIR_LEASE_ATTEMPT" \
            --leaseOwner="AUTO_REPAIR_BOT" \
            --repairRunId="$GITHUB_RUN_ID" > /tmp/flixo-lease-verification.json
          test "$(jq -r '.status' /tmp/flixo-lease-verification.json)" = "LEASE_ACTIVE"
          echo "GLOBAL_REPAIR_LEASE_VERIFIED=$FLIXO_REPAIR_LEASE_REF"
          echo "GLOBAL_REPAIR_LEASE_ATTEMPT=$FLIXO_REPAIR_LEASE_ATTEMPT"

          node scripts/ci/repair-control-plane.mjs claim \
            --fingerprint="$FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --executionSha="$EXECUTION_SHA" \
            --mainSha="$MAIN_SHA" \
            --owner="AUTO_REPAIR_BOT" \
            --branch="execution" > /tmp/flixo-repair-control-plane.json
          test "$(jq -r '.state' /tmp/flixo-repair-control-plane.json)" = "CLAIMED"
          echo "FLIXO_CONTROL_PLANE_FILE=/tmp/flixo-repair-control-plane.json" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Establish trusted main controller and active execution target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main execution
          MAIN_SHA="$(git rev-parse origin/main)"
          EXECUTION_SHA="$(git rev-parse origin/execution)"
          CONTROLLER_SHA="$MAIN_SHA"
          test "$CONTROLLER_SHA" = "$MAIN_SHA"
          test "$EXECUTION_SHA" != ""
          git worktree add --detach /tmp/flixo-repair-controller "$CONTROLLER_SHA"
          test "$(git -C /tmp/flixo-repair-controller rev-parse HEAD)" = "$CONTROLLER_SHA"
          git show "$MAIN_SHA:diagnostics/auto-repair/memory.json" > /tmp/flixo-trusted-memory.json
          test -s /tmp/flixo-trusted-memory.json
          printf "%s\n" "$CONTROLLER_SHA" > /tmp/flixo-trusted-controller-sha
          printf "%s\n" "$MAIN_SHA" > /tmp/flixo-trusted-memory-sha
          printf "%s\n" "$EXECUTION_SHA" > /tmp/flixo-execution-target-sha
          echo "FLIXO_TRUSTED_CONTROLLER_SHA=$CONTROLLER_SHA" >> "$GITHUB_ENV"
          echo "FLIXO_TRUSTED_MEMORY_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "FLIXO_TRUSTED_REPAIR_MEMORY=/tmp/flixo-trusted-memory.json" >> "$GITHUB_ENV"
          echo "FLIXO_REPAIR_CONTROLLER=/tmp/flixo-repair-controller" >> "$GITHUB_ENV"
          echo "FLIXO_EXECUTION_TARGET_SHA=$EXECUTION_SHA" >> "$GITHUB_ENV"
          echo "TRUST_MODEL=MAIN_CONTROLLER_EXECUTION_TARGET"

      - name: Validate trusted controller memory before mutation
        run: |
          set -euo pipefail
          FLIXO_MEMORY_VALIDATION_PATH=/tmp/flixo-trusted-memory.json node /tmp/flixo-repair-controller/scripts/ci/validate-auto-repair-memory.mjs
      - name: Run exact-SHA read-only source scout
        env:
          INVESTIGATION_DIR: /tmp/flixo-investigation
          FLIXO_SCOUT_REPORT: /tmp/flixo-investigation/code-scout-latest.json
        run: |
          set -euo pipefail
          node /tmp/flixo-repair-controller/scripts/ci/code-read-only-scout.mjs
          test -s "$FLIXO_SCOUT_REPORT"
          SCOUT_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.FLIXO_SCOUT_REPORT,'utf8'));process.stdout.write(x.scannedSha||'')")"
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "$SCOUT_SHA" = "$CURRENT_SHA"
          cp "$FLIXO_SCOUT_REPORT" /tmp/flixo-scout-report.json
          test -s /tmp/flixo-scout-report.json
          printf '%s\n' /tmp/flixo-scout-report.json > /tmp/flixo-scout-path

      - name: Self-test trusted repair controller before mutation
        env:
          FLIXO_TRUSTED_REPAIR_MEMORY: ''
          FLIXO_TRUSTED_MEMORY_SHA: ''
          FLIXO_SKIP_GIT_MEMORY_HISTORY: 'true'
        run: |
          set -euo pipefail
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-diagnosis.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-learning.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-architecture.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-reasoning.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-strategy.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-external-guard.mjs
          node /tmp/flixo-repair-controller/scripts/ci/test-auto-repair-final.mjs
          FLIXO_HISTORICAL_ROLLBACK_SELF_TEST=1 node /tmp/flixo-repair-controller/scripts/ci/auto-repair/historical-rollback.mjs

      - name: Consume Daily Visit execution prompt bundle
        if: inputs.prompt_source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-prompt-bundle
          gh run download "$FLIXO_PROMPT_SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "flixo-repair-execution-prompts-$FLIXO_PROMPT_SOURCE_RUN_ID" \
            --dir /tmp/flixo-prompt-bundle
          test -s /tmp/flixo-prompt-bundle/execution-prompts.json
          test -s /tmp/flixo-prompt-bundle/execution-prompts.md
          BUNDLE_SHA="$(jq -r '.executionSha' /tmp/flixo-prompt-bundle/execution-prompts.json)"
          EXPECTED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$BUNDLE_SHA" = "$EXPECTED_SHA" || {
            echo "FAIL CLOSED: prompt bundle SHA $BUNDLE_SHA does not match repair target $EXPECTED_SHA."
            exit 1
          }
          BUNDLE_FINGERPRINT="$(jq -r --arg run "$TARGET_RUN_ID" '.prompts[] | select((.runIds // []) | index($run)) | .fingerprint' /tmp/flixo-prompt-bundle/execution-prompts.json | head -n 1)"
          if [ -n "$FLIXO_FAILURE_FINGERPRINT" ] && [ -n "$BUNDLE_FINGERPRINT" ]; then
            test "$BUNDLE_FINGERPRINT" = "$FLIXO_FAILURE_FINGERPRINT" || {
              echo 'FAIL CLOSED: prompt bundle fingerprint does not match the watcher repair target.'
              exit 1
            }
          fi
          echo "FLIXO_EXECUTION_PROMPT_PATH=/tmp/flixo-prompt-bundle/execution-prompts.json" >> "$GITHUB_ENV"
          echo "PROMPT_BUNDLE_SOURCE_RUN=$FLIXO_PROMPT_SOURCE_RUN_ID"
      - name: Learn from historical GitHub Actions failures and repair history
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_TRUSTED_REPAIR_MEMORY: /tmp/flixo-trusted-memory.json
          FLIXO_INTRACTABLE_ERRORS: /tmp/flixo-intractable-errors.json
          FLIXO_HISTORICAL_LEARNING_OUTPUT: /tmp/flixo-historical-learning.json
        run: node /tmp/flixo-repair-controller/scripts/ci/learn-from-historical-actions.mjs

      - name: Run persistent repair-bot teaching sessions
        id: teaching_sessions
        env:
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_CURRENT_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
          FLIXO_TEACHING_SESSIONS_OUTPUT: /tmp/flixo-teaching-sessions.json
        run: |
          set -euo pipefail
          node scripts/ci/test-repair-teaching-sessions.mjs
          node scripts/ci/repair-teaching-sessions.mjs
          test -s /tmp/flixo-teaching-sessions.json
          jq -e '.exactShaRequired == true and (.sessions | length) == 10 and .closure.result == "OPEN_UNTIL_PROVEN"' /tmp/flixo-teaching-sessions.json >/dev/null
          echo "FLIXO_TEACHING_SESSIONS_PATH=/tmp/flixo-teaching-sessions.json" >> "$GITHUB_ENV"

      - name: Publish repair teaching packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-teaching-sessions-${{ github.run_id }}
          path: /tmp/flixo-teaching-sessions.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture failed CI logs before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1; then
            echo 'FAIL CLOSED: failed-run evidence could not be captured.'
            printf '%s\n' 'EVIDENCE_CAPTURE=FAILED' > /tmp/flixo-evidence-capture-failed
            exit 1
          fi
          test -s "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$TARGET_RUN_ID"
            gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,headSha,headBranch,conclusion
            grep -E -i 'error|failed|failure|timeout|cancelled|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(|DEEP_[A-Z_]+_MISSING|execution graph completeness' "$FLIXO_FAILURE_LOG" | tail -n "$FLIXO_DIAGNOSTIC_LINE_LIMIT" || true
          } > /tmp/flixo-repair-summary.txt
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=EVIDENCE_LOCKED --actor=AUTO_REPAIR_BOT --reason=FAILURE_EVIDENCE_CAPTURED

      - name: Open mandatory three-bot collaboration mission
        if: success()
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/flixo-failed-sha)"
          FP="$FLIXO_FAILURE_FINGERPRINT"
          TASK_ID="ACTION-RED:$TARGET_RUN_ID:$FP"
          node scripts/ci/action-three-bot-collaboration.mjs             --task="$TASK_ID"             --fingerprint="$FP"             --sha="$SHA"             --run-id="$TARGET_RUN_ID"             --log="$FLIXO_FAILURE_LOG"             --output=/tmp/action-three-bot-collaboration.json
          test -s /tmp/action-three-bot-collaboration.json
          jq -e --arg sha "$SHA" --arg fp "$FP" --arg run "$TARGET_RUN_ID" '
            .status == "ACTIVE" and
            .targetSha == $sha and
            .failureFingerprint == $fp and
            .failedRunId == $run and
            (.participants | length) == 3 and
            ([.participants[].id] | sort) == ["ACTION-HISTORIAN-3","ACTION-REPAIR","ACTION-REPAIR-2"] and
            .collaborationRules.sameTask == true and
            .collaborationRules.sameFingerprint == true and
            .collaborationRules.sameSha == true and
            .collaborationRules.evidenceExchangeBeforeMutation == true
          ' /tmp/action-three-bot-collaboration.json >/dev/null
          echo "FLIXO_THREE_BOT_COLLABORATION_PATH=/tmp/action-three-bot-collaboration.json" >> "$GITHUB_ENV"
          echo "ACTION_THREE_BOT_COLLABORATION=ACTIVE"

      - name: Prepare isolated runtime memory for ACTION-REPAIR
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/flixo-action-repair-bots
          mkdir -p /tmp/flixo-action-repair-bots

      - name: ACTION-INDEX record every RED and open Master learning request
        if: always()
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/flixo-failed-sha)"
          FP="$FLIXO_FAILURE_FINGERPRINT"
          test -n "$FP"
          if [ -s "$FLIXO_FAILURE_LOG" ]; then
            node scripts/ci/action-repair-five-workers.mjs --role=index --target-sha="$SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FP" --log="$FLIXO_FAILURE_LOG" --output=/tmp/flixo-historical-solution-index.json
          else
            printf '%s\n' '{"schemaVersion":1,"historicalMatchCount":0,"historicalMatches":[]}' > /tmp/flixo-historical-solution-index.json
          fi
          test -s /tmp/flixo-historical-solution-index.json
          echo 'FLIXO_HISTORICAL_SOLUTION_PATH=/tmp/flixo-historical-solution-index.json' >> "$GITHUB_ENV"
          echo "ACTION_INDEX_HISTORICAL_MATCHES=$(jq -r '.historicalMatchCount' /tmp/flixo-historical-solution-index.json)"
          NORMALIZED_FAILURE='FAILED_RUN_EVIDENCE_UNAVAILABLE'
          if [ -s "$FLIXO_FAILURE_LOG" ]; then NORMALIZED_FAILURE="$(tr '\n' ' ' < "$FLIXO_FAILURE_LOG" | sed 's/[[:space:]]\+/ /g' | cut -c1-16000)"; fi
          node scripts/ci/action-learning-master.mjs --op=open-red --target-sha="$SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FP" --workflow="Actions" --normalized-failure="$NORMALIZED_FAILURE"
          test -s /tmp/flixo-action-repair-bots/ACTION-INDEX.json

      - name: Materialize validated twin outputs from read-only job
        id: twin
        env:
          TWIN_A_B64: ${{ needs.adversarial_twin.outputs.twin_a }}
          TWIN_B_B64: ${{ needs.adversarial_twin.outputs.twin_b }}
          EXPECTED_TWIN_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
        run: |
          set -euo pipefail
          test -n "$TWIN_A_B64"
          test -n "$TWIN_B_B64"
          printf '%s' "$TWIN_A_B64" | base64 -d > /tmp/flixo-twin-a.json
          printf '%s' "$TWIN_B_B64" | base64 -d > /tmp/flixo-twin-b.json
          for TWIN in a b; do
            jq -e --arg sha "$EXPECTED_TWIN_SHA" '.targetSha == $sha and .mutationAuthority == false and .repositoryWrite == false and .actionsWrite == false' "/tmp/flixo-twin-$TWIN.json" >/dev/null
          done
          printf '%s\n' 'FLIXO_TWIN_A_PATH=/tmp/flixo-twin-a.json' >> "$GITHUB_ENV"
          printf '%s\n' 'FLIXO_TWIN_B_PATH=/tmp/flixo-twin-b.json' >> "$GITHUB_ENV"

      - name: ACTION-REPAIR comprehensive knowledge audit
        id: action_repair_knowledge_audit
        env:
          FLIXO_ACTION_INDEX_MEMORY_PATH: /tmp/flixo-action-repair-bots/ACTION-INDEX.json
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-knowledge-audit.mjs \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --output=/tmp/flixo-action-repair-knowledge-audit.json
          test -s /tmp/flixo-action-repair-knowledge-audit.json
          jq -e '.botId=="ACTION-REPAIR" and .targetSha==env.FLIXO_EXPECTED_TARGET_SHA and .hardConstraints.exactShaRequired==true and .selfSearch.enabled==true' /tmp/flixo-action-repair-knowledge-audit.json >/dev/null
          cp /tmp/flixo-action-repair-knowledge-audit.json /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          test -s /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          echo "FLIXO_ACTION_REPAIR_KNOWLEDGE_AUDIT=/tmp/flixo-action-repair-bots/ACTION-REPAIR.json" >> "$GITHUB_ENV"
          echo "FLIXO_ACTION_REPAIR_MEMORY=/tmp/flixo-action-repair-bots/ACTION-REPAIR.json" >> "$GITHUB_ENV"

      - name: ACTION-REPAIR self-search current Actions log and historical index
        id: action_repair_search
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
          FLIXO_ACTION_REPAIR_INDEX_PATH: docs/agents/historical-action-errors/index.json
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-five-workers.mjs \
            --role=repair-search \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --log="$FLIXO_FAILURE_LOG" \
            --output=/tmp/flixo-action-repair-search.json
          test -s /tmp/flixo-action-repair-search.json
          jq -e '.botId=="ACTION-REPAIR" and .indexOwner==true and .directActionSearch==true and .searchBeforeMutation==true and .targetSha==env.FLIXO_EXPECTED_TARGET_SHA' /tmp/flixo-action-repair-search.json >/dev/null
          echo "FLIXO_ACTION_REPAIR_SEARCH_PATH=/tmp/flixo-action-repair-search.json" >> "$GITHUB_ENV"

      - name: ACTION-WISE select best repair option from history and twin A/B
        id: cell_selector
        if: steps.twin.outcome == 'success'
        env:
          FLIXO_ACTION_MEMORY_DIR: /tmp/flixo-action-repair-bots
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-five-workers.mjs \
            --role=select \
            --target-sha="$(cat /tmp/flixo-failed-sha)" \
            --run-id="$TARGET_RUN_ID" \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --historical="${FLIXO_HISTORICAL_SOLUTION_PATH:-/tmp/flixo-historical-solution-index.json}" \
            --twin-a="${FLIXO_TWIN_A_PATH:-/tmp/flixo-twin-a.json}" \
            --twin-b="${FLIXO_TWIN_B_PATH:-/tmp/flixo-twin-b.json}" \
            --output=/tmp/flixo-selected-repair-option.json
          SELECTED="$(jq -r '.selection.selectedStrategy // empty' /tmp/flixo-selected-repair-option.json)"
          if [ -n "$SELECTED" ]; then
            printf '%s\n' "ACTION_WISE_SELECTED_STRATEGY=$SELECTED"
          else
            printf '%s\n' 'ACTION_WISE_SELECTED_STRATEGY=NONE'
          fi
          printf '%s\n' 'FLIXO_SELECTION_PATH=/tmp/flixo-selected-repair-option.json' >> "$GITHUB_ENV"
      - name: Run Phase 1 AI failure intelligence and exact-target preflight
        env:
          FLIXO_CURRENT_TARGET_SHA_FILE: /tmp/flixo-failed-sha
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --preflight

      - name: Run Phase 3 AI decision-intelligence preflight
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE3_PATH: /tmp/flixo-ai-phase3.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --preflight

      - name: Classify root cause with trusted controller
        env:
          FLIXO_SCOUT_REPORT: /tmp/flixo-scout-report.json
        run: node /tmp/flixo-repair-controller/scripts/ci/auto-repair-classifier.mjs

      - name: Record RCA state in the Repair Control Plane
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=RCA --actor=INVESTIGATOR --reason=TRUSTED_ROOT_CAUSE_CLASSIFIED

      - name: Bind Task Agent preparation to the active repair cycle on execution
        id: task_agent
        run: |
          set -euo pipefail
          SIGNATURE="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8')); process.stdout.write(x.signature||'unknown')")"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$(git branch --show-current)" = execution
          FLIXO_TASK_AGENT_OUTPUT_DIR=/tmp/flixo-task-agent node /tmp/flixo-repair-controller/scripts/ci/task-agent.mjs --all-ready --failure-run-id="$TARGET_RUN_ID" --failure-sha="$FAILED_SHA" --failure-fingerprint="$SIGNATURE" --failure-evidence=/tmp/flixo-repair-summary.txt --execution-prompt="${FLIXO_EXECUTION_PROMPT_PATH:-}"
          test -s /tmp/flixo-task-agent/latest.json

      - name: Bind selected Prompt ID to learning provenance
        if: steps.task_agent.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
           PROMPT_ID="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/flixo-task-agent/latest.json","utf8")); process.stdout.write(x.executionPrompt?.selectedPromptId || "")')"
           if [ -n "$PROMPT_ID" ]; then
             printf '%s\n' 'FLIXO_PROMPT_ID selected and retained only in the current repair packet.'
           else
             printf '%s\n' 'FLIXO_PROMPT_ID not available; learning remains unbound to a registry prompt.'
           fi


      - name: Restore durable no-repeat repair ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f "$FLIXO_REPAIR_ATTEMPT_LEDGER"
          mkdir -p "$(dirname "$FLIXO_REPAIR_ATTEMPT_LEDGER")"
          PREFIX="flixo-repair-attempt-ledger-$FLIXO_REPAIR_CHAIN_ID-"
          LATEST_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired == false) | [.id,.created_at,.name] | @tsv' | grep -F "$PREFIX" | sort -k2,2r | head -n 1 | cut -f1 || true)"
          if [ -n "$LATEST_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LATEST_ID/zip" > /tmp/flixo-attempt-ledger.zip
            unzip -p /tmp/flixo-attempt-ledger.zip repair-attempt-ledger.json > "$FLIXO_REPAIR_ATTEMPT_LEDGER"
          else
            node /tmp/flixo-repair-controller/scripts/ci/repair-attempt-ledger.mjs init
          fi
          test -s "$FLIXO_REPAIR_ATTEMPT_LEDGER"
          node --input-type=module -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync(process.env.FLIXO_REPAIR_ATTEMPT_LEDGER,'utf8'));if(l.chainId!==process.env.FLIXO_REPAIR_CHAIN_ID)throw new Error('REPAIR_ATTEMPT_LEDGER_CHAIN_MISMATCH');console.log(JSON.stringify({chainId:l.chainId,rejected:l.rejected?.length||0,attempts:l.attempts?.length||0}));"
      - name: Select repair strategy and continue strict RED repair
        id: strategy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node /tmp/flixo-repair-controller/scripts/ci/repair-strategy.mjs
          cat /tmp/flixo-repair-strategy.json
          # INTRACTABLE is a learning/escalation signal, never a permission to leave an
          # actionable RED untouched. repair-strategy rotates to the next evidence-backed
          # strategy on the next cycle.
          echo 'intractable=false' >> "$GITHUB_OUTPUT"
          if [ "$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(String(x.teachingEscalation))")" = "true" ]; then
            echo 'Teaching escalation recorded; continuing with the next repair strategy.'
          fi

      - name: Enforce divergent twin decision before mutation
        if: steps.strategy.outcome == 'success'
        run: |
          set -euo pipefail
          TWIN_PRESENT="$(jq -r '.twin.present // false' /tmp/flixo-repair-strategy.json)"
          TWIN_DIVERGENT="$(jq -r '.twin.divergent // false' /tmp/flixo-repair-strategy.json)"
          TWIN_DISPOSITION="$(jq -r '.twin.disposition // "NO_TWIN"' /tmp/flixo-repair-strategy.json)"
          SELECTED_STRATEGY="$(jq -r '.twin.selector.selectedStrategy // empty' /tmp/flixo-repair-strategy.json)"
          EXECUTOR_STRATEGY="$(jq -r '.twin.executorStrategy // empty' /tmp/flixo-repair-strategy.json)"
          if [ "$TWIN_DISPOSITION" = "SELECTED" ]; then
            test -n "$SELECTED_STRATEGY"
            test "$SELECTED_STRATEGY" = "$EXECUTOR_STRATEGY"
          elif [ "$TWIN_PRESENT" = true ] && [ "$TWIN_DIVERGENT" != true ] && [ "$TWIN_DISPOSITION" != "NO_SAFE_ALTERNATIVE_FOUND" && "$TWIN_DISPOSITION" != "BLOCK" ]; then
            echo 'FAIL CLOSED: twin review did not provide a distinct safe alternative and no selector decision was recorded.'
            exit 1
          fi
          echo "TWIN_DECISION_GATE=PASS disposition=$TWIN_DISPOSITION selected=$SELECTED_STRATEGY"

      - name: Record prepared repair plan state in the Repair Control Plane
        if: steps.strategy.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=REPAIR_PLANNED --actor=REPAIR_AGENT --reason=REPAIR_STRATEGY_SELECTED

      - name: Run Phase 1 AI self-test
        run: node --experimental-strip-types scripts/ci/test-ai-phase1.mjs

      - name: Run Phase 2 AI self-test
        run: node --experimental-strip-types scripts/ci/test-ai-phase2.mjs

      - name: Run Phase 3 AI self-test
        run: node --experimental-strip-types scripts/ci/test-ai-phase3.mjs

      - name: Install target dependencies
        id: install_target
        if: steps.strategy.outputs.intractable != 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Mark mutation boundary in the Repair Control Plane
        if: steps.strategy.outputs.intractable != 'true' && steps.install_target.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=MUTATING --actor=REPAIR_AGENT --reason=BOUNDED_SOURCE_MUTATION

      - name: ACTION-REPAIR-2 audit, non-green learning and dual-control proposal
        id: action_repair_assistant
        if: steps.strategy.outcome == 'success'
        env:
          FLIXO_ACTION_REPAIR_ASSISTANT_MEMORY: diagnostics/auto-repair/action-repair-bots/ACTION-REPAIR-2.json
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-dual-control.mjs audit --agent=ACTION-REPAIR-2 --partner=ACTION-REPAIR --target-sha="$FLIXO_EXPECTED_TARGET_SHA" --fingerprint="$FLIXO_FAILURE_FINGERPRINT" --run-id="$TARGET_RUN_ID" --memory="$FLIXO_ACTION_REPAIR_ASSISTANT_MEMORY" --strategy=/tmp/flixo-repair-strategy.json --evidence=/tmp/flixo-root-cause.json --proposal=/tmp/action-repair-2-proposal.json
          test -s /tmp/action-repair-2-proposal.json

      - name: ACTION-REPAIR-1 approval for ACTION-REPAIR-2
        id: action_repair_primary_approval
        if: steps.action_repair_assistant.outcome == 'success'
        env:
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
        run: |
          set -euo pipefail
          node scripts/ci/action-repair-dual-control.mjs approve --agent=ACTION-REPAIR --assistant=ACTION-REPAIR-2 --target-sha="$FLIXO_EXPECTED_TARGET_SHA" --fingerprint="$FLIXO_FAILURE_FINGERPRINT" --proposal=/tmp/action-repair-2-proposal.json --approval=/tmp/action-repair-2-approval.json
          node scripts/ci/action-repair-dual-control.mjs heartbeat --primary=ACTION-REPAIR --assistant=ACTION-REPAIR-2 --target-sha="$FLIXO_EXPECTED_TARGET_SHA" --state=READY_FOR_MUTATION --out=/tmp/action-repair-pair-heartbeat.json
          node scripts/ci/action-repair-dual-control.mjs assert --approval=/tmp/action-repair-2-approval.json --heartbeat=/tmp/action-repair-pair-heartbeat.json --approver=ACTION-REPAIR --assistant=ACTION-REPAIR-2 --target-sha="$FLIXO_EXPECTED_TARGET_SHA"

      - name: Resolve active Actions repair owner from durable lease state
        id: action_turn
        if: steps.strategy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_FAILURE_FINGERPRINT: ${{ env.FLIXO_FAILURE_FINGERPRINT }}
          FLIXO_REPAIR_ATTEMPT: ${{ env.FLIXO_REPAIR_LEASE_ATTEMPT }}
        run: |
          set -euo pipefail
          FAILED_SHA="$FLIXO_EXPECTED_TARGET_SHA"
          node /tmp/flixo-repair-controller/scripts/ci/repair-lease.mjs brother-state             --fingerprint="$FLIXO_FAILURE_FINGERPRINT"             --failedSha="$FAILED_SHA"             --targetRunId="$TARGET_RUN_ID"             --branch="execution" > /tmp/action-repair-brother-state.json
          ACTIVE_BROTHER="$(jq -r '.activeBrother' /tmp/action-repair-brother-state.json)"
          case "$ACTIVE_BROTHER" in
            A)
              printf '%s\n' 'FLIXO_ACTIVE_ACTION_BOT=ACTION-REPAIR' >> "$GITHUB_ENV"
              printf '%s\n' 'FLIXO_REPAIR_ACTOR=actionRepairBot' >> "$GITHUB_ENV"
              ;;
            B)
              printf '%s\n' 'FLIXO_ACTIVE_ACTION_BOT=ACTION-REPAIR-2' >> "$GITHUB_ENV"
              printf '%s\n' 'FLIXO_REPAIR_ACTOR=assistantRepairAgent' >> "$GITHUB_ENV"
              ;;
            *)
              echo 'FAIL CLOSED: unknown durable Actions repair owner.'
              exit 1
              ;;
          esac

      - name: FLIXO Auto Repair Bot — sole mutation authority for the active RED target
        id: execute_repair
        if: steps.strategy.outcome == 'success' && steps.install_target.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          FLIXO_SCOUT_REPORT: /tmp/flixo-scout-report.json
          FLIXO_REPAIR_ACTOR: ${{ env.FLIXO_REPAIR_ACTOR }}
          FLIXO_ASSISTANT_APPROVAL_PATH: /tmp/action-repair-2-approval.json
          FLIXO_ACTION_REPAIR_BOT_ID: ACTION-REPAIR
          FLIXO_ACTION_KNOWLEDGE_BOT_ID: ACTION-WISE
          FLIXO_ACTION_REPAIR_MEMORY: /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
        run: |
          set -euo pipefail
          export FLIXO_REPAIR_STRATEGY_ID="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId||'')")"
          export FLIXO_REPAIR_STRATEGY="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId+'::'+x.strategy)")"
          node /tmp/flixo-repair-controller/scripts/ci/auto-repair-engine.mjs
      - name: Build Phase 1 AI impact and CI orchestration plan
        id: ai_phase1
        if: always() && steps.strategy.outcome == 'success'
        env:
          FLIXO_CURRENT_TARGET_SHA_FILE: /tmp/flixo-failed-sha
          FLIXO_EXPECTED_TARGET_SHA: ${{ env.FLIXO_EXPECTED_TARGET_SHA }}
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --postflight

      - name: Run Phase 2 AI strategy, set-cover and security guard from Phase 1 canonical context
        id: ai_phase2
        if: always() && steps.ai_phase1.outcome == 'success'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_REPAIR_STRATEGY_PATH: /tmp/flixo-repair-strategy.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase2.mjs --guard

      - name: Run Phase 3 AI decision-intelligence postflight
        id: ai_phase3
        if: always() && steps.ai_phase2.outcome == 'success'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_AI_PHASE3_PATH: /tmp/flixo-ai-phase3.json
          FLIXO_REPAIR_STRATEGY_PATH: /tmp/flixo-repair-strategy.json
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --postflight

      - name: Validate repair diff boundary before publication
        id: boundary
        if: always()
        run: node scripts/ci/validate-auto-repair-boundary.mjs --diff-only

      - name: Verify Repair Agent repair before publication
        id: verify
        if: always() && steps.boundary.outcome == 'success'
        run: |
          set -euo pipefail
          if [ "${{ steps.strategy.outputs.intractable }}" = "true" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Case is INTRACTABLE; fail-closed escalation is required.'
            exit 0
          fi
          test -f /tmp/flixo-repair-evidence.json || { echo 'verified=false' >> "$GITHUB_OUTPUT"; exit 0; }
          test -s /tmp/flixo-ai-phase1.json
          test -s /tmp/flixo-ai-phase3.json
          node --experimental-strip-types scripts/ci/auto-repair/ai-phase1.mjs --assert-post
          node --experimental-strip-types scripts/ci/auto-repair/ai-phase3.mjs --assert-post
          OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          echo "REPAIR_OUTCOME=$OUTCOME"
          if [ "$OUTCOME" != "verified-repair" ] && [ "$OUTCOME" != "verified-historical-revert" ]; then echo 'verified=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --quiet && { echo 'verified=false' >> "$GITHUB_OUTPUT"; echo 'Verified repair produced no source diff; refusing publication.'; exit 1; }
          node /tmp/flixo-repair-controller/scripts/ci/ensure-agent-locales.mjs
          node /tmp/flixo-repair-controller/node_modules/typescript/bin/tsc --noEmit
          node /tmp/flixo-repair-controller/scripts/test.mjs --mode=diagnose --gate=static
          node /tmp/flixo-repair-controller/scripts/test.mjs --mode=diagnose --gate=build
          git diff --check
          test "$(git branch --show-current)" = execution
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Handoff active Actions repair owner after failed repair
        if: always() && steps.strategy.outcome == 'success' && steps.verify.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          case "$ENGINE_OUTCOME" in
            blocked-external|verified-repair|verified-historical-revert)
              echo "ACTION_OWNER_HANDOFF=NOT_REQUIRED outcome=$ENGINE_OUTCOME"
              exit 0
              ;;
          esac
          BROTHER_ID="${FLIXO_ACTIVE_ACTION_BROTHER:-A}"
          node /tmp/flixo-repair-controller/scripts/ci/repair-lease.mjs brother-surrender             --fingerprint="$FLIXO_FAILURE_FINGERPRINT"             --failedSha="$FLIXO_EXPECTED_TARGET_SHA"             --targetRunId="$TARGET_RUN_ID"             --branch="execution"             --attempt="${FLIXO_REPAIR_LEASE_ATTEMPT:-1}"             --brotherId="$BROTHER_ID"             --reason="FAILED_REPAIR_OR_UNREPAIRED"             --exitSha="$FLIXO_EXPECTED_TARGET_SHA"
          echo "ACTION_OWNER_HANDOFF=PASS from=$BROTHER_ID"
      
      - name: Record local verification state in the Repair Control Plane
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=LOCAL_VERIFICATION --actor=VERIFIER --reason=FULL_VERIFICATION_PASSED

      - name: Record durable no-repeat outcome for the active repair chain
        if: always()
        env:
          FLIXO_LEDGER_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          FLIXO_REPAIR_EVIDENCE_PATH: /tmp/flixo-repair-evidence.json
        run: |
          set -euo pipefail
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' engine-error)"
          VERIFIED_OUTCOME="$FLIXO_LEDGER_OUTCOME"
          if [ "$ENGINE_OUTCOME" = "verified-repair" ] && [ "$VERIFIED_OUTCOME" = "success" ]; then
            echo 'NO_REPEAT_LEDGER=GREEN_NO_REJECTION'
          elif [ "$ENGINE_OUTCOME" = "proposal-only" ] || [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            echo "NO_REPEAT_LEDGER=NO_SOURCE_REPAIR outcome=$ENGINE_OUTCOME"
          else
            node /tmp/flixo-repair-controller/scripts/ci/repair-attempt-ledger.mjs record
          fi
      - name: Record learning outcome for every diagnosed failure
        if: always()
        env:
          FLIXO_REPAIR_MEMORY: /tmp/flixo-repair-memory.json
          FLIXO_DERIVED_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
          FLIXO_INTRACTABLE_ERRORS: /tmp/flixo-intractable-errors.json
          VERIFY_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          FLIXO_FAILED_SHA: ''
          FLIXO_RUN_ID: ${{ env.TARGET_RUN_ID }}
          FLIXO_TRUSTED_MEMORY_SHA: ${{ env.FLIXO_TRUSTED_MEMORY_SHA || '' }}
          FLIXO_TARGET_SHA: ''
          FLIXO_REVERTED_COMMIT: ''
        run: |
          set -euo pipefail
          if [ -f /tmp/flixo-failed-sha ]; then FLIXO_FAILED_SHA="$(cat /tmp/flixo-failed-sha)"; fi
          test -f /tmp/flixo-root-cause.json || printf '%s\n' '{"rootCause":"unknown"}' > /tmp/flixo-root-cause.json
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          if [ -f /tmp/flixo-repair-evidence.json ]; then
            RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||x.historicalRollback?.rule||'')")
            ENGINE_OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
            TARGET_SHA=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.targetSha||'')")
            REVERTED_COMMIT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.historicalRollback?.revertedSha||'')")
          else
            RULE=''
            ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
            TARGET_SHA=''
            REVERTED_COMMIT=''
          fi
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ]; then
            LEARNING_OUTCOME='reverted-repair'
          elif [ "$VERIFY_OUTCOME" = "success" ] && [ "$ENGINE_OUTCOME" = "verified-repair" ]; then
            LEARNING_OUTCOME='success'
          elif [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            LEARNING_OUTCOME='blocked-external'
          elif [ "$ENGINE_OUTCOME" = "proposal-only" ]; then
            LEARNING_OUTCOME='proposed'
          else
            LEARNING_OUTCOME='unrepaired'
          fi
          if [ ! -s /tmp/flixo-repair-strategy.json ]; then
            printf '%s\n' 'engine-error' > /tmp/flixo-engine-outcome
            printf '%s\n' 'unrepaired' > /tmp/flixo-learning-outcome
            echo 'FAIL CLOSED: repair strategy evidence is missing; no handoff or learning promotion is permitted.'
            exit 1
          fi
          STRATEGY_ID="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId||'')")"
          FLIXO_REPAIR_STRATEGY_ID="$STRATEGY_ID" FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" FLIXO_LEARNING_OUTCOME="$LEARNING_OUTCOME" FLIXO_VERIFICATION="$ENGINE_OUTCOME" FLIXO_TARGET_SHA="$TARGET_SHA" FLIXO_REVERTED_COMMIT="$REVERTED_COMMIT" FLIXO_RUN_ID="$TARGET_RUN_ID" FLIXO_FAILED_SHA="$FLIXO_EXPECTED_TARGET_SHA" FLIXO_TASK_ID="ACTION-REPAIR:$TARGET_RUN_ID" FLIXO_TRUSTED_MEMORY_SHA="${FLIXO_TRUSTED_MEMORY_SHA:-}" node scripts/ci/auto-repair-learning.mjs
          printf '%s\n' "$ENGINE_OUTCOME" > /tmp/flixo-engine-outcome
          printf '%s\n' "$LEARNING_OUTCOME" > /tmp/flixo-learning-outcome

      - name: Publish ACTION-INDEX learning evidence for every repair task
        if: always() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-action-index-learning-${{ github.run_id }}
          path: |
            diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
            /tmp/flixo-historical-solution-index.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Promote verified repair learning state
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-repair-memory.json
          cp /tmp/flixo-repair-memory.json diagnostics/auto-repair/memory.json
          if [ -s /tmp/flixo-intractable-errors.json ]; then
            cp /tmp/flixo-intractable-errors.json diagnostics/auto-repair/intractable-errors.json
          fi
      - name: Keep non-green learning state ephemeral
        if: always() && steps.verify.outputs.verified != 'true' && steps.strategy.outputs.intractable != 'true'
        run: |
          set -euo pipefail
          test -s /tmp/flixo-repair-memory.json
          if [ -s /tmp/flixo-intractable-errors.json ]; then
            cp /tmp/flixo-intractable-errors.json /tmp/flixo-intractable-errors-non-green.json
          fi
          echo 'NON_GREEN_LEARNING_PERSISTENCE=ARTIFACT_ONLY'
          echo 'NON_GREEN_REPAIR_MAY_NOT_ADVANCE_EXECUTION_SHA'

      - name: Enforce central Repair Protocol commit boundary
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          node /tmp/flixo-repair-controller/scripts/ci/repair-protocol.mjs commit-gate --evidence=/tmp/flixo-repair-evidence.json

      - name: Commit and push verified repair on the single working branch
        if: steps.verify.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          git add -A
          git add -f diagnostics/auto-repair/memory.json
          if [ -f diagnostics/auto-repair/intractable-errors.json ]; then git add -f diagnostics/auto-repair/intractable-errors.json; fi
          git diff --cached --quiet && { echo 'No applicable repair diff; refusing empty repair.'; exit 1; }
          ENGINE_OUTCOME="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")"
          FINGERPRINT="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.fingerprint||'unknown')")"
          RULE="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||x.historicalRollback?.rule||'unknown')")"
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin execution
          REMOTE_EXECUTION_SHA="$(git rev-parse origin/execution)"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          test "$BASE_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: local repair base $BASE_SHA is not the failed target SHA $FAILED_SHA."
            exit 1
          }
          test "$REMOTE_EXECUTION_SHA" = "$FAILED_SHA" || {
            echo "FAIL CLOSED: execution advanced during repair; refusing stale publication."
            exit 1
          }
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ]; then
            REVERTED_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.historicalRollback?.revertedSha||'')")"
            test "$REVERTED_SHA" != ""
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "revert(auto-repair): historical rollback for run ${TARGET_RUN_ID}" -m "FLIXO-REPAIR-ROLLBACK-v1\nkind=historical-revert\nFLIXO-BOT-ID=ACTION-REPAIR\nFLIXO-BOT-ROLE=ACTION_REPAIR_EXECUTOR\nFLIXO-BOT-TASK=ACTION-REPAIR:${TARGET_RUN_ID}\nFLIXO-BOT-FINGERPRINT=$FINGERPRINT\nrevertedSha=$REVERTED_SHA\nrule=$RULE"
          else
            FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(auto-repair): verified repair for run ${TARGET_RUN_ID}" -m "FLIXO-REPAIR-MARKER-v1\nkind=verified-source-repair\nFLIXO-BOT-ID=ACTION-REPAIR\nFLIXO-BOT-ROLE=ACTION_REPAIR_EXECUTOR\nFLIXO-BOT-TASK=ACTION-REPAIR:${TARGET_RUN_ID}\nFLIXO-BOT-FINGERPRINT=$FINGERPRINT\nrule=$RULE\nfailedSha=$FAILED_SHA\nbaseSha=$BASE_SHA"
          fi
          PUSHED=false
          git fetch --no-tags origin execution
          REMOTE_EXECUTION_SHA="$(git rev-parse origin/execution)"
          LOCAL_REPAIR_PARENT="$(git rev-parse HEAD^)"
          if [ "$REMOTE_EXECUTION_SHA" != "$LOCAL_REPAIR_PARENT" ]; then
            echo "FAIL CLOSED: execution advanced after the verified repair was created; refusing stale publication."
            exit 1
          fi
          if git push origin execution; then
            PUSHED=true
          fi
          test "$PUSHED" = true
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head execution --title "fix(auto-repair): canonical execution repair" --body "Canonical two-branch repair path.\n\nAll repairs are applied only on execution and promoted only after exact-SHA Canonical CI GREEN.")"
          fi
          echo "Canonical execution -> main PR: $PR_URL"

      - name: ACTION-INDEX close Master learning request and create second execution commit
        if: steps.verify.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          git fetch --no-tags origin execution
          FIRST_REPAIR_SHA="$(git rev-parse HEAD)"
          REMOTE_EXECUTION_SHA="$(git rev-parse origin/execution)"
          test "$FIRST_REPAIR_SHA" = "$REMOTE_EXECUTION_SHA"
          test "$(git rev-list --count "$FAILED_SHA"..HEAD)" -eq 1
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome)"
          test "$ENGINE_OUTCOME" = "verified-repair" || test "$ENGINE_OUTCOME" = "verified-historical-revert"
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8')); const out={strategyId:x.selected||x.historicalRollback?.rule||null,rule:x.selected||x.historicalRollback?.rule||null,rootCause:x.rootCause||null,changedPaths:x.changedPaths||[],targetSha:x.targetSha||process.env.FAILED_SHA||null,outcome:x.outcome||process.env.ENGINE_OUTCOME,verification:'verified-repair'}; fs.writeFileSync('/tmp/flixo-master-solution.json',JSON.stringify(out,null,2)+'\\n')"
          node scripts/ci/action-learning-master.mjs --op=close-green --target-sha="$FAILED_SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FLIXO_FAILURE_FINGERPRINT" --solution-file=/tmp/flixo-master-solution.json --verification=verified-repair --evidence-ref=/tmp/flixo-repair-evidence.json
          test -s /tmp/flixo-action-repair-bots/ACTION-INDEX.json
          test -s /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          node scripts/ci/action-repair-knowledge-audit.mjs --target-sha="$FIRST_REPAIR_SHA" --run-id="$TARGET_RUN_ID" --fingerprint="$FLIXO_FAILURE_FINGERPRINT" --output=/tmp/flixo-action-repair-post-green.json
          test -s /tmp/flixo-action-repair-post-green.json
          cp /tmp/flixo-action-repair-post-green.json /tmp/flixo-action-repair-bots/ACTION-REPAIR.json
          mkdir -p diagnostics/auto-repair/action-repair-bots
          cp /tmp/flixo-action-repair-bots/ACTION-INDEX.json diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json
          cp /tmp/flixo-action-repair-bots/ACTION-REPAIR.json diagnostics/auto-repair/action-repair-bots/ACTION-REPAIR.json
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json diagnostics/auto-repair/action-repair-bots/ACTION-REPAIR.json "
          git add diagnostics/auto-repair/action-repair-bots/ACTION-INDEX.json diagnostics/auto-repair/action-repair-bots/ACTION-REPAIR.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(memory): record verified Actions solution for run $TARGET_RUN_ID"
          SECOND_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --count "$FAILED_SHA"..$SECOND_SHA)" -eq 2
          test "$(git rev-parse "$SECOND_SHA^")" = "$FIRST_REPAIR_SHA"
          git fetch --no-tags origin execution
          test "$(git rev-parse origin/execution)" = "$FIRST_REPAIR_SHA"
          git push origin execution
          test "$(git rev-parse origin/execution)" = "$SECOND_SHA"
          echo "ACTION_REPAIR_TWO_COMMITS=PASS"
          echo "ACTION_REPAIR_COMMIT_1=$FIRST_REPAIR_SHA"
          echo "ACTION_REPAIR_COMMIT_2=$SECOND_SHA"
      - name: Record publication state in the Repair Control Plane
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=PUBLISHED_TO_EXECUTION --actor=AUTO_REPAIR_BOT --reason=VERIFIED_EXECUTION_SHA_PUSHED
          node scripts/ci/repair-control-plane.mjs advance --file=/tmp/flixo-repair-control-plane.json --to=CANONICAL_CI --actor=AUTO_REPAIR_BOT --reason=AWAITING_CANONICAL_CI

      - name: Enforce central Repair Protocol post-commit boundary
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          node /tmp/flixo-repair-controller/scripts/ci/repair-protocol.mjs post-commit --evidence=/tmp/flixo-repair-evidence.json

      - name: Prepare exact post-commit repair handoff
        if: steps.verify.outputs.verified == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = execution
          git fetch --no-tags origin execution
          EXECUTION_SHA="$(git rev-parse HEAD)"
          REMOTE_EXECUTION_SHA="$(git rev-parse origin/execution)"
          test "$EXECUTION_SHA" = "$REMOTE_EXECUTION_SHA"
          PARENT_SHA="$(git rev-parse "$EXECUTION_SHA^")"
          test -f /tmp/flixo-repair-evidence.json
          SOURCE_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.targetSha||'')")"
          test "$SOURCE_SHA" = "$PARENT_SHA"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome)"
          case "$ENGINE_OUTCOME" in
            verified-repair|verified-historical-revert) ;;
            *) echo "FAIL CLOSED: invalid post-commit handoff outcome=$ENGINE_OUTCOME"; exit 1 ;;
          esac
          git diff --binary "$PARENT_SHA" "$EXECUTION_SHA" > /tmp/flixo-prepared-repair.patch
          test -s /tmp/flixo-prepared-repair.patch
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const evidence = JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));
          const executionSha = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const parentSha = execFileSync('git',['rev-parse',`${executionSha}^`],{encoding:'utf8'}).trim();
          const changedPaths = execFileSync('git',['diff','--name-only',parentSha,executionSha],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const patch = fs.readFileSync('/tmp/flixo-prepared-repair.patch');
          const mode = fs.readFileSync('/tmp/flixo-engine-outcome','utf8').trim();
          const handoff = {
            schemaVersion: 4,
            protocol: 'AGENT-REPAIR-HANDOFF-GATE-v4',
            mode: mode === 'verified-historical-revert' ? 'VERIFIED_HISTORICAL_REVERT' : 'VERIFIED_REPAIR',
            applyBy: 'AUTO_REPAIR_BOT',
            requiresCanonicalCI: true,
            repository: process.env.GITHUB_REPOSITORY,
            headBranch: 'execution',
            baseBranch: 'main',
            repairRunId: process.env.GITHUB_RUN_ID,
            targetFailureRunId: process.env.TARGET_RUN_ID,
            chainId: process.env.FLIXO_REPAIR_CHAIN_ID,
            failedSha: fs.readFileSync('/tmp/flixo-failed-sha','utf8').trim(),
            sourceSha: evidence.targetSha,
            controllerSha: process.env.FLIXO_TRUSTED_MEMORY_SHA || null,
            executionSha,
            parentSha,
            fingerprint: evidence.fingerprint,
            selectedRule: evidence.selected || evidence.historicalRollback?.rule || null,
            changedPaths,
            patchSha256: crypto.createHash('sha256').update(patch).digest('hex'),
            evidenceFile: 'flixo-repair-evidence.json',
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/flixo-prepared-repair-handoff.json', JSON.stringify(handoff,null,2)+'\n');
          NODE
          test -s /tmp/flixo-prepared-repair-handoff.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/flixo-prepared-repair-handoff.json','utf8'));for(const k of ['repairRunId','targetFailureRunId','chainId','failedSha','sourceSha','controllerSha','executionSha','parentSha','fingerprint','selectedRule','patchSha256']) if(h[k]===undefined||h[k]===null||h[k]==='') throw new Error('missing handoff field '+k);"
          test "${GITHUB_RUN_ID}" = "$(node -e "const h=require('/tmp/flixo-prepared-repair-handoff.json');process.stdout.write(h.repairRunId)")"
          test "$TARGET_RUN_ID" = "$(node -e "const h=require('/tmp/flixo-prepared-repair-handoff.json');process.stdout.write(h.targetFailureRunId)")"
      - name: Validate Phase 2 release integrity handoff
        if: steps.verify.outputs.verified == 'true'
        env:
          FLIXO_AI_PHASE1_PATH: /tmp/flixo-ai-phase1.json
          FLIXO_AI_PHASE2_PATH: /tmp/flixo-ai-phase2.json
          FLIXO_REPAIR_EVIDENCE_PATH: /tmp/flixo-repair-evidence.json
        run: node --experimental-strip-types scripts/ci/auto-repair/ai-phase2.mjs --release-handoff

      - name: Record durable repair lease outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ ! -s /tmp/flixo-lease-verification.json ]; then
            echo 'LEASE_OUTCOME_ATTESTATION=SKIPPED_NO_VERIFIED_LEASE'
            exit 0
          fi

          FAILED_SHA="$(cat /tmp/flixo-failed-sha 2>/dev/null || printf '%s' '')"
          EXIT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha' 2>/dev/null || printf '%s' "$FAILED_SHA")"
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          VERIFICATION="engine-error"
          OUTCOME="FAILED_REPAIR"
          if [ "$ENGINE_OUTCOME" = "verified-historical-revert" ]; then
            OUTCOME="VERIFIED_HISTORICAL_REVERT"
            VERIFICATION="verified-historical-revert"
          elif [ "$ENGINE_OUTCOME" = "verified-repair" ] && [ "${{ steps.verify.outputs.verified }}" = "true" ]; then
            OUTCOME="VERIFIED_REPAIR"
            VERIFICATION="verified-repair"
          elif [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            OUTCOME="BLOCKED_EXTERNAL"
            VERIFICATION="blocked-external"
          elif [ ! -s /tmp/flixo-root-cause.json ]; then
            OUTCOME="BLOCKED_RCA"
            VERIFICATION="root-cause-unavailable"
          else
            VERIFICATION="$ENGINE_OUTCOME"
          fi
          VERIFICATION_PROGRESS=false
          if [ "$OUTCOME" = "VERIFIED_REPAIR" ] || [ "$OUTCOME" = "VERIFIED_HISTORICAL_REVERT" ] || [ "$EXIT_SHA" != "$FAILED_SHA" ]; then
            VERIFICATION_PROGRESS=true
          fi
          STRATEGY_ID="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-strategy.json','utf8'));process.stdout.write(x.strategyId||'unknown')}catch{process.stdout.write('unavailable')}" 2>/dev/null || printf '%s' 'unavailable')"

          node scripts/ci/repair-lease.mjs outcome \
            --fingerprint="$FLIXO_FAILURE_FINGERPRINT" \
            --failedSha="$FAILED_SHA" \
            --targetRunId="$TARGET_RUN_ID" \
            --branch="execution" \
            --attempt="$FLIXO_REPAIR_LEASE_ATTEMPT" \
            --leaseOwner="AUTO_REPAIR_BOT" \
            --repairRunId="$GITHUB_RUN_ID" \
            --strategy="$STRATEGY_ID" \
            --outcome="$OUTCOME" \
            --exitSha="$EXIT_SHA" \
            --verification="$VERIFICATION" \
            --verificationProgress="$VERIFICATION_PROGRESS" \
            >/tmp/flixo-repair-lease-outcome.json
          cat /tmp/flixo-repair-lease-outcome.json
          echo "LEASE_OUTCOME=$OUTCOME"
          echo "LEASE_EXIT_SHA=$EXIT_SHA"
          echo "LEASE_VERIFICATION_PROGRESS=$VERIFICATION_PROGRESS"

      - name: Publish Repair Control Plane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-control-plane-${{ github.run_id }}
          path: |
            /tmp/flixo-repair-control-plane.json
            /tmp/flixo-lease-verification.json
            /tmp/flixo-repair-lease-outcome.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish durable no-repeat repair ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-repair-attempt-ledger-${{ env.FLIXO_REPAIR_CHAIN_ID }}-${{ github.run_id }}
          path: /tmp/flixo-repair-attempt-ledger.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-auto-repair-${{ env.TARGET_RUN_ID }}-${{ github.run_id }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-scout-report.json
            /tmp/flixo-scout-path
            /tmp/flixo-root-cause.json
            /tmp/flixo-engine-outcome
            /tmp/flixo-learning-outcome
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-ai-phase1.json
            /tmp/flixo-ai-phase2.json
            /tmp/flixo-ai-phase3.json
            /tmp/flixo-repair-strategy.json
            /tmp/flixo-intractable-state
            /tmp/flixo-task-agent/*.json
            /tmp/flixo-repair-memory.json
            /tmp/flixo-historical-learning.json
            /tmp/flixo-intractable-errors.json
            diagnostics/auto-repair/memory.json
            diagnostics/auto-repair/intractable-errors.json
          if-no-files-found: warn
          retention-days: 30

      - name: Block source-free learning publication on non-green cycle
        if: always() && steps.verify.outputs.verified != 'true'
        run: |
          set -euo pipefail
          echo 'NON_GREEN_LEARNING_PUBLISH=DISABLED'
          echo 'Learning remains workflow-local/artifact-only until a verified source repair exists.'
      - name: Keep the same repair cycle open when verification is not green
        if: always() && steps.verify.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' engine-error)"
          if [ "$ENGINE_OUTCOME" = "blocked-external" ]; then
            echo 'External tooling failure is BLOCKED_EXTERNAL; source mutation remains prohibited, but the repair cycle stays open.'
            REPROBE_DECISION="$(node scripts/ci/auto-repair-supervisor.mjs --check-reprobe | tail -n 1)"
            if [ "$REPROBE_DECISION" = "true" ]; then
              echo 'External provider signature changed; permitting another diagnostic cycle.'
            else
              echo 'External provider signature unchanged; keeping the cycle open and scheduling a controlled re-probe.'
            fi
          fi
          if [ "$ENGINE_OUTCOME" = "engine-error" ]; then
            echo 'Repair engine error; preserving RED and reopening the repair cycle for another diagnostic/strategy attempt.'
          fi

          FAILED_BRANCH="$(cat /tmp/flixo-failed-branch 2>/dev/null || printf '%s' main)"
          if [ "$FAILED_BRANCH" = "execution" ]; then
            CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            CURRENT_FAILURE_ID="$(
              gh run list --repo "$GITHUB_REPOSITORY" --branch execution --limit 50                 --json databaseId,name,headSha,conclusion,createdAt                 --jq 'map(select((.name == "FLIXO Test System" or .name == "FLIXO WP0 Trust Baseline" or .name == "FLIXO Continuous Delivery") and .headSha == "'$CURRENT_EXECUTION_SHA'" and (.conclusion == "failure" or .conclusion == "timed_out"))) | sort_by(.createdAt) | last.databaseId // empty'
            )"
            if [ -z "$CURRENT_FAILURE_ID" ]; then
              echo "No current canonical failure remains on execution $CURRENT_EXECUTION_SHA; no RED is currently open."
              exit 0
            fi
            echo "Repair remains open on execution failure run $CURRENT_FAILURE_ID."
            echo "Execution repair remains open on execution failure run $CURRENT_FAILURE_ID."
            echo 'DISPATCH_AUTHORITY=DAILY_FLIXO_GREEN_GATE'
            echo "RED_REMAINS_OPEN=$CURRENT_FAILURE_ID"
            echo 'The Daily·FLIXO Green Gate is the sole dispatcher. The executor never dispatches itself; unresolved RED remains fail-closed.'
            exit 1
          fi

          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          CURRENT_FAILURE_ID="$(
            gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 50               --json databaseId,name,headSha,conclusion,createdAt               --jq 'map(select((.name == "FLIXO Test System" or .name == "FLIXO WP0 Trust Baseline" or .name == "FLIXO Continuous Delivery") and .headSha == "'$CURRENT_MAIN_SHA'" and (.conclusion == "failure" or .conclusion == "timed_out"))) | sort_by(.createdAt) | last.databaseId // empty'
          )"
          if [ -z "$CURRENT_FAILURE_ID" ]; then
            echo "No current canonical failure remains on main $CURRENT_MAIN_SHA; no RED is currently open."
            exit 0
          fi
          echo "Repair remains open on current canonical failure run $CURRENT_FAILURE_ID."
          echo 'DISPATCH_AUTHORITY=DAILY_FLIXO_GREEN_GATE'
            echo "RED_REMAINS_OPEN=$CURRENT_FAILURE_ID"
            echo 'The Daily·FLIXO Green Gate is the sole dispatcher. The executor never dispatches itself; unresolved RED remains fail-closed.'
          exit 1