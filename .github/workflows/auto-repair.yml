name: FLIXO Auto Repair Bot

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Failed workflow run ID to diagnose and repair'
        required: true
        type: string
  workflow_run:
    workflows: ["FLIXO Test System", "FLIXO WP0 Trust Baseline", "FLIXO Continuous Delivery", "FLIXO Agent Repair Handoff Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read

# Single authoritative repair lane for canonical main-branch Actions.
# The bot diagnoses every failure, prepares a bounded repair, verifies it,
# learns from the result, and emits an explicit handoff when it cannot safely repair.
# It never publishes source changes.
concurrency:
  group: flixo-auto-repair-main
  cancel-in-progress: false

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
  FLIXO_REPAIR_LANE: single
  TARGET_RUN_ID: ${{ inputs.target_run_id || github.event.workflow_run.id }}

jobs:
  repair:
    name: Single-lane diagnose, prepare, verify and learn
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted repair engine from current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,headSha,headBranch,name
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx 'failure'
          printf '%s\n' "$TARGET_RUN_ID" > /tmp/flixo-target-run-id

      - name: Materialize failed SHA as isolated repair target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED_SHA="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          git fetch --no-tags origin "$FAILED_SHA"
          git worktree add --detach /tmp/flixo-repair-target "$FAILED_SHA"
          printf '%s\n' "$FAILED_SHA" > /tmp/flixo-failed-sha

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Capture failed CI logs before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1 || true
          test -s "$FLIXO_FAILURE_LOG" || printf '%s\n' 'No failed log payload was available.' > "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$TARGET_RUN_ID"
            gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,headSha,headBranch
            grep -E -i 'error|failed|failure|timeout|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(' "$FLIXO_FAILURE_LOG" | tail -n 300 || true
          } > /tmp/flixo-repair-summary.txt

      - name: Classify root cause before repair dependencies
        run: node scripts/ci/auto-repair-classifier.mjs

      - name: Install target dependencies
        id: install_target
        continue-on-error: true
        working-directory: /tmp/flixo-repair-target
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Record target dependency-install failure
        if: steps.install_target.outcome != 'success'
        run: |
          printf '%s\n' 'target-dependency-install-failed' > /tmp/flixo-engine-outcome
          printf '%s\n' 'unrepaired' > /tmp/flixo-learning-outcome
          printf '%s\n' '{"rootCause":"target_dependency_install_failure"}' > /tmp/flixo-root-cause.json

      - name: Run bounded repair engine as preparation only
        if: steps.install_target.outcome == 'success'
        env:
          FLIXO_TARGET_DIR: /tmp/flixo-repair-target
        run: node scripts/ci/auto-repair-engine.mjs

      - name: Verify prepared repair without publishing it
        id: verify
        if: always()
        working-directory: /tmp/flixo-repair-target
        run: |
          set -euo pipefail
          if [ "${{ steps.install_target.outcome }}" != "success" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Target dependencies could not be installed; preparation is not certifiable.'
            exit 0
          fi
          test -f /tmp/flixo-repair-evidence.json || {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'No repair evidence was produced; no prepared repair is handed off.'
            exit 0
          }
          OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          echo "REPAIR_OUTCOME=$OUTCOME"
          if [ "$OUTCOME" != "verified-repair" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo "Repair outcome '$OUTCOME' is not a verified prepared repair; escalation only."
            exit 0
          fi
          git diff --quiet && {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Engine reported verified-repair but produced no source diff; refusing handoff.'
            exit 0
          }
          npm run typecheck
          npm run test:static
          npm run test:build
          git diff --binary > /tmp/flixo-prepared-repair.patch
          printf '%s\n' '{"mode":"PREPARATION_ONLY","applyBy":"SUPERVISING_EXECUTION_AGENT","sourcePublishByBot":false}' > /tmp/flixo-prepared-repair-handoff.json
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Record learning outcome for every diagnosed failure
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          FLIXO_FAILED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          FLIXO_RUN_ID: ${{ env.TARGET_RUN_ID }}
        run: |
          set -euo pipefail
          if [ -f /tmp/flixo-failed-sha ]; then FLIXO_FAILED_SHA="$(cat /tmp/flixo-failed-sha)"; fi
          test -f /tmp/flixo-root-cause.json || printf '%s\n' '{"rootCause":"unknown"}' > /tmp/flixo-root-cause.json
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          if [ -f /tmp/flixo-repair-evidence.json ]; then
            RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||'')")
            ENGINE_OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          else
            RULE=''
            ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          fi
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$ENGINE_OUTCOME" = "verified-repair" ]; then
            LEARNING_OUTCOME='success'
          else
            LEARNING_OUTCOME='unrepaired'
          fi
          FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" FLIXO_LEARNING_OUTCOME="$LEARNING_OUTCOME" FLIXO_VERIFICATION="$ENGINE_OUTCOME" node scripts/ci/auto-repair-learning.mjs
          printf '%s\n' "$ENGINE_OUTCOME" > /tmp/flixo-engine-outcome
          printf '%s\n' "$LEARNING_OUTCOME" > /tmp/flixo-learning-outcome

      - name: Publish one prepared repair bundle for executive review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-auto-repair-${{ env.TARGET_RUN_ID }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-root-cause.json
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-engine-outcome
            /tmp/flixo-learning-outcome
            /tmp/flixo-prepared-repair.patch
            /tmp/flixo-prepared-repair-handoff.json
            diagnostics/auto-repair/memory.json
          if-no-files-found: warn
          retention-days: 30
