name: FLIXO Auto Repair Bot

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: flixo-auto-repair-main
  cancel-in-progress: true

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log

jobs:
  repair:
    name: Diagnose and safely repair main CI failures
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact failed SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Capture failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1 || true
          test -s "$FLIXO_FAILURE_LOG" || printf '%s\n' 'No failed log payload was available.' > "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$RUN_ID"
            echo 'head_sha=${{ github.event.workflow_run.head_sha }}'
            grep -E -i 'error|failed|failure|timeout|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(' "$FLIXO_FAILURE_LOG" | tail -n 300 || true
          } > /tmp/flixo-repair-summary.txt

      - name: Run bounded auto-repair engine
        run: node scripts/ci/auto-repair-engine.mjs

      - name: Verify repair before publishing
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes were produced; no repair PR will be created.'
            exit 0
          fi
          npm run typecheck
          npm run test:static
          npm run test:build

      - name: Create repair branch
        if: success()
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          BRANCH="bot/auto-repair-${{ github.event.workflow_run.id }}"
          git switch -c "$BRANCH"
          git config user.name 'flixo-auto-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(ci): apply safe automatic repair from run ${{ github.event.workflow_run.id }}"
          git push --set-upstream origin "$BRANCH"
          echo "REPAIR_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open repair PR
        if: success() && env.REPAIR_BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$REPAIR_BRANCH" \
            --draft \
            --title "fix(ci): automatic repair for failed run $RUN_ID" \
            --body "## FLIXO Auto Repair Bot\n\nFailed canonical CI run: $RUN_ID\n\nFailed SHA: $FAILED_SHA\n\nThe bot applies only bounded deterministic repairs and verifies typecheck + static + build before opening a draft PR.\n\nFailure summary:\n\n$(cat /tmp/flixo-repair-summary.txt)\n\nNo direct push to main is performed by the repair bot."

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-auto-repair-${{ github.event.workflow_run.id }}
          path: |
            "$FLIXO_FAILURE_LOG"
            /tmp/flixo-repair-summary.txt
          if-no-files-found: warn
          retention-days: 14
