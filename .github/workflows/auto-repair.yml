name: FLIXO Auto Repair Bot

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Workflow run ID to diagnose and repair'
        required: true
        type: string
  workflow_run:
    workflows: ["FLIXO Test System", "FLIXO WP0 Trust Baseline", "FLIXO Continuous Delivery"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write
  checks: read
  pull-requests: write

concurrency:
  group: flixo-auto-repair-main
  cancel-in-progress: false

env:
  FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
  FLIXO_REPAIR_MEMORY: diagnostics/auto-repair/memory.json
  FLIXO_REPAIR_LANE: single
  TARGET_RUN_ID: ${{ inputs.target_run_id || github.event.workflow_run.id }}
  FLIXO_HISTORY_LIMIT: '30'
  FLIXO_HISTORY_WORKFLOWS: 'FLIXO Test System,FLIXO WP0 Trust Baseline,FLIXO Continuous Delivery'

jobs:
  repair:
    name: Single-lane diagnose, execute, verify and learn
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted repair engine from current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          case "$CONCLUSION" in
            failure|timed_out) ;;
            skipped|cancelled|action_required|stale|success|neutral|in_progress|queued)
              echo "Target run $TARGET_RUN_ID has non-diagnosable conclusion: $CONCLUSION"
              exit 1
              ;;
            *)
              echo "Target run $TARGET_RUN_ID has unsupported conclusion: $CONCLUSION"
              exit 1
              ;;
          esac
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,headSha,headBranch,name
          printf '%s\n' "$TARGET_RUN_ID" > /tmp/flixo-target-run-id
          printf '%s\n' "$CONCLUSION" > /tmp/flixo-target-conclusion

      - name: Materialize failed SHA as named isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED_SHA="$(gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test -n "$FAILED_SHA" && test "$FAILED_SHA" != "null"
          BRANCH="flixo-auto-repair/${TARGET_RUN_ID}-${GITHUB_RUN_ID}"
          git fetch --no-tags origin "$FAILED_SHA"
          git worktree add -b "$BRANCH" /tmp/flixo-repair-target "$FAILED_SHA"
          printf '%s\n' "$FAILED_SHA" > /tmp/flixo-failed-sha
          printf '%s\n' "$BRANCH" > /tmp/flixo-repair-branch

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Learn from historical GitHub Actions failures and repair history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/learn-from-historical-actions.mjs

      - name: Capture failed CI logs before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$FLIXO_FAILURE_LOG" 2>&1 || true
          test -s "$FLIXO_FAILURE_LOG" || printf '%s\n' 'No failed log payload was available.' > "$FLIXO_FAILURE_LOG"
          {
            echo '### Failed CI classification input'
            echo "run_id=$TARGET_RUN_ID"
            gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,headSha,headBranch,conclusion
            grep -E -i 'error|failed|failure|timeout|cancelled|unused|no-unused|type error|TS[0-9]+|prettier|playwright|expect\(' "$FLIXO_FAILURE_LOG" | tail -n 300 || true
          } > /tmp/flixo-repair-summary.txt

      - name: Classify root cause with evidence gate
        run: node scripts/ci/auto-repair-classifier.mjs

      - name: Bind Task Agent to the active repair cycle on the isolated branch
        run: |
          set -euo pipefail
          SIGNATURE="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8')); process.stdout.write(x.signature||'unknown')")"
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          BRANCH="$(cat /tmp/flixo-repair-branch)"
          cd /tmp/flixo-repair-target
          test "$(git branch --show-current)" = "$BRANCH"
          node scripts/ci/task-agent.mjs --all-ready --failure-run-id="$TARGET_RUN_ID" --failure-sha="$FAILED_SHA" --failure-fingerprint="$SIGNATURE" --failure-evidence=/tmp/flixo-repair-summary.txt
          cp diagnostics/agents/task-agent/latest.json /tmp/flixo-task-agent-latest.json
          test -s /tmp/flixo-task-agent-latest.json

      - name: Install target dependencies
        id: install_target
        working-directory: /tmp/flixo-repair-target
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Execute bounded root-cause repair under Task Agent authority
        id: execute_repair
        working-directory: /tmp/flixo-repair-target
        env:
          FLIXO_TARGET_DIR: /tmp/flixo-repair-target
        run: |
          set -euo pipefail
          export FLIXO_REPAIR_STRATEGY="$(node -e "const x=require('/tmp/flixo-repair-strategy.json');process.stdout.write(x.strategyId+'::'+x.strategy)")"
          node scripts/ci/auto-repair-engine.mjs

      - name: Verify Task Agent repair before publication
        id: verify
        if: always()
        working-directory: /tmp/flixo-repair-target
        run: |
          set -euo pipefail
          if [ -f /tmp/flixo-intractable-state ] && [ "$(cat /tmp/flixo-intractable-state)" = "true" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Case is INTRACTABLE; fail-closed escalation is required.'
            exit 0
          fi
          test -f /tmp/flixo-repair-evidence.json || {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'No repair evidence was produced.'
            exit 0
          }
          OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          echo "REPAIR_OUTCOME=$OUTCOME"
          if [ "$OUTCOME" != "verified-repair" ]; then
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo "Repair outcome '$OUTCOME' is not a verified repair; fail closed."
            exit 0
          fi
          git diff --quiet && {
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Verified repair produced no source diff; refusing publication.'
            exit 1
          }
          npm run typecheck
          npm run test:static
          npm run test:build
          git diff --check
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Commit and push verified repair from Task Agent branch
        if: steps.verify.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /tmp/flixo-repair-target
        run: |
          set -euo pipefail
          BRANCH="$(cat /tmp/flixo-repair-branch)"
          git add -A
          git diff --cached --quiet && { echo 'No applicable repair diff; refusing empty repair.'; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(auto-repair): verified repair for run ${TARGET_RUN_ID}"
          git push --set-upstream origin "$BRANCH"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "fix(auto-repair): verified repair for run ${TARGET_RUN_ID}" --body "Automated repair for unresolved run ${TARGET_RUN_ID}.\n\nThe Task Agent owns the isolated repair branch. The bounded repair engine is an execution backend under that authority. Canonical CI remains the final merge gate.\n\nFailed SHA: $(cat /tmp/flixo-failed-sha)\nRepair run: ${GITHUB_RUN_ID}")"
          echo "Created verified repair PR: $PR_URL"

      - name: Record learning outcome for every diagnosed failure
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outputs.verified == 'true' && 'success' || 'failure' }}
          FLIXO_FAILED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          FLIXO_RUN_ID: ${{ env.TARGET_RUN_ID }}
        run: |
          set -euo pipefail
          if [ -f /tmp/flixo-failed-sha ]; then FLIXO_FAILED_SHA="$(cat /tmp/flixo-failed-sha)"; fi
          test -f /tmp/flixo-root-cause.json || printf '%s\n' '{"rootCause":"unknown"}' > /tmp/flixo-root-cause.json
          ROOT_CAUSE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-root-cause.json','utf8'));process.stdout.write(x.rootCause||'unknown')")
          if [ -f /tmp/flixo-repair-evidence.json ]; then
            RULE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.selected||'')")
            ENGINE_OUTCOME=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")
          else
            RULE=''
            ENGINE_OUTCOME="$(cat /tmp/flixo-engine-outcome 2>/dev/null || printf '%s' 'engine-error')"
          fi
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$ENGINE_OUTCOME" = "verified-repair" ]; then LEARNING_OUTCOME='success'; else LEARNING_OUTCOME='unrepaired'; fi
          FLIXO_ROOT_CAUSE="$ROOT_CAUSE" FLIXO_REPAIR_RULE="$RULE" FLIXO_LEARNING_OUTCOME="$LEARNING_OUTCOME" FLIXO_VERIFICATION="$ENGINE_OUTCOME" node scripts/ci/auto-repair-learning.mjs
          printf '%s\n' "$ENGINE_OUTCOME" > /tmp/flixo-engine-outcome
          printf '%s\n' "$LEARNING_OUTCOME" > /tmp/flixo-learning-outcome

      - name: Publish repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-auto-repair-${{ env.TARGET_RUN_ID }}-${{ github.run_id }}
          path: |
            /tmp/flixo-failure.log
            /tmp/flixo-repair-summary.txt
            /tmp/flixo-root-cause.json
            /tmp/flixo-engine-outcome
            /tmp/flixo-learning-outcome
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-repair-strategy.json
            /tmp/flixo-intractable-state
            /tmp/flixo-task-agent-latest.json
            /tmp/flixo-repair-target/diagnostics/agents/task-agent/*.json
            diagnostics/auto-repair/memory.json
            diagnostics/auto-repair/historical-learning.json
            diagnostics/auto-repair/intractable-errors.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-open repair cycle when the current attempt is not verified
        if: always() && steps.verify.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/flixo-intractable-state 2>/dev/null || printf '%s' false)" = "true" ]; then
            echo 'INTRACTABLE case reached: recursive repair is intentionally stopped.'
            echo 'Fail-closed teaching/escalation packet is required before a new cycle is allowed.'
            exit 1
          fi
          FAILED_SHA="$(cat /tmp/flixo-failed-sha)"
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$FAILED_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Repair target $TARGET_RUN_ID is superseded: failed SHA $FAILED_SHA != current main $CURRENT_MAIN_SHA."
            echo 'Failing closed; a fresh cycle must start from the current main SHA.'
            exit 1
          fi
          echo "Repair remains open: target run $TARGET_RUN_ID is not verified on current main. Starting another bounded repair pass."
          gh workflow run auto-repair.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_run_id="$TARGET_RUN_ID"
          exit 1
