name: G4 Locale Runtime Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
      VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
      VITE_TEST_ORIGIN: https://canonical.test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 3000 >/tmp/g4-diagnostic-server.log 2>&1 &
          echo $! >/tmp/g4-diagnostic-server.pid
          for _ in $(seq 1 60); do
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/g4-diagnostic-server.log
          exit 1
      - name: Diagnose Firefox /ar runtime
        run: |
          cat >/tmp/g4-diagnostic.mjs <<'NODE'
          import { firefox } from 'playwright';

          const browser = await firefox.launch({ headless: true });
          const page = await browser.newPage();
          page.on('pageerror', (error) => console.log('PAGEERROR:', error.stack || error.message));
          page.on('console', (message) => console.log(`CONSOLE ${message.type()}:`, message.text()));
          page.on('requestfailed', (request) => console.log('REQUESTFAILED:', request.url(), request.failure()?.errorText || 'unknown'));

          const response = await page.goto('http://127.0.0.1:3000/ar', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(3000);
          console.log('RESPONSE:', response?.status(), response?.url());
          console.log('DOM:', await page.evaluate(() => ({
            url: location.href,
            readyState: document.readyState,
            html: document.documentElement.outerHTML.slice(0, 4000),
            lang: document.documentElement.getAttribute('lang'),
            dir: document.documentElement.getAttribute('dir'),
            root: document.getElementById('root')?.innerHTML.slice(0, 4000) ?? null,
            scripts: [...document.scripts].map((s) => ({ src: s.src, type: s.type, ready: s.readyState })),
            startupError: document.documentElement.getAttribute('data-g4-startup-error'),
          })));
          await browser.close();
          NODE
          node /tmp/g4-diagnostic.mjs
      - if: always()
        run: cat /tmp/g4-diagnostic-server.log || true
