name: Temporary Lockfile Rebuild

on:
  push:
    branches:
      - remediation/image-only-closure-execution-20260907

permissions:
  contents: write

jobs:
  rebuild-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: remediation/image-only-closure-execution-20260907
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate lockfile after dependency closure'
          git push origin HEAD:remediation/image-only-closure-execution-20260907
