name: Temporary Workflow Syntax Audit

on:
  push:
    branches: [execution]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Parse workflow YAML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in .github/workflows/auto-repair.yml .github/workflows/daily-flixo-green-gate.yml; do
            encoded="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${GITHUB_SHA}" --jq '.content')"
            printf '%s' "${encoded}" | tr -d '\n' | base64 --decode > "/tmp/$(basename "${file}")"
          done
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.parse_file(p); puts "PARSE_OK=#{p}" }' /tmp/auto-repair.yml /tmp/daily-flixo-green-gate.yml
