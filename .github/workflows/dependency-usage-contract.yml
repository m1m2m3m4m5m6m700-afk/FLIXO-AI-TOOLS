name: Dependency Usage Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'scripts/report-dependency-usage.mjs'
      - 'scripts/test-dependency-usage-classification.mjs'
      - '.github/workflows/dependency-usage-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Dependency usage contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test-dependency-usage-classification.mjs
