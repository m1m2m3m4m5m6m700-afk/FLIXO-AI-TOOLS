name: Dependency Health

# Deep dependency diagnostics: main/manual only during PR rescue mode.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    name: Dependency Health Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce dependency zero-debt gate
        run: npm run validate:dependency-zero-debt
      - name: Generate dependency health report
        env:
          DEPENDENCY_HEALTH_JSON: diagnostics/dependency-health.json
        run: |
          mkdir -p diagnostics
          npm run report:dependency-health > diagnostics/dependency-health.txt
      - name: Upload dependency health report
        id: upload-report
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        continue-on-error: true
        with:
          name: dependency-health-${{ github.sha }}
          path: |
            diagnostics/dependency-health.txt
            diagnostics/dependency-health.json
          if-no-files-found: error
          retention-days: 14
      - name: Report artifact-service status
        if: always()
        run: |
          if [ "${{ steps.upload-report.outcome }}" != "success" ]; then
            echo "Dependency health artifact upload unavailable; diagnostic artifact delivery is non-gating." >&2
          fi
