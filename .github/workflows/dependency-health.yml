name: Dependency Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inventory:
    name: Dependency Health Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Synchronize lockfile
        if: github.event_name == 'pull_request'
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit synchronized lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: synchronize lockfile after zero-debt cleanup"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: npm ci
      - name: Enforce dependency zero-debt gate
        run: npm run validate:dependency-zero-debt
      - name: Generate dependency health report
        env:
          DEPENDENCY_HEALTH_JSON: diagnostics/dependency-health.json
        run: |
          mkdir -p diagnostics
          npm run report:dependency-health > diagnostics/dependency-health.txt
      - name: Upload dependency health report
        uses: actions/upload-artifact@v6
        with:
          name: dependency-health-${{ github.sha }}
          path: |
            diagnostics/dependency-health.txt
            diagnostics/dependency-health.json
          if-no-files-found: error
          retention-days: 14
