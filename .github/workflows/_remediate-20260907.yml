name: FLIXO Autonomous Remediation 20260907

on:
  push:
    branches:
      - repair/2026-09-07-session-001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Repair locale type boundaries and locale data
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_entry(path: str, locale: str, next_locale: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              pattern = rf"\n  {re.escape(locale)}:.*?\n  {re.escape(next_locale)}:"
              updated, count = re.subn(pattern, "\n" + replacement + f"\n  {next_locale}:", text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {locale} entry before {next_locale} in {path}; found {count}")
              p.write_text(updated, encoding='utf-8')

          # Deterministic TypeScript syntax repairs.
          p = Path('src/components/technical-tool-shell.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const EXTERNAL_PROCESSING: Partial<Record<KnownLocale, string> = {', 'const EXTERNAL_PROCESSING: Partial<Record<KnownLocale, string>> = {')
          p.write_text(text, encoding='utf-8')

          p = Path('src/lib/i18n/tool-localization.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("Partial<Record<KnownLocale, Record<'Images' | 'AI' | 'Other', string>> = {", "Record<Locale, Record<'Images' | 'AI' | 'Other', string>> = {")
          p.write_text(text, encoding='utf-8')

          ms_home = """  ms: copy({language:'ms',dir:'ltr',nav:{tools:'Alat',categories:'Kategori',privacy:'Privasi',switch:'English'},badge:'Utamakan privasi · Utamakan pelayar',eyebrow:'FLIXO · PETI ALAT PINTAR',heroTitle:'Alat yang tepat, <span>tanpa jalan berliku.</span>',heroLead:'Cari tugasan, buka alat dan siapkan dengan pantas. FLIXO mengekalkan pengalaman yang fokus dan menggunakan pemprosesan tempatan dalam pelayar apabila disokong oleh alat.',describe:'Terangkan tugasan',searchLabel:'Cari alat',searchPlaceholder:'Apa yang anda mahu lakukan? Cuba “mampatkan imej”',smartPalette:'Buka palet arahan pintar',suggested:'Disyorkan:',openDirectly:'buka terus',popular:'Carian popular',trust:[['Pelayar diutamakan','Pemprosesan tempatan apabila disokong oleh alat.'],['Mula pantas','Laluan terus tanpa pendaftaran yang tidak diperlukan.'],['Penghalaan pintar','Tugasan biasa terus menuju ke alat yang sesuai.']],quickDrop:'LETAK PANTAS',quickDropTitle:'Letakkan fail. Kami akan tunjukkan alat yang sesuai.',quickDropLead:'FLIXO tidak memuat naik fail anda dari halaman utama. Hanya jenis fail diperiksa secara tempatan untuk mencadangkan alat sedia ada.',dropChoose:'Letakkan atau pilih fail',dropSupport:'Imej kini disokong untuk cadangan pintar.',suggestedTool:'Alat disyorkan',openTool:'Buka alat',toolbox:'PETI ALAT',toolboxTitle:'Mulakan dengan alat yang benar-benar diperlukan.',ready:'sedia',empty:'Tiada alat yang sepadan buat masa ini. Cuba frasa yang lebih ringkas atau buka Smart Intent dengan Ctrl K.',builtForFocus:'DIBINA UNTUK FOKUS',finalTitle:'Satu carian. Satu hasil berguna.',finalLead:'FLIXO membawa anda daripada niat kepada tindakan tanpa menjadikan tugasan mudah sebagai aliran kerja yang rumit.',trySmart:'Cuba Smart Intent',all:'Semua',browserMeta:'Utamakan pelayar · Mula serta-merta',ariaHome:'Halaman utama FLIXO',ariaPrimary:'Navigasi utama',ariaFindTool:'Cari alat',ariaTrust:'Isyarat kepercayaan',ariaCategories:'Kategori alat',quickTags:['Mampat imej','Buang latar belakang','OCR','PDF','Imej AI']}),"""
          uk_home = """  uk: copy({language:'uk',dir:'ltr',nav:{tools:'Інструменти',categories:'Категорії',privacy:'Конфіденційність',switch:'English'},badge:'Приватність передусім · Браузер передусім',eyebrow:'FLIXO · РОЗУМНИЙ НАБІР ІНСТРУМЕНТІВ',heroTitle:'Потрібний інструмент, <span>без зайвих кроків.</span>',heroLead:'Знайдіть завдання, відкрийте інструмент і швидко завершіть його. FLIXO зберігає фокус і використовує локальну обробку в браузері, коли інструмент це підтримує.',describe:'Опишіть завдання',searchLabel:'Пошук інструментів',searchPlaceholder:'Що потрібно зробити? Спробуйте «стиснути зображення»',smartPalette:'Відкрити розумну панель команд',suggested:'Рекомендовано:',openDirectly:'відкрити напряму',popular:'Популярні запити',trust:[['Браузер передусім','Локальна обробка, коли її підтримує інструмент.'],['Швидкий старт','Прямі маршрути без зайвої реєстрації.'],['Розумна маршрутизація','Поширені завдання одразу ведуть до потрібного готового інструмента.']],quickDrop:'ШВИДКЕ ДОДАВАННЯ',quickDropTitle:'Додайте файл. Ми підкажемо потрібний інструмент.',quickDropLead:'FLIXO не завантажує ваш файл із головної сторінки. Для рекомендації наявного інструмента локально перевіряється лише тип файлу.',dropChoose:'Перетягніть або виберіть файл',dropSupport:'Зображення наразі підтримуються для розумних рекомендацій.',suggestedTool:'Рекомендований інструмент',openTool:'Відкрити інструмент',toolbox:'НАБІР ІНСТРУМЕНТІВ',toolboxTitle:'Почніть з інструментів, які справді потрібні.',ready:'готово',empty:'Відповідного інструмента поки немає. Спробуйте простіший запит або відкрийте Smart Intent через Ctrl K.',builtForFocus:'СТВОРЕНО ДЛЯ ФОКУСУ',finalTitle:'Один пошук. Один корисний результат.',finalLead:'FLIXO веде вас від наміру до дії, не перетворюючи просте завдання на складний робочий процес.',trySmart:'Спробувати Smart Intent',all:'Усі',browserMeta:'Браузер передусім · Миттєвий старт',ariaHome:'Головна FLIXO',ariaPrimary:'Основна навігація',ariaFindTool:'Знайти інструмент',ariaTrust:'Сигнали довіри',ariaCategories:'Категорії інструментів',quickTags:['Стиснути зображення','Видалити фон','OCR','PDF','Зображення ШІ']}),"""
          replace_entry('src/data/home-locales.ts', 'ms', 'hi', ms_home)
          replace_entry('src/data/home-locales.ts', 'uk', 'ja', uk_home)

          ms_quickflow = """  ms:q({missing:'QuickFlow tidak ditemui',back:'Kembali ke FLIXO',eyebrow:'QUICKFLOW · PEMPROSESAN TEMPATAN',runLabel:'Jalankan QuickFlow',choose:'Pilih imej untuk bermula',processing:'Pemprosesan berlaku dalam pelayar anda.',result:'Hasil sedia',download:'Muat turun hasil',chooseError:'Pilih imej terlebih dahulu.',failure:'Aliran kerja gagal.',running:'Sedang dijalankan…',run:'Jalankan aliran kerja',resultAlt:'Hasil QuickFlow FLIXO',progress:'Kemajuan'}),"""
          uk_quickflow = """  uk:q({missing:'QuickFlow не знайдено',back:'Назад до FLIXO',eyebrow:'QUICKFLOW · ЛОКАЛЬНА ОБРОБКА',runLabel:'Запустити QuickFlow',choose:'Виберіть зображення, щоб почати',processing:'Обробка виконується у вашому браузері.',result:'Результат готовий',download:'Завантажити результат',chooseError:'Спочатку виберіть зображення.',failure:'Робочий процес не виконано.',running:'Виконується…',run:'Запустити робочий процес',resultAlt:'Результат QuickFlow від FLIXO',progress:'Прогрес'}),"""
          replace_entry('src/data/quickflow-locales.ts', 'ms', 'hi', ms_quickflow)
          replace_entry('src/data/quickflow-locales.ts', 'uk', 'ja', uk_quickflow)

          # Semantic guards: new public locale keys must carry their own language metadata.
          home = Path('src/data/home-locales.ts').read_text(encoding='utf-8')
          quick = Path('src/data/quickflow-locales.ts').read_text(encoding='utf-8')
          for blob, expected in ((home, "ms: copy({language:'ms',dir:'ltr'"), (home, "uk: copy({language:'uk',dir:'ltr'"), (quick, "ms:q({missing:'QuickFlow tidak ditemui'"), (quick, "uk:q({missing:'QuickFlow не знайдено'")):
              if expected not in blob:
                  raise SystemExit(f'Semantic locale guard failed: {expected}')
          PY

      - name: TypeScript verification
        run: npx tsc --noEmit --pretty false

      - name: Build verification
        run: npm run build

      - name: Commit only after clean verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-remediation-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .remediation-tsc.log .remediation-build.log .remediation-playwright.log .remediation-build-final.log .remediation-state
          rm -f .github/workflows/_diagnose-20260907.yml .github/workflows/_remediate-20260907.yml
          git add -A
          git diff --cached --quiet || git commit -m "fix: complete locale contract remediation"
          git push origin HEAD:${GITHUB_REF_NAME}
