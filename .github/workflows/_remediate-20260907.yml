name: FLIXO Autonomous Remediation 20260907

on:
  push:
    branches:
      - repair/2026-09-07-session-001

permissions:
  contents: write

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Repair generated type-boundary mistakes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')

          # The first pass intentionally moved legacy dictionaries behind KnownLocale.
          # Correct nested generic closure introduced by that mechanical rewrite.
          for path in [
              'src/components/auto-localized-tool-surface.tsx',
              'src/components/technical-tool-shell.tsx',
              'src/lib/i18n/shared-tool-ui.ts',
              'src/lib/i18n/tool-localization.ts',
              'src/lib/i18n/tool-ui-runtime.ts',
              'src/lib/i18n/tool-ui-runtime-supplement.ts',
          ]:
              text = read(path)
              text = re.sub(
                  r'(Partial<Record<KnownLocale,\s*Record<[^\n;=]+string)\s*>>)(\s*=)',
                  r'\1>\2',
                  text,
              )
              write(path, text)

          # CATEGORY_LABELS is authoritative canonical data and is complete for the 20 locales.
          p = Path('src/lib/i18n/tool-localization.ts')
          text = read(p)
          text = text.replace(
              "export const CATEGORY_LABELS: Partial<Record<KnownLocale, Record<'Images' | 'AI' | 'Other', string>> = {",
              "export const CATEGORY_LABELS: Record<Locale, Record<'Images' | 'AI' | 'Other', string>> = {",
          )
          write(p, text)

          # Keep the compatibility type explicit in files that retain zh/ur historical dictionaries.
          p = Path('src/lib/i18n/config.ts')
          text = read(p)
          expected = "export type LegacyLocale = 'zh' | 'ur';\nexport type KnownLocale = CanonicalLocale | LegacyLocale;"
          if expected not in text:
              text = re.sub(
                  r'export type CanonicalLocale = \(typeof LOCALES\)\[number\];',
                  "export type CanonicalLocale = (typeof LOCALES)[number];\n\n/** Internal compatibility envelope for legacy locale dictionaries. */\n" + expected,
                  text,
              )
          write(p, text)
          PY

      - name: TypeScript verification
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          code=$?
          {
            echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
            echo "TSC_EXIT_CODE=${code}"
            echo
            cat /tmp/tsc.log
          } > .remediation-tsc.log
          if [ "$code" -ne 0 ]; then
            echo 'TSC_FAILED=1' >> .remediation-state
          else
            echo 'TSC_FAILED=0' >> .remediation-state
          fi
          exit 0

      - name: Build verification
        if: hashFiles('.remediation-state') != '' && !contains(join('', steps.*.outputs.*), '')
        shell: bash
        run: |
          if grep -q 'TSC_FAILED=1' .remediation-state; then exit 0; fi
          set -o pipefail
          npm run build 2>&1 | tee .remediation-build.log

      - name: Localization runtime verification
        shell: bash
        run: |
          if grep -q 'TSC_FAILED=1' .remediation-state; then exit 0; fi
          set -o pipefail
          npx playwright test tests/localization-runtime.spec.ts 2>&1 | tee .remediation-playwright.log

      - name: Final build verification
        shell: bash
        run: |
          if grep -q 'TSC_FAILED=1' .remediation-state; then exit 0; fi
          set -o pipefail
          npm run build 2>&1 | tee .remediation-build-final.log

      - name: Commit diagnostics or finalize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tsc_ok=0
          runtime_ok=0
          build_ok=0
          grep -q 'TSC_EXIT_CODE=0' .remediation-tsc.log && tsc_ok=1 || true
          test -f .remediation-playwright.log && ! grep -qE '[0-9]+ failed|\bfailed\b' .remediation-playwright.log && runtime_ok=1 || true
          test -f .remediation-build-final.log && ! grep -qE 'ELIFECYCLE|Build failed|Error:' .remediation-build-final.log && build_ok=1 || true
          verified=0
          if [ "$tsc_ok" -eq 1 ] && [ "$runtime_ok" -eq 1 ] && [ "$build_ok" -eq 1 ]; then verified=1; fi
          if [ "$verified" -eq 1 ]; then
            rm -f .github/workflows/_remediate-20260907.yml .github/workflows/_diagnose-20260907.yml .remediation-tsc.log .remediation-state .remediation-build.log .remediation-playwright.log .remediation-build-final.log
          fi
          git config user.name 'openai-remediation-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$verified" -eq 1 ]; then
              git commit -m 'fix: finalize locale and CI remediation with verification'
            else
              git commit -m 'chore: capture remediation verification state'
            fi
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
