name: Bundle Boundary Contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-boundaries:
    name: Protected bundle boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate protected entrypoints
        run: node scripts/validate-bundle-boundaries.mjs
      - name: Inventory heavy dependency usage
        run: npm run report:heavy-dependency-usage
      - name: Upload heavy dependency inventory
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: heavy-dependency-usage
          path: diagnostics/heavy-dependency-usage.json
          if-no-files-found: error
          retention-days: 14
