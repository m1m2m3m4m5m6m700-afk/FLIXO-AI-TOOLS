name: Agent Editor Step 5-6 Verification

on:
  push:
    branches:
      - execution
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: agent-editor-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FLIXO_ENABLE_MOCK_LLM: "true"
      FLIXO_RATE_LIMIT_FAIL_CLOSED: "false"
      VITE_SITE_URL: "https://flixoai.m1m2m3m4m5m6m700.workers.dev"
    defaults:
      run:
        working-directory: apps/agent-editor
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install agent editor dependencies
        run: npm install --no-package-lock

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and API integration contracts
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Exact-SHA evidence
        working-directory: .
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_SHA=${EXPECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
