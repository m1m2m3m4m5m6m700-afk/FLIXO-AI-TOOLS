name: FLIXO Task History Ledger

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-task-history-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  task-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate historical prefix
        if: github.event_name == 'pull_request'
        run: node scripts/ci/task-history-ledger.mjs verify --base=${{ github.event.pull_request.base.sha }}

      - name: Reconcile executed tasks
        if: github.event_name != 'pull_request'
        run: node scripts/ci/task-history-ledger.mjs reconcile

      - name: Verify append-only invariant
        if: github.event_name != 'pull_request'
        run: node scripts/ci/task-history-ledger.mjs verify --base=HEAD^

      - name: Report newly discovered history without source mutation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/agents/task-history/ledger.jsonl; then
            echo "TASK_HISTORY_MUTATION=NONE"
          else
            echo "TASK_HISTORY_MUTATION=DETECTED_BUT_PUBLICATION_FORBIDDEN"
            git diff -- docs/agents/task-history/ledger.jsonl
            exit 1
          fi
