name: FLIXO Council Priority Wake

on:
  workflow_dispatch:
    inputs:
      entry_sha:
        description: Exact execution SHA
        required: true
        type: string
      request_id:
        description: Idempotent council request identifier
        required: true
        type: string
      source_comment_id:
        description: Source PR comment id
        required: true
        type: string
      question:
        description: Council question/request
        required: true
        type: string

permissions:
  contents: read
  issues: write
  id-token: write
  actions: read

concurrency:
  group: flixo-council-priority-\${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  wake:
    name: Immediate P0 Council dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Council controller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The workflow has id-token:write. Execute only trusted controller code from main.
          # entry_sha is validated against the live execution ref as data, never as checked-out code.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate current exact SHA and Council contract
        env:
          GH_TOKEN: \${{ github.token }}
          ENTRY_SHA: \${{ inputs.entry_sha }}
        run: |
          set -euo pipefail
          [[ "$ENTRY_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$ENTRY_SHA" = "$CURRENT_SHA"
          node scripts/ci/test-council-directive.mjs
          node scripts/ci/test-council-wake-dispatch.mjs

      - name: Dispatch P0 Council request through OIDC
        env:
          ENTRY_SHA: \${{ inputs.entry_sha }}
          REQUEST_ID: \${{ inputs.request_id }}
          SOURCE_COMMENT_ID: \${{ inputs.source_comment_id }}
          QUESTION: \${{ inputs.question }}
          RUNTIME_URL: https://zrpsmgdrtwzrhkjwwujo.supabase.co/functions/v1/flixo-council-runtime
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNTIME_URL" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          jq -n \
            --arg messageId "$REQUEST_ID" \
            --arg taskId "COUNCIL-P0-$REQUEST_ID" \
            --arg workPackageId "COUNCIL-P0-$SOURCE_COMMENT_ID" \
            --arg entrySha "$ENTRY_SHA" \
            --arg question "$QUESTION" \
            --arg sourceCommentId "$SOURCE_COMMENT_ID" \
            '{
              messageId:$messageId,
              idempotencyKey:($messageId + ":" + $entrySha),
              taskId:$taskId,
              workPackageId:$workPackageId,
              entrySha:$entrySha,
              primaryAccountId:"CHIEF",
              fallbackAccountId:"CHIEF",
              requestedByAccountId:"SYSTEM",
              directiveVersion:"1.0.0",
              priority:"P0",
              councilOperation:true,
              councilRole:"PRESIDENT",
              payload:{
                source:"COUNCIL_ACTIVE_EXECUTION_PR",
                sourceCommentId:$sourceCommentId,
                question:$question,
                priority:"P0",
                councilOperation:true,
                preemption:"SAFE_BOUNDARY",
                requestedAction:"IMMEDIATE_COUNCIL_RESPONSE"
              }
            }' > /tmp/council-p0.json
          curl -fsSL \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$RUNTIME_URL?action=dispatch" \
            --data-binary @/tmp/council-p0.json > /tmp/council-dispatch.json
          jq -e '.ok == true and .status == "LEASED" and .primaryAccountId == "CHIEF" and .entrySha == $ENTRY_SHA' \
            --arg ENTRY_SHA "$ENTRY_SHA" /tmp/council-dispatch.json >/dev/null
          jq -r '"DISPATCH_ID=" + .dispatchId + "\\nPRIORITY=P0\\nSTATUS=" + .status + "\\nEXACT_SHA=" + .entrySha + "\\nPUSH=" + (.push|tostring)' /tmp/council-dispatch.json

      - name: Publish immediate P0 receipt
        env:
          GH_TOKEN: \${{ github.token }}
          ENTRY_SHA: \${{ inputs.entry_sha }}
          REQUEST_ID: \${{ inputs.request_id }}
          COMMENT_ID: \${{ inputs.source_comment_id }}
        run: |
          set -euo pipefail
          COUNCIL_PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          test -n "$COUNCIL_PR_NUMBER"
          BODY="$(printf '%s\\n' \
            '### COUNCIL P0 WAKE RECEIPT' \
            '' \
            '**Priority:** P0 — Council First' \
            "**Request:** $REQUEST_ID" \
            "**Source comment:** $COMMENT_ID" \
            "**Exact SHA:** $ENTRY_SHA" \
            '**Dispatch:** CHIEF / immediate' \
            '**Preemption:** SAFE_BOUNDARY' \
            '' \
            'The request has been admitted to the canonical Council runtime at P0. ACK is separate evidence and is not inferred from queue admission.')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments" --raw-field body="$BODY" >/dev/null
