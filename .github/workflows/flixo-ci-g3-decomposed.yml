name: FLIXO CI — G3 Decomposed

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-ci-g3-decomposed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  SITE_URL: https://canonical.test
  TEST_ORIGIN: http://127.0.0.1:3000
  RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_SITE_URL: https://canonical.test
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  NODE_ENV: test

jobs:
  foundation:
    name: CI / Foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: G3-00 Identity
        run: node scripts/ci/g3/identity.mjs
      - name: G3-01/02/03 Environment
        if: always()
        run: node scripts/ci/g3/environment.mjs
      - name: Install dependencies
        if: always()
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: G3-11 TypeScript
        if: always()
        run: npx tsc --noEmit --pretty false
      - name: G3-12 ESLint
        if: always()
        run: npm run lint
      - name: G3-13 Build
        if: always()
        run: npm run build
      - name: G3-14 Build Identity
        if: always()
        run: git rev-parse HEAD
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-foundation-${{ github.run_id }}
          path: artifacts/ci/g3/
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: CI / Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Materialize fixed G3 fixtures
        if: always()
        run: node scripts/ci/g3/prepare-fixtures.mjs
      - name: Artifact contract gates G3-20..31
        if: always()
        run: node --experimental-strip-types scripts/ci/g3/artifact-gates.mjs
      - name: Universal artifact regression matrix
        if: always()
        run: node scripts/test-g3-artifact-integrity.mjs
      - name: Processor gates G3-40..47
        if: always()
        run: node --experimental-strip-types scripts/ci/g3/processor.mjs
      - name: Regression gates G3-90..97
        if: always()
        run: node scripts/ci/g3/regression.mjs
      - name: Determinism
        if: always()
        run: node scripts/ci/g3/determinism.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-contracts-${{ github.run_id }}
          path: |
            artifacts/ci/g3/
            tests/fixtures/g3/manifest.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: CI / Browser
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: G3-50 Browser Installed
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Build runtime
        if: always()
        run: npm run build:runtime
      - name: Start local runtime
        if: always()
        shell: bash
        run: |
          set +e
          npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/flixo-g3-server.log 2>&1 &
          echo $! > /tmp/flixo-g3-server.pid
          exit 0
      - name: G3-50..85 Browser evidence
        if: always()
        run: node scripts/ci/g3/browser-gates.mjs
      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-browser-${{ github.run_id }}
          path: |
            artifacts/ci/g3/
            playwright-report/
            test-results/
            /tmp/flixo-g3-server.log
          if-no-files-found: warn
          retention-days: 14

  aggregator:
    name: CI / Aggregator
    if: always()
    needs: [foundation, contracts, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download all G3 evidence
        uses: actions/download-artifact@v6
        with:
          pattern: g3-*
          path: artifacts/ci/g3/all
          merge-multiple: true
      - name: Resolve legacy G3 result
        id: legacy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        shell: bash
        run: |
          set +e
          conclusion=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="FLIXO CI — G3 Artifact Integrity Shadow")] | sort_by(.completed_at) | last | .conclusion // "NOT_FOUND"')
          echo "LEGACY_RESULT=$conclusion" >> "$GITHUB_ENV"
          echo "Legacy G3 conclusion: $conclusion"
      - name: Authoritative root-cause aggregation
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          LEGACY_RESULT: ${{ env.LEGACY_RESULT }}
        run: node scripts/ci/g3/aggregate.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g3-aggregator-${{ github.run_id }}
          path: artifacts/ci/g3/aggregator.json
          if-no-files-found: warn
          retention-days: 30
