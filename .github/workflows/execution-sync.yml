name: FLIXO Execution Canonical Sync

on:
  push:
    branches: [execution]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: flixo-execution-canonical-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile execution with canonical main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution
        uses: actions/checkout@v5
        with:
          ref: execution
          fetch-depth: 0

      - name: Reconcile known current divergence without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main execution
          test "$(git branch --show-current)" = "execution"

          MAIN_SHA="$(git rev-parse origin/main)"
          EXEC_SHA="$(git rev-parse origin/execution)"
          if git merge-base --is-ancestor "$MAIN_SHA" "$EXEC_SHA"; then
            echo "execution already contains canonical main $MAIN_SHA"
            exit 0
          fi

          MERGE_BASE="$(git merge-base origin/main origin/execution)"
          EXPECTED_MAIN="dfc2d5f6cc3d9426a98630d97c3e2c321746a9eb"
          EXPECTED_BASE="8a59c089f5c4d48bcb3448d0175a26ceeef3d67e"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$MERGE_BASE" = "$EXPECTED_BASE"

          mapfile -t MAIN_FILES < <(git diff --name-only "$MERGE_BASE" origin/main | sort)
          EXPECTED_FILES=(
            ".github/workflows/auto-repair.yml"
            "diagnostics/auto-repair/memory.json"
            "scripts/ci/audit-technical-debt.mjs"
            "scripts/ci/task-agent.mjs"
            "scripts/ci/test-technical-debt-audit.mjs"
            "scripts/ci/validate-technical-debt-audit.mjs"
          )
          printf '%s\n' "${EXPECTED_FILES[@]}" | sort > /tmp/flixo-expected-main-files
          printf '%s\n' "${MAIN_FILES[@]}" > /tmp/flixo-actual-main-files
          diff -u /tmp/flixo-expected-main-files /tmp/flixo-actual-main-files

          PRE_SHA="$(git rev-parse HEAD)"
          git merge --no-edit -X ours origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git diff "$PRE_SHA" HEAD)"

          npm ci --prefer-offline --no-audit --no-fund
          npm run test:auto-repair
          npm run validate:auto-repair-memory

          NEW_SHA="$(git rev-parse HEAD)"
          test "$NEW_SHA" != "$PRE_SHA"
          git push origin HEAD:execution
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref execution

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --json number --jq 'length == 1 ? .[0].number : empty')"
          test -n "$PR_NUMBER"

          deadline=$((SECONDS + 1500))
          EXPECTED_SHA="$NEW_SHA"
          while true; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > /tmp/flixo-sync-check-runs.json
            jq -s '[
              .[].check_runs[]
              | select(
                  (.name | ascii_downcase) != "vercel"
                  and (.name | ascii_downcase) != "vercel deployment"
                  and (.name | ascii_downcase) != "flixo auto repair merge gate"
                  and (.name | ascii_downcase) != "flixo execution canonical sync"
                  and (.name | ascii_downcase) != "gate"
                  and (.name | ascii_downcase) != "github-advanced-security"
                  and (.name | ascii_downcase) != "github advanced security"
                  and (.name | ascii_downcase) != "code scanning ai findings"
                )
            ] | group_by(.name) | map(max_by((.completed_at // .started_at // "")))'               /tmp/flixo-sync-check-runs.json > /tmp/flixo-sync-repository-check-runs.json

            COUNT="$(jq 'length' /tmp/flixo-sync-repository-check-runs.json)"
            BAD="$(jq '[.[] | select(.status != "completed" or .conclusion != "success")] | length' /tmp/flixo-sync-repository-check-runs.json)"
            echo "EXACT_HEAD=$EXPECTED_SHA repositoryChecks=$COUNT nonGreen=$BAD"
            if [ "$COUNT" -gt 0 ] && [ "$BAD" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for exact-head repository GREEN."
              jq '.[] | {name,status,conclusion}' /tmp/flixo-sync-repository-check-runs.json
              exit 1
            fi
            sleep 20
          done

          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"

          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq '.state+"|"+(.mergedAt//"")')"
          case "$state" in
            MERGED\|*) ;;
            *) echo "Canonical execution -> main merge was not completed: $state"; exit 1 ;;
          esac

          MAIN_AFTER="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$MAIN_AFTER" && test "$MAIN_AFTER" != "null"
          echo "execution reconciled and PR #$PR_NUMBER merged after exact-head repository GREEN."
          echo "Canonical main after merge: $MAIN_AFTER"
