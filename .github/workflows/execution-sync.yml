name: FLIXO Execution Canonical Sync — Chair Proposal Only

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-execution-sync-proposal
  cancel-in-progress: true
  queue: max

jobs:
  sync:
    name: Detect execution/main divergence for Chair review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 0

      - name: Produce read-only execution/main reconciliation proposal
        env:
          PROPOSAL_ARTIFACT: /tmp/flixo-execution-sync-proposal
        run: |
          set -euo pipefail
          git fetch --no-tags origin main execution
          test "$(git branch --show-current)" = "execution"
          MAIN_SHA="$(git rev-parse origin/main)"
          EXEC_SHA="$(git rev-parse origin/execution)"
          mkdir -p "$PROPOSAL_ARTIFACT"
          if git merge-base --is-ancestor "$MAIN_SHA" "$EXEC_SHA"; then
            printf '%s\n' 'ALREADY_CONVERGED' > "$PROPOSAL_ARTIFACT/status.txt"
            printf '%s\n' "$MAIN_SHA" > "$PROPOSAL_ARTIFACT/main-sha.txt"
            printf '%s\n' "$EXEC_SHA" > "$PROPOSAL_ARTIFACT/execution-sha.txt"
            exit 0
          fi

          git checkout --detach "$EXEC_SHA"
          if ! git merge --no-edit -X ours "origin/main"; then
            git merge --abort || true
            printf '%s\n' 'BLOCKED_CONFLICT' > "$PROPOSAL_ARTIFACT/status.txt"
            printf '%s\n' "$MAIN_SHA" > "$PROPOSAL_ARTIFACT/main-sha.txt"
            printf '%s\n' "$EXEC_SHA" > "$PROPOSAL_ARTIFACT/execution-sha.txt"
            exit 1
          fi

          git status --short
          git diff --check
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git diff --name-only "$EXEC_SHA" "$CANDIDATE_SHA" | sort > "$PROPOSAL_ARTIFACT/changed-paths.txt"
          printf '%s\n' 'PROPOSAL_READY' > "$PROPOSAL_ARTIFACT/status.txt"
          printf '%s\n' "$MAIN_SHA" > "$PROPOSAL_ARTIFACT/main-sha.txt"
          printf '%s\n' "$EXEC_SHA" > "$PROPOSAL_ARTIFACT/execution-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$PROPOSAL_ARTIFACT/candidate-sha.txt"
          printf '%s\n' 'CHAIR_HANDOFF_REQUIRED=true' > "$PROPOSAL_ARTIFACT/handoff.txt"
          git show --stat --oneline --no-renames "$CANDIDATE_SHA" > "$PROPOSAL_ARTIFACT/candidate-summary.txt"

      - name: Publish proposal evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-execution-sync-proposal-${{ github.run_id }}
          path: /tmp/flixo-execution-sync-proposal
          if-no-files-found: error
          retention-days: 14
