name: Phase B Evidence Ledger

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/contracts/ci-contracts.ts'
      - 'src/lib/contracts/evidence-ledger.ts'
      - 'src/lib/contracts/evidence-ledger.schema.json'
      - 'scripts/evidence-ledger.mjs'
      - 'scripts/test-evidence-ledger.mjs'
      - 'scripts/validate-evidence-ledger.mjs'
      - 'scripts/validate-generated-evidence.mjs'
      - '.github/workflows/phase-b-evidence.yml'

permissions:
  contents: read

jobs:
  evidence-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate evidence contract
        run: node --experimental-strip-types scripts/validate-evidence-ledger.mjs
      - name: Generate Evidence Ledger artifact
        env:
          EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT_ROOT: artifacts/contracts
          EVIDENCE_RECORDED_AT: ${{ github.run_started_at }}
        run: node --experimental-strip-types scripts/test-evidence-ledger.mjs
      - name: Validate generated evidence identity
        env:
          EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT_ROOT: artifacts/contracts
        run: node --experimental-strip-types scripts/validate-generated-evidence.mjs
      - name: Upload Evidence Ledger
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-b-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/contracts/
          if-no-files-found: error
          retention-days: 14
