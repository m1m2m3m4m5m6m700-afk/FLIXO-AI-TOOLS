name: Generate workspace lockfile

on:
  push:
    branches:
      - architecture/npm-workspaces-migration

permissions:
  contents: write
  actions: write

jobs:
  generate:
    if: ${{ github.ref_name == 'architecture/npm-workspaces-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate canonical workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove bootstrap workflow
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/_generate-workspace-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
            exit 0
          fi
          git commit -m "build(workspaces): regenerate canonical npm lockfile"
          git push origin "HEAD:$HEAD_BRANCH"
      - name: Trigger canonical CI on generated-lockfile commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: gh workflow run "FLIXO CI" --ref "$HEAD_BRANCH"
