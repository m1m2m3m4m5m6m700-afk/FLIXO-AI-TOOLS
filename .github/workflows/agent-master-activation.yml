name: FLIXO Master Agent Activation Relay

on:
  workflow_run:
    workflows:
      - FLIXO Test System
      - FLIXO WP0 Trust Baseline
      - FLIXO Test Impact
      - FLIXO Test Impact Execution
      - Repository Security Baseline
      - Claude Security Review
      - Daily·FLIXO Green Gate
      - FLIXO Auto Repair Bot
      - FLIXO Agent Repair Supervisor
      - Agent Recovery Gate
    types: [completed]
    branches: [execution, main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  checks: read

concurrency:
  group: flixo-master-agent-activation-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  activate:
    name: Record RED and wake repair supervision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.conclusion != 'skipped' &&
        github.event.workflow_run.name != 'FLIXO Master Agent Activation Relay'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Capture exact failure identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id || github.run_id }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          NAME="${{ github.event.workflow_run.name || 'manual-activation' }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion || 'manual' }}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,name,conclusion,headSha,headBranch,event,displayTitle,url > /tmp/run.json
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > /tmp/jobs.json
          else
            printf '%s\n' '{}' > /tmp/run.json
            printf '%s\n' 'MANUAL_ACTIVATION' > /tmp/failed.log
            printf '%s\n' '{"jobs":[]}' > /tmp/jobs.json
          fi

      - name: Append exact-SHA activation event to the master inbox
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          SHA: ${{ steps.identity.outputs.sha }}
          BRANCH: ${{ steps.identity.outputs.branch }}
          WORKFLOW_NAME: ${{ steps.identity.outputs.name }}
          CONCLUSION: ${{ steps.identity.outputs.conclusion }}
        run: |
          set -euo pipefail
          JOBS="$(jq -r '[.jobs[]? | [.name, .conclusion, .status] | @tsv] | .[]?' /tmp/jobs.json | head -n 25)"
          {
            echo "## ${WORKFLOW_NAME} — ${CONCLUSION}"
            echo
            echo "**Activation:** `MASTER_AGENT_ACTIVATION`"
            echo "**Run:** `${RUN_ID}`"
            echo "**Branch:** `${BRANCH}`"
            echo "**Exact SHA:** `${SHA}`"
            echo "**Conclusion:** `${CONCLUSION}`"
            echo
            echo "### Jobs"
            if [ -n "$JOBS" ]; then
              printf '%s\n' "$JOBS" | while IFS=$'\t' read -r name conclusion status; do
                echo "- `$name` — $conclusion / $status"
              done
            else
              echo "- No job data available."
            fi
            echo
            echo "### Required response"
            echo "Inspect the helper-agent change at this exact SHA. Identify whether the failure is caused by the change, repair the root cause yourself when necessary, update tests/contracts/memory so the helper agent learns, and continue until canonical GREEN. Do not treat this inbox event as a closure signal."
            echo
            echo "<!-- activation-run:${RUN_ID}:sha:${SHA} -->"
          } > /tmp/activation-comment.md
          gh issue comment 761 --repo "$GITHUB_REPOSITORY" --body-file /tmp/activation-comment.md

      - name: Wake autonomous repair supervision immediately for internal failures
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'execution' &&
          github.event.workflow_run.name != 'FLIXO Auto Repair Bot' &&
          github.event.workflow_run.name != 'FLIXO Agent Repair Supervisor' &&
          github.event.workflow_run.name != 'Daily·FLIXO Green Gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run agent-repair-supervisor.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'MASTER_AGENT_REPAIR_SUPERVISOR_WAKE=DISPATCHED'

      - name: Preserve activation evidence as artifact
        uses: actions/upload-artifact@v6
        with:
          name: flixo-master-agent-activation-${{ github.run_id }}
          path: |
            /tmp/run.json
            /tmp/jobs.json
            /tmp/failed.log
          if-no-files-found: warn
          retention-days: 14
