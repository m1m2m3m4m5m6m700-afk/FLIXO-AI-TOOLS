name: FLIXO Master Agent Activation Relay

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
    branches: [execution]

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: flixo-master-agent-activation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  activate:
    name: Record genuine canonical RED
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deduplicated RED activation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "execution"
          test -n "$SHA"
          MARKER="<!-- activation-run:${RUN_ID}:sha:${SHA} -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/759/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$MARKER"; then
            echo "MASTER_ACTIVATION_DEDUP=1"
            exit 0
          fi
          {
            echo "## FLIXO Test System — RED"
            echo
            echo "**Activation:** MASTER_AGENT_ACTIVATION"
            echo "**Run:** ${RUN_ID}"
            echo "**Branch:** ${BRANCH}"
            echo "**Exact SHA:** ${SHA}"
            echo
            echo "Diagnose the exact canonical failure, repair only its causal root, verify on a newer exact SHA, and return to canonical GREEN."
            echo
            echo "$MARKER"
          } > /tmp/activation-comment.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/759/comments" --raw-field body="$(cat /tmp/activation-comment.md)" >/dev/null

      - name: Dispatch canonical RED wake to Chief GPT runtime
        env:
          COUNCIL_RUNTIME_URL: https://zrpsmgdrtwzrhkjwwujo.supabase.co/functions/v1/flixo-council-runtime
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COUNCIL_RUNTIME_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          OIDC_RESPONSE="$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$COUNCIL_RUNTIME_URL")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          curl -fsS --max-time 15             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$(jq -nc               --arg messageId "github-red-$RUN_ID-$SHA"               --arg idempotencyKey "github-red-$RUN_ID-$SHA"               --arg taskId "GREEN-RECOVERY-001"               --arg workPackageId "ROOT-CAUSE-SPINE-001"               --arg entrySha "$SHA"               --arg sourceRun "$RUN_ID"               '{messageId:$messageId,idempotencyKey:$idempotencyKey,taskId:$taskId,workPackageId:$workPackageId,entrySha:$entrySha,requestedByAccountId:"SYSTEM",primaryAccountId:"CHIEF",fallbackAccountId:"CHIEF",source:"github-master-activation",payload:{workflowRunId:$sourceRun,reason:"canonical-red"}}')"             "${COUNCIL_RUNTIME_URL%/}?action=dispatch"
          echo "COUNCIL_CHIEF_WAKE=DISPATCHED"
