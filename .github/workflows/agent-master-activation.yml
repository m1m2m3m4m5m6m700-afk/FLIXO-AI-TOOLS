name: FLIXO Master Agent Activation Relay

on:
  workflow_run:
    workflows: ["FLIXO Test System"]
    types: [completed]
    branches: [execution]

permissions:
  contents: read
  actions: write
  checks: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: flixo-master-agent-activation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  activate:
    name: Record genuine canonical RED
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted activation controller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cancel stale workflow_run source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/assert-workflow-run-current.mjs
      - name: Revalidate canonical Test System source and live execution SHA
        env:
          GH_TOKEN: \${{ github.token }}
          RUN_ID: \${{ github.event.workflow_run.id }}
          EVENT_SHA: \${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          META="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(printf '%s' "$META" | jq -r '.name')" = "FLIXO Test System"
          test "$(printf '%s' "$META" | jq -r '.path')" = ".github/workflows/ci.yml"
          test "$(printf '%s' "$META" | jq -r '.head_branch')" = "execution"
          test "$(printf '%s' "$META" | jq -r '.head_sha')" = "$EVENT_SHA"
          test "$(printf '%s' "$META" | jq -r '.conclusion')" = "failure"
          LIVE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$LIVE_SHA" = "$EVENT_SHA"
          echo "MASTER_ACTIVATION_SOURCE=CANONICAL_TEST_SYSTEM"
          echo "MASTER_ACTIVATION_EXACT_SHA=$EVENT_SHA"

      - name: Deduplicated RED activation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "execution"
          test -n "$SHA"
          COUNCIL_PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          test -n "$COUNCIL_PR_NUMBER"
          MARKER="<!-- activation-run:${RUN_ID}:sha:${SHA} -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$MARKER"; then
            echo "MASTER_ACTIVATION_DEDUP=1"
            exit 0
          fi
          {
            echo "## FLIXO Test System — RED"
            echo
            echo "**Activation:** MASTER_AGENT_ACTIVATION"
            echo "**Run:** ${RUN_ID}"
            echo "**Branch:** ${BRANCH}"
            echo "**Exact SHA:** ${SHA}"
            echo
            echo "Diagnose the exact canonical failure, repair only its causal root, verify on a newer exact SHA, and return to canonical GREEN."
            echo
            echo "$MARKER"
          } > /tmp/activation-comment.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments" --raw-field body="$(cat /tmp/activation-comment.md)" >/dev/null

      - name: Dispatch canonical RED wake to Chief GPT runtime
        env:
          COUNCIL_RUNTIME_URL: https://zrpsmgdrtwzrhkjwwujo.supabase.co/functions/v1/flixo-council-runtime
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -u
          test -n "$COUNCIL_RUNTIME_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"

          council_rc=0
          OIDC_RESPONSE="$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$COUNCIL_RUNTIME_URL")" || council_rc=$?
          if [ "$council_rc" -eq 0 ]; then
            OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')"
            if [ -n "$OIDC_TOKEN" ]; then
              curl -fsS --max-time 15 \
                -X POST \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -nc \
                  --arg messageId "github-red-$RUN_ID-$SHA" \
                  --arg idempotencyKey "github-red-$RUN_ID-$SHA" \
                  --arg taskId "GREEN-RECOVERY-001" \
                  --arg workPackageId "ROOT-CAUSE-SPINE-001" \
                  --arg entrySha "$SHA" \
                  --arg sourceRun "$RUN_ID" \
                  '{messageId:$messageId,idempotencyKey:$idempotencyKey,taskId:$taskId,workPackageId:$workPackageId,entrySha:$entrySha,requestedByAccountId:"SYSTEM",primaryAccountId:"CHIEF",fallbackAccountId:"CHIEF",source:"github-master-activation",payload:{workflowRunId:$sourceRun,reason:"canonical-red"}}')" \
                "${COUNCIL_RUNTIME_URL%/}?action=dispatch" || council_rc=$?
            else
              council_rc=1
            fi
          fi

          if [ "$council_rc" -eq 0 ]; then
            echo "COUNCIL_CHIEF_WAKE=DISPATCHED"
            exit 0
          fi

          echo "COUNCIL_CHIEF_WAKE=UNAVAILABLE rc=$council_rc"
          echo "CANONICAL_REPAIR_FALLBACK=GREEN_GATE"
          active_in_progress="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flixo-green-gate.yml/runs?branch=main&status=in_progress&per_page=20" --jq '.total_count')"
          active_queued="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flixo-green-gate.yml/runs?branch=main&status=queued&per_page=20" --jq '.total_count')"
          if [ "$active_in_progress" -gt 0 ] || [ "$active_queued" -gt 0 ]; then
            echo "GREEN_GATE_FALLBACK=NOOP_ACTIVE"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flixo-green-gate.yml/dispatches" -f ref=main
          echo "GREEN_GATE_FALLBACK=DISPATCHED"
