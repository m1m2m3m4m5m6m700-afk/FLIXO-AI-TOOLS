name: FLIXO Advanced Repair Contract

on:
  pull_request:
concurrency:
  group: flixo-latest-test-advanced-repair-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packet-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Fetch canonical main base ref
        run: git fetch --no-tags --depth=1 origin main:refs/heads/main
      - name: Fail closed when this commit is superseded
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: node scripts/ci/assert-current-commit.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Bind validation workspace to canonical execution branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git switch --create execution "$EXPECTED_SHA"
          test "$(git branch --show-current)" = execution
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate packet validator syntax
        run: node --check scripts/ci/validate-advanced-repair-packet.mjs
      - name: Run positive and negative contract tests
        run: node scripts/ci/test-advanced-repair-packet-validator.mjs
      - name: Validate Chair push guard syntax
        run: node --check scripts/ci/chair-push-guard.mjs
      - name: Validate agent chair lifecycle syntax
        run: |
          node --check scripts/ci/chair-bound-execution.mjs
          node --check scripts/ci/chair-push-guard.mjs
          node --check scripts/ci/agent-session.mjs
          node --check scripts/ci/agent-coordination.mjs
      - name: Run Chair fencing and push proposal regression tests
        run: node scripts/ci/test-chair-bound-execution.mjs
      - name: Validate Repair Agent learning fail-closed contract
        run: |
          set -euo pipefail
          node --check scripts/ci/auto-repair-learning.mjs
          node scripts/ci/test-auto-repair-learning.mjs

      - name: Validate Auto Repair Chair-1 audit syntax and regression
        run: |
          node --check scripts/ci/auto-repair-chair1-audit.mjs
          node scripts/ci/test-auto-repair-chair1-audit.mjs
      - name: Run end-to-end agent chair admission regression
        run: node scripts/ci/test-agent-chair-lifecycle.mjs
      - name: Run execution mutation gate regression tests
        run: node scripts/ci/test-execution-mutation-gate.mjs
      - name: Run repair protocol chair-admission regression tests
        run: node scripts/ci/test-repair-protocol.mjs
      - name: Validate the complete auto-repair mutation boundary
        run: node scripts/ci/validate-auto-repair-boundary.mjs
      - name: Validate latest-commit-only supersession and immutable rerun lock
        run: node scripts/ci/test-latest-commit-rerun-lock.mjs

      - name: Validate strict Chair-1 central boundary
        run: node scripts/ci/test-strict-chair-boundary.mjs
      - name: Run Chair-1 central lease adversarial attack matrix
        run: node scripts/ci/test-chair1-central-lease-adversarial.mjs
      - name: Validate strict push detail guard
        run: node scripts/ci/test-chair-push-guard-strict.mjs
      - name: Validate Repair Agent cognitive clone and adversarial convergence
        run: |
          set -euo pipefail
          node --check scripts/ci/repair-agent-cognitive-clone.mjs
          node scripts/ci/test-repair-agent-cognitive-clone.mjs
          node --check scripts/ci/repair-adversarial-convergence.mjs
          node scripts/ci/test-repair-adversarial-convergence.mjs
      - name: Validate Master Repair 20X Governor
        run: |
          set -euo pipefail
          node --check scripts/ci/patch-truth-engine.mjs
          node --check scripts/ci/master-repair-governor.mjs
          node --check scripts/ci/master-repair-canary.mjs
          node --check scripts/ci/master-repair-rollback-proof.mjs
          node --check scripts/ci/master-repair-historical-replay.mjs
          node --check scripts/ci/master-repair-negative-proof.mjs
          node scripts/ci/test-patch-truth-engine.mjs
          node scripts/ci/test-master-repair-governor.mjs
          node scripts/ci/master-repair-negative-proof.mjs
          test -s docs/agents/master-repair-20x-contract.json

      - name: Validate no direct push boundary
        run: node scripts/ci/validate-no-direct-push.mjs
      - name: Run 100-worker atomic lease race without GitHub write permission
        run: node scripts/ci/test-repair-lease-live-race.mjs
