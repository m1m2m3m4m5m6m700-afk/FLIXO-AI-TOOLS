name: FLIXO Agent Communication Relay

on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  group: flixo-agent-communication-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  receive:
    name: Immediate agent message receive
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body != '' && (github.event.comment.author_association == 'OWNER' || github.event.comment.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted communication implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # This workflow has actions:write and id-token:write. Execute only trusted controller code from main.
          # The live execution SHA is evidence data, never executable source.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind relay to current exact execution SHA
        id: relay_head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMENT_ID" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid comment id'; exit 1 ;;
          esac
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          CONTROLLER_SHA="$(git rev-parse HEAD)"
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "controller_sha=$CONTROLLER_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical Council ingress
        id: council_ingress
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ISSUE_NUMBER" ]; then
            PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ISSUE_NUMBER")"
            test "$(printf '%s' "$PR_JSON" | jq -r '.state // empty')" = open
            test "$(printf '%s' "$PR_JSON" | jq -r '.head.ref // empty')" = execution
            test "$(printf '%s' "$PR_JSON" | jq -r '.base.ref // empty')" = main
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUE_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          test -n "$ISSUE_NUMBER"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Extract President Wake when present
        id: president_wake
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body || '', '<!-- FLIXO_AGENT_COUNCIL_WAKE -->')
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT_BODY" > /tmp/council-wake-comment.md
          echo 'wake=true' >> "$GITHUB_OUTPUT"

      - name: Resolve current execution SHA for President Wake
        id: president_head
        if: steps.president_wake.outputs.wake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build President Wake plan
        id: president_plan
        if: steps.president_wake.outputs.wake == 'true'
        env:
          CURRENT_SHA: ${{ steps.president_head.outputs.sha }}
          RELAY_SHA: ${{ steps.relay_head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELAY_SHA" = "$CURRENT_SHA"
          node scripts/ci/council-wake-dispatch.mjs             --comment-file=/tmp/council-wake-comment.md             --current-execution-sha="$CURRENT_SHA"             --repository="$GITHUB_REPOSITORY" > /tmp/council-wake-plan.json
          jq -r '"mode=" + .mode + "\nrole=" + .role + "\nworkflow=" + (.workflow // "") + "\nworkPackage=" + .workPackageId + "\nentrySha=" + .entrySha' /tmp/council-wake-plan.json >> "$GITHUB_OUTPUT"

      - name: Check President Wake idempotency
        id: president_duplicate
        if: steps.president_wake.outputs.wake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COUNCIL_PR_NUMBER: ${{ steps.council_ingress.outputs.issue_number }}
          TARGET_REF: ${{ steps.target.outputs.target_ref }}
          TARGET_MESSAGE_SHA: ${{ steps.target.outputs.message_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMENT_ID" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid comment id'; exit 1 ;;
          esac
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          RECEIPT="<!-- FLIXO_COUNCIL_WAKE_RECEIPT:$COMMENT_ID -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$RECEIPT"; then
            echo 'duplicate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'duplicate=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch President Wake workflow
        if: steps.president_wake.outputs.wake == 'true' && steps.president_duplicate.outputs.duplicate != 'true' && steps.president_plan.outputs.mode == 'WORKFLOW_DISPATCH'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.president_plan.outputs.workflow }}
          ENTRY_SHA: ${{ steps.president_plan.outputs.entrySha }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$WORKFLOW" in
            council-priority-wake.yml)
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref execution \
                -f "entry_sha=$ENTRY_SHA" \
                -f "request_id=president-$COMMENT_ID" \
                -f "source_comment_id=$COMMENT_ID" \
                -f "question=$COMMENT_BODY"
              ;;
            ultra-investigator.yml)
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref execution -f "expected_sha=$ENTRY_SHA"
              ;;
            code-read-only-scout.yml|test-matrix-contract.yml|repository-security-baseline.yml|root-cause-diagnostics.yml)
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref execution
              ;;
            *)
              echo "FAIL CLOSED: unsupported President Wake workflow=$WORKFLOW"
              exit 1
              ;;
          esac

      - name: Acknowledge President Wake
        if: steps.president_wake.outputs.wake == 'true' && steps.president_duplicate.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ steps.president_plan.outputs.role }}
          MODE: ${{ steps.president_plan.outputs.mode }}
          WORKPACKAGE: ${{ steps.president_plan.outputs.workPackage }}
          ENTRY_SHA: ${{ steps.president_plan.outputs.entrySha }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COUNCIL_PR_NUMBER: ${{ steps.council_ingress.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMENT_ID" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid comment id'; exit 1 ;;
          esac
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          BODY="$(printf '%s\n' "### PRESIDENT WAKE RECEIPT" "" "**Role:** $ROLE" "**Mode:** $MODE" "**Work Package:** $WORKPACKAGE" "**Exact SHA:** $ENTRY_SHA" "" "Wake accepted through the canonical communication relay. Workflow dispatch remains subject to exact-SHA and role controls." "" "<!-- FLIXO_COUNCIL_WAKE_RECEIPT:$COMMENT_ID -->")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments" --raw-field body="$BODY" >/dev/null

      - name: Detect P0 Council question / request
        id: council_question
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (contains(github.event.comment.body || '', '### COUNCIL QUESTION') ||
           contains(github.event.comment.body || '', '<!-- FLIXO_COUNCIL_PRIORITY -->'))
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test ${#COMMENT_BODY} -le 30000
          echo 'priority=p0' >> "$GITHUB_OUTPUT"
          {
            echo 'question<<EOF'
            printf '%s\n' "$COMMENT_BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch P0 Council question immediately
        if: steps.council_question.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          QUESTION: ${{ steps.council_question.outputs.question }}
          COUNCIL_PR_NUMBER: ${{ steps.council_ingress.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run council-priority-wake.yml --repo "$GITHUB_REPOSITORY" --ref execution \
            -f "entry_sha=$SHA" \
            -f "request_id=council-question-${COMMENT_ID}" \
            -f "source_comment_id=$COMMENT_ID" \
            -f "question=$QUESTION"

      - name: Extract and validate incoming message
        id: message
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = process.env.COMMENT_BODY || '';
          const manual = process.env.MANUAL_MESSAGE_JSON || '';
          const marker = '<!-- FLIXO_AGENT_MESSAGE -->';
          const fence = '\`\`\`json';
          const start = body.indexOf(marker);
          const fenceStart = start >= 0 ? body.indexOf(fence, start) : -1;
          const payloadStart = fenceStart >= 0 ? fenceStart + fence.length : -1;
          const fenceEnd = payloadStart >= 0 ? body.indexOf('\`\`\`', payloadStart) : -1;
          const match = payloadStart >= 0 && fenceEnd >= 0
            ? body.slice(payloadStart, fenceEnd).trim()
            : null;
          if (!match) {
            fs.writeFileSync('/tmp/flixo-agent-message-skip', 'NO_CANONICAL_AGENT_MESSAGE\\n');
            process.exit(0);
          }
          const message = JSON.parse(match);
          fs.writeFileSync('message.json', JSON.stringify(message, null, 2) + '\\n');
          if (!message.messageId) throw new Error('AGENT_MESSAGE_ID_MISSING');
          process.stdout.write('MESSAGE_ID=' + message.messageId + '\\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'MESSAGE_ID=' + message.messageId + '\\n');
          NODE

      - name: Resolve message branch by exact SHA
        id: target
        if: steps.message.outcome == 'success' && hashFiles('message.json') != ''
        run: |
          set -euo pipefail
          git fetch --no-tags origin main execution
          MESSAGE_SHA="$(node -e "const x=require('./message.json'); process.stdout.write(x.entrySha)")"
          MAIN_SHA="$(git rev-parse origin/main)"
          EXECUTION_SHA="$(git rev-parse origin/execution)"
          case "$MESSAGE_SHA" in
            "$MAIN_SHA") TARGET_REF=main ;;
            "$EXECUTION_SHA") TARGET_REF=execution ;;
            *) TARGET_REF='' ;;
          esac
          if [ -z "$TARGET_REF" ]; then
            echo "MESSAGE_TARGET_SHA_STALE=$MESSAGE_SHA"
            echo 'status=STALE' >> "$GITHUB_OUTPUT"
          else
            # Never switch the privileged runner to event-controlled execution code.
            # TARGET_REF is provenance metadata only; executable communication code remains from trusted main.
            echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
            echo "status=READY" >> "$GITHUB_OUTPUT"
          fi
          echo "message_sha=$MESSAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check durable master-inbox idempotency
        id: duplicate
        if: steps.message.outcome == 'success' && hashFiles('message.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.message.outputs.MESSAGE_ID }}
          COUNCIL_PR_NUMBER: ${{ steps.council_ingress.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          RECEIPT="<!-- FLIXO_AGENT_MESSAGE_RECEIPT:$MESSAGE_ID -->"
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          if gh api "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$RECEIPT"; then
            echo 'duplicate=true' >> "$GITHUB_OUTPUT"
            echo 'DUPLICATE_AGENT_MESSAGE=NO_OP'
          else
            echo 'duplicate=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest incoming message immediately
        id: ingest
        if: steps.target.outputs.status == 'READY' && steps.duplicate.outputs.duplicate != 'true' && hashFiles('message.json') != ''
        run: |
          set -euo pipefail
          node scripts/ci/agent-communication.mjs validate --message-file=message.json
          node scripts/ci/agent-communication.mjs ingest --message-file=message.json | tee /tmp/flixo-agent-message-receipt.json
          jq -r '"MESSAGE_STATUS=" + .status + "\\nMESSAGE_ID=" + .messageId + "\\nMESSAGE_ENTRY_SHA=" + .entrySha + "\\nMESSAGE_IDEMPOTENCY_KEY=" + .idempotencyKey' /tmp/flixo-agent-message-receipt.json >> "$GITHUB_OUTPUT"

      - name: Build canonical invocation envelope
        id: invocation
        if: steps.ingest.outcome == 'success' && hashFiles('message.json') != ''
        env:
          ENTRY_SHA: ${{ steps.ingest.outputs.MESSAGE_ENTRY_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/invocation-contract.mjs build --message-file=message.json --current-sha="$ENTRY_SHA" --output=/tmp/flixo-invocation.json | tee /tmp/flixo-invocation-console.json
          jq -r '"INVOCATION_ID=" + .invocationId + "\nINVOCATION_STATE=" + .state + "\nINVOCATION_FAILURE_FINGERPRINT=" + .failureFingerprint + "\nINVOCATION_ATTEMPT=" + (.attempt|tostring) + "\nINVOCATION_LEASE_EPOCH=" + (.leaseEpoch|tostring)' /tmp/flixo-invocation.json >> "$GITHUB_OUTPUT"

      - name: Dispatch administrative message to canonical Council runtime
        id: runtime_dispatch
        if: steps.ingest.outcome == 'success' && hashFiles('message.json') != '' && contains(github.event.comment.body || '', '"administrativeInstruction"')
        env:
          ENTRY_SHA: ${{ steps.ingest.outputs.MESSAGE_ENTRY_SHA }}
          MESSAGE_ID: ${{ steps.ingest.outputs.MESSAGE_ID }}
          MESSAGE_KEY: ${{ steps.ingest.outputs.MESSAGE_IDEMPOTENCY_KEY }}
          TASK_ID: ${{ steps.ingest.outputs.MESSAGE_ID }}
          INVOCATION_ID: ${{ steps.invocation.outputs.INVOCATION_ID }}
          FAILURE_FINGERPRINT: ${{ steps.invocation.outputs.INVOCATION_FAILURE_FINGERPRINT }}
          ATTEMPT: ${{ steps.invocation.outputs.INVOCATION_ATTEMPT }}
          LEASE_EPOCH: ${{ steps.invocation.outputs.INVOCATION_LEASE_EPOCH }}
          RUNTIME_URL: https://zrpsmgdrtwzrhkjwwujo.supabase.co/functions/v1/flixo-council-runtime
        shell: bash
        run: |
          set -euo pipefail
          RECIPIENT_MASTER="$(jq -r '.payload.recipientMaster // empty' message.json)"
          TOP_RECIPIENT="$(jq -r '.recipient // empty' message.json)"
          IS_PEER="$(jq -r '(.payload.masterPeerMessage // .payload.peerMessage // false)' message.json)"
          SENDER_MASTER="$(jq -r '.payload.senderMaster // empty' message.json)"

          if [ -z "$RECIPIENT_MASTER" ] && [ "$TOP_RECIPIENT" != "MASTERS" ] && [ "$IS_PEER" != "true" ]; then
            echo 'RUNTIME_DISPATCH=NOT_APPLICABLE_FOR_NON_MASTER_AGENT_BROADCAST'
            exit 0
          fi

          OIDC_RESPONSE="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNTIME_URL")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          if [ "$IS_PEER" = "true" ]; then
            test -n "$SENDER_MASTER"
            case "$SENDER_MASTER" in MASTER-1|MASTER-2|MASTER-3) ;; *) echo "FAIL CLOSED: unknown senderMaster=$SENDER_MASTER"; exit 1 ;; esac
          fi

          if [ "$RECIPIENT_MASTER" = "MASTERS" ] || [ "$TOP_RECIPIENT" = "MASTERS" ]; then
            mapfile -t DELIVERY_MASTERS < <(jq -r --arg sender "$SENDER_MASTER" 'if ((.payload.requiredRecipients // []) | length) > 0 then .payload.requiredRecipients[]? | select(. != $sender) else "MASTER-1","MASTER-2","MASTER-3" end' message.json)
          else
            DELIVERY_MASTERS=("$RECIPIENT_MASTER")
          fi
          test "${#DELIVERY_MASTERS[@]}" -gt 0

          : > /tmp/council-runtime-dispatch-ids.txt
          : > /tmp/council-runtime-dispatches.jsonl

          for DELIVERY_MASTER in "${DELIVERY_MASTERS[@]}"; do
            case "$DELIVERY_MASTER" in
              MASTER-1) PRIMARY_ACCOUNT=CHIEF; FALLBACK_ACCOUNT=CHIEF ;;
              MASTER-2) PRIMARY_ACCOUNT=WORKER_A; FALLBACK_ACCOUNT=WORKER_B ;;
              MASTER-3) PRIMARY_ACCOUNT=WORKER_B; FALLBACK_ACCOUNT=WORKER_A ;;
              *) echo "FAIL CLOSED: unknown delivery master=$DELIVERY_MASTER"; exit 1 ;;
            esac

            DELIVERY_ID="${MESSAGE_ID}:${DELIVERY_MASTER}"
            DELIVERY_KEY="${MESSAGE_KEY}:${DELIVERY_MASTER}"
            DELIVERY_TASK_ID="${TASK_ID}:${DELIVERY_MASTER}"
            WORK_PACKAGE="ADMIN-COMMUNICATION-${MESSAGE_ID}-${DELIVERY_MASTER}"

            jq -n               --arg messageId "$DELIVERY_ID"               --arg idempotencyKey "$DELIVERY_KEY"               --arg taskId "$DELIVERY_TASK_ID"               --arg workPackageId "$WORK_PACKAGE"               --arg entrySha "$ENTRY_SHA"               --arg invocationId "$INVOCATION_ID"               --arg failureFingerprint "$FAILURE_FINGERPRINT"               --arg attempt "$ATTEMPT"               --arg leaseEpoch "$LEASE_EPOCH"               --arg primary "$PRIMARY_ACCOUNT"               --arg fallback "$FALLBACK_ACCOUNT"               --arg deliveryMaster "$DELIVERY_MASTER"               --arg canonicalRecipientMaster "$RECIPIENT_MASTER"               --slurpfile message message.json               '{messageId:$messageId,idempotencyKey:$idempotencyKey,taskId:$taskId,workPackageId:$workPackageId,entrySha:$entrySha,requestedByAccountId:"SYSTEM",primaryAccountId:$primary,fallbackAccountId:$fallback,source:"agent-communication-relay",payload:{administrativeInstruction:true,administrativeBroadcast:(($message[0].payload.masterPeerMessage // $message[0].payload.peerMessage // false)|not),canonicalMessageId:($message[0].messageId // $messageId),canonicalRecipientMaster:$canonicalRecipientMaster,exactSha:$entrySha,actor:($message[0].actor // null),recipient:($message[0].recipient // null),intent:($message[0].intent // null),priority:($message[0].priority // null),councilOperation:($message[0].councilOperation // false),masterPeerMessage:($message[0].payload.peerMessage // false),automaticDelivery:($message[0].payload.automaticDelivery // false),conversationId:($message[0].payload.conversationId // null),replyToMessageId:($message[0].payload.replyToMessageId // null),senderMaster:($message[0].payload.senderMaster // null),recipientMaster:$deliveryMaster,messageText:($message[0].payload.messageText // null),invocation:{invocationId:$invocationId,failureFingerprint:$failureFingerprint,attempt:($attempt|tonumber),leaseEpoch:($leaseEpoch|tonumber),targetSha:$entrySha,state:"DISPATCHED"}}' > /tmp/council-runtime-dispatch.json

            curl -fsSL               -H "Authorization: Bearer $OIDC_TOKEN"               -H "Content-Type: application/json"               -X POST "$RUNTIME_URL?action=dispatch"               --data-binary @/tmp/council-runtime-dispatch.json               | tee /tmp/council-runtime-dispatch-response.json

            jq -e '.ok == true and .entrySha == $sha' --arg sha "$ENTRY_SHA" /tmp/council-runtime-dispatch-response.json >/dev/null
            jq -r '.dispatchId' /tmp/council-runtime-dispatch-response.json >> /tmp/council-runtime-dispatch-ids.txt
            jq -c '{dispatchId,status,entrySha,primaryAccountId,fallbackAccountId,push}' /tmp/council-runtime-dispatch-response.json >> /tmp/council-runtime-dispatches.jsonl
          done

          test -s /tmp/council-runtime-dispatch-ids.txt
          RUNTIME_DISPATCH_IDS="$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/council-runtime-dispatch-ids.txt)"
          echo "RUNTIME_DISPATCH_IDS=$RUNTIME_DISPATCH_IDS" >> "$GITHUB_OUTPUT"
          cat /tmp/council-runtime-dispatches.jsonl >> /tmp/council-runtime-dispatch-response.json

      - name: Publish immediate receipt to master inbox
        if: steps.ingest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.ingest.outputs.MESSAGE_ID }}
          MESSAGE_STATUS: ${{ steps.ingest.outputs.MESSAGE_STATUS }}
          MESSAGE_SHA: ${{ steps.ingest.outputs.MESSAGE_ENTRY_SHA }}
          MESSAGE_KEY: ${{ steps.ingest.outputs.MESSAGE_IDEMPOTENCY_KEY }}
          INVOCATION_ID: ${{ steps.invocation.outputs.INVOCATION_ID }}
          COUNCIL_PR_NUMBER: ${{ steps.council_ingress.outputs.issue_number }}
        run: |
          set -euo pipefail
          case "$COUNCIL_PR_NUMBER" in
            ''|*[!0-9]*) echo 'FAIL CLOSED: invalid canonical PR number'; exit 1 ;;
          esac
          BODY="$(printf '%s\n' "### AGENT MESSAGE RECEIVED" "" "**Message:** $MESSAGE_ID" "**Status:** $MESSAGE_STATUS" "**Entry SHA:** $MESSAGE_SHA" "**Idempotency Key:** $MESSAGE_KEY" "**Invocation:** $INVOCATION_ID" "" "**Receipt:** IMMEDIATE_EVENT_RECEIPT" "**Target ref:** $TARGET_REF" "" "The message has entered the canonical agent communication inbox. No execution authority is granted by receipt; the target agent must read, revalidate the exact SHA, acquire coordination ownership, and only then execute." "" "<!-- FLIXO_AGENT_MESSAGE_RECEIPT:$MESSAGE_ID -->")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$COUNCIL_PR_NUMBER/comments" --raw-field body="$BODY" >/dev/null

      - name: Wake repair supervision for repair-class messages
        if: >-
          steps.ingest.outcome == 'success' &&
          (
            contains(toJSON(github.event.comment.body || ''), 'REPAIR') ||
            contains(toJSON(github.event.comment.body || ''), 'FAILURE') ||
            contains(toJSON(github.event.comment.body || ''), 'RED')
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run agent-repair-supervisor.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'AGENT_MESSAGE_REPAIR_WAKE=DISPATCHED'

      - name: Record stale-message evidence
        if: steps.target.outputs.status == 'STALE'
        run: |
          set -euo pipefail
          printf '%s\n' 'MESSAGE_STALE=FAIL_CLOSED' > /tmp/flixo-agent-message-stale.txt
          printf '%s\n' "ENTRY_SHA=$TARGET_MESSAGE_SHA" >> /tmp/flixo-agent-message-stale.txt

      - name: Preserve communication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-agent-message-${{ github.run_id }}
          path: |
            message.json
            /tmp/flixo-agent-message-receipt.json
            /tmp/flixo-agent-message-skip
            /tmp/flixo-agent-message-stale.txt
          if-no-files-found: ignore
          retention-days: 30
