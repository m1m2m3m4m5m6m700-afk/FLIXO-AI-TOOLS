name: Localization — 20 Locale Gate
# Strict multi-surface localization enforcement: every locale remains required.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/localization-runtime.spec.ts'
      - 'scripts/validate-language-quality*.mjs'
      - 'scripts/validate-locale-contract.mjs'
      - 'scripts/validate-localization-complete.mjs'
      - 'scripts/validation-utils.mjs'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/localization-20.yml'
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'seo/**'
      - 'ci/**'
      - 'refactor/**'
      - 's3-**'
  workflow_dispatch:

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

concurrency:
  group: localization-20-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  locale:
    name: Localization Static — ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        locale:
          - en
          - ar
          - es
          - fr
          - de
          - ru
          - zh
          - hi
          - id
          - ur
          - ja
          - pt
          - it
          - ko
          - nl
          - pl
          - tr
          - vi
          - th
          - sv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate translation contract
        env:
          FLIXO_LOCALE: ${{ matrix.locale }}
        run: node scripts/validate-locale-contract.mjs
      - name: Strict localization release engine
        env:
          FLIXO_LOCALE: ${{ matrix.locale }}
        run: npm run verify:i18n -- --strict --report

  runtime:
    name: Localization Runtime — ${{ matrix.locale }} — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        locale:
          - en
          - ar
          - es
          - fr
          - de
          - ru
          - zh
          - hi
          - id
          - ur
          - ja
          - pt
          - it
          - ko
          - nl
          - pl
          - tr
          - vi
          - th
          - sv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Render and verify locale
        env:
          FLIXO_TEST_LOCALE: ${{ matrix.locale }}
        run: npx playwright test tests/localization-runtime.spec.ts --project=chromium --grep "representative tool runtime is localized for ${{ matrix.locale }}"

  aggregate:
    name: Localization — 20 Locale Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [locale, runtime]
    steps:
      - name: Enforce all 20 locale checks
        shell: bash
        run: |
          if [[ "${{ needs.locale.result }}" != "success" ]]; then
            echo "Localization — 20 Locale Gate FAILED: at least one static locale check failed."
            exit 1
          fi
          if [[ "${{ needs.runtime.result }}" != "success" ]]; then
            echo "Localization — 20 Locale Gate FAILED: at least one rendered runtime locale check failed."
            exit 1
          fi
          echo "Localization — 20 Locale Gate PASSED: all 20 static and rendered runtime locale checks executed and passed."
