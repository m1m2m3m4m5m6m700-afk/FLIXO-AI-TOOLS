name: Localization — 20 Locale Gate
# Strict multi-surface localization enforcement: PR + main only; no feature-branch replay.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/localization-runtime.spec.ts'
      - 'scripts/validate-language-quality*.mjs'
      - 'scripts/validate-locale-contract.mjs'
      - 'scripts/validate-localization-complete.mjs'
      - 'scripts/validation-utils.mjs'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/localization-20.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: localization-20-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  locale:
    name: Localization — ${{ matrix.locale }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, ar, es, fr, de, ru, zh, hi, id, ur, ja, pt, it, ko, nl, pl, tr, vi, th, sv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate ${{ matrix.locale }} translation contract
        env:
          FLIXO_LOCALE: ${{ matrix.locale }}
        run: node scripts/validate-locale-contract.mjs
      - name: Strict ${{ matrix.locale }} localization release engine
        env:
          FLIXO_LOCALE: ${{ matrix.locale }}
        run: npm run verify:i18n -- --strict --report

  runtime:
    name: Localization Runtime — ${{ matrix.locale }} — Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, ar, es, fr, de, ru, zh, hi, id, ur, ja, pt, it, ko, nl, pl, tr, vi, th, sv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render and verify ${{ matrix.locale }} runtime
        env:
          FLIXO_TEST_LOCALE: ${{ matrix.locale }}
        run: npx playwright test tests/localization-runtime.spec.ts --project=chromium --grep "representative tool runtime is localized for ${{ matrix.locale }}"

  aggregate:
    name: Localization — 20 Locale Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [locale, runtime]
    steps:
      - name: Enforce all 20 locale checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.locale.result }}" != "success" ]]; then
            echo "Localization — 20 Locale Gate FAILED: at least one static locale test failed."
            exit 1
          fi
          if [[ "${{ needs.runtime.result }}" != "success" ]]; then
            echo "Localization — 20 Locale Gate FAILED: at least one rendered runtime locale test failed."
            exit 1
          fi
          echo "Localization — 20 Locale Gate PASSED: all 20 static and rendered runtime locale checks are green."
