name: G4 — Localization + SEO Matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: g4-localization-seo-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  g4:
    name: G4 Universal Localization & SEO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Strict G4 static localization and SEO certification
        run: node scripts/test-g4-localization-static.mjs

      - name: Build canonical production artifacts
        run: npm run build

      - name: Start isolated production preview
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/g4-server.log 2>&1 &
          echo $! >/tmp/g4-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/g4-server.log || true
          exit 1

      - name: G4 all-public-route runtime matrix — 20 locales
        env:
          S4_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/g4-localization-seo.spec.ts --project=chromium --workers=6 --retries=0

      - name: Stop isolated production preview
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/g4-server.pid ]; then
            PID="$(cat /tmp/g4-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' )"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ] && kill -0 "$PID" 2>/dev/null; then
              kill -- -"$PGID" 2>/dev/null || true
            fi
          fi
          cat /tmp/g4-server.log 2>/dev/null || true

      - name: Final G4 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g4-localization-seo-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/g4-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: G4 certification
        run: echo 'G4 PASS: 20 locales × every public sitemap route × runtime UI/SEO/accessibility certification.'
