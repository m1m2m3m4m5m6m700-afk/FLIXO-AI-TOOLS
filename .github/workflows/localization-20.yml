name: Localization — 20 Locale Gate
# Strict multi-surface localization enforcement: every locale remains required.
# Ten parallel jobs each execute exactly two locales across BOTH static and runtime checks.
# All 40 required checks remain present; only runner/setup duplication is reduced.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/localization-runtime.spec.ts'
      - 'scripts/validate-language-quality*.mjs'
      - 'scripts/validate-locale-contract.mjs'
      - 'scripts/validate-localization-complete.mjs'
      - 'scripts/validation-utils.mjs'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/localization-20.yml'
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'seo/**'
      - 'ci/**'
      - 'refactor/**'
      - 's3-**'
  workflow_dispatch:

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

concurrency:
  group: localization-20-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  locale:
    name: Localization — shard ${{ matrix.shard }}/10
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - shard: 1
            locales: 'en ar'
          - shard: 2
            locales: 'es fr'
          - shard: 3
            locales: 'de ru'
          - shard: 4
            locales: 'zh hi'
          - shard: 5
            locales: 'id ur'
          - shard: 6
            locales: 'ja pt'
          - shard: 7
            locales: 'it ko'
          - shard: 8
            locales: 'nl pl'
          - shard: 9
            locales: 'tr vi'
          - shard: 10
            locales: 'th sv'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright once per shard
        run: |
          npx playwright install-deps chromium
          npx playwright install chromium
      - name: Execute every static and runtime locale check
        shell: bash
        env:
          FLIXO_LOCALES: ${{ matrix.locales }}
        run: |
          set +e
          failures=0
          executed=0
          mkdir -p diagnostics/localization
          for locale in $FLIXO_LOCALES; do
            executed=$((executed + 1))
            echo "===== STATIC LOCALE: $locale ====="
            FLIXO_LOCALE="$locale" node scripts/validate-locale-contract.mjs > "diagnostics/localization/${locale}-contract.log" 2>&1
            contract_status=$?
            cat "diagnostics/localization/${locale}-contract.log"

            FLIXO_LOCALE="$locale" npm run verify:i18n -- --strict --report > "diagnostics/localization/${locale}-quality.log" 2>&1
            quality_status=$?
            cat "diagnostics/localization/${locale}-quality.log"

            echo "===== RUNTIME LOCALE: $locale ====="
            FLIXO_TEST_LOCALE="$locale" npx playwright test tests/localization-runtime.spec.ts --project=chromium --grep "representative tool runtime is localized for $locale" > "diagnostics/localization/${locale}-runtime.log" 2>&1
            runtime_status=$?
            cat "diagnostics/localization/${locale}-runtime.log"

            printf '%s contract=%s quality=%s runtime=%s\n' "$locale" "$contract_status" "$quality_status" "$runtime_status" >> diagnostics/localization/summary.txt
            if [[ $contract_status -ne 0 || $quality_status -ne 0 || $runtime_status -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          done
          cat diagnostics/localization/summary.txt
          if [[ $executed -ne 2 ]]; then
            echo "Localization shard FAIL: expected exactly 2 locales, executed $executed."
            exit 1
          fi
          if [[ $failures -ne 0 ]]; then
            echo "Localization shard FAIL: $failures locale(s) had failures."
            exit 1
          fi
          echo "Localization shard PASS: both locales completed all static and runtime checks."
      - name: Upload locale diagnostics
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: localization-shard-${{ matrix.shard }}
          path: |
            diagnostics/localization/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    name: Localization — 20 Locale Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [locale]
    steps:
      - name: Enforce all 10 required locale shards
        shell: bash
        run: |
          if [[ "${{ needs.locale.result }}" != "success" ]]; then
            echo "Localization — 20 Locale Gate FAILED: one or more required locale shards failed."
            exit 1
          fi
          echo "Localization — 20 Locale Gate PASSED: all 20 locales executed both static and rendered runtime checks."
