name: One-time SPA Lockfile Refresh

on:
  push:
    branches:
      - fix/ci-exact-head-certification-2026-08-26

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: regenerate SPA lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          ! grep -Eiq '@tanstack/react-start|@tanstack/router-plugin|(^|[\"/])nitro([\"/]|:)' package-lock.json
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-refresh-spa-lockfile.yml
          git add package-lock.json .github/workflows/one-time-refresh-spa-lockfile.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes and workflow already absent.'
            exit 0
          fi
          git commit -m 'chore: regenerate SPA lockfile'
          git push