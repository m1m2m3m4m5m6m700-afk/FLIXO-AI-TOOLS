name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Execution is tested through the canonical pull_request lane; push runs remain for main after integration.
  push:
    branches: [main, execution]
  workflow_dispatch:

# Each exact commit SHA has its own advisory execution slot; advisory reviews are also subject to repository-wide latest-commit supersession.
# The surviving run still reviews the exact PR head SHA.
concurrency:
  group: claude-security-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Advisory only: this workflow never modifies source code and is not a merge gate.
permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Claude Security Review (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted security-review revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed when this commit is superseded
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REQUIRE_LIVE_HEAD_MATCH: 'true'
        shell: bash
        run: node scripts/ci/assert-current-commit.mjs

      - name: Check whether Claude API key is configured
        id: key-check
        shell: bash
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Claude API key is configured; advisory review will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Claude API key is not configured; advisory review will be skipped."
          fi

      - name: Run Claude Security Review
        if: steps.key-check.outputs.configured == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # verified upstream commit
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
          run-every-commit: true
          claudecode-timeout: "20"

      - name: Record advisory policy
        if: always()
        shell: bash
        run: |
          {
            echo '## Claude Security Review Policy'
            echo
            echo '- Mode: advisory'
            echo '- Auto-apply: false'
            echo '- Human review required: true'
            echo '- Merge gate: false'
            echo '- Source modification by AI: disabled'
            echo '- Re-scan policy: newest PR commit only (superseded runs are cancelled)'
          } >> "$GITHUB_STEP_SUMMARY"