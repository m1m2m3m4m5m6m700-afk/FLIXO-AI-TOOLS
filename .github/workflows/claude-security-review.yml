name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Execution is tested through the canonical pull_request lane; push runs remain for main after integration.
  push:
    branches: [main, execution]
  workflow_dispatch:

# Each exact commit SHA has its own advisory execution slot; active reviews are never cancelled by newer commits.
# The surviving run still reviews the exact PR head SHA.
concurrency:
  group: claude-security-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Advisory only: this workflow never modifies source code and is not a merge gate.
permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Claude Security Review (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when PR head changes during review
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL CLOSED: invalid expected PR SHA"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "FAIL CLOSED: invalid PR number"; exit 1; }
          LIVE_SHA="$(gh api "repos/$EXPECTED_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$LIVE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "FAIL CLOSED: invalid live PR SHA"; exit 1; }
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "CLAUDE_SECURITY_PR_HEAD_SHA=$LIVE_SHA"
          echo "CLAUDE_SECURITY_PR_BRANCH=$EXPECTED_BRANCH"
          echo "CLAUDE_SECURITY_TRUSTED_WORKSPACE=NO_PR_CHECKOUT"

      - name: Check whether Claude API key is configured
        id: key-check
        shell: bash
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Claude API key is configured; advisory review will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Claude API key is not configured; advisory review will be skipped."
          fi

      - name: Run Claude Security Review
        if: steps.key-check.outputs.configured == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # verified upstream commit
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
          run-every-commit: true
          claudecode-timeout: "20"

      - name: Record advisory policy
        if: always()
        shell: bash
        run: |
          {
            echo '## Claude Security Review Policy'
            echo
            echo '- Mode: advisory'
            echo '- Auto-apply: false'
            echo '- Human review required: true'
            echo '- Merge gate: false'
            echo '- Source modification by AI: disabled'
            echo '- Re-scan policy: newest PR commit only (superseded runs are cancelled)'
          } >> "$GITHUB_STEP_SUMMARY"