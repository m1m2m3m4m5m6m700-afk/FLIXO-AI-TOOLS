        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-003 "Registry & Contracts" contract-validation P0 "npm run validate:ci-contract && npm run validate:tool-registry && npm run validate:tool-manifest && npm run validate:router-registry && npm run validate:contracts"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-executive-CI-003-${{ github.run_id }}
          path: artifacts/ci-executive/CI-003/
          if-no-files-found: error
