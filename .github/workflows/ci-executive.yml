name: FLIXO CI — Executive Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: executive-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The Executive Contract is the PR verification authority.
# The 18 executive paths below are independent and never block one another.

jobs:
  ci-001:
    name: CI-001 — TypeScript Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        continue-on-error: true
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-001 "TypeScript Type Checking" static-analysis P0 "npm run typecheck"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-executive-CI-001-${{ github.run_id }}
          path: artifacts/ci-executive/CI-001/
          if-no-files-found: error
          retention-days: 14

  ci-002:
    name: CI-002 — ESLint Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
