      - name: Install dependencies
        continue-on-error: true
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-002 "ESLint Code Quality" static-analysis P0 "npm run lint"
      - uses: actions/upload-artifact@v6
        if: always()
