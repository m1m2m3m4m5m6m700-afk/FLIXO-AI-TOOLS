      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-018 "Tool Data Integrity" tool-contract P0 "npm run validate:tool-registry && npm run validate:tool-manifest && node scripts/test-release-evidence.mjs && npm run test:tool-localization"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-executive-CI-018-${{ github.run_id }}
          path: artifacts/ci-executive/CI-018/
          if-no-files-found: error
          retention-days: 14

  aggregator:
    name: Aggregation — Executive Error Report
    needs:
      - ci-001
      - ci-002
      - ci-003
      - ci-004
      - ci-005
      - ci-006
      - ci-007
      - ci-008
      - ci-009
      - ci-010
      - ci-011
      - ci-012
      - ci-013
      - ci-014
      - ci-015
      - ci-016
      - ci-017
      - ci-018
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download all executive artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: ci-executive-*
          path: artifacts/ci-executive
          merge-multiple: false
      - name: Verify artifact coverage
        shell: bash
        run: |
          set -euo pipefail
          expected=18
          actual=$(find artifacts/ci-executive -type f -name "result.json" | wc -l)
          echo "Executive result artifacts: $actual/$expected"
          if [[ "$actual" -ne "$expected" ]]; then
            echo "Missing executive result artifacts; collector will mark the run RED."
          fi
      - name: Generate error-report.json
        id: aggregate
        run: node scripts/collect-errors.mjs
      - name: Publish report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: error-report-${{ github.run_id }}
          path: error-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Print report summary
        if: always()
        shell: bash
        run: |
          cat error-report.json
          {
            echo '### FLIXO Executive CI'
            echo
            node -e "const r=require('./error-report.json'); console.log('**Verdict:** '+r.verdict); console.log('**Jobs:** '+r.jobResults.length+'/18'); console.log('**Failed jobs:** '+r.summary.failedJobs); console.log('**Missing jobs:** '+r.summary.missingJobs); console.log('**Errors:** '+r.summary.total);"
          } >> "$GITHUB_STEP_SUMMARY"
