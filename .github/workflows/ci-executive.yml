      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-016 "Tool Input Validation" tool-contract P0 "npm run test:upload-boundary && node --experimental-strip-types scripts/test-file-safety.mjs"
      - uses: actions/upload-artifact@v6
