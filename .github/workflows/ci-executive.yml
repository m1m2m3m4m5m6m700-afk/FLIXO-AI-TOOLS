      - name: Execute path
        run: node scripts/ci/execute-executive-job.mjs CI-011 "Bundle Analysis" performance P2 "npm run build:runtime && npm run report:bundle-size && npm run validate:performance-budget"
      - uses: actions/upload-artifact@v6
