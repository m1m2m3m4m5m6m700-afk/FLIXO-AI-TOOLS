name: Fast Repair Lane

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fast-repair-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  VITE_SITE_URL: https://flixoai.vercel.app
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  fast-repair:
    name: Fast Repair — Impact / Static / Targeted Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Assert exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA" || {
            echo "Fast Repair SHA mismatch: expected=$EXPECTED_HEAD_SHA actual=$actual"
            exit 1
          }
      - name: Run impact-aware fast verification
        run: node --experimental-strip-types scripts/ci/fast-verify.mjs
      - name: Verify fast evidence identity
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/fast-ci-plan.json
          test -s diagnostics/fast-ci-result.json
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('diagnostics/fast-ci-result.json','utf8')); if(r.sha!==process.env.EXPECTED_HEAD_SHA) throw new Error('Fast evidence SHA mismatch'); if(r.status!=='PASS') throw new Error('Fast verification is not PASS'); console.log(JSON.stringify({mode:r.mode,status:r.status,durationMs:r.durationMs,executed:r.executed.length},null,2));"
      - name: Upload fast verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-repair-${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
