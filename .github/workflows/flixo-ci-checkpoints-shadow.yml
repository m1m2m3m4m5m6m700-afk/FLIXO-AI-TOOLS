name: FLIXO CI — Checkpoint Shadow

on:
  workflow_dispatch:

concurrency:
  group: flixo-ci-checkpoints-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app

jobs:
  checkpoints-shadow:
    name: CI Checkpoint Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Checkpoint semantics
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/ci/checkpoints/checkpoint.test.mjs
      - name: Checkpoint self-test
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/ci/checkpoints/self-test.mjs
      - name: Verify checkpoint fingerprint shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(printf '%s' 'checkpoint' | sha256sum | awk '{print length($1)}')" -eq 64
