name: Final Surgical Remediation Once

on:
  push:
    branches: [protocols/i18n-assets-boundary-guards]
  pull_request:
    types: [synchronize]

permissions:
  contents: write

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: protocols/i18n-assets-boundary-guards

      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin protocols/i18n-assets-boundary-guards
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/protocols/i18n-assets-boundary-guards)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Purge legacy source surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/tools/seed
          cp src/components/floating-canvas-overlay.tsx src/tools/seed/seed-canvas-overlay.tsx
          cp src/components/useCanvasCompare.ts src/tools/seed/useCanvasCompare.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tools/seed/index.tsx')
          s = p.read_text()
          target = "from '../../components/floating-canvas-overlay';"
          replacement = "from './seed-canvas-overlay';"
          if target not in s:
              raise SystemExit('Seed floating overlay import not found')
          p.write_text(s.replace(target, replacement, 1))
          PY

          git rm -f --ignore-unmatch \
            src/routes/ai-captioner-srt.tsx src/routes/ai-vocal-instrumental-remover.tsx src/routes/aspect-ratio-tools.tsx src/routes/audio-compressor.tsx src/routes/audio-cutter-trimmer.tsx src/routes/audio-noise-reducer.tsx src/routes/audio-tools.tsx src/routes/base64-tools.tsx src/routes/case-tools.tsx src/routes/color-tools.tsx src/routes/en-image-compressor.tsx src/routes/hash-generator.tsx src/routes/image-tools.tsx src/routes/json-tools.tsx src/routes/password-tools.tsx src/routes/pdf-tools.tsx src/routes/qr-tools.tsx src/routes/regex-tools.tsx src/routes/text-tools.tsx src/routes/video-compressor-converter.tsx src/routes/video-gif-meme.tsx src/routes/video-tools.tsx src/routes/word-tools.tsx \
            src/components/lazy-image-compressor.tsx src/components/technical-tool-shell.tsx src/components/tool-header-hud.tsx src/lib/i18n/shared-tool-ui.ts src/components/technical-tool-shell-premium.css src/components/canvas/ZenCanvas.tsx src/components/floating-canvas-overlay.tsx src/components/useCanvasCompare.ts \
            scripts/generate-home-locale-modules.mjs scripts/split-home-locales.mjs scripts/generate-admin-password-hash.mjs scripts/quickflow-intent.test.mjs scripts/test-image-compressor-file-safety.mjs scripts/validate-locale-integrity.mjs

          git rm -f --ignore-unmatch src/tools/{seed,pix,image-compressor,ai-image-generator,background-blur,background-remover,collage-maker,crop-resize,exif-cleaner,image-converter,image-cropper,image-effects,image-ocr,image-to-svg,image-toolkit,image-upscaler,meme-generator,mockup-generator,object-remover,passport-photo-maker,raster-to-svg,svg-optimizer,watermark-adder,watermark-remover}/{manifest.ts,test.ts}
          git rm -rf --ignore-unmatch src/tools/{seed,pix,image-compressor,ai-image-generator,background-blur,background-remover,collage-maker,crop-resize,exif-cleaner,image-converter,image-cropper,image-effects,image-ocr,image-to-svg,image-toolkit,image-upscaler,meme-generator,mockup-generator,object-remover,passport-photo-maker,raster-to-svg,svg-optimizer,watermark-adder,watermark-remover}/seo

      - name: Fix static CI and canonical matrix topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('scripts/ci/fast-verify.mjs')
          s = p.read_text()
          old = "const sourceFiles = files.filter((file) => /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(file));"
          new = "const sourceFiles = files.filter((file) => existsSync(file) && /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(file));"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('fast-verify sourceFiles rule missing')

          p = Path('src/tools/pix/index.tsx')
          s = p.read_text()
          nested = '<h1 className="sr-only">Pix Studio</h1>'
          if nested in s:
              p.write_text(s.replace(nested, '', 1))

          p = Path('.github/workflows/ci.yml')
          lines = p.read_text().splitlines()
          if not any(line.strip() == 'workflow_call:' for line in lines[:20]):
              for i, line in enumerate(lines):
                  if line.strip() == 'workflow_dispatch:':
                      lines.insert(i + 1, '  workflow_call:')
                      break
          start = next((i for i, line in enumerate(lines) if line == '      - name: Resolve legacy G3'), None)
          if start is not None:
              end = next((i for i in range(start + 1, len(lines)) if lines[i] == '      - name: G3 authoritative aggregation'), None)
              if end is None:
                  raise SystemExit('G3 authoritative aggregation boundary missing')
              del lines[start:end]
          lines = [line for line in lines if not line.strip().startswith('LEGACY_RESULT:')]
          p.write_text('\n'.join(lines) + '\n')

          p = Path('.github/workflows/release-certification.yml')
          lines = p.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if line == '  engineering-gate:'), None)
          end = next((i for i in range((start or 0) + 1, len(lines)) if lines[i] == '  deployment-provider:'), None)
          if start is None or end is None:
              raise SystemExit('release engineering gate boundaries missing')
          block = [
              '  canonical-ci:',
              '    name: Canonical GitHub CI',
              '    needs: [socket-release]',
              '    uses: ./.github/workflows/ci.yml',
              '    secrets: inherit',
              '',
              '  matrix-certification:',
              '    name: Canonical Matrix First Certification',
              '    needs: [socket-release]',
              '    uses: ./.github/workflows/matrix-first.yml',
              '    secrets: inherit',
              '',
              '  engineering-gate:',
              '    name: Engineering Release Gate',
              '    needs: [socket-release, canonical-ci, matrix-certification]',
              '    runs-on: ubuntu-latest',
              '    timeout-minutes: 8',
              '    steps:',
              '      - uses: actions/checkout@v5',
              '      - uses: actions/setup-node@v5',
              '        with:',
              '          node-version-file: .nvmrc',
              '          cache: npm',
              '      - run: npm ci --prefer-offline --no-audit --no-fund',
              '      - name: Enforce native prerequisite results',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          test "${{ needs.socket-release.result }}" = success',
              '          test "${{ needs.canonical-ci.result }}" = success',
              '          test "${{ needs.matrix-certification.result }}" = success',
              '      - name: Verify production surface',
              '        env:',
              '          PRODUCTION_ORIGIN: https://flixoai.vercel.app',
              '        run: node scripts/validate-production-certification.mjs',
              '      - name: Write release evidence',
              '        run: |',
              '          {',
              '            echo "## FLIXO Release Certification"',
              '            echo',
              '            echo "Engineering gate: PASS"',
              '            echo "Commit: $GITHUB_SHA"',
              '            echo',
              '            echo "Blocking evidence:"',
              '            echo "- Socket supply-chain scan: PASS"',
              '            echo "- Canonical GitHub CI: PASS"',
              '            echo "- Canonical Matrix First certification: PASS"',
              '            echo "- Production surface certification: PASS"',
              '            echo',
              '            echo "Vercel provider-side quota status is recorded separately and never converted into an engineering PASS."',
              '          } >> "$GITHUB_STEP_SUMMARY"',
              '',
          ]
          p.write_text('\n'.join(lines[:start] + block + lines[end:]) + '\n')

          p = Path('package.json')
          data = json.loads(p.read_text())
          scripts = data['scripts']
          scripts.pop('validate:locale-integrity', None)
          scripts['verify:i18n'] = "node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/validate-localization-complete.mjs --strict --report"
          for key in ('check', 'verify:contracts'):
              parts = scripts[key].split(' && ')
              parts = [part for part in parts if part != 'npm run validate:locale-integrity' and part != 'npm run validate:localization-complete']
              scripts[key] = ' && '.join(parts)
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')

          # Diagnostics are manual-only; remove PR/push/schedule triggers while retaining workflow_dispatch.
          for name in ('parallel-diagnostics.yml', 'phase-b-evidence.yml', 'phase-c-failure-classifier.yml', 'root-cause-diagnostics.yml'):
              p = Path('.github/workflows') / name
              if not p.exists():
                  continue
              ws = p.read_text().splitlines()
              out = []
              in_on = False
              for line in ws:
                  if line == 'on:':
                      in_on = True
                      out.append(line)
                      continue
                  if in_on and line.startswith('jobs:'):
                      if not any(x.strip() == 'workflow_dispatch:' for x in out[-8:]):
                          out.append('  workflow_dispatch:')
                      in_on = False
                      out.append(line)
                      continue
                  if in_on and (line.startswith('  pull_request:') or line.startswith('  push:') or line.startswith('  schedule:')):
                      continue
                  if in_on and line.startswith('    '):
                      continue
                  out.append(line)
              p.write_text('\n'.join(out) + '\n')
          PY

      - name: Verify topology and removed surfaces
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/full-matrix-parallel.yml
          test ! -e .github/workflows/g1-platform-contract.yml
          test ! -e scripts/validate-locale-integrity.mjs
          if find .github/workflows -maxdepth 1 -type f \( -name 'flixo-ci-*-shadow.yml' -o -name 'flixo-ci-shadow.yml' \) -print -quit | grep -q .; then exit 1; fi
          if grep -R -nE 'gh api|gh run list|check-runs|LEGACY_RESULT|Resolve legacy G3|legacy-g3' .github/workflows --exclude='zz-final-surgical-remediation.yml'; then exit 1; fi
          grep -q '^  workflow_call:' .github/workflows/ci.yml
          grep -q '^  workflow_call:' .github/workflows/matrix-first.yml
          grep -q -- '--retries=0' .github/workflows/matrix-first.yml
          grep -q -- '--max-failures=1' .github/workflows/matrix-first.yml
          for f in parallel-diagnostics.yml phase-b-evidence.yml phase-c-failure-classifier.yml root-cause-diagnostics.yml; do
            if [ -f ".github/workflows/$f" ]; then
              if grep -qE '^  (pull_request|push|schedule):' ".github/workflows/$f"; then
                echo "diagnostic workflow still has an automatic trigger: $f" >&2
                exit 1
              fi
              grep -q '^  workflow_dispatch:' ".github/workflows/$f"
            fi
          done

      - name: Validate exact source state before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run check
          npm run verify:i18n -- --strict --report
          npm run validate:tool-manifest
          npm run validate:seo-manifest
          npm run validate:language-quality
          npx playwright install chromium
          npm run build
          test -f dist/index.html

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/zz-final-surgical-remediation.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore: consolidate CI and purge legacy surfaces"
          git push origin HEAD:protocols/i18n-assets-boundary-guards
