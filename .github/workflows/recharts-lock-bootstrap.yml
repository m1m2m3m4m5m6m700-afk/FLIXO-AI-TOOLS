name: Recharts Lock Bootstrap

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/recharts-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Generate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Commit generated lockfile to PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(recharts): synchronize package lockfile"
          git push origin "HEAD:${BRANCH}"
