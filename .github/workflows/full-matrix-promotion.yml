name: Full Matrix Promotion

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-matrix-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CI_BROWSERS: chromium,firefox,webkit
  CI_SHARD_COUNT: 6
  CI_MAX_SHARDS: 18
  CI_RUNNER_RESERVE: 2
  CI_RUNNER_BUDGET: 8

jobs:
  source-artifact:
    name: Full Matrix — Source Artifact
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      certified_sha: ${{ steps.certified-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Resolve certified SHA
        id: certified-sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Consume canonical CI build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v7
        with:
          name: flixo-build-${{ github.event.workflow_run.head_sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Build certification artifact once for manual certification
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          VITE_SITE_URL: https://flixoai.vercel.app
        run: npm run build
      - name: Verify static artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_flixo_build_manifest.json
      - name: Upload certification source artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-source-${{ steps.certified-sha.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  plan:
    name: Full Matrix — Weighted Plan
    needs: [source-artifact]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-artifact.outputs.certified_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate deterministic weighted browser matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/weighted-shard-plan.mjs > /tmp/full-matrix-plan.json
          matrix="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const d=JSON.parse(readFileSync('/tmp/full-matrix-plan.json','utf8')); process.stdout.write(JSON.stringify(d.matrix))")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          cp /tmp/full-matrix-plan.json full-matrix-plan.json
      - name: Upload audited shard plan
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-plan-${{ needs.source-artifact.outputs.certified_sha }}
          path: full-matrix-plan.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    needs: [source-artifact, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-artifact.outputs.certified_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Download canonical source artifact
        uses: actions/download-artifact@v7
        with:
          name: full-matrix-source-${{ needs.source-artifact.outputs.certified_sha }}
          path: dist
      - name: Start isolated preview server
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/full-matrix-server.log 2>&1 &
          echo $! >/tmp/full-matrix-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/full-matrix-server.log
          exit 1
      - name: Run assigned weighted suite set
        id: e2e
        env:
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(node --input-type=module -e "for (const suite of JSON.parse(process.env.TESTS_JSON)) console.log(suite)")
          specs=()
          for suite in "${suites[@]}"; do
            if [[ "$suite" == "localization" ]]; then
              specs+=("tests/localization-smoke.spec.ts")
            else
              spec="tests/${suite}.spec.ts"
              test -f "$spec"
              specs+=("$spec")
            fi
          done
          npx playwright test "${specs[@]}" --project=${{ matrix.browser }} --retries=0
      - name: Write shard evidence
        if: ${{ always() }}
        env:
          CERTIFIED_SHA: ${{ needs.source-artifact.outputs.certified_sha }}
          TESTS_JSON: ${{ toJSON(matrix.tests) }}
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-matrix-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const tests = JSON.parse(process.env.TESTS_JSON);
          const passed = process.env.TEST_OUTCOME === 'success';
          const record = {
            sha: process.env.CERTIFIED_SHA,
            browser: '${{ matrix.browser }}',
            shard: ${{ matrix.shard }},
            expected_suites: tests.length,
            executed_suites: passed ? tests : [],
            failed: passed ? 0 : 1,
            skipped: passed ? 0 : tests.length,
          };
          writeFileSync(`full-matrix-evidence/${record.browser}-shard-${record.shard}.json`, JSON.stringify(record, null, 2));
          NODE
      - name: Upload shard diagnostics and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.browser }}-${{ matrix.shard }}-${{ needs.source-artifact.outputs.certified_sha }}
          path: |
            full-matrix-evidence/
            playwright-report/
            test-results/
            /tmp/full-matrix-server.log
          if-no-files-found: warn
          retention-days: 14

  promotion:
    name: Full Matrix Promotion Gate
    needs: [source-artifact, plan, e2e]
    if: ${{ always() && needs.source-artifact.result == 'success' && needs.plan.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-artifact.outputs.certified_sha }}
          fetch-depth: 1
      - name: Download all shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: full-matrix-*-*-*${{ needs.source-artifact.outputs.certified_sha }}
          path: full-matrix-evidence
          merge-multiple: true
      - name: Validate exact 23 × 3 certification
        env:
          EXACT_SHA: ${{ needs.source-artifact.outputs.certified_sha }}
          EVIDENCE_ROOT: full-matrix-evidence/full-matrix-evidence
        run: node scripts/ci/validate-full-matrix-evidence.mjs
      - name: Write certification evidence
        env:
          CERTIFIED_SHA: ${{ needs.source-artifact.outputs.certified_sha }}
        shell: bash
        run: |
          {
            echo '## FLIXO Full Matrix Certification'
            echo
            echo "Exact SHA: ${CERTIFIED_SHA}"
            echo '23 suites × 3 browsers = 69 suite/browser executions.'
            echo 'Weighted shard plan was generated from repository duration history.'
            echo 'No PR execution is performed by this workflow; PR runtime coverage belongs to canonical CI S4.'
          } >> "$GITHUB_STEP_SUMMARY"
