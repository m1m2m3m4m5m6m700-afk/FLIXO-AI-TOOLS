name: Full Matrix Promotion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full Matrix — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        tool: [
          image-compressor,
          background-remover,
          image-upscaler,
          image-converter,
          ai-image-generator,
          object-remover,
          watermark-remover,
          image-cropper,
          image-to-svg,
          image-ocr,
          photo-colorizer,
          background-blur,
          passport-photo-maker,
          watermark-adder,
          meme-generator,
          collage-maker,
          image-effects,
          exif-cleaner,
          svg-optimizer,
          mockup-generator,
          seed,
          pix,
          localization
        ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Resolve test specification
        id: spec
        shell: bash
        run: |
          set -euo pipefail
          spec="tests/${{ matrix.tool }}.spec.ts"
          if [[ "${{ matrix.tool }}" == "localization" ]]; then
            spec="tests/localization-smoke.spec.ts"
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
      - name: Run ${{ matrix.tool }} E2E on ${{ matrix.browser }}
        run: npx playwright test "${{ steps.spec.outputs.spec }}" --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact certified SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CERTIFIED_SHA" = "${{ github.sha }}"
          echo "Exact certified SHA: $CERTIFIED_SHA"
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'Full browser matrix passed for:'
            echo '${{ github.sha }}'
            echo
            echo '23 suites × 3 browsers = 69 E2E jobs completed successfully.'
            echo 'Certification is bound to the exact commit SHA above.'
          } >> "$GITHUB_STEP_SUMMARY"
