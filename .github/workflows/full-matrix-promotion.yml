name: Full Matrix Promotion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        shards: [4]
    env:
      CI: 'true'
      VITE_SITE_URL: https://canonical.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
      - run: npm ci --prefer-offline --no-audit
      - name: Install ${{ matrix.browser }} if cache missed
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run shard ${{ matrix.shard }}/4 on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact certified SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CERTIFIED_SHA" = "${{ github.sha }}"
          echo "Exact certified SHA: $CERTIFIED_SHA"
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'Full browser matrix passed for:'
            echo '${{ github.sha }}'
            echo
            echo '23 suites × 3 browsers = 69 certified browser test selections, distributed across 12 parallel shards.'
            echo 'Certification is bound to the exact commit SHA above.'
          } >> "$GITHUB_STEP_SUMMARY"
