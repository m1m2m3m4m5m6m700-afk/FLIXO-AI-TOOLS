name: Full Matrix Promotion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The matrix is deliberately split into independent parallel stages so failures
# are isolated, visible, and diagnosable without changing the total coverage.

jobs:
  image-core:
    name: Stage 1 — Image Core — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: image-compressor
            spec: tests/image-compressor.spec.ts
          - tool: background-remover
            spec: tests/background-remover.spec.ts
          - tool: image-upscaler
            spec: tests/image-upscaler.spec.ts
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: object-remover
            spec: tests/object-remover.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-stage1-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  image-processing:
    name: Stage 2 — Image Processing — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: ai-image-generator
            spec: tests/ai-image-generator.spec.ts
          - tool: watermark-remover
            spec: tests/watermark-remover.spec.ts
          - tool: image-ocr
            spec: tests/image-ocr.spec.ts
          - tool: photo-colorizer
            spec: tests/photo-colorizer.spec.ts
          - tool: background-blur
            spec: tests/background-blur.spec.ts
          - tool: watermark-adder
            spec: tests/watermark-adder.spec.ts
          - tool: meme-generator
            spec: tests/meme-generator.spec.ts
          - tool: collage-maker
            spec: tests/collage-maker.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-stage2-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  image-advanced:
    name: Stage 3 — Image Advanced — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: passport-photo-maker
            spec: tests/passport-photo-maker.spec.ts
          - tool: image-effects
            spec: tests/image-effects.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: svg-optimizer
            spec: tests/svg-optimizer.spec.ts
          - tool: mockup-generator
            spec: tests/mockup-generator.spec.ts
          - tool: seed
            spec: tests/seed.spec.ts
          - tool: pix
            spec: tests/pix.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-stage3-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  platform-localization:
    name: Stage 4 — Platform & Localization — ${{ matrix.tool }} — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - tool: localization
            spec: tests/localization-smoke.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-stage4-${{ matrix.tool }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  promotion:
    name: Full Matrix Promotion Gate
    needs: [image-core, image-processing, image-advanced, platform-localization]
    if: ${{ always() && needs.image-core.result == 'success' && needs.image-processing.result == 'success' && needs.image-advanced.result == 'success' && needs.platform-localization.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'All parallel E2E stages passed for:'
            echo '${{ github.sha }}'
            echo
            echo 'Stage 1 — Image Core: 7 suites × 3 browsers = 21 jobs'
            echo 'Stage 2 — Image Processing: 8 suites × 3 browsers = 24 jobs'
            echo 'Stage 3 — Image Advanced: 7 suites × 3 browsers = 21 jobs'
            echo 'Stage 4 — Platform & Localization: 1 suite × 3 browsers = 3 jobs'
            echo 'Total: 23 suites × 3 browsers = 69 E2E jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

  diagnostic-summary:
    name: Full Matrix Diagnostic Summary
    if: ${{ always() }}
    needs: [image-core, image-processing, image-advanced, platform-localization, promotion]
    runs-on: ubuntu-latest
    steps:
      - name: Write matrix summary
        run: |
          {
            echo '## FLIXO Full Matrix Diagnostic Summary'
            echo
            echo '| Parallel Stage | Result |'
            echo '| --- | --- |'
            echo '| Stage 1 — Image Core | ${{ needs.image-core.result }} |'
            echo '| Stage 2 — Image Processing | ${{ needs.image-processing.result }} |'
            echo '| Stage 3 — Image Advanced | ${{ needs.image-advanced.result }} |'
            echo '| Stage 4 — Platform & Localization | ${{ needs.platform-localization.result }} |'
            echo '| Promotion Gate | ${{ needs.promotion.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
