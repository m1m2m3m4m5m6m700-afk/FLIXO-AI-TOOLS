name: Full Matrix Promotion

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  VITE_SITE_URL: https://flixoai.vercel.app
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: https://canonical.test
  CI_MAX_PARALLEL: ${{ vars.CI_MAX_PARALLEL || '12' }}

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Full Matrix — Dynamic Weighted Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute deterministic weighted matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-shard-plan.mjs
          matrix="$(node --input-type=module -e "const x=require('fs').readFileSync('diagnostics/ci-shard-plan.json','utf8'); console.log(JSON.stringify(JSON.parse(x).units))")"
          max_parallel="$(node --input-type=module -e "console.log(JSON.parse(require('fs').readFileSync('diagnostics/ci-shard-plan.json','utf8')).maxParallel)")"
          shard_count="$(node --input-type=module -e "console.log(JSON.parse(require('fs').readFileSync('diagnostics/ci-shard-plan.json','utf8')).shardCount)")"
          {
            echo "matrix=$matrix"
            echo "max_parallel=$max_parallel"
            echo "shard_count=$shard_count"
          } >> "$GITHUB_OUTPUT"
          cat diagnostics/ci-shard-plan.json >> "$GITHUB_STEP_SUMMARY"

  build-once:
    name: Full Matrix Build Once
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build immutable certification artifact
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile(
            'full-matrix-build-metadata.json',
            JSON.stringify(
              {
                sha: process.env.GITHUB_SHA,
                workflow: process.env.GITHUB_WORKFLOW,
                run_id: process.env.GITHUB_RUN_ID,
                generated_at: new Date().toISOString(),
              },
              null,
              2,
            ) + '\n',
          );
          NODE
      - name: Publish immutable certification artifact
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-build-${{ github.sha }}
          path: |
            dist/
            full-matrix-build-metadata.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Full Matrix — ${{ matrix.tool }} — ${{ matrix.browser }}
    needs: [plan, build-once]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download immutable certification artifact
        uses: actions/download-artifact@v6
        with:
          name: full-matrix-build-${{ github.sha }}
          path: .
      - name: Verify exact build SHA
        shell: bash
        run: |
          set -euo pipefail
          test -f full-matrix-build-metadata.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const metadata = JSON.parse(await readFile('full-matrix-build-metadata.json', 'utf8'));
          if (metadata.sha !== process.env.GITHUB_SHA) throw new Error(`Build SHA mismatch: expected ${process.env.GITHUB_SHA}, got ${metadata.sha}`);
          NODE
          test -f dist/index.html
      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
      - run: npx playwright install-deps ${{ matrix.browser }}
      - run: npx playwright install ${{ matrix.browser }}
      - name: Start prebuilt production server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/full-matrix-server.log 2>&1 &
          echo $! > /tmp/full-matrix-server.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/full-matrix-server.log || true
          exit 1
      - name: Verify resolved specification
        run: test -f "${{ matrix.spec }}"
      - name: Run weighted E2E unit
        env:
          CI: 'true'
          PLAYWRIGHT_EXTERNAL_SERVER: 'true'
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          CI_TEST_UNIT_WEIGHT: ${{ matrix.weight }}
        run: /usr/bin/time -f '%e' -o /tmp/test-duration-seconds.txt npx playwright test "${{ matrix.spec }}" --project=${{ matrix.browser }}
      - name: Upload unit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-unit-${{ matrix.tool }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            /tmp/test-duration-seconds.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup prebuilt server
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/full-matrix-server.pid ]; then
            PID="$(cat /tmp/full-matrix-server.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ')"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ]; then kill -- -"$PGID" 2>/dev/null || true; fi
          fi
          sleep 1
          ! pgrep -af 'vite preview --host 127.0.0.1 --port 3000' >/dev/null

  promotion:
    name: Full Matrix Promotion Gate
    needs: [plan, build-once, e2e]
    if: ${{ always() && needs.plan.result == 'success' && needs.build-once.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact certified SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CERTIFIED_SHA" = "${{ github.sha }}"
          echo "Exact certified SHA: $CERTIFIED_SHA"
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'Dynamic weighted matrix completed against one immutable build artifact.'
            echo '23 suites × 3 browsers = 69 E2E units.'
            echo "Planner parallelism: ${{ needs.plan.outputs.max_parallel }}"
            echo "Planner shards: ${{ needs.plan.outputs.shard_count }}"
            echo 'Exact certification SHA:'
            echo '${{ github.sha }}'
          } >> "$GITHUB_STEP_SUMMARY"
