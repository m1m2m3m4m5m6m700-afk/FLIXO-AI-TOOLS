name: Full Matrix Promotion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Run complete browser shard
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          specs=()
          while IFS= read -r -d '' spec; do
            specs+=("$spec")
          done < <(find tests -maxdepth 1 -type f -name '*.spec.ts' -print0 | sort -z)
          test "${#specs[@]}" -ge 23
          npx playwright test "${specs[@]}" --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact certified SHA
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CERTIFIED_SHA" = "${{ github.sha }}"
          echo "Exact certified SHA: $CERTIFIED_SHA"
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'Complete browser matrix passed for:'
            echo '${{ github.sha }}'
            echo
            echo '23 suites × 3 browsers = 69 suite/browser executions distributed across 12 independent shards.'
            echo 'All shards are required; any shard failure blocks promotion.'
            echo 'Certification is bound to the exact commit SHA above.'
          } >> "$GITHUB_STEP_SUMMARY"
