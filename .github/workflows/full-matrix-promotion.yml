name: Full Matrix Promotion

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full Matrix — ${{ matrix.browser }} — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run sharded E2E
        env:
          CI: 'true'
        run: >-
          npx playwright test
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}/4
          --reporter=blob
      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: warn
          retention-days: 2

  merge-report:
    name: Merge Full Matrix Report
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download shard reports
        uses: actions/download-artifact@v6
        with:
          pattern: full-matrix-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload merged report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: full-matrix-playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  promotion:
    name: Full Matrix Promotion Gate
    needs: [e2e, merge-report]
    if: ${{ always() && needs.e2e.result == 'success' && needs.merge-report.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write promotion evidence
        run: |
          {
            echo '## FLIXO Full Matrix Promotion'
            echo
            echo 'Commit: ${{ github.sha }}'
            echo 'Coverage: full Playwright corpus across Chromium, Firefox and WebKit.'
            echo 'Execution: 3 browsers × 4 shards = 12 parallel E2E jobs.'
            echo 'Merged report: full-matrix-playwright-report'
          } >> "$GITHUB_STEP_SUMMARY"
