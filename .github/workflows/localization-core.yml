name: Localization Core + Home Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-core:
    name: Localization Core + Home — 20 locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate EN + AR core localization
        run: node scripts/validate-localization-core.mjs
      - name: Validate all Home locale translations
        run: node scripts/validate-home-localization.mjs
