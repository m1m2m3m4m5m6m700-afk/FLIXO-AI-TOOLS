name: FLIXO Security Red-Team Continuous Pulse

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: Red-Team bot to wake
        required: false
        type: choice
        options:
          - SECURITY-REDTEAM-1
          - SECURITY-REDTEAM-2
          - SECURITY-REDTEAM-3

permissions:
  contents: read
  actions: write

concurrency:
  group: flixo-security-red-team-pulse-${{ inputs.bot || 'ALL' }}
  cancel-in-progress: false

env:
  PULSE_MS: 60000
  STALE_MS: 150000

jobs:
  pulse:
    name: Continuous pulse — ${{ inputs.bot || 'ALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        bot:
          - SECURITY-REDTEAM-1
          - SECURITY-REDTEAM-2
          - SECURITY-REDTEAM-3
    steps:
      - name: Select exact bot scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.bot || '' }}"
          BOT="${{ matrix.bot }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$BOT" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "bot=$BOT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact execution SHA
        if: steps.scope.outputs.active == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 1
          persist-credentials: false

      - name: Emit continuous heartbeat and peer-wake
        if: steps.scope.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_ID: ${{ steps.scope.outputs.bot }}
        shell: bash
        run: |
          set -euo pipefail

          emit_pulse() {
            local tick="$1"
            local sha="$2"
            local now
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BOT=$BOT_ID"
            echo "HEARTBEAT_TICK=$tick"
            echo "HEARTBEAT_AT=$now"
            echo "HEARTBEAT_EXACT_SHA=$sha"
            echo "HEARTBEAT_STATE=ACTIVE"
          }

          peer_job_state() {
            local peer="$1"
            local sha="$2"
            gh api --paginate               "repos/$GITHUB_REPOSITORY/actions/runs?branch=execution&per_page=50"               --jq --arg peer "$peer" --arg sha "$sha" '
                .workflow_runs[]
                | select(.head_sha == $sha)
                | select(.status == "queued" or .status == "in_progress")
                | .id
              ' | while read -r RUN_ID; do
                [ -n "$RUN_ID" ] || continue
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100"                   --jq --arg peer "$peer" '
                    .jobs[]
                    | select(.name == ("Continuous pulse — " + $peer))
                    | "(.status)|(.conclusion // "")|(.started_at // "")"
                  ' || true
              done
          }

          wake_peer() {
            local peer="$1"
            echo "PEER_WAKE_TARGET=$peer"
            gh workflow run security-red-team-pulse.yml               --repo "$GITHUB_REPOSITORY"               --ref execution               -f "bot=$peer"
            echo "PEER_WAKE_DISPATCHED=$peer"
          }

          for TICK in 1 2 3 4 5 6 7; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
            emit_pulse "$TICK" "$SHA"

            for PEER in SECURITY-REDTEAM-1 SECURITY-REDTEAM-2 SECURITY-REDTEAM-3; do
              [ "$PEER" = "$BOT_ID" ] && continue

              STATES="$(peer_job_state "$PEER" "$SHA" | tail -n 10)"
              if printf '%s
' "$STATES" | grep -Eq '^(queued|in_progress)\|'; then
                echo "PEER=$PEER STATUS=ALIVE"
                continue
              fi

              echo "PEER=$PEER STATUS=MISSING"
              wake_peer "$PEER" || echo "PEER_WAKE_FAILED=$PEER"
            done

            if [ "$TICK" -lt 7 ]; then
              sleep 60
            fi
          done

      - name: Publish pulse evidence
        if: always() && steps.scope.outputs.active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-security-red-team-pulse-${{ steps.scope.outputs.bot }}-${{ github.run_id }}
          path: /tmp/does-not-exist
          if-no-files-found: warn
          retention-days: 7
