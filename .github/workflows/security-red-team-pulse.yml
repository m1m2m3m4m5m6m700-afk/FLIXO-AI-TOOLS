name: FLIXO Security Red-Team Continuous Pulse

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: Red-Team bot to heartbeat
        required: false
        type: choice
        options:
          - SECURITY-REDTEAM-1
          - SECURITY-REDTEAM-2
          - SECURITY-REDTEAM-3

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-security-red-team-pulse-${{ inputs.bot || 'ALL' }}
  cancel-in-progress: true

jobs:
  pulse:
    name: Continuous read-only security pulse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted pulse controller from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Emit one exact-SHA heartbeat for the selected Red-Team bots
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_FILTER: ${{ inputs.bot || '' }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p /tmp/security-red-team-pulse
          : > /tmp/security-red-team-pulse/heartbeat.jsonl
          for BOT_ID in SECURITY-REDTEAM-1 SECURITY-REDTEAM-2 SECURITY-REDTEAM-3; do
            if [ -n "$BOT_FILTER" ] && [ "$BOT_FILTER" != "$BOT_ID" ]; then
              continue
            fi
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "{\"bot\":\"$BOT_ID\",\"heartbeatAt\":\"$NOW\",\"exactSha\":\"$SHA\",\"state\":\"ACTIVE\",\"mutation\":\"NONE\"}" >> /tmp/security-red-team-pulse/heartbeat.jsonl
            node scripts/ci/agent-liveness-protocol.mjs heartbeat \
              --task="SECURITY-REDTEAM-PULSE:$BOT_ID:$GITHUB_RUN_ID" \
              --state=ACTIVE \
              --sha="$SHA" \
              --progress=false \
              --file="/tmp/security-red-team-pulse/$BOT_ID-heartbeat.json"
          done
          test -s /tmp/security-red-team-pulse/heartbeat.jsonl
          echo "SECURITY_RED_TEAM_PULSE_SHA=$SHA"
          echo "SECURITY_RED_TEAM_PULSE_MUTATION=NONE"

      - name: Publish pulse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-security-red-team-pulse-${{ github.run_id }}
          path: /tmp/security-red-team-pulse/
          if-no-files-found: error
          retention-days: 7
