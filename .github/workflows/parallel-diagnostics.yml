name: Parallel Diagnostics

# Deep-diagnostic workflow. It intentionally does not replace the canonical CI gate.
# 23 suites × 3 browsers = 69 suite/browser executions, distributed across 4 shards/browser.
# 12 runner jobs preserve the full matrix while reducing repeated runner/setup overhead.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/parallel-diagnostics.yml'

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

concurrency:
  group: parallel-diagnostics-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Diagnostic — ${{ matrix.browser }} — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Playwright ${{ matrix.browser }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
      - name: Sanitize blocked external APT sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            echo "Removing inaccessible Microsoft APT source: $source"
            sudo rm -f "$source"
          done < <(grep -RIl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
      - name: Install Playwright system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Write diagnostic context
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > diagnostics/context.txt <<'EOF'
          commit=${{ github.sha }}
          workflow=${{ github.workflow }}
          run=${{ github.run_id }}
          browser=${{ matrix.browser }}
          shard=${{ matrix.shard }}/4
          node=$(node --version)
          npm=$(npm --version)
          playwright=$(npx playwright --version)
          EOF
          cat diagnostics/context.txt
      - name: Run complete diagnostic browser shard
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          specs=(
            tests/image-compressor.spec.ts
            tests/background-remover.spec.ts
            tests/image-upscaler.spec.ts
            tests/image-converter.spec.ts
            tests/ai-image-generator.spec.ts
            tests/object-remover.spec.ts
            tests/watermark-remover.spec.ts
            tests/image-cropper.spec.ts
            tests/image-to-svg.spec.ts
            tests/image-ocr.spec.ts
            tests/photo-colorizer.spec.ts
            tests/background-blur.spec.ts
            tests/passport-photo-maker.spec.ts
            tests/watermark-adder.spec.ts
            tests/meme-generator.spec.ts
            tests/collage-maker.spec.ts
            tests/image-effects.spec.ts
            tests/exif-cleaner.spec.ts
            tests/svg-optimizer.spec.ts
            tests/mockup-generator.spec.ts
            tests/seed.spec.ts
            tests/pix.spec.ts
            tests/localization-smoke.spec.ts
          )
          npx playwright test "${specs[@]}" --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            diagnostics/context.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo '## FLIXO Parallel Diagnostic Matrix'
            echo
            echo 'Matrix design: 23 suites × 3 browsers = 69 suite/browser executions across 12 required shards.'
            echo 'fail-fast=false keeps independent failures visible in parallel.'
            echo 'Every shard retains trace/video/screenshot/report artifacts from Playwright config.'
            echo 'Overall matrix result: ${{ needs.e2e.result }}'
          } >> "$GITHUB_STEP_SUMMARY"
