name: FLIXO Read-Only Error Investigator

on:
  push:
    branches:
      - execution
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: Active observation branch
        required: true
        default: execution
        type: choice
        options:
          - execution
          - main

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  security-events: read

concurrency:
  group: flixo-read-only-error-investigator-${{ github.event.inputs.branch || 'execution' }}
  cancel-in-progress: true

jobs:
  investigate:
    name: Read-only error/RCA intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-canonical branch
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'execution' }}
        run: |
          case "${TARGET_BRANCH}" in
            execution|main) ;;
            *) echo "FAIL CLOSED: branch is not canonical: ${TARGET_BRANCH}"; exit 1 ;;
          esac

      - name: Checkout trusted workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The observation target is data only; executable code always comes from the trusted workflow revision.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve observed branch SHA as data only
        id: observed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'execution' }}
        run: |
          set -euo pipefail
          OBSERVED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha // empty')"
          [[ "$OBSERVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "observed_sha=$OBSERVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Install read-only analysis dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate shared operational memory contract
        run: node scripts/ci/validate-shared-operational-memory.mjs

      - name: Test shared operational memory
        run: node scripts/ci/test-shared-operational-memory-contract.mjs

      - name: Validate investigator contract
        env:
          FLIXO_READ_ONLY_POWER: '10X'
        run: node scripts/ci/validate-read-only-error-investigator.mjs

      - name: Test five-x read-only power profile
        run: node scripts/ci/test-read-only-power-profile.mjs

      - name: Validate deep reasoning contract
        run: node scripts/ci/validate-read-only-deep-reasoning.mjs
      
      - name: Validate repair intelligence mirror contract
        run: node scripts/ci/validate-read-only-repair-intelligence.mjs

      - name: Test knowledge fusion
        run: npm run test:knowledge-fusion

      - name: Run read-only investigator
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_SHA: ${{ steps.observed.outputs.observed_sha }}
          GITHUB_REF_NAME: ${{ github.event.inputs.branch || 'execution' }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: |
          node scripts/ci/read-only-error-investigator.mjs --branch="${GITHUB_REF_NAME}" --sha="${OBSERVED_SHA}" --max-logs=100 --limit=100

      - name: Upload read-only intelligence report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: error-intelligence-${{ github.run_id }}
          path: |
            diagnostics/investigation/error-intelligence-latest.json
            diagnostics/investigation/error-investigator-contract.json
          if-no-files-found: error
          retention-days: 14
