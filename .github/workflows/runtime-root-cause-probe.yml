name: Runtime Root Cause Probe

on:
  push:
    branches: [ci/final-architecture-v5-v10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Focused Runtime Root Cause Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build:runtime
      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/flixo-probe-server.log 2>&1 &
          echo $! > /tmp/flixo-probe-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/flixo-probe-server.log
          exit 1
      - name: Probe runtime with Playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const routes = ['/en', '/en/ai-captioner-srt', '/en/base64-encoder-decoder'];
          for (const route of routes) {
            const page = await context.newPage();
            const errors = [];
            const failed = [];
            const consoleErrors = [];
            page.on('pageerror', (e) => errors.push(`${e.name}: ${e.message}\n${e.stack ?? ''}`));
            page.on('requestfailed', (r) => failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText ?? 'unknown'}`));
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1500);
            console.log(`=== ROUTE ${route} ===`);
            console.log(`URL=${page.url()}`);
            console.log(`TITLE=${await page.title()}`);
            console.log(`BODY_TEXT=${(await page.locator('body').innerText()).slice(0, 3000)}`);
            console.log(`ROOT_HTML=${(await page.locator('#root').innerHTML()).slice(0, 5000)}`);
            console.log(`PAGE_ERRORS=${JSON.stringify(errors)}`);
            console.log(`CONSOLE_ERRORS=${JSON.stringify(consoleErrors)}`);
            console.log(`FAILED_REQUESTS=${JSON.stringify(failed)}`);
            await page.close();
          }
          await browser.close();
          NODE
      - name: Server log
        if: always()
        run: cat /tmp/flixo-probe-server.log || true
