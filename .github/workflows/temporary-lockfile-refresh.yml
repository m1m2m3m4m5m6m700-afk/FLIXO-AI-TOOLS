name: Temporary Lockfile Refresh

on:
  push:
    branches:
      - fix/ci-exact-head-certification-2026-08-26

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: regenerate SPA lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate package lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate SPA server dependencies are absent
        run: |
          if grep -Eiq '"(@tanstack/react-start|@tanstack/router-plugin|nitro)"[[:space:]]*:' package-lock.json; then
            echo 'Stale SPA server dependencies remain in package-lock.json'
            exit 1
          fi
      - name: Commit regenerated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes.'
            exit 0
          fi
          git commit -m 'chore: regenerate SPA lockfile'
          git push