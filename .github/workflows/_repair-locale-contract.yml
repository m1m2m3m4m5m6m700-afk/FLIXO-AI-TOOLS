name: One-shot Locale Contract Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Reconcile strict canonical locale boundaries
        shell: python
        run: |
          from pathlib import Path
          import re

          canonical = {'ar','en','es','fr','de','hi','id','it','ja','ko','ms','nl','pl','pt','ru','sv','th','tr','uk','vi'}

          def replace_import_and_records(raw_path: str) -> None:
              p = Path(raw_path)
              text = p.read_text(encoding='utf-8')
              text = text.replace("import type { Locale } from './config';", "import type { KnownLocale, Locale } from './config';")
              text = text.replace("import type { Locale } from './i18n/config';", "import type { KnownLocale, Locale } from './i18n/config';")
              text = text.replace("import type { Locale } from '@/lib/i18n';", "import type { KnownLocale, Locale } from '@/lib/i18n';")
              text = text.replace('Partial<Record<Locale, string>>', 'Partial<Record<KnownLocale, string>>')
              text = text.replace('Record<KnownLocale, string>>', 'Record<KnownLocale, string>>')
              p.write_text(text, encoding='utf-8')

          replace_import_and_records('src/lib/i18n/tool-localization.ts')
          replace_import_and_records('src/lib/privacy.ts')
          replace_import_and_records('src/data/home-locales.ts')
          replace_import_and_records('src/data/quickflow-locales.ts')

          p = Path('src/lib/i18n/shared-tool-ui.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import type { Locale } from './config';", "import type { KnownLocale, Locale } from './config';")
          text = text.replace('Record<Locale, SharedCopy>', 'Record<KnownLocale, SharedCopy>')
          text = text.replace("locale === 'zh' ? '外部处理' : locale === 'uk' ? 'Зовнішня обробка' : 'External processing'", "locale === 'uk' ? 'Зовнішня обробка' : 'External processing'")
          p.write_text(text, encoding='utf-8')

          p = Path('src/lib/seo/tool-catalog.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import type { Locale } from '@/lib/i18n';", "import type { KnownLocale, Locale } from '@/lib/i18n';")
          text = text.replace('Record<Locale, {', 'Record<KnownLocale, {')
          text = text.replace('Record<Locale, string>', 'Record<KnownLocale, string>')
          text = text.replace('Record<Locale,', 'Record<KnownLocale,')
          p.write_text(text, encoding='utf-8')

          # A pilot manifest is explicitly allowed to retain historical zh/ur assets; complete remains strict 20-locale.
          p = Path('src/lib/seo/tool-manifest.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import type { Locale } from '@/lib/i18n';", "import type { KnownLocale, Locale } from '@/lib/i18n';")
          text = text.replace('Partial<Record<Locale, LocalizedToolSeo>>', 'Partial<Record<KnownLocale, LocalizedToolSeo>>')
          p.write_text(text, encoding='utf-8')

          # Existing manifests that claim complete but do not contain every canonical locale are truthfully pilot.
          changed = []
          for p in sorted(Path('src/tools').glob('*/manifest.ts')):
              text = p.read_text(encoding='utf-8')
              if "status: 'ready'" not in text or "seoStatus: 'complete'" not in text:
                  continue
              m = re.search(r'seoLocales: Object\.freeze\(\{([^\n]*)\}\)', text)
              if not m:
                  raise SystemExit(f'{p}: cannot parse seoLocales contract')
              present = {part.strip().split()[0] for part in m.group(1).split(',') if part.strip()}
              if not canonical.issubset(present):
                  text = text.replace("seoStatus: 'complete'", "seoStatus: 'pilot'", 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))
          print('ready manifests reclassified to pilot:', len(changed))

          # Static validator follows the source-of-truth public matrix.
          p = Path('scripts/validate-seo-manifest.mjs')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r"const expectedLocales = \[[^\]]*\];?", "const expectedLocales = ['en','ar','es','fr','de','hi','id','it','ja','ko','ms','nl','pl','pt','ru','sv','th','tr','uk','vi'];", text, count=1)
          p.write_text(text, encoding='utf-8')

      - name: TypeScript contract
        run: npx tsc --noEmit --pretty false

      - name: SEO manifest contract
        run: node scripts/validate-seo-manifest.mjs

      - name: Commit verified repair and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_repair-locale-contract.yml
          git add src/lib/i18n src/lib/privacy.ts src/data/home-locales.ts src/data/quickflow-locales.ts src/lib/seo/tool-catalog.ts src/lib/seo/tool-manifest.ts src/tools scripts/validate-seo-manifest.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified repair changes staged'; exit 1; }
          git commit -m 'fix(i18n): reconcile canonical locale contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
