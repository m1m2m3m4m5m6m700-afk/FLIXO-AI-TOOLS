name: One-shot Locale Contract Repair (Disabled)

# This workflow is intentionally inert. Locale/schema repair must be performed
# in normal development commits and verified by authoritative CI; CI must never
# mutate, commit, or push back to a pull-request branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Disabled self-mutating repair placeholder
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Self-mutating locale repair is disabled; use repository CI diagnostics and normal commits.'
