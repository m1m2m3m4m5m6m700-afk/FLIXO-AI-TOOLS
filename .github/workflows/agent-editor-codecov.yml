name: FLIXO Agent Editor Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [execution]
  workflow_dispatch:

concurrency:
  group: agent-editor-codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: Agent Editor coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-editor
    env:
      VITE_SITE_URL: "https://flixoai.vercel.app"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Install agent editor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: apps/agent-editor/coverage/lcov.info
          fail_ci_if_error: true
