name: FLIXO Agent Editor Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [execution]
  workflow_dispatch:

concurrency:
  group: agent-editor-codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: Agent Editor coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-editor
    env:
      VITE_SITE_URL: "https://flixoai.m1m2m3m4m5m6m700.workers.dev"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Install agent editor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate coverage
        run: npm run test:coverage

      - name: Verify coverage artifact and exact SHA
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s apps/agent-editor/coverage/lcov.info
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'target_sha=%s\n' "$EXPECTED_SHA" > apps/agent-editor/coverage/exact-sha.txt
          printf 'coverage_file_sha256=%s\n' "$(sha256sum apps/agent-editor/coverage/lcov.info | cut -d' ' -f1)" >> apps/agent-editor/coverage/exact-sha.txt

      - name: Upload internal coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flixo-agent-editor-coverage-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/agent-editor/coverage/lcov.info
            apps/agent-editor/coverage/exact-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: apps/agent-editor/coverage/lcov.info
          fail_ci_if_error: false
