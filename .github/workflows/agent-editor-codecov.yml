name: FLIXO Agent Editor Coverage

on:
  push:
    branches: [execution]
  workflow_dispatch:

concurrency:
  group: agent-editor-codecov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Agent Editor coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-editor
    env:
      VITE_SITE_URL: "https://flixoai.vercel.app"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Install agent editor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate coverage
        run: npm run test:coverage

      - name: Check Codecov credentials
        id: codecov_credentials
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_UPLOAD=SKIPPED_NO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "CODECOV_TOKEN is not configured; coverage was generated but not uploaded."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "CODECOV_UPLOAD=ENABLED" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov_credentials.outputs.has_token == 'true' }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/agent-editor/coverage/lcov.info
          fail_ci_if_error: true
