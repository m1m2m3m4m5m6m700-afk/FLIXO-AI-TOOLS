name: Phase 3 Chain Compatibility

# Legacy compatibility microscope. Canonical CI owns blocking verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Compatibility contract
        run: node tests/phase3-chain-compatibility.mjs
