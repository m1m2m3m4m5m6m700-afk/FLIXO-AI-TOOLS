name: FLIXO Agent Editor - STEP 4

on:
  pull_request:
    branches: [execution, main]
  push:
    branches: [feat/step4-agent-runtime-v2]
  workflow_dispatch:

concurrency:
  group: agent-editor-step4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-agent-editor:
    name: STEP 4 verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-editor
    env:
      FLIXO_ENABLE_MOCK_LLM: "true"
      VITE_SITE_URL: "https://flixoai.vercel.app"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install isolated app dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Runtime tests
        run: npx vitest run --config vitest.config.ts __tests__/agent-runtime.test.ts

      - name: Full isolated test suite
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Exact-SHA evidence
        working-directory: .
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=${EXPECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
