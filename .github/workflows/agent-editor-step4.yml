name: FLIXO Agent Editor - STEP 4

on:
  pull_request:
    branches: [execution, main]
  push:
    branches: [main, execution]
  workflow_dispatch:

concurrency:
  group: agent-editor-step4-${{ github.event_name }}-${{ github.ref || github.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-agent-editor:
    name: STEP 4 verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent-editor
    env:
      FLIXO_ENABLE_MOCK_LLM: "true"
      VITE_SITE_URL: "https://flixoai.m1m2m3m4m5m6m700.workers.dev"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Runtime tests
        run: npx vitest run --config vitest.config.ts __tests__/agent-runtime.test.ts

      - name: Full isolated test suite
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Exact-SHA evidence
        working-directory: .
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=${EXPECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"