name: FLIXO Council Wake Push Relay
# WAKE_RELAY_ACTIVE: PRESIDENT-controlled exact-SHA transport

on:
  push:
    branches: [execution]

permissions:
  contents: read
  issues: write
  actions: read
  id-token: write

concurrency:
  group: flixo-council-wake-push-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  wake:
    if: ${{ contains(github.event.head_commit.message, 'PRESIDENT WAKE') && github.actor == 'github-actions[bot]' && github.event.sender.login == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Load trusted Council controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Privileged push-triggered workflow: execute controller code only from trusted main.
          # The execution commit is transport metadata, never executable source.
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce Council directive before wake transport
        run: node scripts/ci/test-council-directive.mjs

      - name: Parse wake command
        id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          ROLE="$(printf '%s\n' "$MESSAGE" | sed -nE 's/.*ROLE=([A-Z]+).*/\1/p' | head -n1)"
          WP="$(printf '%s\n' "$MESSAGE" | sed -nE 's/.*WORK_PACKAGE=([A-Z][A-Z0-9_-]{3,80}).*/\1/p' | head -n1)"
          test -n "$ROLE"
          [[ "$WP" =~ ^[A-Z][A-Z0-9_-]{3,80}$ ]]
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          echo "work_package=$WP" >> "$GITHUB_OUTPUT"
          echo "entry_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact execution SHA
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_SHA: ${{ steps.parse.outputs.entry_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$CURRENT" = "$ENTRY_SHA"

      - name: Wake external Council runtime
        if: ${{ steps.parse.outputs.role == 'DEPUTY' || steps.parse.outputs.role == 'TASK' || steps.parse.outputs.role == 'EXECUTION' || steps.parse.outputs.role == 'REVIEW' || steps.parse.outputs.role == 'CERTIFICATION' }}
        env:
          ENTRY_SHA: ${{ steps.parse.outputs.entry_sha }}
          ROLE: ${{ steps.parse.outputs.role }}
          WORK_PACKAGE: ${{ steps.parse.outputs.work_package }}
          RUNTIME_URL: https://zrpsmgdrtwzrhkjwwujo.supabase.co/functions/v1/flixo-council-runtime
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNTIME_URL"             | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"

          MESSAGE_ID="push-wake-${GITHUB_RUN_ID}-$ROLE"
          COMMIT_MESSAGE="${MESSAGE:-}"
          jq -n             --arg messageId "$MESSAGE_ID"             --arg workPackage "$WORK_PACKAGE"             --arg entrySha "$ENTRY_SHA"             --arg role "$ROLE"             --arg commitMessage "$COMMIT_MESSAGE"             '{
              messageId:$messageId,
              idempotencyKey:$messageId,
              taskId:"COUNCIL-OPERATIONS-001",
              workPackageId:$workPackage,
              entrySha:$entrySha,
              primaryAccountId:"CHIEF",
              fallbackAccountId:"CHIEF",
              requestedByAccountId:"SYSTEM",
              councilRole:$role,
              directiveVersion:"1.0.0",
              payload:{
                source:"FLIXO Council Wake Push Relay",
                commitMessage:$commitMessage,
                exactSha:$entrySha
              }
            }' > /tmp/council-dispatch-payload.json
          curl -fsSL             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             -X POST "$RUNTIME_URL?action=dispatch"             --data-binary @/tmp/council-dispatch-payload.json > /tmp/council-dispatch.json
          jq -e '.ok == true' /tmp/council-dispatch.json >/dev/null
          jq -r '"DISPATCH_ID=" + .dispatchId + "\nDISPATCH_STATUS=" + .status + "\nPUSH_RESULT=" + (.push|tostring)' /tmp/council-dispatch.json

      - name: Publish wake receipt evidence
        env:
          ROLE: ${{ steps.parse.outputs.role }}
          WORK_PACKAGE: ${{ steps.parse.outputs.work_package }}
          ENTRY_SHA: ${{ steps.parse.outputs.entry_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/president-wake-receipt
          printf '%s\n' \
            '### PRESIDENT WAKE RECEIPT' \
            '' \
            "**Role:** $ROLE" \
            "**Work Package:** $WORK_PACKAGE" \
            "**Exact SHA:** $ENTRY_SHA" \
            '**Transport:** push → OIDC → Supabase Council Runtime' \
            '**Result:** QUEUED' \
            '' \
            'This receipt proves the exact-SHA wake was accepted into the canonical runtime queue. Agent ACK is separate evidence and is not inferred from queue acceptance.' \
            > /tmp/president-wake-receipt/wake-receipt.md
          test -s /tmp/president-wake-receipt/wake-receipt.md

      - name: Archive wake receipt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: president-wake-receipt-${{ github.run_id }}
          path: /tmp/president-wake-receipt/wake-receipt.md
          if-no-files-found: error
          retention-days: 30

      - name: Stop on unsupported role
        if: ${{ steps.parse.outputs.role != 'DEPUTY' && steps.parse.outputs.role != 'TASK' && steps.parse.outputs.role != 'EXECUTION' && steps.parse.outputs.role != 'REVIEW' && steps.parse.outputs.role != 'CERTIFICATION' }}
        run: |
          echo "WAKE_ROLE_NOT_SUPPORTED_FOR_EXTERNAL_TRANSPORT"
          exit 1
