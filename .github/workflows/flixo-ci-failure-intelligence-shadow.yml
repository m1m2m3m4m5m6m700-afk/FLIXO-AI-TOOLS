name: FLIXO CI — Failure Intelligence Shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flixo-ci-failure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  failure-intelligence-shadow:
    name: CI Failure Intelligence Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/ci/failure
          npx tsc --noEmit --pretty false 2>&1 | tee artifacts/ci/failure/typescript.log
      - name: Record TypeScript gate evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/failure
          printf '%s\n' '{"gate":"typescript","outcome":"${{ steps.typecheck.outcome }}","headSha":"${{ github.event.pull_request.head.sha || github.sha }}"}' > artifacts/ci/failure/typescript.json
      - name: Failure classification semantics
        if: steps.typecheck.outcome == 'success'
        run: node --experimental-strip-types scripts/ci/failure/engine.test.mjs
      - name: Deterministic failure report
        if: steps.typecheck.outcome == 'success'
        env:
          CI_FAILURE_EVENTS: '[{"id":"1","contract":"G4-TITLE-001","status":"FAIL","message":"localized title mismatch","route":"/tr/x","locale":"tr"},{"id":"2","contract":"G3-INTEGRITY-001","status":"FAIL","message":"artifact integrity SHA mismatch","route":"/en/x","locale":"en"}]'
        run: node --experimental-strip-types scripts/ci/failure/report.mjs
      - name: Verify report
        if: steps.typecheck.outcome == 'success'
        run: test -s artifacts/ci/failure/report.json && test -s artifacts/ci/failure/report.md
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-failure-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ci/failure/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce TypeScript gate
        if: always()
        run: test "${{ steps.typecheck.outcome }}" = success
