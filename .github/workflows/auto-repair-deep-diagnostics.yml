name: FLIXO Auto Repair Deep Diagnostics

# Automatically diagnoses failures and, only after the existing repair engine
# certifies a verified repair, applies the prepared patch to main. Canonical
# CI remains the final gate; failed verification never publishes source.
on:
  workflow_run:
    workflows:
      - "FLIXO Test System"
      - "FLIXO WP0 Trust Baseline"
      - "FLIXO Continuous Delivery"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: flixo-auto-repair-deep-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
  TARGET_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  diagnose:
    name: Deep diagnostics and autonomous repair
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout failed exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install committed graph
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run read-only code scout
        env:
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: npm run validate:code-scout && npm run agent:code-scout

      - name: Run historical root-cause analysis
        run: |
          node scripts/test-error-root-cause-extractor.mjs
          node scripts/ci/extract-error-root-causes.mjs docs/ERROR_MEMORY.md error-root-causes.json

      - name: Run bounded repair engine
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
        run: |
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/flixo-failure.log 2>&1 || true
          node scripts/ci/auto-repair-classifier.mjs
          node scripts/ci/auto-repair-engine.mjs

      - name: Verify repair before publication
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          OUTCOME="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")"
          test "$OUTCOME" = verified-repair
          test -n "$(git status --porcelain)"
          npm run typecheck
          npm run test:static
          npm run test:build
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

      - name: Apply verified repair to main
        if: steps.verify.outputs.outcome == 'verified-repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "FLIXO Auto Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B flixo-auto-repair origin/main
          git diff --binary "$TARGET_SHA" -- . ':!diagnostics' > /tmp/flixo-verified.patch
          test -s /tmp/flixo-verified.patch
          git apply --index /tmp/flixo-verified.patch
          git status --short
          git commit -m "fix(auto-repair): apply verified repair for failed run $TARGET_RUN_ID"
          git push origin HEAD:main

      - name: Re-run canonical verification after autonomous repair
        if: steps.verify.outputs.outcome == 'verified-repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Upload diagnostics and repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-repair-deep-${{ github.run_id }}
          path: |
            diagnostics/investigation/code-scout-latest.json
            error-root-causes.json
            /tmp/flixo-failure.log
            /tmp/flixo-repair-evidence.json
          if-no-files-found: warn
          retention-days: 30
