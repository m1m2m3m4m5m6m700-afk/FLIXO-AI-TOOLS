name: FLIXO Auto Repair Deep Diagnostics

# Automatically diagnoses failures and, only after the repair engine certifies
# a verified repair, applies a bounded patch to main. Canonical CI remains
# the final gate; failed verification never publishes source.
on:
  workflow_run:
    workflows:
      - "FLIXO Test System"
      - "FLIXO WP0 Trust Baseline"
      - "FLIXO Continuous Delivery"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: flixo-auto-repair-deep-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
  TARGET_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  diagnose:
    name: Deep diagnostics and autonomous repair
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout failed exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install committed graph
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run read-only code scout
        env:
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: npm run validate:code-scout && npm run agent:code-scout

      - name: Run historical root-cause analysis
        run: |
          node scripts/test-error-root-cause-extractor.mjs
          node scripts/ci/extract-error-root-causes.mjs docs/ERROR_MEMORY.md error-root-causes.json

      - name: Run bounded repair engine
        env:
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/flixo-failure.log 2>&1 || true
          node scripts/ci/auto-repair-classifier.mjs
          node scripts/ci/auto-repair-engine.mjs

      - name: Verify repair before publication
        id: verify
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          OUTCOME="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")"
          test "$OUTCOME" = verified-repair
          test -n "$(git status --porcelain --untracked-files=no)"
          # test:static already contains the canonical TypeScript gate, so do
          # not execute the same typecheck twice in one repair cycle.
          npm run test:static
          npm run test:build

          # Capture the exact source paths before checking the evidence claim.
          git diff --name-only --diff-filter=ACMRTUXB > /tmp/flixo-verified-files.txt
          test -s /tmp/flixo-verified-files.txt

          # Fail closed if the repair engine changed anything outside the
          # exact evidence paths it declared, or touched a protected path.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json', 'utf8'));
          const allowed = new Set(evidence.changedPaths ?? []);
          const neverModify = [
            '.github/workflows/ci.yml',
            '.github/workflows/deploy-flixoai.yml',
            '.github/workflows/auto-repair.yml',
            '.github/workflows/repair-seed.yml',
            'package-lock.json',
            '.env',
          ];
          const protectedAreas = [
            'scripts/ci/certification-engine.mjs',
            'scripts/ci/validate-execution-graph.mjs',
            'tests/seed.spec.ts',
          ];
          const changed = fs.readFileSync('/tmp/flixo-verified-files.txt', 'utf8').trim().split('\n').filter(Boolean);
          const forbidden = (p) => neverModify.includes(p) || neverModify.some((r) => r.endsWith('.*') && p.startsWith(r.slice(0, -2))) || protectedAreas.includes(p);
          const unexpected = changed.filter((p) => !allowed.has(p));
          const blocked = changed.filter(forbidden);
          if (unexpected.length || blocked.length) {
            console.error(JSON.stringify({ unexpected, blocked }, null, 2));
            process.exit(1);
          }
          NODE

          git diff --binary -- . ':!diagnostics' > /tmp/flixo-verified.patch
          test -s /tmp/flixo-verified.patch
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

      - name: Apply verified repair to current main
        if: steps.verify.outputs.outcome == 'verified-repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "FLIXO Auto Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B flixo-auto-repair origin/main
          git apply --index /tmp/flixo-verified.patch
          git status --short
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(auto-repair): apply verified repair for failed run $TARGET_RUN_ID"
          git push origin HEAD:main

      - name: Upload diagnostics and repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-repair-deep-${{ github.run_id }}
          path: |
            diagnostics/investigation/code-scout-latest.json
            error-root-causes.json
            /tmp/flixo-failure.log
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-verified-files.txt
          if-no-files-found: warn
          retention-days: 30
