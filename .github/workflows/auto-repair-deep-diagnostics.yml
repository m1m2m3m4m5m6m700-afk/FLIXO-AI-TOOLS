name: FLIXO Auto Repair Deep Diagnostics

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Failed canonical workflow run ID'
        required: true
        type: string
      target_sha:
        description: 'Exact failed SHA'
        required: true
        type: string
      target_branch:
        description: 'Exact failed branch'
        required: true
        type: string
  workflow_run:
    workflows:
      - "FLIXO Test System"
      - "FLIXO WP0 Trust Baseline"
      - "FLIXO Continuous Delivery"
    types: [completed]

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write

concurrency:
  group: flixo-auto-repair-${{ inputs.target_branch || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha || github.event.workflow_run.head_sha }}
  TARGET_RUN_ID: ${{ inputs.target_run_id || github.event.workflow_run.id }}
  TARGET_BRANCH: ${{ inputs.target_branch || github.event.workflow_run.head_branch }}
  FLIXO_HISTORY_LIMIT: '30'
  FLIXO_HISTORY_WORKFLOWS: 'FLIXO Test System,FLIXO WP0 Trust Baseline,FLIXO Continuous Delivery'
  FLIXO_REPAIR_LANE: single

jobs:
  diagnose:
    name: Closed-loop diagnose, repair, verify and handoff
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout failed exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install committed graph
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Learn from historical GitHub Actions failures and repair history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/learn-from-historical-actions.mjs

      - name: Capture exact failed logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/flixo-failure.log 2>&1 || true
          test -s /tmp/flixo-failure.log || printf '%s\n' 'No failed log payload was available.' > /tmp/flixo-failure.log

      - name: Run read-only code scout and root-cause analysis
        env:
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: |
          set -euo pipefail
          npm run validate:code-scout
          npm run agent:code-scout
          node scripts/test-error-root-cause-extractor.mjs
          node scripts/ci/extract-error-root-causes.mjs docs/ERROR_MEMORY.md error-root-causes.json

      - name: Run bounded repair engine
        env:
          FLIXO_FAILURE_LOG: /tmp/flixo-failure.log
          FLIXO_TARGET_DIR: ${{ github.workspace }}
          TARGET_RUN_ID: ${{ env.TARGET_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/auto-repair-engine.mjs

      - name: Verify repair proof and required local gates
        id: verify
        run: |
          set -euo pipefail
          test -f /tmp/flixo-repair-evidence.json
          OUTCOME="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json','utf8'));process.stdout.write(x.outcome||'unknown')")"
          test "$OUTCOME" = verified-repair
          test -n "$(git status --porcelain --untracked-files=no)"
          npm run test:static
          npm run test:build
          npm run verify:ci-cd-trust
          git diff --name-only --diff-filter=ACMRTUXB > /tmp/flixo-verified-files.txt
          test -s /tmp/flixo-verified-files.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json', 'utf8'));
          const changed = fs.readFileSync('/tmp/flixo-verified-files.txt', 'utf8').trim().split('\n').filter(Boolean);
          const allowed = new Set(evidence.changedPaths ?? []);
          const protectedPaths = ['.github/workflows/ci.yml', '.github/workflows/deploy-flixoai.yml', '.github/workflows/auto-repair.yml', '.github/workflows/repair-seed.yml', 'package-lock.json', '.env', 'scripts/ci/certification-engine.mjs', 'scripts/ci/validate-execution-graph.mjs', 'tests/seed.spec.ts'];
          const unexpected = changed.filter((p) => !allowed.has(p));
          const blocked = changed.filter((p) => protectedPaths.includes(p));
          if (unexpected.length || blocked.length) process.exit(1);
          NODE
          git diff --binary -- . ':!diagnostics' > /tmp/flixo-verified.patch
          test -s /tmp/flixo-verified.patch
          cp diagnostics/auto-repair/memory.json /tmp/flixo-repair-memory.json
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

      - name: Revalidate current main before integration
        if: steps.verify.outputs.outcome == 'verified-repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$TARGET_BRANCH" = "main" ]; then
            test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          else
            PR_BASE_SHA="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json baseRefOid --jq '.[0].baseRefOid // empty')"
            if [ -n "$PR_BASE_SHA" ]; then test "$PR_BASE_SHA" = "$(git rev-parse origin/main)"; fi
          fi

      - name: Prepare isolated repair branch
        if: steps.verify.outputs.outcome == 'verified-repair'
        id: branch
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == flixo-auto-repair/* ]]; then
            REPAIR_BRANCH="$TARGET_BRANCH"
            git checkout -B "$REPAIR_BRANCH" "$TARGET_SHA"
          else
            REPAIR_BRANCH="flixo-auto-repair/run-$TARGET_RUN_ID"
            git checkout -B "$REPAIR_BRANCH" origin/main
          fi
          echo "repair_branch=$REPAIR_BRANCH" >> "$GITHUB_OUTPUT"
          git apply --index /tmp/flixo-verified.patch
          mkdir -p diagnostics/auto-repair
          cp /tmp/flixo-repair-memory.json diagnostics/auto-repair/memory.json

      - name: Persist immutable repair-cycle evidence
        if: steps.verify.outputs.outcome == 'verified-repair'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('/tmp/flixo-repair-evidence.json', 'utf8'));
          const historyPath = 'docs/AUTO_REPAIR_HISTORY.jsonl';
          const record = {
            schemaVersion: 2,
            recordedAt: new Date().toISOString(),
            cycleId: `RC-${process.env.TARGET_RUN_ID}-${evidence.fingerprint ?? 'unknown'}`,
            repairWorkflowRunId: process.env.GITHUB_RUN_ID,
            failedRunId: process.env.TARGET_RUN_ID,
            failedSha: process.env.TARGET_SHA,
            targetBranch: process.env.TARGET_BRANCH,
            fingerprint: evidence.fingerprint ?? null,
            rootCause: evidence.specialist?.id ?? null,
            selectedRule: evidence.selected ?? null,
            outcome: evidence.outcome,
            changedPaths: evidence.changedPaths ?? [],
            rootCauseProof: evidence.rootCauseProof ?? null,
            repairProof: evidence.repairProof ?? null,
            recurrenceProof: evidence.recurrenceProof ?? null,
            preventionRule: evidence.preventionRule ?? null,
            learning: evidence.learning ?? null,
          };
          fs.mkdirSync('docs', { recursive: true });
          fs.appendFileSync(historyPath, `${JSON.stringify(record)}\n`);
          NODE
          git config user.name "FLIXO Auto Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/auto-repair/memory.json docs/AUTO_REPAIR_HISTORY.jsonl
          git commit -m "fix(auto-repair): verified repair cycle for run $TARGET_RUN_ID"
          git push --force-with-lease origin "HEAD:${{ steps.branch.outputs.repair_branch }}"

      - name: Create or update repair PR without touching main
        if: steps.verify.outputs.outcome == 'verified-repair'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.repair_branch }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REPAIR_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REPAIR_BRANCH" --draft --title "fix(auto-repair): closed-loop repair cycle $TARGET_RUN_ID" --body "Automated repair cycle for failed run $TARGET_RUN_ID. The repair is isolated on this branch. Canonical CI, browser gates, certification, and exact-SHA evidence are required before integration. A new failure opens the next repair cycle; no direct main push is permitted.")"
          fi
          echo "REPAIR_PR=$PR_URL"
          gh pr ready "$PR_URL"
          gh pr merge "$PR_URL" --auto --squash --delete-branch

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-repair-deep-${{ github.run_id }}
          path: |
            diagnostics/investigation/code-scout-latest.json
            error-root-causes.json
            /tmp/flixo-failure.log
            /tmp/flixo-repair-evidence.json
            /tmp/flixo-verified-files.txt
            /tmp/flixo-repair-memory.json
            diagnostics/auto-repair/historical-learning.json
          if-no-files-found: warn
          retention-days: 30
