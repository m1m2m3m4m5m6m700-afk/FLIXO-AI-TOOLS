name: FLIXO Auto Repair Deep Diagnostics

# Automatically activates the deep diagnostic agents whenever a canonical
# main-branch verification workflow fails. This is diagnostic-only: it never
# publishes source changes and does not weaken the canonical CI gates.
on:
  workflow_run:
    workflows:
      - "FLIXO Test System"
      - "FLIXO WP0 Trust Baseline"
      - "FLIXO Continuous Delivery"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-auto-repair-deep-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  ultra:
    name: Ultra Deep Recovery
    if: github.event.workflow_run.conclusion == 'failure'
    uses: ./.github/workflows/ultra-investigator.yml
    with:
      expected_sha: ${{ github.event.workflow_run.head_sha }}

  code-scout:
    name: Read-only Code Scout
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout failed exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install committed graph
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate scout contract
        run: npm run validate:code-scout
      - name: Run read-only code scout
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: npm run agent:code-scout
      - name: Upload scout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-repair-code-scout-${{ github.event.workflow_run.id }}
          path: diagnostics/investigation/code-scout-latest.json
          if-no-files-found: warn
          retention-days: 30

  historical-root-cause:
    name: Historical Error Root Cause
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout failed exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$
      - name: Run historical root-cause regression
        run: node scripts/test-error-root-cause-extractor.mjs
      - name: Emit normalized root-cause report
        run: node scripts/ci/extract-error-root-causes.mjs docs/ERROR_MEMORY.md error-root-causes.json
      - name: Upload historical root-cause evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-repair-error-root-causes-${{ github.event.workflow_run.id }}
          path: error-root-causes.json
          if-no-files-found: warn
          retention-days: 30
