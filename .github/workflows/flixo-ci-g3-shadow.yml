name: FLIXO CI — G3 Artifact Integrity Shadow

# Shadow regression suite is retained for manual forensic comparison only.
# Canonical G3 certification owns automated PR/main execution.
on:
  workflow_dispatch:

concurrency:
  group: flixo-ci-g3-manual
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_RUNTIME_ORIGIN: http://127.0.0.1:3000
  VITE_TEST_ORIGIN: http://127.0.0.1:3000
  VITE_SITE_URL: https://flixoai.vercel.app
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  g3-shadow:
    name: G3 Artifact Integrity Shadow (manual diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA" || { echo "G3 exact-head identity mismatch: expected=$EXPECTED_HEAD_SHA actual=$actual"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Existing output integrity regression
        run: node --experimental-strip-types scripts/test-output-integrity.mjs
      - name: Existing SVG integrity regression
        run: node --experimental-strip-types scripts/test-svg-integrity.mjs
      - name: Existing G3 artifact matrix
        run: node --experimental-strip-types scripts/test-g3-artifact-integrity.mjs
      - name: Real G3 browser flow
        timeout-minutes: 8
        run: timeout --preserve-status 420s bash -c 'npx playwright install --with-deps chromium && npx playwright test tests/g3-artifact-integrity.spec.ts --project=chromium --workers=1 --retries=0'
      - name: Verify G3 evidence identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Upload G3 shadow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-g3-shadow-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
