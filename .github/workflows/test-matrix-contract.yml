name: FLIXO Test Matrix Contract

on:
  workflow_dispatch:

concurrency:
  group: flixo-test-matrix-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix_contract:
    name: Fast Matrix + Output Proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate test matrix contract
        run: node scripts/ci/validate-test-matrix-contract.mjs
