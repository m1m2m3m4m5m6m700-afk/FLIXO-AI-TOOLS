name: FLIXO Latest Commit Test Supersession

on:
  push:
    branches:
      - execution
      - main
  pull_request:
    branches:
      - main
    types: [synchronize]

# Repository-wide rule:
# only the live branch head may execute current verification work;
# every active run tied to an older SHA on the same source branch is cancelled;
# exact-SHA guards remain fail-closed for any cancellation race.
concurrency:
  group: flixo-latest-commit-supersession-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  supersede:
    name: Cancel every stale commit run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted supersession controller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve authoritative live head
        id: head
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_BRANCH" =~ ^[[:alnum:]_./-]+$ ]]
          [[ "$SOURCE_REPOSITORY" =~ ^[^/]+/[^/]+$ ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          LIVE_SHA="$(git ls-remote "https://github.com/$SOURCE_REPOSITORY.git" "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "event_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "LATEST_COMMIT_LIVE_HEAD=$LIVE_SHA"
          echo "LATEST_COMMIT_EVENT_SHA=$EVENT_SHA"
          echo "LATEST_COMMIT_BRANCH=$TARGET_BRANCH"
          echo "LATEST_COMMIT_SOURCE_REPOSITORY=$SOURCE_REPOSITORY"
          echo "EVENT_SHA_SOURCE=IMMUTABLE_GITHUB_EVENT_SHA"
          if [ "$EVENT_SHA" != "$LIVE_SHA" ]; then
            echo "stale_event=true" >> "$GITHUB_OUTPUT"
            echo "SUPERSESSION_EVENT_OBSOLETE=true"
          else
            echo "stale_event=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel every active run for an older SHA
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ steps.head.outputs.sha }}
          BRANCH: ${{ steps.head.outputs.branch }}
          SOURCE_REPOSITORY: ${{ steps.head.outputs.source_repository }}
          REPOSITORY: ${{ github.repository }}
          CONTROLLER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cancel_run() {
            local run_id="$1"
            local head_sha="$2"
            local status="$3"
            local name="$4"
            echo "STALE_RUN_CANDIDATE id=$run_id sha=$head_sha status=$status name=$name"
            case "$status" in queued|pending|in_progress) ;; *) return 0 ;; esac
            local output=""
            for attempt in 1 2 3; do
              if output="$(gh run cancel "$run_id" --repo "$REPOSITORY" 2>&1)"; then
                echo "$output"
                echo "STALE_RUN_CANCELLED id=$run_id sha=$head_sha attempt=$attempt"
                return 0
              fi
              if printf '%s' "$output" | grep -Eiq 'already completed|cannot cancel.*completed|not in progress|completed'; then
                echo "STALE_RUN_ALREADY_COMPLETED run=$run_id"
                return 0
              fi
              if printf '%s' "$output" | grep -Eiq 'rate limit exceeded|secondary rate limit|abuse detection'; then
                echo "STALE_RUN_CANCEL_RETRY rate_limit id=$run_id attempt=$attempt"
                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 5))
                  continue
                fi
                echo "CANCEL_DEFERRED_STALE_INVALIDATED id=$run_id reason=rate_limit"
                echo "STALE_RUN_INVALIDATED=true"
                return 0
              fi
              sleep 2
            done
            echo "FAIL CLOSED: unable to cancel stale active run id=$run_id"
            exit 1
          }

          RUNS_JSON="$(gh api --paginate "repos/$REPOSITORY/actions/runs?branch=$BRANCH&per_page=100")"
          printf '%s\n' "$RUNS_JSON" > /tmp/supersession-runs.ndjson
          jq -s -r '.[].workflow_runs[]? | [.id,.head_sha,.status,.name,.head_repository.full_name // "",.head_branch // ""] | @tsv' /tmp/supersession-runs.ndjson > /tmp/supersession-runs.tsv

          while IFS=$'\t' read -r RUN_ID HEAD_SHA STATUS NAME HEAD_REPOSITORY HEAD_BRANCH; do
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_ID" = "$CONTROLLER_RUN_ID" ] && continue
            [ "$HEAD_REPOSITORY" = "$SOURCE_REPOSITORY" ] || continue
            [ "$HEAD_BRANCH" = "$BRANCH" ] || continue
            [ "$HEAD_SHA" = "$CURRENT_SHA" ] && continue
            cancel_run "$RUN_ID" "$HEAD_SHA" "$STATUS" "$NAME"
          done < /tmp/supersession-runs.tsv

      - name: Reconcile late stale runs until the head is stable
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ steps.head.outputs.sha }}
          BRANCH: ${{ steps.head.outputs.branch }}
          SOURCE_REPOSITORY: ${{ steps.head.outputs.source_repository }}
          REPOSITORY: ${{ github.repository }}
          CONTROLLER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for poll in $(seq 1 30); do
            LIVE_SHA="$(git ls-remote "https://github.com/$SOURCE_REPOSITORY.git" "refs/heads/$BRANCH" | awk 'NR==1 {print $1}')"
            [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [ "$LIVE_SHA" != "$CURRENT_SHA" ]; then
              echo "SUPERSESSION_HEAD_MOVED old=$CURRENT_SHA new=$LIVE_SHA"
              exit 0
            fi

            RUNS_JSON="$(gh api --paginate "repos/$REPOSITORY/actions/runs?branch=$BRANCH&per_page=100")"
            stale_ids="$(printf '%s\n' "$RUNS_JSON" | jq -s -r --arg sha "$CURRENT_SHA" --arg sourceRepo "$SOURCE_REPOSITORY" --arg branch "$BRANCH" --arg controller "$CONTROLLER_RUN_ID" '
              [.[].workflow_runs[]?
                | select((.status == "queued" or .status == "pending" or .status == "in_progress"))
                | select((.id|tostring) != $controller)
                | select(.head_sha != $sha)
                | select((.head_repository.full_name // "") == $sourceRepo)
                | select((.head_branch // "") == $branch)
                | .id] | .[]?'
            )"

            stale_active="$(printf '%s\n' "$stale_ids" | awk 'NF {count++} END {print count+0}')"
            echo "STALE_ACTIVE_RUNS=$stale_active"
            if [ "$stale_active" -eq 0 ]; then
              echo "LATEST_COMMIT_ONLY_ENFORCED=true"
              echo "LATEST_COMMIT_SHA=$CURRENT_SHA"
              echo "LATEST_COMMIT_BRANCH=$BRANCH"
              echo "LATEST_COMMIT_SUPERSESSION=PASS"
              exit 0
            fi

            while read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "LATE_STALE_RUN_CANCEL_REQUESTED id=$run_id"
              cancelled=false
              for attempt in 1 2 3; do
                if output="$(gh run cancel "$run_id" --repo "$REPOSITORY" 2>&1)"; then
                  echo "$output"
                  echo "STALE_RUN_CANCELLED id=$run_id attempt=$attempt"
                  cancelled=true
                  break
                fi
                if printf '%s' "$output" | grep -Eiq 'already completed|cannot cancel.*completed|not in progress|completed'; then
                  echo "STALE_RUN_ALREADY_COMPLETED run=$run_id"
                  cancelled=true
                  break
                fi
                if printf '%s' "$output" | grep -Eiq 'rate limit exceeded|secondary rate limit|abuse detection'; then
                  echo "STALE_RUN_CANCEL_RETRY rate_limit_late id=$run_id attempt=$attempt"
                  sleep $((attempt * 5))
                  continue
                fi
                break
              done
              if [ "$cancelled" != true ]; then
                echo "CANCEL_DEFERRED_STALE_INVALIDATED id=$run_id reason=rate_limit_late"
                echo "STALE_RUN_INVALIDATED=true"
                cancelled=true
              fi
            done <<< "$stale_ids"

            sleep 3
          done

          echo "FAIL CLOSED: active stale commit runs remain after supersession reconciliation."
          exit 1
