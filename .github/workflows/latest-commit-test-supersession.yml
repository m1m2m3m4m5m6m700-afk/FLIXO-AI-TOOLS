name: FLIXO Latest Commit Test Supersession

on:
  push:
    branches:
      - execution
      - main
  pull_request:
    branches:
      - main
    types: [synchronize]

# Central stale-run controller. Any non-authoritative run for an older SHA is cancelled and its evidence is stale.
concurrency:
  # One observer per branch/event; stale SHA runs are the data being cancelled, not separate controller lanes.
  group: flixo-latest-commit-supersession-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  supersede:
    name: Cancel stale test runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted supersession controller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # This job has actions:write and therefore must never execute PR-controlled code.
          # Supersession decisions are made from immutable GitHub API state; controller code comes only from main.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve live branch head and event head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_BRANCH" =~ ^[[:alnum:]_./-]+$ ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          LIVE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "event_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_SHA" = "$LIVE_SHA" ]; then
            echo "stale_event=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale_event=true" >> "$GITHUB_OUTPUT"
            echo "SUPERSESSION_EVENT_OBSOLETE=true"
          fi
          echo "LATEST_TEST_EVENT_HEAD=$EVENT_SHA"
          echo "LATEST_TEST_LIVE_HEAD=$LIVE_SHA"
          echo "LATEST_TEST_LIVE_BRANCH=$TARGET_BRANCH"
          echo 'EVENT_SHA_SOURCE=IMMUTABLE_GITHUB_EVENT_SHA'

      - name: Assert API-only supersession regression
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          LIVE_AFTER_CHECK="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          if [ "$LIVE_AFTER_CHECK" != "$EVENT_SHA" ]; then
            echo "SUPERSESSION_EVENT_OBSOLETE_DURING_CHECK=true"
            exit 0
          fi
          echo "SUPERSESSION_API_REGRESSION=PASS"
          echo "SUPERSESSION_CONTROLLER_SOURCE=TRUSTED_MAIN"
          echo "SUPERSESSION_CONTROLLER_BRANCH=$TARGET_BRANCH"
          echo "SUPERSESSION_CONTROLLER_EVENT_SHA=$EVENT_SHA"

      - name: Cancel stale test and verification runs
        id: cancel
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.head.outputs.branch }}
          CURRENT_SHA: ${{ steps.head.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          is_supersedable_run() {
            # The newest branch SHA is the only authoritative lane.
            [ "$1" != "FLIXO Latest Commit Test Supersession" ]
          }

          cancel_stale_run() {
            local run_id="$1"
            local head_sha="$2"
            local status="$3"
            local name="$4"
            local event="$5"
            echo "CANDIDATE stale run=$run_id sha=$head_sha name=$name event=$event listed_status=$status"

            # Every non-completed stale run is invalid. Request cancellation regardless of current
            # runner state; exact-SHA gates independently reject any late completion race.
            local live_status=""
            live_status="$(gh run view "$run_id" --repo "$REPOSITORY" --json status --jq '.status')"
            case "$live_status" in
              completed)
                echo "STALE_RUN_ALREADY_COMPLETED run=$run_id"
                return 0
                ;;
              in_progress|queued|waiting|requested|pending)
                ;;
              *)
                echo "KEEP_UNKNOWN_RUN_STATUS run=$run_id status=$live_status"
                return 0
                ;;
            esac

            echo "CANCEL_STALE_RUN run=$run_id status=$live_status"
            local cancel_output=""
            local attempt=1
            local now_status=""
            while [ "$attempt" -le 3 ]; do
              if cancel_output="$(gh run cancel "$run_id" --repo "$REPOSITORY" 2>&1)"; then
                echo "$cancel_output"
                echo "STALE_RUN_CANCEL_REQUESTED run=$run_id attempt=$attempt"
                return 0
              fi
              if printf '%s' "$cancel_output" | grep -Eiq 'API rate limit exceeded|rate limit exceeded|secondary rate limit|abuse detection'; then
                echo "BLOCKED_EXTERNAL: GitHub Actions API rate limit prevented stale-run cancellation for run=$run_id"
                echo "SUPERSESSION_EXTERNAL_BLOCKER=GITHUB_ACTIONS_API_RATE_LIMIT"
                return 0
              fi
              local status_output=""
              if status_output="$(gh run view "$run_id" --repo "$REPOSITORY" --json status --jq '.status' 2>&1)"; then
                now_status="$status_output"
                case "$now_status" in
                  in_progress)
                    echo "KEEP_IN_PROGRESS_STALE_DURING_CANCEL run=$run_id"
                    return 0
                    ;;
                  completed)
                    echo "STALE_RUN_ALREADY_COMPLETED run=$run_id"
                    return 0
                    ;;
                esac
              elif printf '%s' "$status_output" | grep -Eiq 'API rate limit exceeded|rate limit exceeded|secondary rate limit|abuse detection'; then
                echo "BLOCKED_EXTERNAL: GitHub Actions API rate limit prevented stale-run status lookup for run=$run_id"
                echo "SUPERSESSION_EXTERNAL_BLOCKER=GITHUB_ACTIONS_API_RATE_LIMIT"
                return 0
              fi
              echo "RETRY stale-run cancellation run=$run_id attempt=$attempt status=$now_status" >&2
              sleep 2
              attempt=$((attempt + 1))
            done
            echo "ERROR: cancellation failed for active run=$run_id status=$now_status" >&2
            return 1
          }

          RUNS_JSON=""
          if ! RUNS_JSON="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?branch=$BRANCH&per_page=100" 2>&1)"; then
            if printf '%s' "$RUNS_JSON" | grep -Eiq 'API rate limit exceeded|rate limit exceeded|secondary rate limit|abuse detection'; then
              echo "BLOCKED_EXTERNAL: GitHub Actions API rate limit prevented stale-run inventory."
              echo "SUPERSESSION_EXTERNAL_BLOCKER=GITHUB_ACTIONS_API_RATE_LIMIT"
              exit 0
            fi
            printf '%s\n' "$RUNS_JSON" >&2
            exit 1
          fi
          printf '%s' "$RUNS_JSON" | jq 'add' > /tmp/supersession-all-runs.json
          while IFS=
            [ -n "$RUN_ID" ] || continue
            if [ "$HEAD_SHA" = "$CURRENT_SHA" ]; then
              echo "KEEP current SHA run=$RUN_ID name=$NAME status=$STATUS"
              continue
            fi
            if is_supersedable_run "$NAME"; then
              cancel_stale_run "$RUN_ID" "$HEAD_SHA" "$STATUS" "$NAME" "$EVENT"
            fi
          done < <(
            jq -r '.workflow_runs[] | select(.status != "completed") | [.id,.head_sha,.status,.name,.event] | @tsv' /tmp/supersession-all-runs.json
          )

      - name: Assert no non-authoritative run remains active
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.head.outputs.branch }}
          CURRENT_SHA: ${{ steps.head.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for poll in 1 2 3 4 5; do
            RUNS_JSON="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?branch=$BRANCH&per_page=100")"
            printf '%s' "$RUNS_JSON" | jq 'add' > /tmp/supersession-final-runs.json
            stale_active="$(jq -r --arg sha "$CURRENT_SHA" '[.workflow_runs[] | select(.status != "completed" and .head_sha != $sha and .name != "FLIXO Latest Commit Test Supersession")] | length' /tmp/supersession-final-runs.json)"
            if [ "$stale_active" -eq 0 ]; then
              echo 'STALE_ACTIVE_RUNS=0'
              echo 'LATEST_COMMIT_ONLY_ENFORCED=true'
              break
            fi
            echo "STALE_ACTIVE_RUNS=$stale_active poll=$poll"
            jq -r --arg sha "$CURRENT_SHA" '.workflow_runs[] | select(.status != "completed" and .head_sha != $sha and .name != "FLIXO Latest Commit Test Supersession") | [.id,.name,.status,.head_sha] | @tsv' /tmp/supersession-final-runs.json
            if [ "$poll" -lt 5 ]; then sleep 2; fi
          done
          test "$stale_active" -eq 0 || {
            echo 'FAIL CLOSED: stale runs remain non-completed after supersession cancellation window.'
            exit 1
          }
          echo 'STALE_ACTIVE_RUNS=0'
          echo 'LATEST_COMMIT_ONLY_ENFORCED=true'

      - name: Assert repository head has not moved during supersession
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
          EXPECTED_BRANCH: ${{ steps.head.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BRANCH" --jq '.object.sha')"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "SUPERSESSION_EVENT_OBSOLETE=true"
            echo "SUPERSESSION_HEAD_MOVED old=$EXPECTED_SHA new=$CURRENT_SHA"
            exit 0
          fi
          echo "LATEST_COMMIT_SUPERSESSION=PASS"
          echo "LATEST_COMMIT_SHA=$EXPECTED_SHA"
          echo "LATEST_COMMIT_BRANCH=$EXPECTED_BRANCH"
\t' read -r RUN_ID HEAD_SHA STATUS NAME EVENT; do
            [ -n "$RUN_ID" ] || continue
            if [ "$HEAD_SHA" = "$CURRENT_SHA" ]; then
              echo "KEEP current SHA run=$RUN_ID name=$NAME status=$STATUS"
              continue
            fi
            if is_test_workflow "$NAME"; then
              cancel_stale_run "$RUN_ID" "$HEAD_SHA" "$STATUS" "$NAME" "$EVENT"
            fi
          done < <(
            printf '%s' "$RUNS_JSON" |
              jq -r '.workflow_runs[] | select(.status != "completed") | [.id,.head_sha,.status,.name,.event] | @tsv'
          )

      - name: Assert repository head has not moved during supersession
        if: steps.head.outputs.stale_event != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
          EXPECTED_BRANCH: ${{ steps.head.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BRANCH" --jq '.object.sha')"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "SUPERSESSION_EVENT_OBSOLETE=true"
            echo "SUPERSESSION_HEAD_MOVED old=$EXPECTED_SHA new=$CURRENT_SHA"
            exit 0
          fi
          echo "LATEST_COMMIT_SUPERSESSION=PASS"
          echo "LATEST_COMMIT_SHA=$EXPECTED_SHA"
          echo "LATEST_COMMIT_BRANCH=$EXPECTED_BRANCH"
