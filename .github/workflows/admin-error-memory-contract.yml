name: ADMIN Error Memory Contract

on:
  push:
    branches: [main]
    paths:
      - 'api/admin/error-memory.ts'
      - 'scripts/test-admin-error-memory.mjs'
      - '.github/workflows/admin-error-memory-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Error memory contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run bounded error memory contract
        run: node --experimental-strip-types scripts/test-admin-error-memory.mjs
