name: Agent Recovery Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    name: Historical recovery + agent control contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate historical recovery gate
        run: node scripts/ci/validate-agent-recovery-gate.mjs
      - name: Validate Task Agent contract
        run: node scripts/ci/validate-task-agent-contract.mjs
      - name: Validate execution control contract
        run: npm run test:agent-execution-control
