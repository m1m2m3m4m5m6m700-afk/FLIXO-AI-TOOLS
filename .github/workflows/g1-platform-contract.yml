name: G1 Platform Contract Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: g1-platform-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  g1-platform-contract:
    name: G1 Platform Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run consolidated G1 source contract
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/test-platform-contract.mjs
      - name: Install Chromium for G1 runtime boundary
        run: npx playwright install --with-deps chromium
      - name: Build G1 runtime target
        run: npm run build
      - name: Start isolated G1 preview server
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/g1-preview.log 2>&1 &
          echo $! >/tmp/g1-preview.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/g1-preview.log
          exit 1
      - name: Prove every unready tool is non-public at runtime
        run: npx playwright test tests/g1-unready-routes.spec.ts --project=chromium
      - name: Cleanup G1 preview server
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -f /tmp/g1-preview.pid ]; then
            PID="$(cat /tmp/g1-preview.pid)"
            PGID="$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' )"
            if [ -n "$PGID" ] && [ "$PGID" != "1" ]; then kill -- -"$PGID" 2>/dev/null || true; fi
          fi
