name: G1 Platform Contract Diagnostic

# Canonical G1 execution is owned by the main CI contract graph.
# This workflow is manual forensic execution only.
on:
  workflow_dispatch:

concurrency:
  group: g1-platform-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g1-platform-contract:
    name: G1 Platform Contract (manual diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_URL: https://flixoai.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run consolidated G1 contract
        run: node --import=./scripts/register-node-resolver.mjs --experimental-strip-types scripts/test-platform-contract.mjs
