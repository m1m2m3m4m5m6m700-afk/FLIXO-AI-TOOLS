name: CI — Fast Incremental

# Canonical PR fast path now lives in ci.yml. Keep this workflow manual-only as a diagnostic tool.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast Incremental Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run impact-aware verification
        env:
          CHANGE_BASE: origin/main
          VITE_SITE_URL: https://flixoai.vercel.app
        run: node scripts/ci/fast-verify.mjs
      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-ci-diagnostic-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
