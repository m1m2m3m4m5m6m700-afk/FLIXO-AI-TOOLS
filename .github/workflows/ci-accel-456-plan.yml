name: CI ACCEL 4-6 Plan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: ACCEL 4-6 — Plan + Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Generate ACCEL 4-6 plan
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/accel-456-plan.mjs --mode=${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      - name: Validate Playwright runtime policy
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const x=fs.readFileSync("playwright.config.ts","utf8"); for (const token of ["trace: \'on-first-retry\'","screenshot: \'only-on-failure\'","video: \'retain-on-failure\'"]) if(!x.includes(token)) throw new Error(`Missing runtime policy: ${token}`);'
      - name: Publish ACCEL plan evidence
        uses: actions/upload-artifact@v6
        with:
          name: flixo-accel-456-plan-${{ github.run_id }}
          path: diagnostics/ci/accel-456-plan.json
          if-no-files-found: error
          retention-days: 14
