name: Lockfile Consistency
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --json > audit.json || true
      - name: Upload generated dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-cleanup-evidence
          path: |
            package-lock.json
            audit.json
      - name: Ensure lockfile is synchronized
        run: git diff --exit-code -- package.json package-lock.json
