name: One-time lockfile sync
on:
  push:
    branches:
      - deps/type-only-qrcode-v1
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/deps/type-only-qrcode-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/_temporary-sync-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "chore: synchronize package lockfile"
          git push
