name: Foundation Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --experimental-strip-types scripts/test-foundation-contracts.mjs
