name: Agent Coordination

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replay swarm state before projection rebuild
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/ci/swarm-engine.mjs --replay-only
      - name: Self-heal agent projections from immutable ledger
        env:
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
          FLIXO_AGENT_CLAIMS_FILE: .ci/agent-coordination/claims.json
          FLIXO_AGENT_SESSIONS_FILE: scripts/ci/active-sessions.json
        run: node scripts/ci/rebuild-agent-projections.mjs
      - name: Validate claims protocol
        run: node scripts/ci/validate-agent-coordination-protocol.mjs
      - name: Validate work queue
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
        run: node scripts/ci/validate-agent-work-queue.mjs
      - name: Validate swarm event-sourced state
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
          FLIXO_SWARM_WORK_QUEUE: .ci/agent-coordination/work-queue.json
        run: node --experimental-strip-types scripts/ci/validate-swarm-state.mjs
      - name: Validate local agent sessions from ledger
        env:
          FLIXO_AGENT_COORDINATION_STRICT_SHA: 'true'
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
        run: node scripts/ci/validate-agent-sessions.mjs
      - name: Validate protocol cooperation graph
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/validate-protocol-cooperation.mjs
      - name: Validate cross-branch collisions from ledgers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
        run: node scripts/ci/validate-agent-pr-collisions.mjs
      - name: Replay swarm state after packet validation
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/ci/swarm-engine.mjs --replay-only
      - name: Revalidate swarm state after packet validation
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLIXO_SWARM_LEDGER: artifacts/ci/agent-coordination/events.ndjson
          FLIXO_SWARM_WORK_QUEUE: .ci/agent-coordination/work-queue.json
        run: node --experimental-strip-types scripts/ci/validate-swarm-state.mjs
      - name: Build coordination dashboard
        run: node scripts/ci/agent-coordination-dashboard.mjs
      - name: Audit coordination state
        run: node scripts/ci/agent-coordination-state.mjs
      - name: Upload coordination evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-coordination-${{ github.run_id }}
          path: artifacts/ci/agent-coordination
          if-no-files-found: error
