name: Read-Only Code Scout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    name: Read-only repository analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install committed graph
        run: npm ci

      - name: Validate scout contract
        run: npm run validate:code-scout

      - name: Run read-only code scout
        env:
          EXPECTED_SHA: ${{ github.sha }}
          INVESTIGATION_DIR: diagnostics/investigation
        run: npm run agent:code-scout

      - name: Upload investigation report
        if: always()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: code-scout-report-${{ github.run_id }}
          path: diagnostics/investigation/code-scout-latest.json
          if-no-files-found: error
          retention-days: 14
