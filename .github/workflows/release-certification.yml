name: Release Certification

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-release:
    name: Release Socket Supply Chain Gate
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - name: Require Socket Security secret
        run: |
          set -euo pipefail
          if [[ -z "$SOCKET_SECURITY_API_KEY" ]]; then
            echo 'SOCKET_SECURITY_API_KEY is required for release certification.'
            echo 'Configure it as a GitHub Actions repository or environment secret before releasing.'
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run blocking Socket supply-chain scan
        run: npx --yes @socketsecurity/cli@1.1.158 ci

  engineering-gate:
    name: Engineering Release Gate
    needs: [socket-release]
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for canonical GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "Canonical CI did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for canonical G1 Platform Contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow g1-platform-contract.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "G1 Platform Contract did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for canonical G4 Localization + SEO Matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow localization-20.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "G4 Localization + SEO Matrix did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for canonical Full Matrix Parallel certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow full-matrix-parallel.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "Canonical Full Matrix Parallel certification did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for exact production deployment
        env:
          PRODUCTION_ORIGIN: https://flixoai.vercel.app
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if manifest="$(curl --fail --silent --show-error --max-time 15 "$PRODUCTION_ORIGIN/_flixo_build_manifest.json" 2>/dev/null)"; then
              sha="$(node -e "const m=JSON.parse(process.argv[1]); console.log(m.sha ?? m.commit_sha ?? '')" "$manifest")"
              echo "Production deployed SHA: $sha"
              if [[ "$sha" == "$GITHUB_SHA" ]]; then exit 0; fi
            fi
            sleep 10
          done
          echo "Production deployment did not expose exact SHA $GITHUB_SHA within the certification window."
          exit 1

      - name: Verify production surface and every public route
        env:
          PRODUCTION_ORIGIN: https://flixoai.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_CERT_TIMEOUT_MS: '15000'
          PRODUCTION_CERT_CONCURRENCY: '12'
        run: node scripts/validate-production-certification.mjs

      - name: Write release evidence
        run: |
          {
            echo '## FLIXO Release Certification'
            echo
            echo "Engineering gate: PASS"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Required engineering evidence:'
            echo '- Blocking Socket supply-chain scan: PASS for version tags'
            echo '- Canonical GitHub CI: PASS'
            echo '- G1 Platform Contract: PASS'
            echo '- G4 Localization + SEO Matrix: PASS'
            echo '- Full Matrix Parallel certification: PASS'
            echo '- Exact production deployment SHA: PASS'
            echo '- Every sitemap public route: PASS'
            echo '- Production canonical/lang/hreflang/robots contract: PASS'
            echo '- Performance and security checks remain owned by repository blocking gates.'
            echo
            echo 'Deployment provider:'
            echo '- Vercel: EXTERNAL / observed directly through canonical production certification'
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-provider:
    name: Deployment Provider (External)
    runs-on: ubuntu-latest
    steps:
      - name: Record external deployment status
        run: |
          {
            echo '## External Deployment Provider'
            echo
            echo 'Provider: Vercel'
            echo 'Classification: deployment evidence, not an independent application correctness gate'
            echo 'Production correctness is determined by the canonical production certification above.'
          } >> "$GITHUB_STEP_SUMMARY"
