name: Release Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-gate:
    name: Engineering Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for canonical GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            result="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Canonical CI did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for full browser matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            result="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow full-matrix-promotion.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Full browser matrix did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Write release evidence
        run: |
          {
            echo '## FLIXO Release Certification'
            echo
            echo "Engineering gate: PASS"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Required engineering evidence:'
            echo '- Canonical GitHub CI: PASS'
            echo '- Full browser matrix (Chromium/Firefox/WebKit): PASS'
            echo '- Performance and security checks are owned by GitHub CI and its promotion workflows.'
            echo
            echo 'Deployment provider:'
            echo '- Vercel: EXTERNAL / NON-BLOCKING'
            echo '- A Vercel failure does not invalidate engineering certification when the provider reports an external deployment-plan or build-rate-limit condition.'
            echo '- This gate never fabricates or overrides Vercel status; it records the separation explicitly.'
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-provider:
    name: Deployment Provider (External)
    runs-on: ubuntu-latest
    steps:
      - name: Record external deployment status
        run: |
          {
            echo '## External Deployment Provider'
            echo
            echo 'Provider: Vercel'
            echo 'Classification: external / non-blocking for engineering certification'
            echo 'Reason: deployment-provider availability, plan limits, and build quotas are outside repository engineering correctness.'
            echo 'No code or test is weakened by this classification.'
          } >> "$GITHUB_STEP_SUMMARY"
