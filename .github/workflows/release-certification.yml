name: Release Certification

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-release:
    name: Release Socket Supply Chain Gate
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - name: Require Socket Security secret
        run: |
          set -euo pipefail
          if [[ -z "$SOCKET_SECURITY_API_KEY" ]]; then
            echo 'SOCKET_SECURITY_API_KEY is required for release certification.'
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run blocking Socket supply-chain scan
        run: npx --yes @socketsecurity/cli@1.1.158 ci

  engineering-gate:
    name: Engineering Release Gate
    needs: [socket-release]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for canonical GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "Canonical CI did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Wait for canonical Full Matrix Parallel certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow full-matrix-parallel.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,databaseId)"
            echo "$result"
            status="$(node -e "const r=$result; console.log(r[0]?.status ?? '')")"
            conclusion="$(node -e "const r=$result; console.log(r[0]?.conclusion ?? '')")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            sleep 10
          done
          echo "Canonical Full Matrix Parallel certification did not complete successfully for $GITHUB_SHA."
          exit 1

      - name: Verify production surface
        env:
          PRODUCTION_ORIGIN: https://flixoai.vercel.app
        run: node scripts/validate-production-certification.mjs

      - name: Write release evidence
        run: |
          {
            echo '## FLIXO Release Certification'
            echo
            echo 'Engineering gate: PASS'
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Blocking evidence:'
            echo '- Socket supply-chain scan: PASS'
            echo '- Canonical GitHub CI: PASS'
            echo '- Full Matrix Parallel certification: PASS'
            echo '- Production surface certification: PASS'
            echo
            echo 'Vercel provider-side quota status is recorded separately and never converted into an engineering PASS.'
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-provider:
    name: Deployment Provider (External)
    runs-on: ubuntu-latest
    steps:
      - name: Record external deployment status
        run: |
          {
            echo '## External Deployment Provider'
            echo
            echo 'Provider: Vercel'
            echo 'Classification: external dependency; provider failures remain failures for release freshness.'
          } >> "$GITHUB_STEP_SUMMARY"
