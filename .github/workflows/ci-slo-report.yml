name: CI SLO Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-slo-report-main
  cancel-in-progress: true

jobs:
  report:
    name: CI SLO Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Measure completed main certification runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-slo-report.mjs
      - name: Upload SLO evidence
        uses: actions/upload-artifact@v6
        with:
          name: ci-slo-${{ github.sha }}
          path: diagnostics/ci-slo.json
          if-no-files-found: error
          retention-days: 30
