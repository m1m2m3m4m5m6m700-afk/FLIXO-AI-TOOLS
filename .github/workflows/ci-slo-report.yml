name: CI SLO Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-slo-report-main
  cancel-in-progress: true

jobs:
  report:
    name: CI SLO Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Measure completed main certification runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-slo-report.mjs
      - name: Upload SLO evidence
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: ci-slo-${{ github.sha }}
          path: diagnostics/ci-slo.json
          if-no-files-found: error
          retention-days: 30
