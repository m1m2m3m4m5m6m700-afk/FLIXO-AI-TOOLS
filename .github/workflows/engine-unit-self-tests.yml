name: CI Engine Self-Tests

# Diagnostic-only engine verification. Never gates PR or release decisions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-self-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-self-tests:
    name: Engine self-tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run engine unit suite
        run: npm run test:engine
      - name: Record diagnostic result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Engine self-test diagnostic result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
