name: FLIXO Auto Repair Executor

# Supervising validation lane: consumes only a verified, bounded repair handoff
# produced by FLIXO Auto Repair Bot, validates it against current main, and
# never bypasses the PR/canonical merge gate.
on:
  workflow_run:
    workflows: ["FLIXO Auto Repair Bot"]
    types: [completed]
    branches: [main]
  push:
    branches: [execution]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: flixo-auto-repair-executor-main
  cancel-in-progress: false

env:
  REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}
  REPAIR_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  push-scope-check:
    name: Non-publishing execution push guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm workflow_run-only publication boundary
        run: |
          set -euo pipefail
          echo 'Execution push observed; Auto Repair Executor publication remains workflow_run-only.'
          echo 'No repository mutation, deployment, or merge occurs in this push guard.'

  execute:
    name: Validate verified repair handoff
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect repair source job
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh run view "$REPAIR_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "Single-lane diagnose, execute, verify and learn on execution") | .conclusion] | first // "skipped"')"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          test "$conclusion" = success

      - name: Download repair bundle
        id: bundle
        if: steps.source.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flixo-executor
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("flixo-auto-repair-"))] | first | .id // empty')"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/flixo-executor/bundle.zip
          unzip -q /tmp/flixo-executor/bundle.zip -d /tmp/flixo-executor/extracted
          for required in flixo-engine-outcome flixo-learning-outcome flixo-prepared-repair-handoff.json flixo-prepared-repair.patch; do
            source="$(find /tmp/flixo-executor/extracted -type f -name "$required" -print -quit)"
            test -n "$source"
            cp "$source" "/tmp/flixo-executor/$required"
          done

      - name: Require verified repair handoff and exact commit binding
        id: handoff
        if: steps.bundle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTCOME="$(cat /tmp/flixo-executor/flixo-engine-outcome)"
          LEARNING="$(cat /tmp/flixo-executor/flixo-learning-outcome)"
          case "$OUTCOME" in
            verified-repair) test "$LEARNING" = "success" ;;
            verified-historical-revert) test "$LEARNING" = "reverted-repair" ;;
            *) echo "FAIL CLOSED: unsupported repair outcome=$OUTCOME"; exit 1 ;;
          esac
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h = JSON.parse(fs.readFileSync('/tmp/flixo-executor/flixo-prepared-repair-handoff.json','utf8'));
          const sha40 = /^[a-f0-9]{40}$/u;
          const sha64 = /^[a-f0-9]{64}$/u;
          const runId = /^\d+$/u;
          for (const key of ['repairRunId','targetFailureRunId','chainId','failedSha','sourceSha','controllerSha','executionSha','parentSha','fingerprint','selectedRule','patchSha256']) {
            if (h[key] === undefined || h[key] === null || h[key] === '') throw new Error(`missing handoff field: ${key}`);
          }
          if (!['VERIFIED_REPAIR','VERIFIED_HISTORICAL_REVERT'].includes(h.mode)) throw new Error(`invalid handoff mode: ${h.mode}`);
          if (h.applyBy !== 'AUTO_REPAIR_BOT') throw new Error(`invalid handoff owner: ${h.applyBy}`);
          if (h.requiresCanonicalCI !== true) throw new Error('canonical CI requirement missing');
          if (h.repository !== process.env.GITHUB_REPOSITORY) throw new Error('repository mismatch');
          if (h.headBranch !== 'execution' || h.baseBranch !== 'main') throw new Error('branch binding mismatch');
          if (!runId.test(String(h.repairRunId)) || !runId.test(String(h.targetFailureRunId))) throw new Error('run id format invalid');
          if (!sha40.test(String(h.failedSha)) || !sha40.test(String(h.sourceSha)) || !sha40.test(String(h.controllerSha)) || !sha40.test(String(h.executionSha)) || !sha40.test(String(h.parentSha))) throw new Error('commit sha format invalid');
          if (!sha64.test(String(h.fingerprint)) || !sha64.test(String(h.patchSha256))) throw new Error('digest format invalid');
          if (h.sourceSha !== h.parentSha) throw new Error('sourceSha must equal committed parentSha');
          if (!Array.isArray(h.changedPaths) || h.changedPaths.length === 0 || h.changedPaths.some((p) => typeof p !== 'string' || !p)) throw new Error('changedPaths invalid');
          NODE
          H="$(cat /tmp/flixo-executor/flixo-prepared-repair-handoff.json)"
          REPAIR_ID="$(printf '%s' "$H" | jq -r '.repairRunId')"
          TARGET_FAILURE_RUN_ID="$(printf '%s' "$H" | jq -r '.targetFailureRunId')"
          FAILED_SHA="$(printf '%s' "$H" | jq -r '.failedSha')"
          SOURCE_SHA="$(printf '%s' "$H" | jq -r '.sourceSha')"
          CONTROLLER_SHA="$(printf '%s' "$H" | jq -r '.controllerSha')"
          EXECUTION_SHA="$(printf '%s' "$H" | jq -r '.executionSha')"
          PARENT_SHA="$(printf '%s' "$H" | jq -r '.parentSha')"
          PATCH_SHA="$(printf '%s' "$H" | jq -r '.patchSha256')"
          test "$REPAIR_ID" = "$REPAIR_RUN_ID"
          TARGET_FAILED_SHA="$(gh run view "$TARGET_FAILURE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$TARGET_FAILED_SHA" = "$FAILED_SHA"
          REMOTE_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$REMOTE_EXECUTION_SHA" = "$EXECUTION_SHA"
          git fetch --no-tags origin main execution "$EXECUTION_SHA" "$SOURCE_SHA" "$FAILED_SHA" "$CONTROLLER_SHA"
          test "$(git rev-parse "$EXECUTION_SHA")" = "$REMOTE_EXECUTION_SHA"
          test "$(git rev-parse "$PARENT_SHA")" = "$PARENT_SHA"
          test "$(git rev-parse "$SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(git rev-parse "$FAILED_SHA")" = "$FAILED_SHA"
          test "$(git rev-parse "$CONTROLLER_SHA")" = "$CONTROLLER_SHA"
          git merge-base --is-ancestor "$FAILED_SHA" "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$EXECUTION_SHA"
          git merge-base --is-ancestor "$CONTROLLER_SHA" "$(git rev-parse origin/main)"
          HANDOFF_PATCH=/tmp/flixo-executor/canonical-repair.patch
          git diff --binary "$PARENT_SHA" "$EXECUTION_SHA" > "$HANDOFF_PATCH"
          test -s "$HANDOFF_PATCH"
          ACTUAL_PATCH_SHA="$(sha256sum "$HANDOFF_PATCH" | awk '{print $1}')"
          test "$ACTUAL_PATCH_SHA" = "$PATCH_SHA"
          git diff --name-only "$PARENT_SHA" "$EXECUTION_SHA" | LC_ALL=C sort > /tmp/flixo-executor/actual-changed-paths.txt
          jq -r '.changedPaths[]' /tmp/flixo-executor/flixo-prepared-repair-handoff.json | LC_ALL=C sort > /tmp/flixo-executor/handed-changed-paths.txt
          diff -u /tmp/flixo-executor/handed-changed-paths.txt /tmp/flixo-executor/actual-changed-paths.txt
          PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head execution --state open --json number,headRefOid)"
          PRS="$PRS" EXECUTION_SHA="$EXECUTION_SHA" node -e 'const p=JSON.parse(process.env.PRS); const h=process.env.EXECUTION_SHA; const ok=p.filter(x=>x.headRefOid===h); if(ok.length!==1) throw new Error(`expected exactly one execution PR at handoff SHA; got ${ok.length}`);'
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Validate exact execution commit without publication
        if: steps.handoff.outputs.ready == 'true'
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(jq -r '.executionSha' /tmp/flixo-executor/flixo-prepared-repair-handoff.json)"
          PARENT_SHA="$(jq -r '.parentSha' /tmp/flixo-executor/flixo-prepared-repair-handoff.json)"
          git fetch origin main execution
          git checkout --detach "$EXECUTION_SHA"
          test -z "$(git branch --show-current)" || { echo 'FAIL CLOSED: validation must run detached; no third branch allowed.'; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          git diff --check "$PARENT_SHA" "$EXECUTION_SHA"
          printf '%s
' "$EXECUTION_SHA" > /tmp/flixo-executor/validated-execution-sha.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changed=fs.readFileSync('/tmp/flixo-executor/actual-changed-paths.txt','utf8').trim().split('
').filter(Boolean);
          const neverModify=[
            '.github/workflows/ci.yml','.github/workflows/deploy-flixoai.yml','.github/workflows/auto-repair.yml','.github/workflows/auto-repair-executor.yml','.github/workflows/auto-repair-merge-gate.yml','.github/workflows/execution-sync.yml','.github/workflows/wp0-trust-baseline.yml','.github/workflows/repair-seed.yml','package-lock.json','.env',
          ];
          const protectedAreas=[
            'scripts/ci/certification-engine.mjs','scripts/ci/validate-execution-graph.mjs','scripts/ci/auto-repair-policy.mjs','scripts/ci/auto-repair-engine.mjs','scripts/ci/auto-repair-learning.mjs','scripts/ci/auto-repair-proof.mjs','scripts/ci/auto-repair/','scripts/ci/task-agent.mjs','scripts/ci/agent-execution-control.mjs','scripts/ci/repository-security-baseline.mjs','scripts/ci/validate-auto-repair-memory.mjs','scripts/ci/validate-certification-surface.mjs','scripts/ci/validate-ci-cd-trust.mjs','scripts/ci/validate-wp0-trust-baseline.mjs','tests/seed.spec.ts',
          ];
          const blocked=changed.filter((p)=>neverModify.includes(p)||protectedAreas.some((prefix)=>prefix.endsWith('/') ? p.startsWith(prefix) : p===prefix));
          if(blocked.length){console.error(JSON.stringify({blocked},null,2));process.exit(1)}
          NODE

      - name: Validate prepared repair patch against current main without publication
        if: steps.handoff.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test -z "$(git branch --show-current)" || { echo 'FAIL CLOSED: validation must run detached; no third branch allowed.'; exit 1; }
          git apply --check /tmp/flixo-executor/flixo-prepared-repair.patch
          git apply --index /tmp/flixo-executor/flixo-prepared-repair.patch
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          printf '%s
' "$changed" > /tmp/flixo-executor/changed-files.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changed=fs.readFileSync('/tmp/flixo-executor/changed-files.txt','utf8').trim().split('
').filter(Boolean);
          const neverModify=['.github/workflows/ci.yml','.github/workflows/deploy-flixoai.yml','.github/workflows/auto-repair.yml','.github/workflows/repair-seed.yml','package-lock.json','.env'];
          const protectedAreas=['scripts/ci/certification-engine.mjs','scripts/ci/validate-execution-graph.mjs','tests/seed.spec.ts'];
          const blocked=changed.filter((p)=>neverModify.includes(p)||protectedAreas.includes(p));
          if(blocked.length){console.error(JSON.stringify({blocked},null,2));process.exit(1)}
          NODE
          git diff --cached --check

      - name: Run independent validation of prepared repair
        if: steps.handoff.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          node scripts/test.mjs --mode=diagnose --gate=static
          node scripts/test.mjs --mode=diagnose --gate=build

      - name: Confirm repair remains PR/canonical-CI gated
        if: steps.handoff.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'The executor never pushes directly to main.'
          echo 'The Auto Repair Bot prepares the verified repair; execution → main PR, canonical CI, and the merge gate own publication.'
          open_execution_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head execution --state open --json number,headRefName,statusCheckRollup --jq '.[] | [.number,.headRefName] | @tsv')"
          test -n "$open_execution_prs" || { echo 'FAIL CLOSED: no canonical execution → main PR is open.'; exit 1; }
          printf '%s\n' "$open_execution_prs" | tee /tmp/flixo-executor/open-repair-prs.txt

      - name: Record execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flixo-auto-repair-execution-${{ github.run_id }}
          path: /tmp/flixo-executor/
          if-no-files-found: warn
          retention-days: 30