name: P3 Lock Repair Once

on:
  push:
    branches: [feat/p3-production-llm-provider]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/p3-production-llm-provider
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify manifest-lock parity
        run: node scripts/validate-lock-manifest-contract.mjs
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'Lockfile already synchronized'; exit 0; }
          git commit -m 'fix(ci): synchronize package lockfile with manifest'
          git push origin HEAD:feat/p3-production-llm-provider
      - name: Remove one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p3-lock-repair-once.yml
          git commit -m 'chore(ci): remove one-time lock repair workflow'
          git push origin HEAD:feat/p3-production-llm-provider
