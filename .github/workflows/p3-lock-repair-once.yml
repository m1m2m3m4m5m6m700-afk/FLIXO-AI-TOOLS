name: P3 One-Time Lock Repair

on:
  push:
    branches: [feat/p3-production-llm-provider]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore(ci): finalize P3 lock repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/p3-production-llm-provider
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Verify lock/manifest parity
        run: npm run validate:lock-manifest
      - name: Finalize and dispatch exact-SHA verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/p3-lock-repair-once.yml
          git diff --cached --quiet && { echo 'No lockfile change produced'; exit 1; }
          git commit -m 'chore(ci): finalize P3 lock repair'
          git push origin HEAD:feat/p3-production-llm-provider
          SHA="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref feat/p3-production-llm-provider
          echo "LOCK_REPAIR_FINAL_SHA=$SHA"
