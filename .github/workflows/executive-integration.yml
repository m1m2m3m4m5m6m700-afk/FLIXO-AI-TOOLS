name: FLIXO CI — Executive Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: executive-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  executive-integration:
    name: Executive Contract Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run focused integration suite
        run: npm run test:integration:executive
