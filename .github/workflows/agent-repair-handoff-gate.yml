name: FLIXO Agent Repair Handoff Gate

on:
  workflow_run:
    workflows: ["FLIXO Auto Repair Bot"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-repair-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}
  REPAIR_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  validate-handoff:
    name: Validate repair handoff boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validators from main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect repair run state
        id: repair-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repair_job_conclusion="$(gh run view "$REPAIR_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "Single-lane diagnose, prepare, verify and learn") | .conclusion] | first // "skipped"')"
          echo "repair_job_conclusion=$repair_job_conclusion" >> "$GITHUB_OUTPUT"
          if [ "$repair_job_conclusion" = "skipped" ]; then
            echo "Repair job was skipped; no handoff artifact is expected. Gate records SKIPPED rather than failing on a missing artifact."
          fi

      - name: Download repair handoff artifact
        if: steps.repair-state.outputs.repair_job_conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-handoff
          gh run download "$REPAIR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "flixo-auto-repair-${REPAIR_RUN_ID}" \
            -D /tmp/repair-handoff

      - name: Validate handoff contract and publication boundary
        if: steps.repair-state.outputs.repair_job_conclusion != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/repair-handoff
          test -f flixo-prepared-repair-handoff.json
          test -f flixo-engine-outcome
          test -f flixo-learning-outcome
          test -f flixo-root-cause.json
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("flixo-prepared-repair-handoff.json","utf8")); const o=fs.readFileSync("flixo-engine-outcome","utf8").trim(); const l=fs.readFileSync("flixo-learning-outcome","utf8").trim(); if(h.mode!=="PREPARATION_ONLY") throw new Error(`Invalid mode: ${h.mode}`); if(h.applyBy!=="SUPERVISING_EXECUTION_AGENT") throw new Error(`Invalid owner: ${h.applyBy}`); if(h.sourcePublishByBot!==false) throw new Error("Bot source publication boundary violated"); if(o==="verified-repair"&&l!=="success") throw new Error("Verified repair without successful learning outcome"); if(o!=="verified-repair"&&l==="success") throw new Error("Learning marked success for unverified repair");'

      - name: Record machine-readable handoff decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-handoff
          if [ "${{ steps.repair-state.outputs.repair_job_conclusion }}" = "skipped" ]; then
            REPAIR_RUN_ID="$REPAIR_RUN_ID" REPAIR_SHA="$REPAIR_SHA" node -e 'const fs=require("fs"); const result={schemaVersion:1,protocol:"AGENT-REPAIR-HANDOFF-GATE-v1",repairRunId:process.env.REPAIR_RUN_ID,failedSha:process.env.REPAIR_SHA,gateState:"SKIPPED_SOURCE_RUN",decision:"NO_HANDOFF_TO_APPLY",generatedAt:new Date().toISOString()}; fs.writeFileSync("/tmp/repair-handoff/repair-handoff-gate.json",JSON.stringify(result,null,2)+"\n");'
          else
            cd /tmp/repair-handoff
            outcome="$(cat flixo-engine-outcome)"
            learning="$(cat flixo-learning-outcome)"
            OUTCOME="$outcome" LEARNING="$learning" REPAIR_RUN_ID="$REPAIR_RUN_ID" REPAIR_SHA="$REPAIR_SHA" node -e 'const fs=require("fs"); const crypto=require("crypto"); const f="flixo-prepared-repair-handoff.json"; const h=JSON.parse(fs.readFileSync(f,"utf8")); const o=process.env.OUTCOME; const l=process.env.LEARNING; const result={schemaVersion:1,protocol:"AGENT-REPAIR-HANDOFF-GATE-v1",repairRunId:process.env.REPAIR_RUN_ID,failedSha:process.env.REPAIR_SHA,mode:h.mode,applyBy:h.applyBy,sourcePublishByBot:h.sourcePublishByBot,engineOutcome:o,learningOutcome:l,decision:o==="verified-repair"&&l==="success"?"READY_FOR_EXECUTIVE_REVIEW":"ESCALATION_ONLY",handoffSha256:crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex"),generatedAt:new Date().toISOString()}; fs.writeFileSync("repair-handoff-gate.json",JSON.stringify(result,null,2)+"\n");'
          fi

      - name: Upload handoff gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-repair-handoff-gate-${{ github.event.workflow_run.id }}
          path: /tmp/repair-handoff/repair-handoff-gate.json
          if-no-files-found: error
          retention-days: 30
