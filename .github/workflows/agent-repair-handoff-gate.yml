name: FLIXO Agent Repair Handoff Gate

on:
  workflow_run:
    workflows: ["FLIXO Auto Repair Bot"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: flixo-execution-mutation-lane
  cancel-in-progress: false

env:
  REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}
  REPAIR_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  REPAIR_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
  GH_TOKEN: ${{ github.token }}

jobs:
  publish-approved-repair:
    if: github.event.workflow_run.conclusion == 'success'
    name: Publish exact Chair-approved repair to execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main validators
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed when source repair run is superseded
        env:
          SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SOURCE_RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$SOURCE_RUN_BRANCH" = "main"
          LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$LIVE_MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$LIVE_MAIN_SHA" = "$SOURCE_RUN_SHA" || {
            echo "FAIL CLOSED: source Auto Repair run is superseded by a newer main head."
            echo "SOURCE_RUN_SHA=$SOURCE_RUN_SHA"
            echo "LIVE_MAIN_SHA=$LIVE_MAIN_SHA"
            exit 1
          }
          echo "WORKFLOW_RUN_SOURCE_CURRENT=1 SHA=$SOURCE_RUN_SHA BRANCH=$SOURCE_RUN_BRANCH LIVE_MAIN_HEAD=$LIVE_MAIN_SHA"

      - name: Download exact Auto Repair publication package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPAIR_RUN_ID }}
          name: flixo-auto-repair-publication-${{ env.REPAIR_RUN_ID }}
          path: /tmp/repair-publication

      - name: Validate immutable Chair publication package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/repair-publication
          test "$REPAIR_SOURCE_BRANCH" = "main"

          test -s flixo-prepared-repair-handoff.json
          test -s flixo-prepared-repair.patch
          test -s flixo-candidate.bundle
          test -s flixo-candidate.bundle.sha256
          test -s flixo-chair1-audit.json
          test -s flixo-master-repair-governor.json
          test -s flixo-head-authority.json
          test -s flixo-mutation-admission.json
          test -s flixo-chair-publication.json
          test -s flixo-chair-publication-request.json

          sha256sum -c flixo-candidate.bundle.sha256

          CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          export CURRENT_EXECUTION_SHA
          export HANDOFF_EXECUTION_SHA
          export HANDOFF_PARENT_SHA
          CANDIDATE_SHA="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.executionSha||'')")"
          PARENT_SHA="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.parentSha||'')")"
          HANDOFF_TARGET_SHA="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.failedSha||'')")"
          HANDOFF_BRANCH="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.headBranch||'')")"
          HANDOFF_EXECUTION_SHA="$CANDIDATE_SHA"
          HANDOFF_PARENT_SHA="$PARENT_SHA"

          node -e "const h=require('./flixo-prepared-repair-handoff.json');if(h.protocol!=='AGENT-REPAIR-HANDOFF-GATE-v4')throw new Error('HANDOFF_PROTOCOL_INVALID');if(!['VERIFIED_REPAIR','VERIFIED_HISTORICAL_REVERT'].includes(h.mode))throw new Error('HANDOFF_MODE_INVALID');if(h.applyBy!=='AUTO_REPAIR_BOT')throw new Error('HANDOFF_APPLIER_INVALID');if(h.requiresCanonicalCI!==true)throw new Error('HANDOFF_CANONICAL_CI_REQUIRED');if(h.noDirectPushByExecutor!==undefined&&h.noDirectPushByExecutor!==true)throw new Error('HANDOFF_DIRECT_PUSH_FLAG_INVALID');" 
          test "$HANDOFF_BRANCH" = "execution"
          test "$HANDOFF_EXECUTION_SHA" = "$CANDIDATE_SHA"
          test "$HANDOFF_PARENT_SHA" = "$PARENT_SHA"
          test "$HANDOFF_TARGET_SHA" = "$PARENT_SHA"
          test "$CANDIDATE_SHA" != "$PARENT_SHA"
          test "$CURRENT_EXECUTION_SHA" = "$PARENT_SHA"

          git fetch --no-tags origin refs/heads/execution:refs/remotes/origin/execution
          test "$(git rev-parse refs/remotes/origin/execution)" = "$PARENT_SHA"

          git bundle verify ./flixo-candidate.bundle
          git fetch ./flixo-candidate.bundle refs/flixo/repair-candidate:refs/flixo/repair-candidate
          test "$(git rev-parse refs/flixo/repair-candidate)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^1")" = "$PARENT_SHA"

          DERIVED_PATCH=/tmp/flixo-derived-repair.patch
          git diff --binary "$PARENT_SHA" "$CANDIDATE_SHA" > "$DERIVED_PATCH"
          DERIVED_PATCH_SHA256="$(sha256sum "$DERIVED_PATCH" | awk '{print $1}')"
          HANDOFF_PATCH_SHA256="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.patchSha256||'')")"
          test "$DERIVED_PATCH_SHA256" = "$HANDOFF_PATCH_SHA256"

          git diff --name-only "$PARENT_SHA" "$CANDIDATE_SHA" | sort > /tmp/actual-changed-paths
          node -e "const fs=require('fs');const h=require('./flixo-prepared-repair-handoff.json');const expected=[...(h.changedPaths||[])].sort();const actual=fs.readFileSync('/tmp/actual-changed-paths','utf8').trim().split(/\r?\n/).filter(Boolean);if(JSON.stringify(expected)!==JSON.stringify(actual))throw new Error('HANDOFF_CHANGED_PATHS_MISMATCH')"

          jq -e --arg candidate "$CANDIDATE_SHA" --arg parent "$PARENT_SHA"             '.protocol=="FLIXO-AUTO-REPAIR-CHAIR1-AUDIT-v1" and .chairId=="chair_1" and .decision=="APPROVED" and .candidateSha==$candidate and .exactSha==true and (.reasonCodes|length)==0'             flixo-chair1-audit.json >/dev/null

          jq -e --arg candidate "$CANDIDATE_SHA" --arg parent "$PARENT_SHA"             '.status=="TRUSTED_FOR_PUBLICATION" and .publication==true and .phase=="FINAL" and .target.failureSha==$parent and .target.candidateSha==$candidate and .authority=="INDEPENDENT_FAIL_CLOSED_GOVERNOR"'             flixo-master-repair-governor.json >/dev/null

          jq -e --arg parent "$PARENT_SHA" --arg candidate "$CANDIDATE_SHA"             '.protocol=="FLIXO-EXECUTION-MUTATION-GATE-v1" and .branch=="execution" and .targetSha==$parent and .ownerAgent=="AUTO_REPAIR_BOT"'             flixo-mutation-admission.json >/dev/null

          jq -e --arg parent "$PARENT_SHA" --arg candidate "$CANDIDATE_SHA"             '.protocol=="FLIXO-CHAIR-PUBLICATION-HANDOFF-v1" and .status=="READY_FOR_CHAIR_PUBLICATION" and .targetSha==$parent and .parentSha==$parent and .candidateSha==$candidate and .requiresIndependentChairPublication==true and .noDirectPushByExecutor==true'             flixo-chair-publication-request.json >/dev/null

          ADMISSION_RUN_ID="$(jq -r '.runId' flixo-mutation-admission.json)"
          ADMISSION_RUN_ATTEMPT="$(jq -r '.runAttempt' flixo-mutation-admission.json)"
          test -n "$ADMISSION_RUN_ID"
          test -n "$ADMISSION_RUN_ATTEMPT"
          GITHUB_RUN_ID="$ADMISSION_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$ADMISSION_RUN_ATTEMPT" \
          FLIXO_HEAD_AUTHORITY_PROOF=/tmp/repair-publication/flixo-head-authority.json \
          node scripts/ci/execution-mutation-gate.mjs verify \
            --phase=handoff-pre-push \
            --admission=/tmp/repair-publication/flixo-mutation-admission.json \
            --candidate="$CANDIDATE_SHA" \
            --parent="$PARENT_SHA"

          node scripts/ci/execution-head-authority.mjs verify \
            --file=/tmp/repair-publication/flixo-head-authority.json \
            --target-sha="$PARENT_SHA" \
            --parent-sha="$PARENT_SHA" \
            --candidate-sha="$CANDIDATE_SHA"

          echo "CHAIR_PUBLICATION_PRECHECK=PASS"
          echo "CURRENT_EXECUTION_SHA=$CURRENT_EXECUTION_SHA"
          echo "HANDOFF_EXECUTION_SHA=$HANDOFF_EXECUTION_SHA"

      - name: Publish approved candidate to execution
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/repair-publication
          CANDIDATE_SHA="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.executionSha||'')")"
          PARENT_SHA="$(node -e "const h=require('./flixo-prepared-repair-handoff.json');process.stdout.write(h.parentSha||'')")"
          CURRENT_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          test "$CURRENT_EXECUTION_SHA" = "$PARENT_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^1")" = "$PARENT_SHA"

          PATCHED_SHA="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/execution"             -f sha="$CANDIDATE_SHA"             -F force=false             --jq '.object.sha')"
          test "$PATCHED_SHA" = "$CANDIDATE_SHA"

          LIVE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/execution" --jq '.object.sha')"
          export LIVE_SHA
          test "$LIVE_SHA" = "$CANDIDATE_SHA"

          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("flixo-prepared-repair-handoff.json","utf8"));const receipt={schemaVersion:1,protocol:"FLIXO-CHAIR-EXECUTION-PUBLICATION-v1",sourceRunId:process.env.REPAIR_RUN_ID,sourceBranch:process.env.REPAIR_SOURCE_BRANCH,parentSha:h.parentSha,candidateSha:h.executionSha,executionShaAfterPublication:process.env.LIVE_SHA,authority:"CHAIR_1",publicationTransport:"github-ref-fast-forward",force:false,status:"PUBLISHED_TO_EXECUTION",createdAt:new Date().toISOString()};fs.writeFileSync("/tmp/chair-execution-publication.json",JSON.stringify(receipt,null,2)+"\n");'
          test -s /tmp/chair-execution-publication.json
          echo "EXECUTION_PUBLICATION=PUBLISHED_TO_EXECUTION"
          echo "EXECUTION_PUBLICATION_SHA=$LIVE_SHA"

      - name: Upload Chair publication receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: flixo-chair-execution-publication-${{ env.REPAIR_RUN_ID }}
          path: |
            /tmp/chair-execution-publication.json
            /tmp/repair-publication/flixo-prepared-repair-handoff.json
          if-no-files-found: warn
          retention-days: 30
