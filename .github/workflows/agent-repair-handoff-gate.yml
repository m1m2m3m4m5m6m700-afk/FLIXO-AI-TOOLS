name: FLIXO Agent Repair Handoff Gate

on:
  workflow_run:
    workflows: ["FLIXO Auto Repair Bot"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: flixo-repair-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}
  REPAIR_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  validate-handoff:
    name: Validate repair handoff boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validators from main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect repair run state
        id: repair-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repair_job_conclusion="$(gh run view "$REPAIR_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "Single-lane diagnose, execute, verify and learn on execution") | .conclusion] | first // "skipped"')"
          echo "repair_job_conclusion=$repair_job_conclusion" >> "$GITHUB_OUTPUT"

      - name: Download repair handoff artifact
        if: steps.repair-state.outputs.repair_job_conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-handoff
          artifact_id="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("flixo-auto-repair-"))] | first | .id // empty')"
          test -n "$artifact_id"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/repair-handoff/artifact.zip
          unzip -q /tmp/repair-handoff/artifact.zip -d /tmp/repair-handoff/extracted
          for required in flixo-engine-outcome flixo-learning-outcome flixo-root-cause.json; do
            source="$(find /tmp/repair-handoff/extracted -type f -name "$required" -print -quit)"
            test -n "$source"
            cp "$source" "/tmp/repair-handoff/$required"
          done
          for file in flixo-prepared-repair-handoff.json flixo-prepared-repair.patch flixo-repair-evidence.json; do
            source="$(find /tmp/repair-handoff/extracted -type f -name "$file" -print -quit || true)"
            if [ -n "$source" ]; then cp "$source" "/tmp/repair-handoff/$file"; fi
          done

      - name: Validate canonical handoff contract
        if: steps.repair-state.outputs.repair_job_conclusion != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/repair-handoff
          outcome="$(cat flixo-engine-outcome)"
          learning="$(cat flixo-learning-outcome)"
          if [ "$outcome" = "verified-repair" ]; then
            test -f flixo-prepared-repair-handoff.json
            test -f flixo-prepared-repair.patch
            node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("flixo-prepared-repair-handoff.json","utf8")); if(h.mode!=="VERIFIED_REPAIR") throw new Error(`Invalid mode: ${h.mode}`); if(h.applyBy!=="AUTO_REPAIR_BOT") throw new Error(`Invalid owner: ${h.applyBy}`); if(h.requiresCanonicalCI!==true) throw new Error("Canonical CI requirement missing");'
            test "$learning" = "success"
          else
            test "$learning" != "success"
            echo "No verified repair was produced; recording escalation-only outcome."
          fi

      - name: Record machine-readable handoff decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-handoff
          if [ "${{ steps.repair-state.outputs.repair_job_conclusion }}" = "skipped" ]; then
            REPAIR_RUN_ID="$REPAIR_RUN_ID" REPAIR_SHA="$REPAIR_SHA" node -e 'const fs=require("fs"); const result={schemaVersion:1,protocol:"AGENT-REPAIR-HANDOFF-GATE-v3",repairRunId:process.env.REPAIR_RUN_ID,failedSha:process.env.REPAIR_SHA,gateState:"SKIPPED_SOURCE_RUN",decision:"NO_HANDOFF_TO_APPLY",generatedAt:new Date().toISOString()}; fs.writeFileSync("/tmp/repair-handoff/repair-handoff-gate.json",JSON.stringify(result,null,2)+"\n");'
          else
            cd /tmp/repair-handoff
            outcome="$(cat flixo-engine-outcome)"
            learning="$(cat flixo-learning-outcome)"
            OUTCOME="$outcome" LEARNING="$learning" REPAIR_RUN_ID="$REPAIR_RUN_ID" REPAIR_SHA="$REPAIR_SHA" node -e 'const fs=require("fs"); const crypto=require("crypto"); const hFile="flixo-prepared-repair-handoff.json"; const hasH=fs.existsSync(hFile); const h=hasH?JSON.parse(fs.readFileSync(hFile,"utf8")):{}; const o=process.env.OUTCOME; const l=process.env.LEARNING; const result={schemaVersion:1,protocol:"AGENT-REPAIR-HANDOFF-GATE-v3",repairRunId:process.env.REPAIR_RUN_ID,failedSha:process.env.REPAIR_SHA,mode:h.mode??null,applyBy:h.applyBy??null,requiresCanonicalCI:h.requiresCanonicalCI??null,engineOutcome:o,learningOutcome:l,decision:o==="verified-repair"&&l==="success"&&h.mode==="VERIFIED_REPAIR"&&h.applyBy==="AUTO_REPAIR_BOT"&&h.requiresCanonicalCI===true?"READY_FOR_EXECUTION":"ESCALATION_ONLY",handoffSha256:hasH?crypto.createHash("sha256").update(fs.readFileSync(hFile)).digest("hex"):null,generatedAt:new Date().toISOString()}; fs.writeFileSync("repair-handoff-gate.json",JSON.stringify(result,null,2)+"\n");'
          fi

      - name: Upload handoff gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flixo-repair-handoff-gate-${{ github.event.workflow_run.id }}
          path: /tmp/repair-handoff/repair-handoff-gate.json
          if-no-files-found: error
          retention-days: 30
