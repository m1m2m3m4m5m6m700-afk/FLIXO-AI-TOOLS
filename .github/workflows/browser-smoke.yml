name: Browser Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — ${{ matrix.tool }} — Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: npx playwright test ${{ matrix.spec }} --project=chromium
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-${{ matrix.tool }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
