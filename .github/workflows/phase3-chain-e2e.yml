name: Phase 3 Chain E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/tool-chain-panel.tsx'
      - 'src/lib/tool-chain.ts'
      - 'src/lib/tool-chain-runner.ts'
      - 'src/lib/tool-chain-adapters.ts'
      - 'src/lib/tool-chain-compatibility.ts'
      - 'tests/phase3-tool-chain-e2e.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/phase3-chain-e2e.yml'

permissions:
  contents: read

jobs:
  chain-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Tool chain E2E
        env:
          CI: 'true'
        run: npx playwright test tests/phase3-tool-chain-e2e.spec.ts --reporter=blob
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: phase3-chain-e2e-blob
          path: blob-report/
          if-no-files-found: warn
          retention-days: 2
