name: Matrix CI Recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: matrix-ci-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  recovery:
    name: Matrix/CI Recovery Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: External service circuit preflight
        env:
          FLIXO_EXTERNAL_SERVICE: vercel
          FLIXO_EXTERNAL_CIRCUIT_STATE: ${{ vars.FLIXO_VERCEL_CIRCUIT_STATE || '' }}
        run: node scripts/ci/check-external-circuit.mjs
      - name: Sweep orphaned coordination claims
        run: node scripts/ci/sweep-orphaned-claims.mjs
      - name: Validate swarm work queue
        run: node scripts/ci/validate-agent-work-queue.mjs
      - name: Matrix identity regression
        run: node scripts/ci/test-matrix-test-identity.mjs
      - name: Agent coordination protocol
        run: node --experimental-strip-types scripts/ci/validate-agent-coordination-protocol.mjs
      - name: Session guard
        run: node --experimental-strip-types scripts/ci/validate-agent-sessions.mjs
      - name: Protocol cooperation graph
        env:
          FLIXO_SOURCE_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: node --experimental-strip-types scripts/ci/validate-protocol-cooperation.mjs
      - name: Contract coverage closure
        env:
          FLIXO_SOURCE_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: node --experimental-strip-types scripts/ci/validate-contract-coverage.mjs
      - name: CI architecture coherence
        run: node scripts/ci/validate-architecture.mjs
      - name: Coordination telemetry
        run: node scripts/ci/agent-coordination-dashboard.mjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Build
        run: npm run build
      - name: Upload coordination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-coordination-${{ github.run_id }}
          path: |
            artifacts/ci/agent-coordination/**
            artifacts/ci/external-circuit/**
          if-no-files-found: ignore
