name: SEO Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fast-content-quality:
    name: SEO Content Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate people-first content signals
        run: node --import=./scripts/register-node-resolver.mjs scripts/validate-content-quality.mjs

  full-crawl-certification:
    name: Full Crawl Certification
    needs: fast-content-quality
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:site-origin
      - run: npm run build
      - name: Validate generated crawler HTML
        run: npm run validate:prerender
      - name: Validate generated content quality
        run: node --import=./scripts/register-node-resolver.mjs scripts/validate-prerendered-content.mjs
      - name: Verify sitemap is generated
        shell: bash
        run: |
          test -s public/sitemap.xml
          grep -q 'hreflang' public/sitemap.xml
      - name: Publish crawl evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-crawl-evidence
          path: |
            public/sitemap.xml
            dist/**/index.html
          if-no-files-found: error
          retention-days: 14

  production-seo-configuration:
    name: Production SEO Configuration
    needs: fast-content-quality
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical origin when configured for production
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SEO PRODUCTION CERTIFICATION DEFERRED: SITE_URL is not configured."
            echo "Runtime, E2E, Lighthouse and content-quality checks remain active."
            echo "Production canonical/sitemap certification will activate automatically when Repository Variable SITE_URL is configured."
            exit 0
          fi
          case "$SITE_URL" in
            https://*.vercel.app|http://*.vercel.app|https://*.vercel.sh|http://*.vercel.sh)
              echo "ERROR: SITE_URL must not use a Vercel deployment domain: $SITE_URL" >&2
              exit 1
              ;;
            https://*|http://*)
              echo "PRODUCTION SEO ORIGIN CONFIGURED: $SITE_URL"
              ;;
            *)
              echo "ERROR: SITE_URL must be an absolute HTTP(S) origin: $SITE_URL" >&2
              exit 1
              ;;
          esac
