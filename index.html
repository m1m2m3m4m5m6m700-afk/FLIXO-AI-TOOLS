<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/flixo-logo.svg" />
    <title>FLIXO — Fast browser-first tools</title>
    <script>
      (() => {
        const localeMap = {
          en: ['en', 'ltr'], ar: ['ar', 'rtl'], es: ['es', 'ltr'], fr: ['fr', 'ltr'], de: ['de', 'ltr'],
          ru: ['ru', 'ltr'], zh: ['zh-CN', 'ltr'], hi: ['hi', 'ltr'], id: ['id', 'ltr'], ur: ['ur', 'rtl'],
          ja: ['ja', 'ltr'], pt: ['pt', 'ltr'], it: ['it', 'ltr'], ko: ['ko', 'ltr'], nl: ['nl', 'ltr'],
          pl: ['pl', 'ltr'], tr: ['tr', 'ltr'], vi: ['vi', 'ltr'], th: ['th', 'ltr'], sv: ['sv', 'ltr'],
          ms: ['ms', 'ltr'], uk: ['uk', 'ltr'],
        };
        const resolveLocale = () => localeMap[window.location.pathname.split('/').filter(Boolean)[0] || 'en'] || localeMap.en;
        const applyLocale = () => {
          const [lang, dir] = resolveLocale();
          const html = document.documentElement;
          if (html.getAttribute('lang') !== lang) html.setAttribute('lang', lang);
          if (html.getAttribute('dir') !== dir) html.setAttribute('dir', dir);
        };
        applyLocale();
        new MutationObserver(applyLocale).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['lang', 'dir'],
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
