<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/flixo-logo.svg" />
    <title>FLIXO AI — Fast browser-first tools</title>
    <script>
      (() => {
        const reportStartupFailure = (label, details) => {
          const message = `[G4 STARTUP ${label}] ${details}`;
          console.error(message);
          document.documentElement.setAttribute('data-g4-startup-error', message.slice(0, 1000));
          const pre = document.createElement('pre');
          pre.setAttribute('data-g4-startup-error', 'true');
          pre.style.cssText = 'position:fixed;inset:0;margin:0;padding:24px;overflow:auto;background:#090d12;color:#fff;font:14px/1.5 monospace;white-space:pre-wrap;z-index:2147483647';
          pre.textContent = message;
          document.body?.appendChild(pre);
        };
        window.addEventListener('error', (event) => {
          reportStartupFailure('ERROR', event.error?.stack || event.message || 'unknown error');
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.stack || event.reason.message : String(event.reason);
          reportStartupFailure('UNHANDLED_REJECTION', reason);
        });
      })();
    </script>
    <script>
      (() => {
        const localeMap = {
          en: ['en', 'ltr'], ar: ['ar', 'rtl'], es: ['es', 'ltr'], fr: ['fr', 'ltr'], de: ['de', 'ltr'],
          ru: ['ru', 'ltr'], zh: ['zh-CN', 'ltr'], hi: ['hi', 'ltr'], id: ['id', 'ltr'], ur: ['ur', 'rtl'],
          ja: ['ja', 'ltr'], pt: ['pt', 'ltr'], it: ['it', 'ltr'], ko: ['ko', 'ltr'], nl: ['nl', 'ltr'],
          pl: ['pl', 'ltr'], tr: ['tr', 'ltr'], vi: ['vi', 'ltr'], th: ['th', 'ltr'], sv: ['sv', 'ltr'],
        };
        const candidate = window.location.pathname.split('/').filter(Boolean)[0] ?? 'en';
        const [lang, dir] = localeMap[candidate] ?? localeMap.en;
        const html = document.documentElement;
        // This is the pre-application locale boundary: it must be present before the
        // module graph loads, so client hydration can never begin from an empty locale.
        html.setAttribute('lang', lang);
        html.setAttribute('dir', dir);
        html.setAttribute('data-flixo-locale', candidate in localeMap ? candidate : 'en');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
