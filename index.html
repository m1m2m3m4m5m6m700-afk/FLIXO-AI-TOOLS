<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/flixo-logo.svg" />
    <title>FLIXO — Fast browser-first tools</title>
    <script>
      (() => {
        const supportedLocales = new Set([
          'ar', 'en', 'es', 'fr', 'de', 'hi', 'id', 'it', 'ja', 'ko',
          'ms', 'nl', 'pl', 'pt', 'ru', 'sv', 'th', 'tr', 'uk', 'vi',
        ]);
        const candidate = window.location.pathname.split('/').filter(Boolean)[0] ?? 'en';
        const locale = supportedLocales.has(candidate) ? candidate : 'en';
        const direction = locale === 'ar' ? 'rtl' : 'ltr';
        const html = document.documentElement;
        html.setAttribute('lang', locale);
        html.setAttribute('dir', direction);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
