<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/flixo-logo.svg" />
    <title>FLIXO — Fast browser-first tools</title>
    <script>
      (() => {
        const localeMap = {
          ar: ['ar', 'rtl'], en: ['en', 'ltr'], es: ['es', 'ltr'], fr: ['fr', 'ltr'], de: ['de', 'ltr'],
          hi: ['hi', 'ltr'], id: ['id', 'ltr'], it: ['it', 'ltr'], ja: ['ja', 'ltr'], ko: ['ko', 'ltr'],
          ms: ['ms', 'ltr'], nl: ['nl', 'ltr'], pl: ['pl', 'ltr'], pt: ['pt', 'ltr'], ru: ['ru', 'ltr'],
          sv: ['sv', 'ltr'], th: ['th', 'ltr'], tr: ['tr', 'ltr'], uk: ['uk', 'ltr'], vi: ['vi', 'ltr'],
        };
        const candidate = window.location.pathname.split('/').filter(Boolean)[0] ?? 'en';
        const [lang, dir] = localeMap[candidate] ?? localeMap.en;
        const html = document.documentElement;
        const enforce = () => {
          if (html.getAttribute('lang') !== lang) html.setAttribute('lang', lang);
          if (html.getAttribute('dir') !== dir) html.setAttribute('dir', dir);
          if (html.getAttribute('data-flixo-locale') !== candidate || !localeMap[candidate]) {
            html.setAttribute('data-flixo-locale', localeMap[candidate] ? candidate : 'en');
          }
        };
        enforce();
        const observer = new MutationObserver(enforce);
        observer.observe(html, { attributes: true, attributeFilter: ['lang', 'dir', 'data-flixo-locale'] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
