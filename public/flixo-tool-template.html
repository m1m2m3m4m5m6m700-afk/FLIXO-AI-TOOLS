<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLIXO AI — قالب أداة</title><meta name="description" content="قالب إنتاجي لأداة FLIXO مع رفع ومعاينة وتصدير محلي.">
<meta name="theme-color" content="#0A0E14"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0A0E14;--panel:#10151D;--panel2:#141B25;--border:#1E2733;--text:#E7ECF2;--muted:#8892A0;--teal:#3ECFB2;--focus:0 0 0 3px rgba(62,207,178,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:0;box-shadow:var(--focus)}
.app{height:100%;display:grid;grid-template-rows:56px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.workspace{display:grid;grid-template-columns:270px 1fr 290px;min-height:0}.side{background:var(--panel);padding:16px;overflow:auto;border-left:1px solid var(--border)}.right{border-left:0;border-right:1px solid var(--border)}
.stage{display:flex;flex-direction:column;min-width:0}.toolbar{height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
.canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}.card{position:relative;width:min(760px,100%);aspect-ratio:4/3;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;background:#0D1219;background-image:linear-gradient(45deg,#151b23 25%,transparent 25%),linear-gradient(-45deg,#151b23 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#151b23 75%),linear-gradient(-45deg,transparent 75%,#151b23 75%);background-size:20px 20px}
.card img{max-width:100%;max-height:100%;display:none}.card img.show{display:block}.card img.zoom-1{transform:scale(1)}.card img.zoom-2{transform:scale(1.25)}.card img.zoom-3{transform:scale(1.5)}.card img.zoom-4{transform:scale(1.75)}.card img.zoom-5{transform:scale(2)}
.drop{border:1.5px dashed var(--border);padding:24px;border-radius:10px;text-align:center;color:var(--muted);cursor:pointer}.drop input{display:none}.control{background:var(--panel2);border:1px solid var(--border);padding:14px;border-radius:10px;margin-bottom:12px}.control label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.control input[type=range]{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.top a{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);text-decoration:none}.primary{background:var(--teal)!important;color:#04140f!important;border-color:transparent!important}
.progress{height:4px;background:#1a2330}.fill{height:100%;background:var(--teal);transition:width .2s}.fill.p0{width:0}.fill.p20{width:20%}.fill.p100{width:100%}.label{font-size:12px;color:var(--muted);margin-bottom:10px}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.side{display:none}.stage .mobile{display:flex}}.mobile{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top"><a href="/ar">← الرئيسية</a><strong>قالب أداة FLIXO</strong><button class="primary" id="exportBtn" disabled>تصدير</button></header>
<div class="workspace">
<aside class="side"><div class="label">الملف المصدر</div><label class="drop" id="drop">اسحب الصورة هنا أو اضغط للاختيار<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div style="height:18px"></div><div class="label">عرض</div><div class="actions"><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="reset">إعادة</button></div></aside>
<main class="stage"><div class="toolbar">معاينة حيّة · محليًا في المتصفح</div><div class="canvas"><div class="card" id="canvas"><img id="image" alt="معاينة الملف"><div id="placeholder">لا يوجد ملف بعد</div></div></div><div><div class="progress"><div class="fill p0" id="fill"></div></div><div style="padding:8px 16px;color:var(--muted);font-size:11px" id="status" aria-live="polite">جاهز</div></div></main>
<aside class="side right"><div class="control"><label><span>حدة الحواف</span><strong id="sharpVal">72</strong></label><input id="sharp" type="range" min="0" max="100" value="72"></div><div class="control"><label><span>السطوع</span><strong id="brightVal">4</strong></label><input id="bright" type="range" min="-50" max="50" value="4"></div><div class="control"><label><span>التباين</span><strong id="contrastVal">8</strong></label><input id="contrast" type="range" min="-50" max="50" value="8"></div></aside>
</div></div>
<script>
'use strict';
(()=>{const $=id=>document.getElementById(id),file=$('file'),img=$('image'),ph=$('placeholder'),fill=$('fill'),status=$('status'),exp=$('exportBtn');let url='',zoom=1;
function progress(v,t){fill.className='fill '+(v===100?'p100':v===20?'p20':'p0');status.textContent=t}
function load(f){if(!f)return;if(f.size>25*1024*1024){progress(0,'الملف يتجاوز 25MB');return}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);img.src=url;img.classList.add('show');ph.hidden=true;exp.disabled=false;progress(20,'جارٍ تجهيز المعاينة');setTimeout(()=>progress(100,'جاهز'),350)}
function setZoom(next){zoom=Math.max(1,Math.min(5,next));img.classList.remove('zoom-1','zoom-2','zoom-3','zoom-4','zoom-5');img.classList.add('zoom-'+zoom)}
file.addEventListener('change',e=>load(e.target.files?.[0]));$('drop').addEventListener('dragover',e=>e.preventDefault());$('drop').addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files?.[0])});
$('zoomIn').onclick=()=>setZoom(zoom+1);$('zoomOut').onclick=()=>setZoom(zoom-1);$('reset').onclick=()=>{setZoom(1);document.querySelectorAll('input[type=range]').forEach(x=>x.value=x.defaultValue);['sharp','bright','contrast'].forEach(id=>$(id+'Val').textContent=$(id).value);progress(0,'جاهز')};
['sharp','bright','contrast'].forEach(id=>$(id).addEventListener('input',e=>$(id+'Val').textContent=e.target.value));
exp.onclick=()=>{if(!url)return;const a=document.createElement('a');a.href=url;a.download='flixo-processed.png';a.click()};
})();
</script>
</body></html>
