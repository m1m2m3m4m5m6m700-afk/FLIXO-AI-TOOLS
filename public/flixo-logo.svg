<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">FLIXO</title>
  <desc id="desc">Square FLIXO logo with a futuristic cyan, blue, violet and magenta gradient mark on a deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="0.55" stop-color="#0a1235"/><stop offset="1" stop-color="#100a29"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19e7ff"/><stop offset="0.48" stop-color="#2563eb"/><stop offset="0.76" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec22ff"/></linearGradient>
    <linearGradient id="markTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#79f8ff"/><stop offset="0.42" stop-color="#1e90ff"/><stop offset="1" stop-color="#1937d8"/></linearGradient>
    <linearGradient id="markBottom" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35dfff"/><stop offset="0.48" stop-color="#7138ff"/><stop offset="1" stop-color="#f018ff"/></linearGradient>
